<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Тест игры</title>
    <style>
        body { margin: 0; padding: 0; background: #222; overflow: hidden; }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Рисуем фон и колобка
        ctx.fillStyle = '#87CEEB';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#D2B48C';
        ctx.beginPath();
        ctx.arc(canvas.width / 2, canvas.height / 2, 50, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#000';
        ctx.font = '30px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('ТЕСТ РАБОТАЕТ!', canvas.width / 2, canvas.height / 2 - 100);
        
        // Показываем координаты для проверки
        ctx.fillText(`Ширина: ${canvas.width}, Высота: ${canvas.height}`, canvas.width / 2, canvas.height / 2 + 100);
    </script>
</body>
</html>
