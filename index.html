<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Колобок: Comix Zone — Ultimate Edition</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="menu-screen">
  <h1>КОЛОБОК</h1>
  <p>COMIX ZONE · ULTIMATE EDITION</p>
  <div class="weapon-select">
    <button class="weapon-btn active" id="wpn-shotgun" data-weapon="shotgun"><span class="weapon-icon">🔫</span><span class="weapon-name">ДРОБОВИК</span></button>
    <button class="weapon-btn" id="wpn-minigun" data-weapon="minigun"><span class="weapon-icon">💥</span><span class="weapon-name">МИНИГАН</span></button>
    <button class="weapon-btn" id="wpn-ak47" data-weapon="ak47"><span class="weapon-icon">🔫</span><span class="weapon-name">АК-47</span></button>
  </div>
  <button class="menu-btn" id="btn-continue">ПРОДОЛЖИТЬ</button>
  <button class="menu-btn" id="btn-new">НОВАЯ ИГРА</button>
  <div class="menu-hint">← → движение · SPACE прыжок (двойной) · J огонь · SHIFT рывок<br>🎵 адаптивная музыка · 🔊 звуки и голоса · 20 миров · 4 босса</div>
</div>

<div id="rotate-hint"><div class="icon">📱</div><div>Поверните телефон<br>горизонтально для игры</div></div>

<div id="game-wrap">
  <canvas id="game" width="1200" height="540"></canvas>
  <div id="topbar">
    <div id="info">Мир 1/20 | ⭐ 0 | ❤️ 3</div>
    <div class="topbtns">
      <button class="iconbtn" id="btn-music" title="Музыка">🎵</button>
      <button class="iconbtn" id="btn-sfx" title="Звуки и голоса">🔊</button>
      <button id="restart">↻ ЗАНОВО</button>
    </div>
  </div>
  <div id="message">Вперёд, Колобок!</div>
</div>

<div class="controls">
  <div class="left-group"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
  <div class="right-group"><button class="ctrl" id="dash">⚡</button><button class="ctrl" id="jump">ПРЫЖОК</button><button class="ctrl" id="shoot">🔫</button></div>
</div>

<script src="game.js"></script>
</body>
</html>
