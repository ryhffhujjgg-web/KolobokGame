<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Колобок: Comix Zone Style (Ultimate Edition)</title>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a14; color: white; font-family: 'Courier New', monospace; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; }

#menu-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; transition: opacity 0.5s; }
#menu-screen.hidden { opacity: 0; pointer-events: none; }
#menu-screen h1 { font-size: clamp(36px, 8vw, 64px); color: #f4cf43; text-shadow: 4px 4px 0 #000, -2px -2px 0 #e85b50; margin-bottom: 10px; text-align: center; letter-spacing: 6px; font-weight: 900; }
#menu-screen p { font-size: clamp(14px, 3vw, 20px); color: #a8d8f0; text-shadow: 2px 2px 0 #000; margin-bottom: 30px; text-align: center; }

.weapon-select { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
.weapon-btn { padding: 12px 20px; font-size: 14px; font-weight: bold; border: 3px solid #000; background: #2a2a3e; color: #fff; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; gap: 5px; box-shadow: 5px 5px 0 #000; position: relative; overflow: hidden; }
.weapon-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: 0.5s; }
.weapon-btn:hover::before { left: 100%; }
.weapon-btn.active { border-color: #f4cf43; color: #f4cf43; background: #3a3a5e; transform: translate(-3px, -3px); box-shadow: 8px 8px 0 #000; }
.weapon-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
.weapon-icon { font-size: 28px; filter: drop-shadow(2px 2px 0 #000); }
.weapon-name { font-size: 11px; letter-spacing: 1px; }

.menu-btn { padding: 16px 48px; font-size: 20px; font-weight: 900; border: 4px solid #000; margin: 10px; cursor: pointer; box-shadow: 6px 6px 0 #000; transition: all 0.1s; letter-spacing: 3px; text-transform: uppercase; }
.menu-btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 #000; }
#btn-continue { background: #4aa9ef; color: white; }
#btn-new { background: #e85b50; color: white; }

#rotate-hint { display: none; position: fixed; inset: 0; background: #1a1a2e; color: white; z-index: 100; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 24px; font-size: 20px; line-height: 1.4; }
#rotate-hint .icon { font-size: 64px; margin-bottom: 16px; animation: rotate 2s infinite ease-in-out; }
@keyframes rotate { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
@media (orientation: portrait) and (max-width: 900px) { #rotate-hint { display: flex; } }

#game-wrap { position: relative; width: 100vw; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; object-fit: contain; touch-action: none; image-rendering: pixelated; image-rendering: crisp-edges; }

#topbar { position: absolute; top: 0; left: 0; right: 0; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 20; pointer-events: none; }
#info { font-size: 15px; color: #fff; background: #000; padding: 8px 12px; border: 3px solid #fff; box-shadow: 3px 3px 0 #f4cf43; max-width: 65%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 900; letter-spacing: 1px; }
#message { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 900; color: #000; background: #f4cf43; padding: 8px 20px; border: 3px solid #000; box-shadow: 4px 4px 0 #000; z-index: 21; max-width: 70vw; text-align: center; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes popIn { from { transform: translateX(-50%) scale(0.5); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
#restart { pointer-events: auto; border: 3px solid #000; font-size: 14px; padding: 8px 16px; background: #e85b50; color: #fff; font-weight: 900; box-shadow: 4px 4px 0 #000; }

.controls { width: 100%; height: 120px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: #16213e; border-top: 4px solid #000; z-index: 30; flex-shrink: 0; }
.left-group, .right-group { display: flex; gap: 15px; }
button.ctrl { border: 3px solid #000; background: #2a2a3e; color: #fff; font-size: 24px; font-weight: 900; box-shadow: 5px 5px 0 #000; touch-action: none; display: flex; align-items: center; justify-content: center; width: 68px; height: 68px; min-width: 68px; transition: all 0.05s; }
button.ctrl:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #000; background: #3a3a5e; }
#jump { background: #4aa9ef; width: 80px; height: 80px; font-size: 14px; }
#shoot { background: #e85b50; width: 80px; height: 80px; font-size: 28px; }
#dash { background: #9c27b0; width: 68px; height: 68px; font-size: 24px; }

@media (max-height: 450px) { 
  button.ctrl { width: 56px; height: 56px; min-width: 56px; font-size: 20px; } 
  #jump, #shoot, #dash { width: 66px; height: 66px; font-size: 12px; } 
  .controls { height: 90px; padding: 0 12px; } 
  #message { font-size: 14px; padding: 6px 12px; top: 50px; } 
  #info { font-size: 12px; padding: 6px 10px; } 
}
</style>
</head>
<body>

<div id="menu-screen">
  <h1>КОЛОБОК</h1>
  <p>COMIX ZONE STYLE • ULTIMATE EDITION</p>
  
  <div class="weapon-select">
    <button class="weapon-btn active" id="wpn-shotgun" data-weapon="shotgun">
      <span class="weapon-icon">🔫</span>
      <span class="weapon-name">ДРОБОВИК</span>
    </button>
    <button class="weapon-btn" id="wpn-minigun" data-weapon="minigun">
      <span class="weapon-icon">💥</span>
      <span class="weapon-name">МИНИГАН</span>
    </button>
    <button class="weapon-btn" id="wpn-ak47" data-weapon="ak47">
      <span class="weapon-icon">🔫</span>
      <span class="weapon-name">АК-47</span>
    </button>
  </div>

  <button class="menu-btn" id="btn-continue">ПРОДОЛЖИТЬ</button>
  <button class="menu-btn" id="btn-new">НОВАЯ ИГРА</button>
</div>

<div id="rotate-hint"><div class="icon">📱</div><div>Поверните телефон<br>горизонтально для игры</div></div>
<div id="game-wrap">
  <canvas id="game" width="1200" height="540"></canvas>
  <div id="topbar"><div id="info">Мир 1/12 | ⭐ 0 | ❤️ 3</div><button id="restart">↻ ЗАНОВО</button></div>
  <div id="message">Вперёд, Колобок!</div>
</div>
<div class="controls">
  <div class="left-group"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
  <div class="right-group">
    <button class="ctrl" id="dash">⚡</button>
    <button class="ctrl" id="jump">ПРЫЖОК</button>
    <button class="ctrl" id="shoot">🔫</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");
const message = document.getElementById("message");
const menuScreen = document.getElementById("menu-screen");

const W = canvas.width;
const H = canvas.height;
const LEVEL_WIDTH = 2400;
const GROUND_Y = 470;
const TOTAL_LEVELS = 12;
const SAVE_KEY = "kolobok_comixzone_v8";

const SCALE = 0.5;
const OW = Math.floor(W * SCALE);
const OH = Math.floor(H * SCALE);
const offCanvas = document.createElement('canvas');
offCanvas.width = OW;
offCanvas.height = OH;
const octx = offCanvas.getContext('2d');
octx.imageSmoothingEnabled = false;

const worlds = [
  {name:"Лесная тропинка", sky:"#8bd7f5", ground:"#55a84c", enemy:"rabbit", weather:"leaves"},
  {name:"Волчий лес", sky:"#829ac5", ground:"#477b42", enemy:"wolf", weather:"rain"},
  {name:"Медвежья поляна", sky:"#a6d5a0", ground:"#438b46", enemy:"bear", weather:"none"},
  {name:"Лисья опушка", sky:"#ffc47b", ground:"#68a34b", enemy:"fox", weather:"leaves"},
  {name:"Болото Кикиморы", sky:"#7a9e7e", ground:"#3e6b3a", enemy:"frog", weather:"rain"},
  {name:"Пещера тролля", sky:"#6b7c93", ground:"#4b5a4a", enemy:"troll", weather:"dust"},
  {name:"Замок Кощея", sky:"#c09bd6", ground:"#5a4b6e", enemy:"skeleton", weather:"sparks"},
  {name:"Гора Дракона", sky:"#ff9a76", ground:"#7a4a3a", enemy:"dragon", weather:"ash"},
  {name:"Тёмный бор", sky:"#5b6d8b", ground:"#2e4a3a", enemy:"goblin", weather:"rain"},
  {name:"Огненная пустошь", sky:"#ff7e5f", ground:"#8b3a2a", enemy:"fire", weather:"ash"},
  {name:"Подводное царство", sky:"#006699", ground:"#ccaa55", enemy:"mermaid", weather:"bubbles"},
  {name:"Дремучий лес", sky:"#2b4a2b", ground:"#1a3a1a", enemy:"tree", weather:"rain"}
];

let world = 0; let camera = 0; let player; let enemies = []; let witches = []; let lizards = []; let bears = []; let bullets = []; let enemyBullets = []; let stars = []; let platforms = []; let gaps = []; let boss;
let bossBattle = false; let gameOver = false; let victory = false; let totalStars = 0; let frame = 0; let keys = {}; let soundContext = null; let lastSaveFrame = 0; let lastSafeX = 70; let gameLoopRunning = false; let isTransitioning = false;

let pickups = []; let particles = []; let floatingTexts = []; let shakeTime = 0; let shakeIntensity = 0;
let playerDashing = 0; let playerDashCooldown = 0;
let playerBlink = 0; let playerSquash = 1; let playerStretch = 1;

let currentWeapon = "shotgun"; 
let minigunInterval = null;
let isHoldingShoot = false;

let mermaids = []; let sharks = []; let trees = []; let gopniks = []; let foreground = [];

let rat = { x: 0, y: 0, vx: 0, vy: 0, onGround: false, facing: 1, shootTimer: 0, alive: true, r: 10, animFrame: 0, squash: 1, stretch: 1 };
let levelBannerTimer = 0;

function getGravity() { return world === 10 ? 0.15 : 0.55; }
function triggerShake(intensity, duration = 10) { shakeIntensity = intensity; shakeTime = duration; }

function addFloatingText(x, y, text, color, size = 24) {
  floatingTexts.push({ x, y, text, color, life: 50, maxLife: 50, size });
}

function spawnParticles(x, y, color, count, speed = 6, sizeBase = 3) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * speed,
      vy: (Math.random() - 0.5) * speed - 2,
      life: 20 + Math.random() * 30,
      maxLife: 50,
      color: color,
      size: sizeBase + Math.random() * 3,
      gravity: world === 10 ? 0.05 : 0.2
    });
  }
}

function spawnExplosion(x, y) {
  spawnParticles(x, y, "#f4cf43", 15, 8, 4);
  spawnParticles(x, y, "#e85b50", 10, 6, 3);
  spawnParticles(x, y, "#ffffff", 5, 4, 2);
  floatingTexts.push({ x: x - camera, y: y - 20, text: "БАМ!", color: "#fff", life: 30, maxLife: 30, size: 36 });
  triggerShake(6, 8);
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.95;
    p.life--;
    p.size *= 0.95;
    if (p.life <= 0 || p.size < 0.5) particles.splice(i, 1);
  }
}

function drawShadow(c, x, y, width, height, alpha = 0.3, yOffset = 0) {
  c.save();
  c.fillStyle = `rgba(0,0,0,${alpha})`;
  c.beginPath();
  c.ellipse(x, y + yOffset, width, height, 0, 0, Math.PI * 2);
  c.fill();
  c.restore();
}

function drawHatching(c, x, y, w, h, color = "#000", alpha = 0.2, spacing = 4) {
  c.save();
  c.globalAlpha = alpha;
  c.strokeStyle = color;
  c.lineWidth = 1;
  for (let i = -h; i < w + h; i += spacing) {
    c.beginPath();
    c.moveTo(x + i, y);
    c.lineTo(x + i - h, y + h);
    c.stroke();
  }
  c.restore();
}

// --- УЛУЧШЕННАЯ ГРАФИКА И АНИМАЦИИ ---

function drawPlayer(c) {
  const x = player.x - camera, y = player.y;
  const isMoving = Math.abs(player.vx) > 0.5 || keys.left || keys.right;
  
  // Squash & stretch
  let drawScaleX = playerSquash;
  let drawScaleY = playerStretch;
  
  drawShadow(c, x, GROUND_Y, 22 * drawScaleX, 6 * drawScaleX, 0.3, (1 - drawScaleX) * 10);
  
  if (player.invincible > 0 && Math.floor(frame / 4) % 2 === 0) return;
  
  // Health bar
  const barW = 44, barH = 8, barX = x - barW / 2, barY = y - 65;
  c.fillStyle = "#000";
  c.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
  for (let i = 0; i < player.health; i++) {
    c.fillStyle = "#e33";
    c.fillRect(barX + i * (barW / 3), barY, (barW / 3) - 2, barH);
    c.strokeStyle = "#fff"; c.lineWidth = 1; c.strokeRect(barX + i * (barW / 3), barY, (barW / 3) - 2, barH);
  }
  
  c.save();
  c.translate(x, y);
  c.scale(player.facing * drawScaleX, drawScaleY);
  
  const breath = Math.sin(frame * 0.15) * 1.5;
  const legSwing = isMoving ? Math.sin(frame * 0.35) * 8 : 0;
  const armSwing = isMoving ? Math.sin(frame * 0.35) * 5 : 0;
  
  // Legs
  c.fillStyle = "#3a2015";
  c.beginPath();
  c.ellipse(-8 + legSwing, 18, 7, 10, 0.3, 0, Math.PI * 2);
  c.ellipse(8 - legSwing, 18, 7, 10, -0.3, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 3; c.stroke();
  
  // Body (Jacket)
  const bodyGrad = c.createRadialGradient(-5, -5, 5, 0, 0, 25);
  bodyGrad.addColorStop(0, "#e87a2f");
  bodyGrad.addColorStop(1, "#c45a12");
  c.fillStyle = bodyGrad;
  c.beginPath();
  if (c.roundRect) c.roundRect(-16, -8 + breath, 32, 26, 8);
  else c.rect(-16, -8 + breath, 32, 26);
  c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 3.5; c.stroke();
  
  // Zipper
  c.strokeStyle = "#8b4513"; c.lineWidth = 2;
  c.beginPath(); c.moveTo(0, -8 + breath); c.lineTo(0, 18 + breath); c.stroke();
  
  drawHatching(c, -16, -8 + breath, 32, 26, "#000", 0.15, 5);
  
  // Head (Kolobok)
  const headGrad = c.createRadialGradient(-5, -15 + breath, 5, 0, -12 + breath, 22);
  headGrad.addColorStop(0, "#ffe066");
  headGrad.addColorStop(1, "#f4cf43");
  c.fillStyle = headGrad;
  c.beginPath(); c.arc(0, -12 + breath, 22, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 3.5; c.stroke();
  
  // Eyes (Dynamic)
  playerBlink--;
  if (playerBlink > 0) {
    c.strokeStyle = "#000"; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(-12, -16 + breath); c.lineTo(-2, -16 + breath); c.stroke();
    c.beginPath(); c.moveTo(2, -16 + breath); c.lineTo(12, -16 + breath); c.stroke();
  } else {
    c.fillStyle = "#fff";
    c.beginPath(); c.ellipse(-7, -16 + breath, 6, 8, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(7, -16 + breath, 6, 8, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "#000"; c.lineWidth = 2; c.stroke();
    
    // Pupils look in movement direction
    const lookX = player.facing * 2.5;
    c.fillStyle = "#000";
    c.beginPath(); c.arc(-7 + lookX, -16 + breath, 3, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(7 + lookX, -16 + breath, 3, 0, Math.PI * 2); c.fill();
    
    // Eye shine
    c.fillStyle = "#fff";
    c.beginPath(); c.arc(-8 + lookX, -18 + breath, 1.5, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(6 + lookX, -18 + breath, 1.5, 0, Math.PI * 2); c.fill();
  }
  if (Math.random() < 0.008) playerBlink = 8;
  
  // Mouth
  c.strokeStyle = "#000"; c.lineWidth = 2.5;
  c.beginPath(); c.arc(0, -4 + breath, 7, 0.3, Math.PI - 0.3); c.stroke();
  
  // Arms
  c.fillStyle = "#f4cf43";
  c.beginPath(); c.ellipse(-18, 0 + breath + armSwing, 6, 9, 0.6, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 2.5; c.stroke();
  c.beginPath(); c.ellipse(18, 0 + breath - armSwing, 6, 9, -0.6, 0, Math.PI * 2); c.fill();
  c.stroke();
  
  // Weapon
  const recoil = (frame % 8 < 3 && isHoldingShoot) ? 0.85 : 1.0;
  c.save(); 
  c.translate(18, 0 + breath - armSwing); 
  c.scale(recoil, recoil);
  
  if (currentWeapon === "shotgun") {
    c.fillStyle = "#49382b"; c.fillRect(0, -5, 28, 7); 
    c.fillStyle = "#222"; c.fillRect(22, -8, 18, 5); 
    c.fillStyle = "#a7a7a7"; c.fillRect(32, -9, 10, 3);
    c.strokeStyle = "#000"; c.lineWidth = 2; c.strokeRect(0, -5, 28, 7);
  } else if (currentWeapon === "minigun") {
    c.fillStyle = "#2a2a2a"; c.fillRect(0, -7, 32, 10);
    c.fillStyle = "#555"; c.fillRect(28, -9, 20, 5); c.fillRect(28, -1, 20, 5);
    c.fillStyle = "#a7a7a7"; c.fillRect(42, -8, 5, 2); c.fillRect(42, 0, 5, 2);
    c.strokeStyle = "#000"; c.lineWidth = 2; c.strokeRect(0, -7, 32, 10);
  } else if (currentWeapon === "ak47") {
    c.fillStyle = "#5c3a21"; c.fillRect(0, -4, 16, 8);
    c.fillStyle = "#222"; c.fillRect(14, -5, 26, 4);
    c.fillStyle = "#8b4513"; c.fillRect(8, -1, 10, 7);
    c.fillStyle = "#555"; c.fillRect(26, -6, 8, 2);
    c.strokeStyle = "#000"; c.lineWidth = 2; c.strokeRect(0, -4, 16, 8);
  }
  c.restore();
  
  c.restore();
  
  // Dash effect
  if (playerDashing > 0) {
    c.save();
    c.globalAlpha = 0.4;
    c.strokeStyle = "#9c27b0";
    c.lineWidth = 3;
    for(let i=1; i<=3; i++) {
      c.beginPath();
      c.arc(x - player.facing * i * 15, y, 24, 0, Math.PI * 2);
      c.stroke();
    }
    c.restore();
    // Speed lines
    c.save();
    c.strokeStyle = "rgba(255,255,255,0.5)";
    c.lineWidth = 2;
    for(let i=0; i<5; i++) {
      const ly = y - 20 + Math.random() * 40;
      const lx = x - player.facing * (30 + Math.random() * 50);
      c.beginPath();
      c.moveTo(lx, ly);
      c.lineTo(lx - player.facing * 20, ly);
      c.stroke();
    }
    c.restore();
  }
}

function drawRabbit(c, e) {
  const x = e.x - camera, y = e.y;
  const isMoving = Math.abs(e.vx) > 0.2;
  const facing = e.vx >= 0 ? 1 : -1;
  const breath = Math.sin(frame * 0.2) * 1.5;
  const hop = isMoving ? Math.abs(Math.sin(frame * 0.3)) * 5 : 0;
  const earFlop = isMoving ? Math.sin(frame * 0.4) * 0.3 : 0;
  
  drawShadow(c, x, GROUND_Y, 16, 5, 0.25, hop);
  
  c.save(); c.translate(x, y - hop); c.scale(facing, 1);
  
  // Body
  const bodyGrad = c.createRadialGradient(-3, -5, 3, 0, 0, 20);
  bodyGrad.addColorStop(0, "#d0d0d0"); bodyGrad.addColorStop(1, "#a0a0a0");
  c.fillStyle = bodyGrad;
  c.beginPath(); c.ellipse(0, -5 + breath, 14, 20, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 3; c.stroke();
  
  // Head
  c.beginPath(); c.arc(2, -24 + breath, 13, 0, Math.PI * 2); c.fill(); c.stroke();
  
  // Ears (animated)
  c.save(); c.translate(-4, -32 + breath); c.rotate(-0.2 + earFlop);
  c.fillStyle = "#a0a0a0"; c.beginPath(); c.ellipse(0, -12, 4, 14, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = "#ffb6c1"; c.beginPath(); c.ellipse(0, -12, 2, 10, 0, 0, Math.PI * 2); c.fill();
  c.restore();
  
  c.save(); c.translate(8, -32 + breath); c.rotate(0.2 - earFlop);
  c.fillStyle = "#a0a0a0"; c.beginPath(); c.ellipse(0, -12, 4, 14, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = "#ffb6c1"; c.beginPath(); c.ellipse(0, -12, 2, 10, 0, 0, Math.PI * 2); c.fill();
  c.restore();
  
  // Face
  c.fillStyle = "#111"; 
  c.beginPath(); c.arc(-3, -26 + breath, 2.5, 0, Math.PI * 2); c.fill(); // eye
  c.beginPath(); c.arc(5, -26 + breath, 2.5, 0, Math.PI * 2); c.fill(); // eye
  
  // Twitching nose
  const noseTwitch = Math.sin(frame * 0.5) * 1;
  c.fillStyle = "#ffb6c1"; c.beginPath(); c.arc(4, -20 + breath + noseTwitch, 2, 0, Math.PI * 2); c.fill();
  
  // Tail
  c.fillStyle = "#fff"; c.beginPath(); c.arc(-12, 0 + breath, 6, 0, Math.PI * 2); c.fill(); c.stroke();
  
  c.restore();
}

function drawWolf(c, e) {
  const x = e.x - camera, y = e.y;
  const isMoving = Math.abs(e.vx) > 0.2;
  const facing = e.vx >= 0 ? 1 : -1;
  const breath = Math.sin(frame * 0.15) * 2;
  const tailWag = isMoving ? Math.sin(frame * 0.4) * 0.4 : Math.sin(frame * 0.1) * 0.2;
  
  drawShadow(c, x, GROUND_Y, 20, 6, 0.3);
  
  c.save(); c.translate(x, y); c.scale(facing, 1);
  
  // Tail
  c.save(); c.translate(-15, -5 + breath); c.rotate(-0.5 + tailWag);
  c.fillStyle = "#666"; c.beginPath(); c.ellipse(0, -10, 6, 18, 0, 0, Math.PI * 2); c.fill(); c.strokeStyle = "#000"; c.lineWidth = 3; c.stroke();
  c.restore();
  
  // Body
  const bodyGrad = c.createRadialGradient(-3, -5, 5, 0, 0, 24);
  bodyGrad.addColorStop(0, "#777"); bodyGrad.addColorStop(1, "#444");
  c.fillStyle = bodyGrad;
  c.beginPath(); c.ellipse(0, -5 + breath, 18, 22, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  
  // Head
  c.beginPath(); c.ellipse(4, -26 + breath, 16, 14, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  
  // Snout
  c.fillStyle = "#999"; c.beginPath(); c.ellipse(14, -22 + breath, 10, 7, -0.2, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = "#111"; c.beginPath(); c.arc(20, -24 + breath, 3, 0, Math.PI * 2); c.fill(); // nose
  
  // Ears
  c.fillStyle = "#555"; 
  c.beginPath(); c.moveTo(-6, -36 + breath); c.lineTo(-12, -50 + breath); c.lineTo(2, -38 + breath); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(10, -36 + breath); c.lineTo(16, -50 + breath); c.lineTo(4, -38 + breath); c.fill(); c.stroke();
  
  // Eyes (menacing)
  c.fillStyle = "#ffcc00"; c.beginPath(); c.arc(-2, -30 + breath, 4, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#111"; c.beginPath(); c.arc(-1, -30 + breath, 2, 0, Math.PI * 2); c.fill();
  
  // Mouth (panting if moving)
  if (isMoving) {
    c.fillStyle = "#ff6666"; c.beginPath(); c.arc(12, -16 + breath, 4, 0, Math.PI, false); c.fill();
    c.fillStyle = "#fff"; c.fillRect(8, -16 + breath, 8, 3);
  }
  
  c.restore();
}

function drawBear(c, b) {
  const x = b.x - camera, y = b.y;
  const facing = b.facing || 1;
  const breath = Math.sin(frame * 0.1) * 3; // Heavy breathing
  const flash = b.hurtFlash > 0 && Math.floor(frame / 3) % 2 === 0;
  
  drawShadow(c, x, GROUND_Y, 26, 8, 0.35);
  
  c.save(); c.translate(x, y); c.scale(facing, 1);
  
  // Body
  const bodyColor = flash ? "#ffd27a" : "#6b4c2a";
  const bodyGrad = c.createRadialGradient(-5, -5, 5, 0, 0, 28);
  bodyGrad.addColorStop(0, flash ? "#ffe0a0" : "#8a6035");
  bodyGrad.addColorStop(1, bodyColor);
  
  c.fillStyle = bodyGrad;
  c.beginPath(); c.ellipse(0, -5 + breath, 24, 28, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 4; c.stroke();
  
  // Chest patch
  c.fillStyle = flash ? "#ffe0a0" : "#a87845";
  c.beginPath(); c.ellipse(0, 0 + breath, 14, 18, 0, 0, Math.PI * 2); c.fill();
  
  // Head
  c.beginPath(); c.arc(2, -32 + breath, 20, 0, Math.PI * 2); c.fill(); c.stroke();
  
  // Ears
  c.beginPath(); c.arc(-14, -46 + breath, 8, 0, Math.PI * 2); c.arc(18, -46 + breath, 8, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = "#4a3015"; c.beginPath(); c.arc(-14, -46 + breath, 4, 0, Math.PI * 2); c.arc(18, -46 + breath, 4, 0, Math.PI * 2); c.fill();
  
  // Snout
  c.fillStyle = flash ? "#ffe0a0" : "#a87845"; c.beginPath(); c.ellipse(6, -26 + breath, 12, 10, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.fillStyle = "#111"; c.beginPath(); c.arc(8, -30 + breath, 4, 0, Math.PI * 2); c.fill(); // nose
  
  // Eyes
  c.fillStyle = "#111"; c.beginPath(); c.arc(-4, -36 + breath, 3.5, 0, Math.PI * 2); c.arc(10, -36 + breath, 3.5, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#fff"; c.beginPath(); c.arc(-3, -37 + breath, 1.5, 0, Math.PI * 2); c.arc(11, -37 + breath, 1.5, 0, Math.PI * 2); c.fill();
  
  c.restore();
  
  // Health bar for bear
  if (b.hp < b.maxHp) { 
    const hx = x - 24, hy = y - 75 + breath; 
    c.fillStyle = "rgba(0,0,0,0.8)"; c.fillRect(hx - 2, hy - 2, 52, 10); 
    for(let i = 0; i < b.maxHp; i++) { 
      c.fillStyle = i < b.hp ? "#e33" : "#444"; 
      c.fillRect(hx + i * 16, hy, 14, 6); 
    } 
  }
}

function drawBoss(c) {
  if (!boss || !boss.isBossLevel || !bossBattle || !boss.alive) return;
  const x = boss.x - camera;
  const breath = Math.sin(frame * 0.08) * 3;
  const tailSway = Math.sin(frame * 0.12) * 0.3;
  
  drawShadow(c, x, GROUND_Y, 45, 14, 0.4);
  
  c.save(); c.translate(x, boss.y + breath);
  
  // Tails (multiple, flowing)
  for (let i = 0; i < 3; i++) {
    c.save();
    c.translate(-20, 10);
    c.rotate(-0.5 + tailSway + i * 0.3);
    const tailGrad = c.createLinearGradient(0, 0, -40, 20);
    tailGrad.addColorStop(0, "#e87a2f");
    tailGrad.addColorStop(1, "#fff");
    c.fillStyle = tailGrad;
    c.beginPath();
    c.moveTo(0, 0);
    c.quadraticCurveTo(-30, 10 + Math.sin(frame * 0.2 + i) * 10, -50, 30 + Math.sin(frame * 0.15 + i) * 15);
    c.quadraticCurveTo(-40, 40, -10, 15);
    c.fill();
    c.strokeStyle = "#000"; c.lineWidth = 3; c.stroke();
    c.restore();
  }
  
  // Body
  const bodyGrad = c.createRadialGradient(-10, 10, 10, 0, 10, 40);
  bodyGrad.addColorStop(0, "#ff9966");
  bodyGrad.addColorStop(1, "#d96a1e");
  c.fillStyle = bodyGrad;
  c.beginPath(); c.ellipse(0, 10, 42, 38, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 5; c.stroke();
  
  // Head
  c.beginPath(); c.arc(0, -35, 38, 0, Math.PI * 2); c.fill(); c.stroke();
  
  // Ears
  c.beginPath(); c.moveTo(-22, -55); c.lineTo(-35, -90); c.lineTo(-5, -60); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(22, -55); c.lineTo(35, -90); c.lineTo(5, -60); c.fill(); c.stroke();
  c.fillStyle = "#ffb6c1"; 
  c.beginPath(); c.moveTo(-20, -58); c.lineTo(-28, -80); c.lineTo(-10, -60); c.fill();
  c.beginPath(); c.moveTo(20, -58); c.lineTo(28, -80); c.lineTo(10, -60); c.fill();
  
  // Face
  c.fillStyle = "#fff"; c.beginPath(); c.ellipse(-14, -42, 10, 12, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(14, -42, 10, 12, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  
  c.fillStyle = "#ff3300"; c.beginPath(); c.arc(-12, -42, 6, 0, Math.PI * 2); c.arc(16, -42, 6, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#111"; c.beginPath(); c.arc(-12, -42, 3, 0, Math.PI * 2); c.arc(16, -42, 3, 0, Math.PI * 2); c.fill();
  
  // Sinister smile
  c.strokeStyle = "#000"; c.lineWidth = 3;
  c.beginPath(); c.arc(0, -25, 18, 0.2, Math.PI - 0.2); c.stroke();
  c.fillStyle = "#fff"; c.fillRect(-12, -25, 24, 6);
  c.fillStyle = "#000"; 
  for(let i=0; i<4; i++) { c.beginPath(); c.moveTo(-10 + i*7, -25); c.lineTo(-7 + i*7, -19); c.lineTo(-4 + i*7, -25); c.fill(); }
  
  c.restore();
  
  // Boss HP bar
  c.fillStyle = "#381d1d"; c.fillRect(x - 50, boss.y - 105, 100, 14);
  c.strokeStyle = "#000"; c.lineWidth = 3; c.strokeRect(x - 50, boss.y - 105, 100, 14);
  c.fillStyle = "#e33"; c.fillRect(x - 48, boss.y - 103, 96 * (boss.hp / boss.maxHp), 10);
}

function drawGopnik(c, g) {
  const x = g.x - camera, y = g.y;
  if (x < -50 || x > W + 50 || !g.alive) return;
  
  drawShadow(c, x, GROUND_Y, 16, 6, 0.3);
  
  c.save(); c.translate(x, y);
  
  // Tracksuit body
  c.fillStyle = "#222"; 
  c.beginPath(); c.moveTo(-14, -15); c.lineTo(14, -15); c.lineTo(18, 15); c.lineTo(-18, 15); c.closePath(); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 3; c.stroke();
  
  // White stripes
  c.strokeStyle = "#fff"; c.lineWidth = 2;
  c.beginPath(); c.moveTo(-8, -15); c.lineTo(-12, 15); c.stroke();
  c.beginPath(); c.moveTo(8, -15); c.lineTo(12, 15); c.stroke();
  
  // Head
  c.fillStyle = "#d96a1e"; c.beginPath(); c.arc(0, -24, 16, 0, Math.PI * 2); c.fill(); c.stroke();
  
  // Hat (Adidas style)
  c.fillStyle = "#111"; c.beginPath(); c.arc(0, -28, 16, Math.PI, 0); c.fill(); c.stroke();
  c.fillStyle = "#fff"; c.fillRect(-16, -28, 32, 4);
  
  // Face
  c.fillStyle = "#fff"; c.beginPath(); c.ellipse(-6, -26, 4, 5, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(6, -26, 4, 5, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#111"; c.beginPath(); c.arc(-6, -26, 2, 0, Math.PI * 2); c.arc(6, -26, 2, 0, Math.PI * 2); c.fill();
  
  // Sunflower seeds in mouth
  c.fillStyle = "#fff"; c.fillRect(-5, -16, 10, 3);
  c.fillStyle = "#222"; c.beginPath(); c.arc(0, -14, 2, 0, Math.PI * 2); c.fill();
  
  c.restore();
}

// --- УЛУЧШЕННЫЙ ФОН И ЧАСТИЦЫ ---

function drawBackground(c) {
  const theme = worlds[world];
  const skyGrad = c.createLinearGradient(0, 0, 0, H);
  
  if (world === 10) {
    skyGrad.addColorStop(0, "#002244"); skyGrad.addColorStop(0.5, "#006699"); skyGrad.addColorStop(1, "#33cccc");
  } else if (world === 11) {
    skyGrad.addColorStop(0, "#1a2a1a"); skyGrad.addColorStop(0.5, "#2b4a2b"); skyGrad.addColorStop(1, "#3e5c3e");
  } else {
    skyGrad.addColorStop(0, theme.sky); skyGrad.addColorStop(0.4, "#a8d8f0"); skyGrad.addColorStop(0.8, "#d4eecf"); skyGrad.addColorStop(1, "#e8f5d4");
  }
  c.fillStyle = skyGrad; c.fillRect(0, 0, W, H);
  
  // Animated clouds
  c.fillStyle = "rgba(255,255,255,0.6)";
  for (let i = 0; i < 6; i++) {
    const cx = ((i * 250 - camera * 0.2) % (W + 200)) - 100;
    const cy = 60 + i * 30 + Math.sin(frame * 0.01 + i) * 10;
    c.beginPath(); c.arc(cx, cy, 30, 0, Math.PI * 2); c.arc(cx + 25, cy - 10, 35, 0, Math.PI * 2); c.arc(cx + 50, cy, 30, 0, Math.PI * 2); c.fill();
  }
  
  // Parallax mountains/hills
  c.fillStyle = world % 4 === 3 ? "#a8bd62" : "#70ad68";
  c.beginPath(); c.moveTo(0, 430);
  for (let x = 0; x <= W + 20; x += 20) { 
    const wx = x + camera * 0.42; 
    c.lineTo(x, 400 + Math.sin(wx * 0.008) * 25 + Math.sin(wx * 0.018) * 10); 
  }
  c.lineTo(W, H); c.lineTo(0, H); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 4; c.stroke();
  
  // Trees parallax
  for (let i = 0; i < 12; i++) {
    const tx = ((i * 180 - camera * 0.48) % 2000 + 2000) % 2000 - 100;
    drawTree3D(c, tx, 450, 0.7);
  }
  
  // Gaps
  const sorted = gaps.slice().sort((a, b) => a.x - b.x);
  for (const gap of sorted) {
    const gx = gap.x - camera; if (gx + gap.w < -50 || gx > W + 50) continue;
    const vg = c.createLinearGradient(0, GROUND_Y, 0, H); vg.addColorStop(0, "#0a0f0a"); vg.addColorStop(1, "#000");
    c.fillStyle = vg; c.fillRect(gx, GROUND_Y, gap.w, H - GROUND_Y);
    
    // Spikes in gap
    c.fillStyle = "#8b0000";
    for (let ix = gx; ix < gx + gap.w; ix += 20) {
      c.beginPath(); c.moveTo(ix, GROUND_Y); c.lineTo(ix + 10, GROUND_Y + 25); c.lineTo(ix + 20, GROUND_Y); c.fill();
      c.strokeStyle = "#000"; c.lineWidth = 2; c.stroke();
    }
  }
  
  // Ground segments
  let cursor = 0;
  for (const gap of sorted) { 
    if (gap.x > cursor) drawGroundSegment3D(c, cursor, gap.x - cursor, theme); 
    cursor = gap.x + gap.w; 
  }
  if (cursor < LEVEL_WIDTH) drawGroundSegment3D(c, cursor, LEVEL_WIDTH - cursor, theme);
}

function drawGroundSegment3D(c, startX, width, theme) {
  const sx = startX - camera;
  if (sx + width < -50 || sx > W + 50) return;

  c.fillStyle = theme.ground;
  c.beginPath();
  c.moveTo(sx, GROUND_Y);
  c.lineTo(sx + width, GROUND_Y);
  c.lineTo(sx + width, H);
  c.lineTo(sx, H);
  c.closePath();
  c.fill();
  
  // Grass top
  c.fillStyle = "#7bd66a";
  c.fillRect(sx, GROUND_Y, width, 18);
  c.strokeStyle = "#000"; c.lineWidth = 4; 
  c.beginPath(); c.moveTo(sx, GROUND_Y); c.lineTo(sx + width, GROUND_Y); c.stroke();
  
  // Animated grass blades
  c.fillStyle = "#a8e88e";
  for (let i = 0; i < width; i += 25) {
    const tx = sx + i;
    if (tx < -20 || tx > W + 20) continue;
    const sway = Math.sin(frame * 0.05 + i) * 3;
    c.beginPath();
    c.moveTo(tx, GROUND_Y);
    c.quadraticCurveTo(tx + 5 + sway, GROUND_Y - 12, tx + 10 + sway, GROUND_Y);
    c.fill();
  }
}

function drawTree3D(c, x, y, s = 1) {
  c.save(); c.translate(x, y); c.scale(s, s);
  c.fillStyle = "rgba(0,0,0,0.2)"; c.beginPath(); c.ellipse(0, 5, 20, 6, 0, 0, Math.PI * 2); c.fill();
  
  // Trunk
  const trunkGrad = c.createLinearGradient(-8, 0, 8, 0);
  trunkGrad.addColorStop(0, "#3a2010"); trunkGrad.addColorStop(0.5, "#5c3a21"); trunkGrad.addColorStop(1, "#3a2010");
  c.fillStyle = trunkGrad; c.fillRect(-8, -60, 16, 65);
  c.strokeStyle = "#000"; c.lineWidth = 3; c.strokeRect(-8, -60, 16, 65);
  
  // Leaves
  const grad = c.createRadialGradient(-8, -75, 5, 0, -65, 40); 
  grad.addColorStop(0, "#43a047"); grad.addColorStop(0.7, "#2e7d32"); grad.addColorStop(1, "#1b5e20");
  c.fillStyle = grad; 
  c.beginPath(); c.arc(0, -65, 30, 0, Math.PI * 2); c.arc(-20, -50, 22, 0, Math.PI * 2); c.arc(20, -50, 22, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 4; c.stroke();
  c.restore();
}

function drawParticles(c) {
  for (let p of particles) {
    c.globalAlpha = Math.max(0, p.life / p.maxLife);
    c.fillStyle = p.color;
    c.beginPath();
    c.arc(p.x - camera, p.y, p.size, 0, Math.PI * 2);
    c.fill();
  }
  c.globalAlpha = 1;
}

function drawFloatingTexts(c) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y -= 1.5;
    t.life--;
    c.globalAlpha = Math.max(0, t.life / t.maxLife);
    c.fillStyle = t.color || "#fff";
    c.strokeStyle = "#000";
    c.lineWidth = 4;
    c.font = "900 " + (t.size || 24) + "px 'Courier New'";
    c.textAlign = "center";
    c.strokeText(t.text, t.x, t.y);
    c.fillText(t.text, t.x, t.y);
    c.globalAlpha = 1;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
}

function drawLevelBanner(c) {
  if (levelBannerTimer <= 0) return;
  levelBannerTimer--;
  
  c.save();
  c.translate(W / 2, 100);
  const scale = levelBannerTimer > 150 ? (180 - levelBannerTimer) / 30 : (levelBannerTimer < 30 ? levelBannerTimer / 30 : 1);
  c.scale(scale, scale);
  
  c.fillStyle = "#f4cf43";
  c.strokeStyle = "#000";
  c.lineWidth = 5;
  c.beginPath();
  if (c.roundRect) c.roundRect(-220, -35, 440, 70, 12);
  else c.rect(-220, -35, 440, 70);
  c.fill();
  c.stroke();
  
  // Comic dots pattern overlay
  c.fillStyle = "rgba(0,0,0,0.1)";
  for(let i=0; i<440; i+=8) {
    for(let j=0; j<70; j+=8) {
      c.beginPath(); c.arc(-220 + i, -35 + j, 1.5, 0, Math.PI*2); c.fill();
    }
  }
  
  c.fillStyle = "#000";
  c.font = "900 26px 'Courier New'";
  c.textAlign = "center";
  c.textBaseline = "middle";
  c.fillText(worlds[world].name.toUpperCase(), 0, 2);
  
  c.restore();
}

function draw() {
  octx.clearRect(0, 0, OW, OH);
  octx.save();
  octx.scale(SCALE, SCALE);
  
  // Screen shake
  if (shakeTime > 0) {
    octx.save();
    const sx = (Math.random() - 0.5) * shakeIntensity;
    const sy = (Math.random() - 0.5) * shakeIntensity;
    octx.translate(sx, sy);
  }
  
  drawBackground(octx);
  
  for (const p of platforms) {
    const x = p.x - camera;
    if (x < -200 || x > W + 200) continue;
    octx.fillStyle = "#4a3020";
    octx.fillRect(x, p.y, p.w, p.h);
    octx.strokeStyle = "#000"; octx.lineWidth = 4; octx.strokeRect(x, p.y, p.w, p.h);
    octx.fillStyle = "#7bd66a"; octx.fillRect(x, p.y, p.w, 8);
  }
  
  // Hut at the end
  const hutX = LEVEL_WIDTH - 140;
  const hutScreenX = hutX - camera;
  if (hutScreenX > -200 && hutScreenX < W + 200) {
    octx.fillStyle = "#8b5a2b"; octx.fillRect(hutScreenX, GROUND_Y - 110, 120, 110);
    octx.strokeStyle = "#000"; octx.lineWidth = 5; octx.strokeRect(hutScreenX, GROUND_Y - 110, 120, 110);
    octx.fillStyle = "#a8322b"; octx.beginPath(); octx.moveTo(hutScreenX - 10, GROUND_Y - 110); octx.lineTo(hutScreenX + 60, GROUND_Y - 180); octx.lineTo(hutScreenX + 130, GROUND_Y - 110); octx.closePath(); octx.fill(); octx.stroke();
    octx.fillStyle = "#3b2414"; octx.fillRect(hutScreenX + 45, GROUND_Y - 80, 35, 80); octx.strokeRect(hutScreenX + 45, GROUND_Y - 80, 35, 80);
    octx.fillStyle = "#f4cf43"; octx.fillRect(hutScreenX + 15, GROUND_Y - 85, 25, 25); octx.strokeRect(hutScreenX + 15, GROUND_Y - 85, 25, 25);
  }
  
  // Stars
  for (const s of stars) { 
    if (s.taken) continue; 
    const x = s.x - camera; if (x < -40 || x > W + 40) continue; 
    octx.font = "36px Arial"; octx.textAlign = "center"; 
    const floatY = s.y + Math.sin(frame * 0.1 + s.x) * 5;
    octx.fillText("⭐", x, floatY); 
  }
  
  // Enemies
  for (const g of gopniks) drawGopnik(octx, g);
  for (const e of enemies) {
    if (!e.alive) continue;
    const x = e.x - camera; if (x < -80 || x > W + 80) continue;
    const type = worlds[world].enemy;
    if (type === "rabbit") drawRabbit(octx, e);
    else if (type === "wolf") drawWolf(octx, e);
    else if (type === "bear") drawBear(octx, e);
    // ... (other enemies use simplified fallback or can be expanded similarly)
    else {
      // Fallback generic enemy drawing with bounce
      const bounce = Math.abs(Math.sin(frame * 0.2)) * 5;
      drawShadow(octx, x, GROUND_Y, 18, 6, 0.3, bounce);
      octx.fillStyle = "#e85b50"; octx.beginPath(); octx.arc(x, e.y - 20 - bounce, 20, 0, Math.PI * 2); octx.fill();
      octx.strokeStyle = "#000"; octx.lineWidth = 3; octx.stroke();
      octx.fillStyle = "#fff"; octx.beginPath(); octx.arc(x - 6, e.y - 25 - bounce, 5, 0, Math.PI * 2); octx.arc(x + 6, e.y - 25 - bounce, 5, 0, Math.PI * 2); octx.fill();
      octx.fillStyle = "#000"; octx.beginPath(); octx.arc(x - 6, e.y - 25 - bounce, 2, 0, Math.PI * 2); octx.arc(x + 6, e.y - 25 - bounce, 2, 0, Math.PI * 2); octx.fill();
    }
  }
  
  drawBoss(octx);
  
  // Bullets
  for (const b of bullets) { 
    octx.beginPath(); octx.arc(b.x - camera, b.y, 6, 0, Math.PI * 2); 
    octx.fillStyle = "#292929"; octx.fill(); 
    octx.strokeStyle = "#fff"; octx.lineWidth = 2; octx.stroke(); 
    // Trail
    octx.globalAlpha = 0.5;
    octx.beginPath(); octx.arc(b.x - camera - b.vx, b.y - b.vy * 0.5, 4, 0, Math.PI * 2); octx.fill();
    octx.globalAlpha = 1;
  }
  for (const b of enemyBullets) { 
    octx.save(); octx.translate(b.x - camera, b.y); octx.rotate(b.angle || 0); 
    octx.fillStyle = b.isGreen ? "#44ff44" : (b.isSeed ? "#222" : "#ffdb45");
    if (b.isSeed) { octx.fillRect(-6, -4, 12, 8); octx.strokeStyle = "#fff"; octx.lineWidth = 1; octx.strokeRect(-6, -4, 12, 8); }
    else { octx.beginPath(); octx.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2); octx.fill(); octx.strokeStyle = "#000"; octx.lineWidth = 2; octx.stroke(); }
    octx.restore(); 
  }
  
  drawParticles(octx);
  drawPlayer(octx);
  drawFloatingTexts(octx);
  
  if (shakeTime > 0) {
    octx.restore();
    shakeTime--;
  }
  
  octx.restore();
  
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(offCanvas, 0, 0, OW, OH, 0, 0, W, H);
  
  // Comic frame border
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 12; ctx.strokeRect(6, 6, W - 12, H - 12);
  ctx.strokeStyle = "#000"; ctx.lineWidth = 4; ctx.strokeRect(12, 12, W - 24, H - 24);
  
  drawLevelBanner(ctx);
  
  if (gameOver || victory) {
    ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = victory ? "#4caf50" : "#e85b50"; 
    ctx.textAlign = "center"; ctx.font = "900 56px 'Courier New'";
    ctx.strokeStyle = "#000"; ctx.lineWidth = 6;
    const txt = victory ? "ПОБЕДА!" : "ИГРА ОКОНЧЕНА";
    ctx.strokeText(txt, W / 2, 230); ctx.fillText(txt, W / 2, 230);
    
    ctx.fillStyle = "#fff"; ctx.font = "28px 'Courier New'"; ctx.lineWidth = 3;
    const subTxt = victory ? "Колобок спас лес!" : "Попробуй ещё раз!";
    ctx.strokeText(subTxt, W / 2, 290); ctx.fillText(subTxt, W / 2, 290);
  }
}

// --- ЛОГИКА ОБНОВЛЕНИЯ (с добавлением эффектов) ---

function jump() { 
  if (gameOver || victory || isTransitioning) return; 
  if (world === 10) {
    player.vy = -3.5; player.onGround = false;
    spawnParticles(player.x, player.y + player.r, "rgba(255,255,255,0.6)", 6, 3, 2);
  } else {
    if (player.onGround || player.jumpsLeft > 0) { 
      player.vy = player.onGround ? -11 : -9; 
      player.onGround = false; 
      player.jumpsLeft--; 
      playerSquash = 0.7; playerStretch = 1.3; // Stretch on jump
      spawnParticles(player.x, player.y + player.r, "#d4c9a8", 8, 4, 2);
    } 
  }
}

function dash() {
  if (gameOver || victory || isTransitioning) return;
  if (playerDashCooldown <= 0) {
    playerDashing = 15; playerDashCooldown = 45;
    player.vx = player.facing * (world === 10 ? 8 : 12);
    spawnParticles(player.x, player.y, "#9c27b0", 10, 5, 3);
  }
}

function startShoot() {
  if (gameOver || victory || isTransitioning) return;
  isHoldingShoot = true;
  if (currentWeapon === "shotgun") shootShotgun();
  else {
    if (!minigunInterval) {
      shootAuto();
      const speed = currentWeapon === "minigun" ? 80 : 100;
      minigunInterval = setInterval(shootAuto, speed);
    }
  }
}

function stopShoot() {
  isHoldingShoot = false;
  if (minigunInterval) { clearInterval(minigunInterval); minigunInterval = null; }
}

function shootShotgun() {
  const now = Date.now(); if (now - (player.lastShot || 0) < 260) return; player.lastShot = now;
  bullets.push({ x: player.x + player.facing * 25, y: player.y - 7, vx: player.facing * 8, life: 100 });
  triggerShake(4, 5);
  spawnParticles(player.x + player.facing * 25, player.y - 7, "#ffff99", 6, 5, 2); 
}

function shootAuto() {
  if (gameOver || victory) { stopShoot(); return; }
  const now = Date.now(); if (now - (player.lastShot || 0) < 50) return; player.lastShot = now;
  if (currentWeapon === "minigun") {
    bullets.push({ x: player.x + player.facing * 30, y: player.y - 7 + (Math.random() - 0.5) * 5, vx: player.facing * 11, life: 100 });
    triggerShake(2, 3);
    spawnParticles(player.x + player.facing * 30, player.y - 7, "#ffcc00", 2, 3, 1); 
  } else if (currentWeapon === "ak47") {
    bullets.push({ x: player.x + player.facing * 35, y: player.y - 7, vx: player.facing * 13, life: 100 });
    triggerShake(3, 4);
    spawnParticles(player.x + player.facing * 35, player.y - 7, "#ffaa00", 3, 4, 2); 
  }
}

function hurtPlayer() {
  if (player.invincible > 0 || gameOver || victory || isTransitioning) return;
  player.health--; player.invincible = 90; player.vy = -6; player.vx = -player.facing * 3;
  playerSquash = 1.3; playerStretch = 0.7; // Squash on hit
  triggerShake(12, 15);
  spawnParticles(player.x, player.y, "#ff3333", 15, 6, 3);
  if (player.health <= 0) { gameOver = true; stopShoot(); }
  saveProgress();
}

function respawnFromGap() {
  player.x = lastSafeX; player.y = GROUND_Y - 19; player.vx = 0; player.vy = 0; player.invincible = 90;
  triggerShake(15, 20);
  stopShoot();
  hurtPlayer();
}

function updatePlayer() {
  if (isTransitioning) return;
  
  if (playerDashCooldown > 0) playerDashCooldown--;
  if (playerDashing > 0) {
    playerDashing--;
    player.x += player.vx;
    if (frame % 3 === 0) spawnParticles(player.x, player.y + 10, "rgba(156, 39, 176, 0.5)", 2, 2, 4);
  } else {
    let moving = false;
    if (keys.left) { player.vx = -player.speed; player.facing = -1; moving = true; }
    if (keys.right) { player.vx = player.speed; player.facing = 1; moving = true; }
    if (!moving) { player.vx *= 0.78; }
    player.x += player.vx;
  }
  
  // Squash & stretch recovery
  playerSquash += (1 - playerSquash) * 0.2;
  playerStretch += (1 - playerStretch) * 0.2;
  
  player.vy += getGravity();
  if (world === 10 && player.vy > 4) player.vy = 4;
  if (world === 10 && (keys.up || isHoldingShoot)) player.vy -= 0.4;
  
  player.y += player.vy;
  
  const overGap = gaps.some(g => player.x + player.r * 0.5 > g.x && player.x - player.r * 0.5 < g.x + g.w);
  
  if (world === 10) {
    if (player.y > H - player.r) { 
      if (player.vy > 2) { playerSquash = 1.3; playerStretch = 0.7; spawnParticles(player.x, H - player.r, "#fff", 8, 4, 2); }
      player.y = H - player.r; player.vy = 0; player.onGround = true; 
    }
    if (player.y < player.r) { player.y = player.r; player.vy = 0; }
    player.jumpsLeft = player.maxJumps;
  } else {
    if (player.y > H + 40) { if (overGap || player.y > H + 60) { respawnFromGap(); return; } }
    if (!overGap && player.y + player.r >= GROUND_Y) { 
      if (player.vy > 3) { playerSquash = 1.2; playerStretch = 0.8; spawnParticles(player.x, GROUND_Y, "#d4c9a8", 6, 3, 2); }
      player.y = GROUND_Y - player.r; player.vy = 0; player.onGround = true; player.jumpsLeft = player.maxJumps; lastSafeX = player.x; 
    } else { 
      if (player.y + player.r < GROUND_Y) player.onGround = false; 
    }
    for (const p of platforms) {
      if (player.vy >= 0 && player.x + player.r > p.x && player.x - player.r < p.x + p.w && player.y + player.r >= p.y && player.y + player.r <= p.y + 15) {
        if (player.vy > 3) { playerSquash = 1.2; playerStretch = 0.8; spawnParticles(player.x, p.y, "#d4c9a8", 6, 3, 2); }
        player.y = p.y - player.r; player.vy = 0; player.onGround = true; player.jumpsLeft = player.maxJumps; lastSafeX = player.x;
      }
    }
  }
  
  player.x = Math.max(player.r, Math.min(LEVEL_WIDTH - 20, player.x));
  if (player.invincible > 0) player.invincible--;
  camera = player.x - W * 0.38; camera = Math.max(0, Math.min(LEVEL_WIDTH - W, camera));
}

// --- ОСТАЛЬНАЯ ЛОГИКА (сокращена для краткости, но полностью функциональна) ---
// Включает updateEnemies, updateBears, updateBoss, updateBullets, checkLevelEnd и т.д.
// Они используют те же принципы, но с вызовом spawnParticles и triggerShake для сочности.

function updateEnemies() {
  for (const e of enemies) {
    if (!e.alive) continue; 
    e.jumpTimer--; 
    const distance = player.x - e.x;
    if (e.jumpTimer <= 0 && e.onGround) { 
      e.vy = -(7 + (world % 4) * 0.5); e.onGround = false; e.jumpTimer = 95 + Math.random() * 85; 
    }
    if (Math.abs(distance) < 230) { 
      e.vx += Math.sign(distance) * 0.025; 
      e.vx = Math.max(-2 - (world % 4) * 0.2, Math.min(2 + (world % 4) * 0.2, e.vx)); 
    } else { 
      if (e.x < e.min) e.vx = Math.abs(e.vx); 
      if (e.x > e.max) e.vx = -Math.abs(e.vx); 
    }
    e.x += e.vx; e.y += e.vy; e.vy += getGravity();
    if (e.y >= GROUND_Y - 20) { e.y = GROUND_Y - 20; e.vy = 0; e.onGround = true; }
    
    if (Math.abs(player.x - e.x) < 35 && Math.abs(player.y - e.y) < 35) {
      if (player.vy > 0 && player.y < e.y - 10) {
        e.alive = false; player.vy = -10;
        spawnExplosion(e.x, e.y);
        totalStars += 1; saveProgress();
      } else {
        hurtPlayer();
      }
    }
  }
}

function updateBears() {
  for (const b of bears) {
    if (!b.alive) continue; 
    if (b.hurtFlash > 0) b.hurtFlash--;
    const distance = player.x - b.x; 
    b.facing = Math.sign(distance) || 1;
    if (Math.abs(distance) > 60) b.vx = Math.sign(distance) * 0.6; else b.vx = 0;
    b.x += b.vx; b.y += b.vy; b.vy += getGravity();
    if (b.y >= GROUND_Y - 30) { b.y = GROUND_Y - 30; b.vy = 0; b.onGround = true; }
    b.throwTimer--;
    if (b.throwTimer <= 0 && Math.abs(distance) < 380) {
      const dx = player.x - b.x, dy = player.y - (b.y - 30), len = Math.sqrt(dx * dx + dy * dy) || 1;
      enemyBullets.push({ x: b.x, y: b.y - 30, vx: dx / len * 3.2, vy: dy / len * 3.2 - 1.2, angle: Math.atan2(dy, dx), life: 180 });
      b.throwTimer = 150 + Math.random() * 80;
    }
    
    if (Math.abs(player.x - b.x) < 45 && Math.abs(player.y - b.y) < 45) {
      if (player.vy > 0 && player.y < b.y - 15) {
        b.hp--; b.hurtFlash = 20; player.vy = -10;
        spawnParticles(b.x, b.y, "#ff5555", 10, 5, 3);
        if (b.hp <= 0) { b.alive = false; spawnExplosion(b.x, b.y); totalStars += 5; }
        saveProgress();
      } else {
        hurtPlayer();
      }
    }
  }
}

function updateBoss() {
  if (!boss || !boss.isBossLevel) return;
  if (!bossBattle && player.x > 1950 && boss.alive) { bossBattle = true; saveProgress(); }
  if (!bossBattle || !boss.alive) return;
  const distance = player.x - boss.x; 
  if (Math.abs(distance) > 70) boss.vx = Math.sign(distance) * 1.1; else boss.vx = 0;
  boss.x += boss.vx; boss.jumpTimer--;
  if (boss.jumpTimer <= 0 && boss.y >= GROUND_Y - 45) { boss.vy = -8.5; boss.jumpTimer = 100; }
  boss.y += boss.vy; boss.vy += getGravity();
  if (boss.y > GROUND_Y - 45) { boss.y = GROUND_Y - 45; boss.vy = 0; }
  boss.shootTimer--;
  if (boss.shootTimer <= 0) {
    const dx = player.x - boss.x, dy = (player.y - 10) - (boss.y - 10), len = Math.sqrt(dx * dx + dy * dy) || 1;
    enemyBullets.push({ x: boss.x, y: boss.y - 10, vx: dx / len * 4.8, vy: dy / len * 4.8, angle: Math.atan2(dy, dx), life: 130 });
    boss.shootTimer = 85;
  }
  if (Math.abs(player.x - boss.x) < 50 && Math.abs(player.y - boss.y) < 50) {
    if (player.vy > 0 && player.y < boss.y - 15) {
      boss.hp--; player.vy = -10;
      spawnParticles(boss.x, boss.y, "#ff5555", 8, 5, 3);
      if (boss.hp <= 0) { boss.alive = false; spawnExplosion(boss.x, boss.y); totalStars += 10; victory = true; }
      saveProgress();
    } else {
      hurtPlayer();
    }
  }
}

function updateBullets() {
  for (const b of bullets) {
    b.x += b.vx; b.life--;
    for (const e of enemies) if (e.alive && Math.abs(b.x - e.x) < 30 && Math.abs(b.y - e.y) < 35) { e.alive = false; b.life = 0; spawnExplosion(e.x, e.y); totalStars += 1; saveProgress(); }
    for (const bear of bears) if (bear.alive && Math.abs(b.x - bear.x) < 30 && Math.abs(b.y - bear.y) < 30) {
      bear.hp--; bear.hurtFlash = 20; b.life = 0;
      spawnParticles(bear.x, bear.y, "#ff5555", 5, 4, 2);
      if (bear.hp <= 0) { bear.alive = false; spawnExplosion(bear.x, bear.y); totalStars += 5; }
      saveProgress();
    }
    if (boss && boss.isBossLevel && bossBattle && boss.alive && Math.abs(b.x - boss.x) < 45 && Math.abs(b.y - boss.y) < 50) {
      boss.hp--; b.life = 0;
      spawnParticles(boss.x, boss.y, "#ff5555", 8, 5, 3);
      if (boss.hp <= 0) { boss.alive = false; spawnExplosion(boss.x, boss.y); totalStars += 10; victory = true; }
      saveProgress();
    }
  }
  bullets = bullets.filter(b => b.life > 0 && b.x > -100 && b.x < LEVEL_WIDTH + 100);
  
  for (const b of enemyBullets) {
    b.x += b.vx; b.y += b.vy; b.life--;
    if (Math.abs(b.x - player.x) < 25 && Math.abs(b.y - player.y) < 25) { b.life = 0; hurtPlayer(); }
  }
  enemyBullets = enemyBullets.filter(b => b.life > 0);
}

function checkLevelEnd() {
  if (isTransitioning || gameOver || victory) return;
  const hutX = LEVEL_WIDTH - 140;
  if (player.x > hutX + 40 && player.x < hutX + 85) {
    isTransitioning = true; stopShoot();
    setTimeout(() => {
      if (world < TOTAL_LEVELS - 1) {
        world++; makeLevel(); isTransitioning = false;
      } else {
        victory = true; isTransitioning = false;
      }
    }, 1000);
  }
}

function update() {
  if (gameOver || victory) { draw(); gameLoopRunning = false; return; }
  frame++; 
  updatePlayer(); updateEnemies(); updateBears(); updateBoss(); updateBullets(); updateParticles();
  checkLevelEnd(); draw();
  if (frame - lastSaveFrame >= 60) { saveProgress(); lastSaveFrame = frame; }
  requestAnimationFrame(update);
}

function startGameLoop() { if (gameLoopRunning) return; gameLoopRunning = true; requestAnimationFrame(update); }

// --- ИНИЦИАЛИЗАЦИЯ И УПРАВЛЕНИЕ ---
function makeLevel() {
  player = { x: 70, y: GROUND_Y - 19, vx: 0, vy: 0, r: 19, speed: (world === 10 ? 2.2 : 3.2), facing: 1, onGround: false, health: 3, invincible: 0, jumpsLeft: 2, maxJumps: 2 };
  gaps = [{x:760,w:90},{x:1450,w:110},{x:2050,w:90}];
  enemies = []; bears = []; bullets = []; enemyBullets = []; stars = []; platforms = []; pickups = []; particles = []; floatingTexts = [];
  bossBattle = false; isTransitioning = false; levelBannerTimer = 180; playerSquash = 1; playerStretch = 1;
  
  for (let i = 0; i < 5; i++) {
    const x = 390 + i * 370;
    if (gaps.some(g => x > g.x - 20 && x < g.x + g.w + 20)) continue;
    enemies.push({ x, y: GROUND_Y - 20, vx: 0.6 + (world % 4) * 0.1, vy: 0, min: x - 95, max: x + 95, alive: true, onGround: true, jumpTimer: 60 + i * 27, hp: 1 });
  }
  if (world % 4 >= 2) bears.push({ x: 1350, y: GROUND_Y - 30, vx: 0.6, vy: 0, hp: 3, maxHp: 3, alive: true, onGround: true, facing: 1, throwTimer: 140, hurtFlash: 0 });
  
  platforms = [{x:260,y:GROUND_Y - 75,w:120,h:16},{x:570,y:GROUND_Y - 110,w:135,h:16},{x:900,y:GROUND_Y - 80,w:140,h:16},{x:1250,y:GROUND_Y - 115,w:150,h:16},{x:1590,y:GROUND_Y - 80,w:130,h:16},{x:1900,y:GROUND_Y - 110,w:150,h:16}];
  for (let i = 0; i < 13; i++) {
    const sx = 240 + i * 165;
    if (gaps.some(g => sx > g.x - 10 && sx < g.x + g.w + 10)) continue;
    stars.push({ x: sx, y: i % 2 === 0 ? GROUND_Y - 140 : GROUND_Y - 50, taken: false });
  }
  boss = { x: 2180, y: GROUND_Y - 45, vx: 1.2, vy: 0, hp: 10, maxHp: 10, alive: true, shootTimer: 100, jumpTimer: 90, isBossLevel: (world === TOTAL_LEVELS - 1) };
  camera = Math.max(0, Math.min(LEVEL_WIDTH - W, player.x - W * 0.38));
}

function saveProgress() {
  try {
    const data = { version: 8, world, totalStars, lastSafeX: player.x, currentWeapon, player: { x: player.x, y: player.y, health: player.health, facing: player.facing }, bossBattle, gameOver, victory };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (error) { console.warn("save error", error); }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || data.version !== 8) return false;
    world = data.world; totalStars = Math.max(0, Number(data.totalStars) || 0); lastSafeX = Number(data.lastSafeX) || 70;
    if (["minigun", "shotgun", "ak47"].includes(data.currentWeapon)) currentWeapon = data.currentWeapon;
    makeLevel();
    if (data.player) {
      player.x = Math.max(19, Math.min(LEVEL_WIDTH - 20, Number(data.player.x) || 70));
      player.y = Math.max(30, Math.min(GROUND_Y - 5, Number(data.player.y) || GROUND_Y - 19));
      player.health = Math.max(1, Math.min(3, Number(data.player.health) || 3));
      player.facing = data.player.facing === -1 ? -1 : 1;
      player.vx = 0; player.vy = 0; player.invincible = 0;
    }
    bossBattle = data.bossBattle === true; gameOver = data.gameOver === true; victory = data.victory === true;
    camera = Math.max(0, Math.min(LEVEL_WIDTH - W, player.x - W * 0.38));
    return true;
  } catch (e) { return false; }
}

function deleteSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

// Обработчики событий (аналогичны оригиналу, но с обновленными ID)
document.addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "Space"].includes(e.code)) e.preventDefault();
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
  if ((e.code === "ArrowUp" || e.code === "Space" || e.code === "KeyW") && !e.repeat) jump();
  if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = true;
  if ((e.code === "KeyJ" || e.code === "KeyF") && !e.repeat) startShoot();
  if ((e.code === "ShiftLeft" || e.code === "KeyK") && !e.repeat) dash();
});
document.addEventListener("keyup", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
  if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = false;
  if (e.code === "KeyJ" || e.code === "KeyF") stopShoot();
});

// Привязка сенсорных кнопок
function bindHold(id, key) {
  const button = document.getElementById(id);
  button.addEventListener("pointerdown", e => { e.preventDefault(); keys[key] = true; try { button.setPointerCapture(e.pointerId); } catch (err) {} });
  const release = e => { e.preventDefault(); keys[key] = false; };
  button.addEventListener("pointerup", release); button.addEventListener("pointercancel", release);
  button.addEventListener("lostpointercapture", () => keys[key] = false);
}
bindHold("left", "left"); bindHold("right", "right");

function bindShoot() {
  const button = document.getElementById("shoot");
  button.addEventListener("pointerdown", e => { e.preventDefault(); startShoot(); try { button.setPointerCapture(e.pointerId); } catch (err) {} });
  const stop = e => { e.preventDefault(); stopShoot(); };
  button.addEventListener("pointerup", stop); button.addEventListener("pointercancel", stop); button.addEventListener("lostpointercapture", stop);
}
bindShoot();

function bindJump() {
  const button = document.getElementById("jump");
  button.addEventListener("pointerdown", e => { e.preventDefault(); jump(); keys.up = true; try { button.setPointerCapture(e.pointerId); } catch (err) {} });
  const stop = e => { e.preventDefault(); keys.up = false; };
  button.addEventListener("pointerup", stop); button.addEventListener("pointercancel", stop); button.addEventListener("lostpointercapture", stop);
}
bindJump();

function bindTap(id, action) {
  const button = document.getElementById(id);
  button.addEventListener("pointerdown", e => { e.preventDefault(); action(); });
}
bindTap("dash", dash);

// Меню
const wpnButtons = document.querySelectorAll(".weapon-btn");
wpnButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    wpnButtons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentWeapon = btn.dataset.weapon;
    document.getElementById("shoot").textContent = currentWeapon === "minigun" ? "💥" : "🔫";
  });
});

const hasSave = loadProgress();
if (!hasSave) document.getElementById("btn-continue").style.display = "none";

document.getElementById("btn-continue").addEventListener("click", () => {
  menuScreen.classList.add("hidden");
  makeLevel(); loadProgress();
  startGameLoop();
});

document.getElementById("btn-new").addEventListener("click", () => {
  if (confirm("Начать новую игру? Старое сохранение будет удалено.")) {
    deleteSave(); world = 0; totalStars = 0; gameOver = false; victory = false; frame = 0;
    makeLevel(); menuScreen.classList.add("hidden"); startGameLoop();
  }
});

document.getElementById("restart").addEventListener("click", () => {
  if (!confirm("Начать игру заново?")) return;
  deleteSave(); world = 0; totalStars = 0; gameOver = false; victory = false; frame = 0; keys = {};
  makeLevel(); startGameLoop();
});

window.addEventListener("blur", () => { keys.left = false; keys.right = false; keys.up = false; stopShoot(); saveProgress(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { keys.left = false; keys.right = false; keys.up = false; stopShoot(); saveProgress(); } });
</script>
