
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колобок: Большое приключение</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#182b42;color:white;font-family:Arial,sans-serif;text-align:center}
header{padding:12px;background:#263e59}
h1{font-size:25px;margin:5px}
#info{font-size:17px;margin:8px}
#game{display:block;width:100%;max-width:900px;margin:auto;background:#8bd7f5;border:3px solid #fff;border-radius:8px;touch-action:none}
#controls{display:flex;justify-content:center;gap:25px;margin:14px}
button{font-size:24px;padding:13px 25px;border:0;border-radius:14px;background:#ffcf55;color:#38240b;font-weight:bold;touch-action:none}
#jump{background:#ff9255}
#message{padding:8px;min-height:28px}
</style>
</head>
<body>
<header>
<h1>🥯 Колобок: Большое приключение</h1>
<div id="info">Мир 1 · Жизни: ❤️❤️❤️ · Звёзды: 0</div>
</header>
<canvas id="game" width="900" height="440"></canvas>
<div id="message">Помоги Колобку пройти все четыре мира!</div>
<div id="controls">
<button id="left">◀</button>
<button id="jump">ПРЫЖОК ⬆</button>
<button id="right">▶</button>
</div>
<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const info=document.getElementById("info");
const message=document.getElementById("message");

const worlds=[
 {name:"Лесная тропинка",sky:"#8bd7f5",ground:"#55a84c",enemy:"🐰"},
 {name:"Волчий лес",sky:"#829ac5",ground:"#477b42",enemy:"🐺"},
 {name:"Медвежья поляна",sky:"#a6d5a0",ground:"#438b46",enemy:"🐻"},
 {name:"Лисья опушка",sky:"#ffc47b",ground:"#68a34b",enemy:"🦊"}
];

let world=0,stars=0,lives=3,finished=false;
let camera=0;
let keys={left:false,right:false};
let player={x:70,y:300,vx:0,vy:0,r:19,onGround:false};
let platforms=[],enemies=[],items=[];
const gravity=.55;
const levelWidth=2400;

function makeLevel(){
 platforms=[
  {x:0,y:385,w:500,h:60},
  {x:560,y:385,w:280,h:60},
  {x:900,y:385,w:400,h:60},
  {x:1370,y:385,w:350,h:60},
  {x:1800,y:385,w:600,h:60},
  {x:300,y:310,w:130,h:18},
  {x:650,y:295,w:130,h:18},
  {x:1020,y:305,w:140,h:18},
  {x:1460,y:285,w:140,h:18},
  {x:1850,y:300,w:150,h:18}
 ];
 enemies=[
  {x:380,y:350,alive:true},
  {x:760,y:350,alive:true},
  {x:1160,y:350,alive:true},
  {x:1550,y:350,alive:true},
  {x:2000,y:350,alive:true}
 ];
 items=[
  {x:350,y:270,taken:false},
  {x:700,y:255,taken:false},
  {x:1080,y:265,taken:false},
  {x:1510,y:245,taken:false},
  {x:1900,y:260,taken:false},
  {x:2200,y:340,taken:false}
 ];
 player.x=70;player.y=300;player.vx=0;player.vy=0;
 camera=0;
}
makeLevel();

function drawBackground(){
 ctx.fillStyle=worlds[world].sky;
 ctx.fillRect(0,0,900,440);
 ctx.fillStyle="#ffffff";
 for(let i=0;i<5;i++){
  let x=((i*230-camera*.25)%1100+1100)%1100;
  ctx.beginPath();ctx.arc(x,75+i%2*35,24,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(x+25,75+i%2*35,30,0,Math.PI*2);ctx.fill();
 }
 for(let i=0;i<12;i++){
  let x=((i*190-camera*.45)%1100+1100)%1100;
  ctx.fillStyle="#397e48";
  ctx.beginPath();ctx.arc(x,360,55,Math.PI,0);ctx.fill();
  ctx.fillStyle="#23613b";
  ctx.fillRect(x-5,290,10,75);
 }
}

function draw(){
 drawBackground();
 ctx.save();
 ctx.translate(-camera,0);

 // Земля и платформы
 platforms.forEach(p=>{
  ctx.fillStyle=worlds[world].ground;
  ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#9b6335";
  ctx.fillRect(p.x,p.y+12,p.w,p.h);
 });

 // Звёзды
 items.forEach(s=>{
  if(!s.taken){
   ctx.font="27px Arial";
   ctx.fillText("⭐",s.x-12,s.y+10);
  }
 });

 // Враги
 enemies.forEach(e=>{
  if(e.alive){
   ctx.font="38px Arial";
   ctx.fillText(worlds[world].enemy,e.x-18,e.y+12);
  }
 });

 // Финиш
 ctx.fillStyle="#fff";
 ctx.fillRect(2320,245,8,140);
 ctx.fillStyle="#ff4444";
 ctx.fillRect(2328,245,65,38);
 ctx.font="25px Arial";
 ctx.fillText("🏁",2310,230);

 // Колобок
 ctx.beginPath();
 ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
 ctx.fillStyle="#f5b83d";ctx.fill();
 ctx.lineWidth=3;ctx.strokeStyle="#a96b17";ctx.stroke();
 ctx.fillStyle="#38240b";
 ctx.beginPath();ctx.arc(player.x-7,player.y-4,2.8,0,7);ctx.fill();
 ctx.beginPath();ctx.arc(player.x+7,player.y-4,2.8,0,7);ctx.fill();
 ctx.strokeStyle="#8b3c16";ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(player.x,player.y+3,7,.2,2.9);ctx.stroke();
 ctx.restore();

 info.textContent="Мир "+(world+1)+" — "+worlds[world].name+
 " · Жизни: "+ "❤️".repeat(lives)+" · Звёзды: "+stars;
}

function collide(a,b){
 return a.x+a.r>b.x && a.x-a.r<b.x+b.w &&
 a.y+a.r>b.y && a.y-a.r<b.y+b.h;
}

function update(){
 if(finished)return;

 player.vx=0;
 if(keys.left)player.vx=-4;
 if(keys.right)player.vx=4;

 player.x+=player.vx;
 player.x=Math.max(player.r,Math.min(levelWidth-player.r,player.x));
 player.vy+=gravity;
 player.y+=player.vy;
 player.onGround=false;

 platforms.forEach(p=>{
  if(player.x+player.r>p.x && player.x-player.r<p.x+p.w &&
     player.y+player.r>=p.y && player.y+player.r<=p.y+22 &&
     player.vy>=0){
   player.y=p.y-player.r;
   player.vy=0;
   player.onGround=true;
  }
 });

 items.forEach(s=>{
  if(!s.taken && Math.abs(player.x-s.x)<28 && Math.abs(player.y-s.y)<30){
   s.taken=true;stars++;
   message.textContent="Отлично! Ты нашёл звёздочку ⭐";
  }
 });

 enemies.forEach(e=>{
  if(!e.alive)return;
  let dx=Math.abs(player.x-e.x),dy=Math.abs(player.y-e.y);
  if(dx<34 && dy<35){
   if(player.vy>1 && player.y<e.y-5){
    e.alive=false;player.vy=-9;
    message.textContent="Враг побеждён!";
   }else{
    lives--;
    player.x=Math.max(70,player.x-100);
    player.y=280;player.vy=-5;
    if(lives<=0){
     lives=3;stars=0;world=0;makeLevel();
     message.textContent="Попробуй ещё раз!";
    }else message.textContent="Осторожно! Колобок потерял жизнь.";
   }
  }
 });

 if(player.y>490){
  lives--;
  player.x=Math.max(70,player.x-120);
  player.y=280;player.vy=0;
  if(lives<=0){lives=3;stars=0;world=0;makeLevel();}
 }

 if(player.x>2320){
  if(world<3){
   world++;
   makeLevel();
   message.textContent="Новый мир: "+worlds[world].name+"!";
  }else{
   finished=true;
   message.textContent="🎉 Победа! Колобок прошёл все четыре мира!";
  }
 }

 camera=Math.max(0,Math.min(levelWidth-900,player.x-300));
 draw();
 requestAnimationFrame(update);
}

function jump(){
 if(player.onGround){
  player.vy=-12;
  player.onGround=false;
 }
}

function bindButton(id,key){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true;});
 b.addEventListener("pointerup",()=>keys[key]=false);
 b.addEventListener("pointerleave",()=>keys[key]=false);
 b.addEventListener("pointercancel",()=>keys[key]=false);
}
bindButton("left","left");
bindButton("right","right");
document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();jump();
});

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if(e.key==="ArrowUp"||e.key===" "||e.key==="w")jump();
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});

draw();
requestAnimationFrame(update);
</script>
</body>
</html>
