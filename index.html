<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Колобок: Побег</title>
    <style>
        body { margin: 0; padding: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        
        /* Тот самый контейнер, который центрирует игру и создает черные полосы */
        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 800px; /* Ограничиваем ширину для пропорций */
            aspect-ratio: 16 / 9; /* Пропорции как у монитора */
            background: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        
        canvas { display: block; width: 100%; height: 100%; touch-action: none; image-rendering: pixelated; }
        
        /* Кнопки управления */
        #controls { position: absolute; bottom: 10px; display: flex; width: 100%; justify-content: space-between; padding: 0 10px; box-sizing: border-box; pointer-events: none; }
        .btn { background: rgba(255,255,255,0.5); border: 2px solid #fff; border-radius: 10px; width: 60px; height: 60px; font-size: 25px; font-weight: bold; color: #000; display: flex; justify-content: center; align-items: center; user-select: none; pointer-events: auto; }
        .btn:active { background: rgba(255,255,255,0.9); transform: translateY(2px); }
        #btnShoot { position: absolute; right: 10px; bottom: 80px; background: rgba(255,0,0,0.7); color: white; border-color: white; }
        
        /* Стартовый экран */
        #startScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; z-index: 10; }
        h1 { font-size: 32px; margin-bottom: 10px; color: #FFD700; text-shadow: 2px 2px #000; }
        p { font-size: 16px; line-height: 1.5; margin-bottom: 20px; max-width: 400px; }
        #startBtn { padding: 15px 30px; font-size: 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="startScreen">
            <h1>КОЛОБОК: ПОБЕГ</h1>
            <p>Бабушка и дедушка хотели тебя съесть!<br>Хватай дробовик, собирай монеты и беги к заправке.</p>
            <button id="startBtn">НАЧАТЬ ИГРУ</button>
        </div>

        <canvas id="gameCanvas"></canvas>
        
        <div id="controls">
            <div class="btn" id="btnLeft">◀</div>
            <div class="btn" id="btnRight">▶</div>
        </div>
        <div class="btn" id="btnShoot">🔫</div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');

    // Теперь ширина и высота привязаны к контейнеру, а не ко всему экрану
    let cw = 800;
    let ch = 450;

    function resizeCanvas() {
        const container = document.getElementById('gameContainer');
        cw = container.clientWidth;
        ch = container.clientHeight;
        canvas.width = cw;
        canvas.height = ch;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let keys = { right: false, left: false };
    let score = 0;
    let gameOver = false;
    let gameStarted = false;
    let level = 1;
    let levelGoal = 1500;

    const player = {
        x: 100, y: 0, width: 50, height: 50, 
        speed: 6, vy: 0, gravity: 0.8, jumpPower: -15,
        grounded: false, cooldown: 0, facingRight: true
    };

    let bullets = [];
    let enemies = [];
    let coins = [];
    let platforms = [];
    let cameraX = 0;

    function setupLevel(lvl) {
        player.x = 100;
        player.y = ch - 130; 
        bullets = [];
        enemies = [];
        coins = [];
        platforms = [];
        cameraX = 0;
        levelGoal = 1500 * lvl; 

        platforms.push({ x: -2000, y: ch - 80, width: 10000, height: 100 });

        // ДОБАВЛЯЕМ БОЛЬШЕ ВРАГОВ
        if (lvl === 1) {
            enemies.push({ x: cw + 300, y: ch - 110, width: 40, height: 40, speed: 1.5, type: '🐇' });
            enemies.push({ x: cw + 900, y: ch - 110, width: 40, height: 40, speed: 1.6, type: '🐇' });
            enemies.push({ x: cw + 1500, y: ch - 110, width: 40, height: 40, speed: 1.7, type: '🐇' });
        } else if (lvl === 2) {
            enemies.push({ x: cw + 300, y: ch - 110, width: 40, height: 40, speed: 1.8, type: '🐺' });
            enemies.push({ x: cw + 700, y: ch - 110, width: 40, height: 40, speed: 1.9, type: '🐻' });
            enemies.push({ x: cw + 1200, y: ch - 110, width: 40, height: 40, speed: 2.0, type: '🐺' });
            enemies.push({ x: cw + 1800, y: ch - 110, width: 40, height: 40, speed: 2.1, type: '🐻' });
        } else if (lvl === 3) {
            enemies.push({ x: cw + 300, y: ch - 110, width: 40, height: 40, speed: 2.2, type: '🦊' });
            enemies.push({ x: cw + 700, y: ch - 110, width: 40, height: 40, speed: 2.3, type: '🐺' });
            enemies.push({ x: cw + 1200, y: ch - 110, width: 40, height: 40, speed: 2.4, type: '🦊' });
            enemies.push({ x: cw + 1600, y: ch - 110, width: 40, height: 40, speed: 2.5, type: '🐻' });
            enemies.push({ x: cw + 2200, y: ch - 110, width: 40, height: 40, speed: 2.6, type: '🐺' });
        }

        // Больше монет
        for (let i = 0; i < 25; i++) {
            coins.push({ x: 400 + i * 120, y: ch - 150 - Math.random() * 80, width: 20, height: 20 });
        }
    }

    startBtn.addEventListener('click', () => {
        startScreen.style.display = 'none';
        gameStarted = true;
        resizeCanvas();
        setupLevel(level);
    });

    window.addEventListener('keydown', (e) => {
        if (!gameStarted) return;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = true; player.facingRight = true; }
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.left = true; player.facingRight = false; }
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            if (player.grounded) { player.vy = player.jumpPower; player.grounded = false; }
        }
        if (e.code === 'KeyF') shoot();
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    });

    document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; player.facingRight = true; });
    document.getElementById('btnRight').addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
    document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; player.facingRight = false; });
    document.getElementById('btnLeft').addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
    document.getElementById('btnShoot').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
    
    canvas.addEventListener('touchstart', (e) => { 
        if (gameStarted && player.grounded) { player.vy = player.jumpPower; player.grounded = false; }
    });

    function shoot() {
        if (gameOver || !gameStarted) return;
        if (player.cooldown <= 0) {
            let startX = player.facingRight ? player.x + player.width : player.x - 15;
            let speed = player.facingRight ? 15 : -15;
            bullets.push({ x: startX, y: player.y + 20, width: 15, height: 8, speed: speed });
            player.cooldown = 15;
        }
    }

    function update() {
        if (gameOver || !gameStarted) return;
        
        if (player.cooldown > 0) player.cooldown--;

        if (keys.right) player.x += player.speed;
        if (keys.left) player.x -= player.speed;

        if (player.x > cw / 2) {
            cameraX = player.x - cw / 2;
        } else {
            cameraX = 0;
        }

        player.vy += player.gravity;
        player.y += player.vy;
        player.grounded = false;

        platforms.forEach(p => {
            if (player.x + player.width > p.x && player.x < p.x + p.width &&
                player.y + player.height > p.y && player.y < p.y + p.height) {
                if (player.vy > 0 && player.y + player.height - player.vy <= p.y) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            }
        });

        bullets.forEach((b, index) => {
            b.x += b.speed;
            if (b.x > player.x + cw || b.x < player.x - cw) bullets.splice(index, 1);
        });

        enemies.forEach((e, index) => {
            if (e.x > player.x) e.x -= e.speed;
            else e.x += e.speed;

            if (player.x < e.x + e.width && player.x + player.width > e.x &&
                player.y < e.y + e.height && player.y + player.height > e.y) {
                gameOver = true;
            }

            bullets.forEach((b, bIndex) => {
                if (b.x < e.x + e.width && b.x + b.width > e.x &&
                    b.y < e.y + e.height && b.y + b.height > e.y) {
                    enemies.splice(index, 1);
                    bullets.splice(bIndex, 1);
                    score += 10;
                }
            });
        });

        coins.forEach((c, index) => {
            if (player.x < c.x + c.width && player.x + player.width > c.x &&
                player.y < c.y + c.height && player.y + player.height > c.y) {
                coins.splice(index, 1);
                score += 5;
            }
        });

        if (player.x > levelGoal) {
            if (level < 3) {
                level++;
                setupLevel(level);
                alert(`Уровень ${level}!`);
            } else {
                gameOver = true; 
                showWinScreen();
            }
        }
    }

    function showWinScreen() {
        ctx.fillStyle = '#FF8C00'; 
        ctx.fillRect(0, 0, cw, ch);
        ctx.fillStyle = '#FFFF00'; 
        ctx.beginPath(); ctx.arc(cw / 2, ch / 2, 80, 0, Math.PI * 2); ctx.fill();
        
        ctx.font = '100px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🚗', cw / 2, ch - 100);
        ctx.fillText('🥯', cw / 2 - 60, ch - 100);

        ctx.fillStyle = '#FFF'; ctx.font = 'bold 40px "Courier New", Courier, monospace';
        ctx.fillText('ПОБЕГ УДАЛСЯ!', cw / 2, 100);
        ctx.font = '24px "Courier New", Courier, monospace';
        ctx.fillText('Колобок уехал в закат', cw / 2, 150);

        ctx.fillStyle = '#000'; ctx.fillRect(cw / 2 - 100, ch - 50, 200, 40);
        ctx.fillStyle = '#FFF'; ctx.font = '20px Arial';
        ctx.fillText('Играть снова', cw / 2, ch - 25);
        ctx.textAlign = 'left';
    }

    function drawKolobok(x, y, w, h, facingRight) {
        ctx.save();
        ctx.fillStyle = '#D2B48C';
        ctx.beginPath(); ctx.arc(x + w/2, y + h/2, w/2, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#333';
        ctx.beginPath(); ctx.arc(x + w/2, y + h/2, w/2 - 1, 0, Math.PI, false); ctx.fill();
        ctx.strokeStyle = '#CCC'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x + w/2, y + h/2 + 5); ctx.lineTo(x + w/2, y + h - 5); ctx.stroke();
        ctx.fillStyle = '#000';
        if (facingRight) {
            ctx.beginPath(); ctx.arc(x + w/2 + 8, y + h/2 - 5, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + w/2 + 16, y + h/2 - 5, 3, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.beginPath(); ctx.arc(x + w/2 - 16, y + h/2 - 5, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + w/2 - 8, y + h/2 - 5, 3, 0, Math.PI*2); ctx.fill();
        }
        ctx.beginPath(); ctx.arc(x + w/2, y + h/2 + 5, 6, 0.1, Math.PI - 0.1); ctx.stroke();
        ctx.fillStyle = '#555';
        ctx.fillRect(facingRight ? x + w - 5 : x - 15, y + h/2 + 5, 20, 6);
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(facingRight ? x + w - 15 : x + 5, y + h/2 + 7, 10, 8);
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, cw, ch);

        if (level === 1) { ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, cw, ch); }
        else if (level === 2) { ctx.fillStyle = '#2E8B57'; ctx.fillRect(0, 0, cw, ch); }
        else { ctx.fillStyle = '#FF8C00'; ctx.fillRect(0, 0, cw, ch); }

        ctx.save();
        ctx.translate(-cameraX, 0);

        ctx.fillStyle = level === 2 ? '#556B2F' : '#8B4513';
        platforms.forEach(p => ctx.fillRect(p.x, p.y, p.width, p.height));

        ctx.fillStyle = '#228B22';
        ctx.fillRect(-2000, ch - 80, 10000, 15);

        ctx.font = '30px Arial';
        coins.forEach(c => { ctx.fillText('🪙', c.x, c.y + 30); });

        ctx.font = '50px Arial';
        enemies.forEach(e => { ctx.fillText(e.type, e.x, e.y + 45); });

        ctx.fillStyle = '#FF0000';
        bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

        drawKolobok(player.x, player.y, player.width, player.height, player.facingRight);
        ctx.restore();

        ctx.fillStyle = '#000'; ctx.font = 'bold 24px "Courier New", Courier, monospace';
        ctx.fillText(`Счет: ${score}`, 20, 40);
        ctx.fillText(`Уровень: ${level} / 3`, 20, 70);

        if (gameOver && level < 3) {
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, cw, ch);
            ctx.fillStyle = '#FFF'; ctx.textAlign = 'center';
            ctx.font = '48px "Courier New", Courier, monospace';
            ctx.fillText('ИГРА ОКОНЧЕНА', cw / 2, ch / 2 - 50);
            ctx.font = '24px "Courier New", Courier, monospace';
            ctx.fillText('Нажмите чтобы перезапустить', cw / 2, ch / 2);
            ctx.textAlign = 'left';
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    canvas.addEventListener('click', () => { if (gameOver && level < 3) location.reload(); });

    loop();
</script>
</body>
</html>
