<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Колобок: Побег</title>
    <style>
        body { margin: 0; padding: 0; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        
        /* Контейнер для игры: фиксированная высота, чтобы не растягивался на весь экран */
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 400px; /* Фиксированная высота! */
            background: #87CEEB;
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
            overflow: hidden;
        }
        
        canvas { display: block; width: 100%; height: 100%; touch-action: none; image-rendering: pixelated; }
        
        /* Кнопки управления находятся на черном фоне под игрой */
        #controlsContainer {
            width: 100vw;
            height: calc(50vh - 200px); /* Оставшееся место снизу */
            background: #222;
            position: relative;
        }
        
        #controls { position: absolute; top: 20px; display: flex; width: 100%; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; }
        .btn { background: rgba(255,255,255,0.4); border: 2px solid #fff; border-radius: 15px; width: 70px; height: 70px; font-size: 30px; font-weight: bold; color: #000; display: flex; justify-content: center; align-items: center; user-select: none; pointer-events: auto; }
        .btn:active { background: rgba(255,255,255,0.8); transform: translateY(2px); }
        #btnShoot { position: absolute; right: 20px; top: -85px; background: rgba(255,0,0,0.6); color: white; border-color: white; }
        
        /* Стартовый экран */
        #startScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; z-index: 10; }
        h1 { font-size: 32px; margin-bottom: 10px; color: #FFD700; }
        p { font-size: 16px; line-height: 1.5; margin-bottom: 20px; }
        #startBtn { padding: 15px 30px; font-size: 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <!-- Верхняя черная полоса -->
    <div style="width: 100vw; height: calc(50vh - 200px); background: #222; display: flex; justify-content: center; align-items: flex-end; padding-bottom: 10px;">
         <h2 style="color: #FFF; margin: 0; font-size: 20px;">КОЛОБОК: ПОБЕГ</h2>
    </div>

    <div id="gameContainer">
        <div id="startScreen">
            <h1>КОЛОБОК: ПОБЕГ</h1>
            <p>Бабушка и дедушка хотели тебя съесть!<br>Хватай дробовик, собирай монеты и беги к заправке.</p>
            <button id="startBtn">НАЧАТЬ ИГРУ</button>
        </div>

        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- Нижняя черная полоса с кнопками -->
    <div id="controlsContainer">
        <div id="controls">
            <div class="btn" id="btnLeft">◀</div>
            <div class="btn" id="btnRight">▶</div>
        </div>
        <div class="btn" id="btnShoot">🔫</div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');

    // Теперь высота фиксирована (400px), ширина - по экрану
    let cw = window.innerWidth;
    let ch = 400; 

    function resizeCanvas() {
        cw = window.innerWidth;
        ch = 400;
        canvas.width = cw;
        canvas.height = ch;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let keys = { right: false, left: false };
    let score = 0;
    let gameOver = false;
    let gameStarted = false;
    let level = 1;
    let levelGoal = 2000;

    const player = {
        x: 100, y: 0, width: 30, height: 30, 
        speed: 5, vy: 0, gravity: 0.6, jumpPower: -11,
        grounded: false, cooldown: 0, facingRight: true
    };

    let bullets = [];
    let enemies = [];
    let coins = [];
    let platforms = [];
    let cameraX = 0;

    function setupLevel(lvl) {
        player.x = 100;
        let groundY = ch - 80; // Земля внизу контейнера
        player.y = groundY - 30; 
        
        bullets = [];
        enemies = [];
        coins = [];
        platforms = [];
        cameraX = 0;
        levelGoal = 2000 * lvl; 

        platforms.push({ x: -2000, y: groundY, width: 10000, height: 100 });

        if (lvl === 1) {
            enemies.push({ x: cw + 400, y: groundY - 30, width: 30, height: 30, speed: 1.2, type: '🐇' });
            enemies.push({ x: cw + 1000, y: groundY - 30, width: 30, height: 30, speed: 1.3, type: '🐇' });
        } else if (lvl === 2) {
            enemies.push({ x: cw + 400, y: groundY - 30, width: 30, height: 30, speed: 1.4, type: '🐺' });
            enemies.push({ x: cw + 900, y: groundY - 30, width: 30, height: 30, speed: 1.5, type: '🐻' });
            enemies.push({ x: cw + 1400, y: groundY - 30, width: 30, height: 30, speed: 1.6, type: '🐺' });
        } else if (lvl === 3) {
            enemies.push({ x: cw + 400, y: groundY - 30, width: 30, height: 30, speed: 1.7, type: '🦊' });
            enemies.push({ x: cw + 800, y: groundY - 30, width: 30, height: 30, speed: 1.8, type: '🐺' });
            enemies.push({ x: cw + 1300, y: groundY - 30, width: 30, height: 30, speed: 1.9, type: '🦊' });
            enemies.push({ x: cw + 1800, y: groundY - 30, width: 30, height: 30, speed: 2.0, type: '🐻' });
        }

        for (let i = 0; i < 25; i++) {
            coins.push({ x: 400 + i * 120, y: groundY - 60 - Math.random() * 40, width: 15, height: 15 });
        }
    }

    startBtn.addEventListener('click', () => {
        startScreen.style.display = 'none';
        gameStarted = true;
        setupLevel(level);
    });

    window.addEventListener('keydown', (e) => {
        if (!gameStarted) return;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = true; player.facingRight = true; }
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.left = true; player.facingRight = false; }
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            if (player.grounded) { player.vy = player.jumpPower; player.grounded = false; }
        }
        if (e.code === 'KeyF') shoot();
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    });

    document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; player.facingRight = true; });
    document.getElementById('btnRight').addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
    document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; player.facingRight = false; });
    document.getElementById('btnLeft').addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
    document.getElementById('btnShoot').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
    
    canvas.addEventListener('touchstart', (e) => { 
        if (gameStarted && player.grounded) { player.vy = player.jumpPower; player.grounded = false; }
    });

    function shoot() {
        if (gameOver || !gameStarted) return;
        if (player.cooldown <= 0) {
            let startX = player.facingRight ? player.x + player.width : player.x - 10;
            let speed = player.facingRight ? 12 : -12;
            bullets.push({ x: startX, y: player.y + 10, width: 10, height: 5, speed: speed });
            player.cooldown = 15;
        }
    }

    function update() {
        if (gameOver || !gameStarted) return;
        
        if (player.cooldown > 0) player.cooldown--;

        if (keys.right) player.x += player.speed;
        if (keys.left) player.x -= player.speed;

        if (player.x > cw / 2) {
            cameraX = player.x - cw / 2;
        } else {
            cameraX = 0;
        }

        player.vy += player.gravity;
        player.y += player.vy;
        player.grounded = false;

        platforms.forEach(p => {
            if (player.x + player.width > p.x && player.x < p.x + p.width &&
                player.y + player.height > p.y && player.y < p.y + p.height) {
                if (player.vy > 0 && player.y + player.height - player.vy <= p.y) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            }
        });

        bullets.forEach((b, index) => {
            b.x += b.speed;
            if (b.x > player.x + cw || b.x < player.x - cw) bullets.splice(index, 1);
        });

        enemies.forEach((e, index) => {
            if (e.x > player.x) e.x -= e.speed;
            else e.x += e.speed;

            if (player.x < e.x + e.width && player.x + player.width > e.x &&
                player.y < e.y + e.height && player.y + player.height > e.y) {
                gameOver = true;
            }

            bullets.forEach((b, bIndex) => {
                if (b.x < e.x + e.width && b.x + b.width > e.x &&
                    b.y < e.y + e.height && b.y + b.height > e.y) {
                    enemies.splice(index, 1);
                    bullets.splice(bIndex, 1);
                    score += 10;
                }
            });
        });

        coins.forEach((c, index) => {
            if (player.x < c.x + c.width && player.x + player.width > c.x &&
                player.y < c.y + c.height && player.y + player.height > c.y) {
                coins.splice(index, 1);
                score += 5;
            }
        });

        if (player.x > levelGoal) {
            if (level < 3) {
                level++;
                setupLevel(level);
                alert(`Уровень ${level}!`);
            } else {
                gameOver = true; 
                showWinScreen();
            }
        }
    }

    function showWinScreen() {
        ctx.fillStyle = '#FF8C00'; 
        ctx.fillRect(0, 0, cw, ch);
        ctx.fillStyle = '#FFFF00'; 
        ctx.beginPath(); ctx.arc(cw / 2, ch / 2, 60, 0, Math.PI * 2); ctx.fill();
        
        ctx.font = '80px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🚗', cw / 2, ch - 80);
        ctx.fillText('🥯', cw / 2 - 40, ch - 80);

        ctx.fillStyle = '#FFF'; ctx.font = 'bold 30px "Courier New", Courier, monospace';
        ctx.fillText('ПОБЕГ УДАЛСЯ!', cw / 2, 80);
        ctx.font = '20px "Courier New", Courier, monospace';
        ctx.fillText('Колобок уехал в закат', cw / 2, 120);

        ctx.fillStyle = '#000'; ctx.fillRect(cw / 2 - 80, ch - 40, 160, 30);
        ctx.fillStyle = '#FFF'; ctx.font = '16px Arial';
        ctx.fillText('Играть снова', cw / 2, ch - 20);
        ctx.textAlign = 'left';
    }

    function drawKolobok(x, y, w, h, facingRight) {
        ctx.save();
        ctx.fillStyle = '#D2B48C';
        ctx.beginPath(); ctx.arc(x + w/2, y + h/2, w/2, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = '#333';
        ctx.beginPath(); ctx.arc(x + w/2, y + h/2, w/2 - 1, 0, Math.PI, false); ctx.fill();
        ctx.strokeStyle = '#CCC'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(x + w/2, y + h/2 + 3); ctx.lineTo(x + w/2, y + h - 3); ctx.stroke();
        ctx.fillStyle = '#000';
        if (facingRight) {
            ctx.beginPath(); ctx.arc(x + w/2 + 4, y + h/2 - 3, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + w/2 + 9, y + h/2 - 3, 2, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.beginPath(); ctx.arc(x + w/2 - 9, y + h/2 - 3, 2, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + w/2 - 4, y + h/2 - 3, 2, 0, Math.PI*2); ctx.fill();
        }
        ctx.beginPath(); ctx.arc(x + w/2, y + h/2 + 3, 4, 0.1, Math.PI - 0.1); ctx.stroke();
        ctx.fillStyle = '#555';
        ctx.fillRect(facingRight ? x + w - 3 : x - 10, y + h/2 + 3, 13, 4);
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(facingRight ? x + w - 10 : x + 3, y + h/2 + 4, 7, 5);
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, cw, ch);

        if (level === 1) { ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, cw, ch); }
        else if (level === 2) { ctx.fillStyle = '#2E8B57'; ctx.fillRect(0, 0, cw, ch); }
        else { ctx.fillStyle = '#FF8C00'; ctx.fillRect(0, 0, cw, ch); }

        ctx.save();
        ctx.translate(-cameraX, 0);

        ctx.fillStyle = level === 2 ? '#556B2F' : '#8B4513';
        platforms.forEach(p => ctx.fillRect(p.x, p.y, p.width, p.height));

        ctx.fillStyle = '#228B22';
        let groundY = ch - 80;
        ctx.fillRect(-2000, groundY, 10000, 15);

        ctx.font = '20px Arial';
        coins.forEach(c => { ctx.fillText('🪙', c.x, c.y + 20); });

        ctx.font = '35px Arial';
        enemies.forEach(e => { ctx.fillText(e.type, e.x, e.y + 35); });

        ctx.fillStyle = '#FF0000';
        bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

        drawKolobok(player.x, player.y, player.width, player.height, player.facingRight);
        ctx.restore();

        ctx.fillStyle = '#000'; ctx.font = 'bold 18px "Courier New", Courier, monospace';
        ctx.fillText(`Счет: ${score}`, 10, 25);
        ctx.fillText(`Уровень: ${level} / 3`, 10, 45);

        if (gameOver && level < 3) {
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, cw, ch);
            ctx.fillStyle = '#FFF'; ctx.textAlign = 'center';
            ctx.font = '36px "Courier New", Courier, monospace';
            ctx.fillText('ИГРА ОКОНЧЕНА', cw / 2, ch / 2 - 30);
            ctx.font = '18px "Courier New", Courier, monospace';
            ctx.fillText('Нажмите чтобы перезапустить', cw / 2, ch / 2 + 10);
            ctx.textAlign = 'left';
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    canvas.addEventListener('click', () => { if (gameOver && level < 3) location.reload(); });

    loop();
</script>
</body>
</html>
