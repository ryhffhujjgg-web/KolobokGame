<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Колобок: Большое приключение</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17283c;color:white;font-family:Arial;text-align:center}
header{padding:10px;background:#263e59}
h1{font-size:22px;margin:5px}
#info{font-size:16px;margin:8px}
canvas{display:block;width:100%;max-width:900px;margin:auto;background:#8bd7f5;border:2px solid white;touch-action:none}
#controls{display:flex;justify-content:center;gap:9px;margin:12px auto;flex-wrap:wrap}
button{font-size:20px;padding:13px 17px;border:0;border-radius:12px;background:#ffcf55;font-weight:bold;touch-action:none;user-select:none;-webkit-user-select:none}
#shoot{background:#e95b43;color:white}
#jump{background:#69c7ff}
#message{padding:8px;min-height:30px}
</style>
</head>
<body>
<header>
<h1>🥯 Колобок: Большое приключение</h1>
<div id="info"></div>
</header>

<canvas id="game" width="900" height="440"></canvas>
<div id="message">Нажми любую кнопку, чтобы начать приключение!</div>

<div id="controls">
<button id="left">◀</button>
<button id="right">▶</button>
<button id="jump">ПРЫЖОК</button>
<button id="shoot">🔫 ОГОНЬ</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const info=document.getElementById("info");
const message=document.getElementById("message");

// Полифилл roundRect для старых браузеров/WebView
if(typeof CanvasRenderingContext2D!=="undefined"&&!CanvasRenderingContext2D.prototype.roundRect){
 CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
  r=Math.min(typeof r==="number"?r:5,w/2,h/2);
  this.moveTo(x+r,y);
  this.arcTo(x+w,y,x+w,y+h,r);
  this.arcTo(x+w,y+h,x,y+h,r);
  this.arcTo(x,y+h,x,y,r);
  this.arcTo(x,y,x+w,y,r);
  this.closePath();
  return this;
 };
}

const worlds=[
 {name:"Лесная тропинка",sky:"#8bd7f5",ground:"#55a84c",enemy:"🐰"},
 {name:"Волчий лес",sky:"#829ac5",ground:"#477b42",enemy:"🐺"},
 {name:"Медвежья поляна",sky:"#a6d5a0",ground:"#438b46",enemy:"🐻"},
 {name:"Лисья опушка",sky:"#ffc47b",ground:"#68a34b",enemy:"🦊"}
];

let world=0,stars=0,lives=3,finished=false;
let camera=0;
let keys={left:false,right:false};
let bullets=[];
let audioStarted=false;
let audioCtx=null;
let boss=null;
let barrierHint=false;

// Рекорд из localStorage (безопасно для приватного режима)
let record=0;
try{record=parseInt(localStorage.getItem("kolobokRecord"))||0;}catch(e){}
let runStartRecord=record;

function addStars(n){
 stars+=n;
 if(stars>record){
  record=stars;
  try{localStorage.setItem("kolobokRecord",String(record));}catch(e){}
 }
}

const player={
 x:70,y:300,vx:0,vy:0,r:19,
 onGround:false,face:1,cooldown:0,inv:0
};

let platforms=[],enemies=[],items=[];
const gravity=.55;
const levelWidth=2400;

function sound(freq=400,duration=.12,type="square"){
 try{
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type=type;
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(.12,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start();osc.stop(audioCtx.currentTime+duration);
 }catch(e){}
}

function scream(){
 try{
  if("speechSynthesis" in window){
   speechSynthesis.cancel();
   const voice=new SpeechSynthesisUtterance("Ай, блядь!");
   voice.lang="ru-RU";
   voice.rate=1.15;
   voice.pitch=1.1;
   speechSynthesis.speak(voice);
  }
 }catch(e){}
 sound(180,.25,"sawtooth");
}

function startAudio(){
 if(audioStarted)return;
 audioStarted=true;
 sound(500,.12);
 try{
  if("speechSynthesis" in window){
   const u=new SpeechSynthesisUtterance(" ");
   u.volume=0;u.lang="ru-RU";
   speechSynthesis.speak(u);
  }
 }catch(e){}
}

function makeLevel(){
 platforms=[
  {x:0,y:385,w:500,h:60},
  {x:560,y:385,w:280,h:60},
  {x:900,y:385,w:400,h:60},
  {x:1370,y:385,w:350,h:60},
  {x:1800,y:385,w:600,h:60},
  {x:300,y:310,w:130,h:18},
  {x:650,y:295,w:130,h:18},
  {x:1020,y:305,w:140,h:18},
  {x:1460,y:285,w:140,h:18},
  {x:1850,y:300,w:150,h:18}
 ];

 enemies=[
  {x:380,y:350,alive:true,min:330,max:470,dir:1},
  {x:760,y:350,alive:true,min:590,max:810,dir:-1},
  {x:1160,y:350,alive:true,min:950,max:1260,dir:1},
  {x:1550,y:350,alive:true,min:1400,max:1680,dir:-1},
  {x:2000,y:350,alive:true,min:1850,max:2250,dir:1}
 ];

 items=[
  {x:350,y:270,taken:false},
  {x:700,y:255,taken:false},
  {x:1080,y:265,taken:false},
  {x:1510,y:245,taken:false},
  {x:1900,y:260,taken:false},
  {x:2200,y:340,taken:false}
 ];

 // Босс только в четвёртом мире
 boss=(world===3)?{
  x:2150,y:345,hp:8,maxHp:8,alive:true,
  min:1850,max:2290,dir:-1,
  charge:0,timer:120,flash:0
 }:null;
 barrierHint=false;

 bullets=[];
 player.x=70;
 player.y=300;
 player.vx=0;
 player.vy=0;
 player.onGround=false;
 player.face=1;
 player.cooldown=0;
 player.inv=0;
 camera=0;
}

function restart(){
 world=0;stars=0;lives=3;finished=false;
 runStartRecord=record;
 makeLevel();
 message.textContent="Новое приключение!";
 sound(700,.3,"sine");
}

function hurt(msg){
 lives--;
 player.inv=90;
 sound(120,.3,"sawtooth");
 if(lives<=0){
  lives=3;stars=0;world=0;
  runStartRecord=record;
  makeLevel();
  message.textContent="Колобок потерял все жизни. Начнём сначала!";
 }else{
  message.textContent=msg;
 }
}

function drawBackground(){
 ctx.fillStyle=worlds[world].sky;
 ctx.fillRect(0,0,900,440);

 ctx.fillStyle="#fff";
 for(let i=0;i<5;i++){
  let x=((i*230-camera*.25)%1100+1100)%1100;
  ctx.beginPath();
  ctx.arc(x,75+i%2*35,24,0,Math.PI*2);
  ctx.arc(x+25,75+i%2*35,30,0,Math.PI*2);
  ctx.fill();
 }

 for(let i=0;i<12;i++){
  let x=((i*190-camera*.45)%1100+1100)%1100;
  ctx.fillStyle="#397e48";
  ctx.beginPath();
  ctx.arc(x,360,55,Math.PI,0);
  ctx.fill();
  ctx.fillStyle="#23613b";
  ctx.fillRect(x-5,290,10,75);
 }
}

function drawPlayer(){
 ctx.save();
 ctx.translate(player.x,player.y);

 if(player.inv>0&&Math.floor(player.inv/5)%2===0)ctx.globalAlpha=.35;

 ctx.fillStyle="#34251c";
 ctx.fillRect(-12,12,10,7);
 ctx.fillRect(3,12,10,7);

 ctx.fillStyle="#5a301b";
 ctx.beginPath();
 ctx.roundRect(-17,-8,34,22,8);
 ctx.fill();

 ctx.strokeStyle="#c18a4c";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(0,-5);ctx.lineTo(0,12);
 ctx.stroke();

 ctx.beginPath();
 ctx.arc(0,-12,19,0,Math.PI*2);
 ctx.fillStyle="#f5b83d";
 ctx.fill();
 ctx.lineWidth=3;
 ctx.strokeStyle="#a96b17";
 ctx.stroke();

 ctx.fillStyle="#38240b";
 ctx.beginPath();
 ctx.arc(-7,-16,2.8,0,7);
 ctx.arc(7,-16,2.8,0,7);
 ctx.fill();
 ctx.strokeStyle="#8b3c16";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(0,-10,7,.2,2.9);
 ctx.stroke();

 ctx.save();
 if(player.face<0)ctx.scale(-1,1);
 ctx.fillStyle="#654321";
 ctx.fillRect(10,-8,22,7);
 ctx.fillStyle="#252525";
 ctx.fillRect(24,-7,23,4);
 ctx.fillStyle="#999";
 ctx.fillRect(43,-8,5,6);
 ctx.restore();

 ctx.restore();
}

function drawBoss(){
 if(!boss||!boss.alive)return;
 ctx.save();
 if(boss.flash>0&&boss.flash%2===0)ctx.globalAlpha=.45;
 // Лис смотрит влево по умолчанию; разворачиваем при движении вправо
 ctx.translate(boss.x,0);
 if(boss.dir>0)ctx.scale(-1,1);
 ctx.font="64px Arial";
 ctx.fillText("🦊",-32,boss.y+38);
 ctx.restore();
 // Корона и восклицание при рывке
 ctx.font="26px Arial";
 ctx.fillText("👑",boss.x-13,boss.y-38);
 if(boss.charge>0){
  ctx.font="24px Arial";
  ctx.fillText("❗",boss.x-8,boss.y-62);
 }
}

function draw(){
 drawBackground();
 ctx.save();
 ctx.translate(-camera,0);

 platforms.forEach(p=>{
  ctx.fillStyle=worlds[world].ground;
  ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#9b6335";
  ctx.fillRect(p.x,p.y+12,p.w,p.h);
 });

 items.forEach(s=>{
  if(!s.taken){
   ctx.font="27px Arial";
   ctx.fillText("⭐",s.x-12,s.y+10);
  }
 });

 enemies.forEach(e=>{
  if(e.alive){
   ctx.font="38px Arial";
   ctx.fillText(worlds[world].enemy,e.x-18,e.y+12);
  }
 });

 drawBoss();

 // Барьер перед флагом, пока босс жив
 if(boss&&boss.alive){
  ctx.fillStyle="rgba(233,91,67,.35)";
  ctx.fillRect(2302,240,12,145);
  ctx.font="24px Arial";
  ctx.fillText("🔒",2296,232);
 }

 bullets.forEach(b=>{
  ctx.fillStyle="#ffeb68";
  ctx.fillRect(b.x,b.y,19,5);
  ctx.fillStyle="#ff713b";
  ctx.fillRect(b.x+15,b.y,5,5);
 });

 ctx.fillStyle="#fff";
 ctx.fillRect(2320,245,8,140);
 ctx.fillStyle="#ff4444";
 ctx.fillRect(2328,245,65,38);
 ctx.font="25px Arial";
 ctx.fillText("🏁",2310,230);

 drawPlayer();
 ctx.restore();

 // Полоска HP босса (экранные координаты)
 if(boss&&boss.alive){
  ctx.save();
  ctx.fillStyle="rgba(0,0,0,.45)";
  ctx.fillRect(250,12,400,26);
  ctx.fillStyle="#e95b43";
  ctx.fillRect(254,16,392*boss.hp/boss.maxHp,18);
  ctx.fillStyle="#fff";
  ctx.font="bold 14px Arial";
  ctx.textAlign="center";
  ctx.fillText("👑 ЛИС-БОСС  "+boss.hp+"/"+boss.maxHp,450,30);
  ctx.restore();
 }

 if(finished){
  ctx.save();
  ctx.fillStyle="rgba(20,30,50,.55)";
  ctx.fillRect(0,0,900,440);
  ctx.fillStyle="#fff";
  ctx.textAlign="center";
  ctx.font="bold 46px Arial";
  ctx.fillText("🎉 ПОБЕДА!",450,180);
  ctx.font="26px Arial";
  ctx.fillText("Звёзды: "+stars+" ⭐   Рекорд: "+record+" ⭐",450,225);
  if(stars>runStartRecord){
   ctx.fillStyle="#ffcf55";
   ctx.font="bold 28px Arial";
   ctx.fillText("🏆 НОВЫЙ РЕКОРД!",450,265);
  }
  ctx.fillStyle="#fff";
  ctx.font="22px Arial";
  ctx.fillText("Нажми на экран или любую кнопку,",450,310);
  ctx.fillText("чтобы сыграть снова",450,338);
  ctx.restore();
 }

 info.textContent="Мир "+(world+1)+" — "+worlds[world].name+
 " · Жизни: "+"❤️".repeat(lives)+" · Звёзды: "+stars+" · Рекорд: "+record;
}

function jump(){
 startAudio();
 if(player.onGround){
  player.vy=-12;
  player.onGround=false;
  sound(550,.13,"sine");
 }
}

function shoot(){
 startAudio();
 if(player.cooldown>0)return;
 player.cooldown=18;
 bullets.push({
  x:player.x+player.face*35,
  y:player.y-17,
  vx:player.face*10
 });
 sound(100,.16,"sawtooth");
 setTimeout(()=>sound(65,.1,"square"),65);
}

function update(){
 if(finished)return;

 player.vx=0;
 if(keys.left){player.vx=-4;player.face=-1;}
 if(keys.right){player.vx=4;player.face=1;}

 player.x+=player.vx;
 player.x=Math.max(player.r,Math.min(levelWidth-player.r,player.x));

 player.vy+=gravity;
 player.y+=player.vy;
 player.onGround=false;

 platforms.forEach(p=>{
  if(player.x+player.r>p.x &&
     player.x-player.r<p.x+p.w &&
     player.y+player.r>=p.y &&
     player.y+player.r<=p.y+22 &&
     player.vy>=0){
   player.y=p.y-player.r;
   player.vy=0;
   player.onGround=true;
  }
 });

 if(player.inv>0)player.inv--;

 enemies.forEach(e=>{
  if(!e.alive)return;
  e.x+=e.dir*1.25;
  if(Math.abs(player.x-e.x)<160){
   e.x+=Math.sign(player.x-e.x)*.5;
  }
  if(e.x<e.min){e.x=e.min;e.dir=1;}
  if(e.x>e.max){e.x=e.max;e.dir=-1;}
 });

 // Босс: патруль, погоня и рывок
 if(boss&&boss.alive){
  boss.timer--;
  if(boss.charge>0){
   boss.charge--;
   boss.x+=boss.dir*5;
  }else{
   boss.x+=boss.dir*1.6;
   if(Math.abs(player.x-boss.x)<260){
    boss.x+=Math.sign(player.x-boss.x)*.9;
   }
   if(boss.timer<=0&&Math.abs(player.x-boss.x)<420){
    boss.dir=Math.sign(player.x-boss.x)||1;
    boss.charge=36;
    boss.timer=150;
    sound(90,.3,"sawtooth");
    message.textContent="⚠️ Лис-босс делает рывок! Прыгай!";
   }
  }
  if(boss.x<boss.min){boss.x=boss.min;boss.dir=1;boss.charge=0;}
  if(boss.x>boss.max){boss.x=boss.max;boss.dir=-1;boss.charge=0;}
  if(boss.flash>0)boss.flash--;

  // Урон от босса
  if(player.inv<=0&&Math.abs(player.x-boss.x)<45&&Math.abs(player.y-boss.y)<45){
   player.x=Math.max(70,player.x-120);
   player.y=280;
   player.vy=-6;
   hurt("🦊 Лис-босс ударил Колобка!");
  }

  // Барьер: к флагу нельзя, пока босс жив
  if(player.x>2300){
   player.x=2300;
   if(!barrierHint){
    message.textContent="🔒 Сначала победи Лиса-босса!";
    barrierHint=true;
   }
  }else if(player.x<2200){
   barrierHint=false;
  }
 }

 bullets.forEach(b=>{
  b.x+=b.vx;
  enemies.forEach(e=>{
   if(b.hit)return;
   if(e.alive && Math.abs(b.x-e.x)<28 && Math.abs(b.y-e.y)<35){
    e.alive=false;
    b.hit=true;
    addStars(1);
    scream();
    message.textContent="💥 Враг побеждён!";
   }
  });
  // Попадание по боссу
  if(!b.hit&&boss&&boss.alive&&
     Math.abs(b.x-boss.x)<40&&Math.abs(b.y-boss.y)<45){
   b.hit=true;
   boss.hp--;
   boss.flash=8;
   sound(200,.15,"square");
   if(boss.hp<=0){
    boss.alive=false;
    addStars(5);
    scream();
    message.textContent="👑 Лис-босс побеждён! +5 ⭐ Путь к флагу открыт!";
    sound(900,.4,"sine");
   }else{
    message.textContent="🎯 Попадание! У босса осталось "+boss.hp+" HP";
   }
  }
 });
 bullets=bullets.filter(b=>!b.hit&&b.x>camera-50&&b.x<camera+1000);

 if(player.cooldown>0)player.cooldown--;

 items.forEach(s=>{
  if(!s.taken && Math.abs(player.x-s.x)<28 &&
     Math.abs(player.y-s.y)<30){
   s.taken=true;
   addStars(1);
   sound(800,.2,"sine");
   message.textContent="Ты нашёл звёздочку ⭐";
  }
 });

 enemies.forEach(e=>{
  if(!e.alive||player.inv>0)return;
  let dx=Math.abs(player.x-e.x);
  let dy=Math.abs(player.y-e.y);
  if(dx<31&&dy<32){
   e.x=Math.max(e.min,Math.min(e.max,e.x+(player.x<e.x?80:-80)));
   player.x=Math.max(70,player.x-100);
   player.y=280;
   player.vy=-6;
   hurt("Осторожно! Колобок получил урон!");
  }
 });

 if(player.y>490){
  player.x=Math.max(70,player.x-120);
  player.y=280;
  player.vy=0;
  hurt("Колобок упал в яму! Минус жизнь.");
 }

 if(player.x>2320){
  if(world<3){
   world++;
   makeLevel();
   message.textContent="Новый мир: "+worlds[world].name+"!"+
    (world===3?" Впереди Лис-босс 👑":"");
   sound(700,.3,"sine");
  }else{
   finished=true;
   message.textContent=stars>runStartRecord
    ?"🎉 Победа! 🏆 Новый рекорд: "+stars+" ⭐"
    :"🎉 Победа! Колобок прошёл все четыре мира!";
   sound(900,.5,"sine");
  }
 }

 camera=Math.max(0,Math.min(levelWidth-900,player.x-300));
}

// Фиксированный шаг: 60 шагов логики в секунду на любом экране
const STEP=1000/60;
let last=performance.now(),acc=0;
function frame(now){
 let dt=now-last;
 last=now;
 if(dt>100)dt=100;
 acc+=dt;
 while(acc>=STEP){
  update();
  acc-=STEP;
 }
 draw();
 requestAnimationFrame(frame);
}

function bindButton(id,key){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  startAudio();
  if(finished){restart();return;}
  keys[key]=true;
  b.setPointerCapture(e.pointerId);
 });
 b.addEventListener("pointerup",()=>keys[key]=false);
 b.addEventListener("pointercancel",()=>keys[key]=false);
 b.addEventListener("lostpointercapture",()=>keys[key]=false);
}
bindButton("left","left");
bindButton("right","right");

document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();
 startAudio();
 if(finished){restart();return;}
 jump();
});
document.getElementById("shoot").addEventListener("pointerdown",e=>{
 e.preventDefault();
 startAudio();
 if(finished){restart();return;}
 shoot();
});

canvas.addEventListener("pointerdown",e=>{
 e.preventDefault();
 startAudio();
 if(finished)restart();
});

document.getElementById("controls").addEventListener("contextmenu",e=>e.preventDefault());

document.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault();
 startAudio();
 if(finished){
  if(e.key==="Enter"||e.key===" ")restart();
  return;
 }
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if((e.key==="ArrowUp"||e.key===" "||e.key==="w")&&!e.repeat)jump();
 if((e.key==="z"||e.key==="x")&&!e.repeat)shoot();
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});

makeLevel();
requestAnimationFrame(frame);
</script>
</body>
</html>
