<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Колобок: Comix Zone Style (Ultimate Edition)</title>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a14; color: white; font-family: 'Courier New', monospace; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; }

#menu-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; transition: opacity 0.5s; overflow-y: auto; }
#menu-screen.hidden { opacity: 0; pointer-events: none; }
#menu-screen h1 { font-size: clamp(36px, 8vw, 64px); color: #f4cf43; text-shadow: 4px 4px 0 #000, -2px -2px 0 #e85b50; margin-bottom: 10px; text-align: center; letter-spacing: 6px; font-weight: 900; }
#menu-screen p { font-size: clamp(14px, 3vw, 20px); color: #a8d8f0; text-shadow: 2px 2px 0 #000; margin-bottom: 30px; text-align: center; }

.weapon-select { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
.weapon-btn { padding: 12px 20px; font-size: 14px; font-weight: bold; border: 3px solid #000; background: #2a2a3e; color: #fff; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; align-items: center; gap: 5px; box-shadow: 5px 5px 0 #000; position: relative; overflow: hidden; }
.weapon-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent); transition: 0.5s; }
.weapon-btn:hover::before { left: 100%; }
.weapon-btn.active { border-color: #f4cf43; color: #f4cf43; background: #3a3a5e; transform: translate(-3px, -3px); box-shadow: 8px 8px 0 #000; }
.weapon-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
.weapon-icon { font-size: 28px; filter: drop-shadow(2px 2px 0 #000); }
.weapon-name { font-size: 11px; letter-spacing: 1px; }

.menu-btn { padding: 16px 48px; font-size: 20px; font-weight: 900; border: 4px solid #000; margin: 10px; cursor: pointer; box-shadow: 6px 6px 0 #000; transition: all 0.1s; letter-spacing: 3px; text-transform: uppercase; }
.menu-btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 #000; }
#btn-continue { background: #4aa9ef; color: white; }
#btn-new { background: #e85b50; color: white; }

#rotate-hint { display: none; position: fixed; inset: 0; background: #1a1a2e; color: white; z-index: 100; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 24px; font-size: 20px; line-height: 1.4; }
#rotate-hint .icon { font-size: 64px; margin-bottom: 16px; animation: rotate 2s infinite ease-in-out; }
@keyframes rotate { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
@media (orientation: portrait) and (max-width: 900px) { #rotate-hint { display: flex; } }

#game-wrap { position: relative; width: 100vw; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; object-fit: contain; touch-action: none; image-rendering: pixelated; image-rendering: crisp-edges; }

#topbar { position: absolute; top: 0; left: 0; right: 0; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 20; pointer-events: none; }
#info { font-size: 15px; color: #fff; background: #000; padding: 8px 12px; border: 3px solid #fff; box-shadow: 3px 3px 0 #f4cf43; max-width: 55%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 900; letter-spacing: 1px; }
#message { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); font-size: 18px; font-weight: 900; color: #000; background: #f4cf43; padding: 8px 20px; border: 3px solid #000; box-shadow: 4px 4px 0 #000; z-index: 21; max-width: 70vw; text-align: center; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
@keyframes popIn { from { transform: translateX(-50%) scale(0.5); opacity: 0; } to { transform: translateX(-50%) scale(1); opacity: 1; } }
#restart { pointer-events: auto; border: 3px solid #000; font-size: 14px; padding: 8px 16px; background: #e85b50; color: #fff; font-weight: 900; box-shadow: 4px 4px 0 #000; }
#music-toggle { pointer-events: auto; border: 3px solid #000; font-size: 14px; padding: 8px 16px; background: #9c27b0; color: #fff; font-weight: 900; box-shadow: 4px 4px 0 #000; margin-left: 8px; }

.controls { width: 100%; height: 120px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background: #16213e; border-top: 4px solid #000; z-index: 30; flex-shrink: 0; }
.left-group, .right-group { display: flex; gap: 15px; }
button.ctrl { border: 3px solid #000; background: #2a2a3e; color: #fff; font-size: 24px; font-weight: 900; box-shadow: 5px 5px 0 #000; touch-action: none; display: flex; align-items: center; justify-content: center; width: 68px; height: 68px; min-width: 68px; transition: all 0.05s; }
button.ctrl:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #000; background: #3a3a5e; }
#jump { background: #4aa9ef; width: 80px; height: 80px; font-size: 14px; }
#shoot { background: #e85b50; width: 80px; height: 80px; font-size: 28px; }
#dash { background: #9c27b0; width: 68px; height: 68px; font-size: 24px; }

@media (max-height: 450px) { 
  button.ctrl { width: 56px; height: 56px; min-width: 56px; font-size: 20px; } 
  #jump, #shoot, #dash { width: 66px; height: 66px; font-size: 12px; } 
  .controls { height: 90px; padding: 0 12px; } 
  #message { font-size: 14px; padding: 6px 12px; top: 50px; } 
  #info { font-size: 12px; padding: 6px 10px; } 
}
</style>

<body>

<div id="menu-screen">
  <h1>КОЛОБОК</h1>
  <p>COMIX ZONE STYLE • ULTIMATE EDITION</p>
  
  <div class="weapon-select">
    <button class="weapon-btn active" id="wpn-shotgun" data-weapon="shotgun">
      <span class="weapon-icon">🔫</span>
      <span class="weapon-name">ДРОБОВИК</span>
    </button>
    <button class="weapon-btn" id="wpn-minigun" data-weapon="minigun">
      <span class="weapon-icon">💥</span>
      <span class="weapon-name">МИНИГАН</span>
    </button>
    <button class="weapon-btn" id="wpn-ak47" data-weapon="ak47">
      <span class="weapon-icon">🔫</span>
      <span class="weapon-name">АК-47</span>
    </button>
  </div>

  <button class="menu-btn" id="btn-continue">ПРОДОЛЖИТЬ</button>
  <button class="menu-btn" id="btn-new">НОВАЯ ИГРА</button>
</div>

<div id="rotate-hint"><div class="icon">📱</div><div>Поверните телефон<br>горизонтально для игры</div></div>
<div id="game-wrap">
  <canvas id="game" width="1200" height="540"></canvas>
  <div id="topbar">
    <div id="info">Мир 1/12 | ⭐ 0 | ❤️ 3</div>
    <div>
      <button id="music-toggle">🎵</button>
      <button id="restart">↻ ЗАНОВО</button>
    </div>
  </div>
  <div id="message">Вперёд, Колобок!</div>
</div>
<div class="controls">
  <div class="left-group"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
  <div class="right-group">
    <button class="ctrl" id="dash">⚡</button>
    <button class="ctrl" id="jump">ПРЫЖОК</button>
    <button class="ctrl" id="shoot">🔫</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");
const message = document.getElementById("message");
const menuScreen = document.getElementById("menu-screen");
const musicToggle = document.getElementById("music-toggle");

const W = canvas.width;
const H = canvas.height;
const LEVEL_WIDTH = 2400;
const GROUND_Y = 470;
const TOTAL_LEVELS = 12;
const SAVE_KEY = "kolobok_comixzone_v9";

const SCALE = 0.5;
const OW = Math.floor(W * SCALE);
const OH = Math.floor(H * SCALE);
const offCanvas = document.createElement('canvas');
offCanvas.width = OW;
offCanvas.height = OH;
const octx = offCanvas.getContext('2d');
octx.imageSmoothingEnabled = false;

const worlds = [
  {name:"Лесная тропинка", sky:"#8bd7f5", ground:"#55a84c", enemy:"rabbit", weather:"leaves", musicKey:0},
  {name:"Волчий лес", sky:"#829ac5", ground:"#477b42", enemy:"wolf", weather:"rain", musicKey:1},
  {name:"Медвежья поляна", sky:"#a6d5a0", ground:"#438b46", enemy:"bear", weather:"none", musicKey:2},
  {name:"Лисья опушка", sky:"#ffc47b", ground:"#68a34b", enemy:"fox", weather:"leaves", musicKey:3},
  {name:"Болото Кикиморы", sky:"#7a9e7e", ground:"#3e6b3a", enemy:"frog", weather:"rain", musicKey:4},
  {name:"Пещера тролля", sky:"#6b7c93", ground:"#4b5a4a", enemy:"troll", weather:"dust", musicKey:5},
  {name:"Замок Кощея", sky:"#c09bd6", ground:"#5a4b6e", enemy:"skeleton", weather:"sparks", musicKey:6},
  {name:"Гора Дракона", sky:"#ff9a76", ground:"#7a4a3a", enemy:"dragon", weather:"ash", musicKey:7},
  {name:"Тёмный бор", sky:"#5b6d8b", ground:"#2e4a3a", enemy:"goblin", weather:"rain", musicKey:8},
  {name:"Огненная пустошь", sky:"#ff7e5f", ground:"#8b3a2a", enemy:"fire", weather:"ash", musicKey:9},
  {name:"Подводное царство", sky:"#006699", ground:"#ccaa55", enemy:"mermaid", weather:"bubbles", musicKey:10},
  {name:"Дремучий лес", sky:"#2b4a2b", ground:"#1a3a1a", enemy:"tree", weather:"rain", musicKey:11}
];

let world = 0; let camera = 0; let player; let enemies = []; let witches = []; let lizards = []; let bears = []; let bullets = []; let enemyBullets = []; let stars = []; let platforms = []; let gaps = []; let boss;
let bossBattle = false; let gameOver = false; let victory = false; let totalStars = 0; let frame = 0; let keys = {}; let soundContext = null; let lastSaveFrame = 0; let lastSafeX = 70; let gameLoopRunning = false; let isTransitioning = false;

let pickups = []; let particles = []; let floatingTexts = []; let shakeTime = 0; let shakeIntensity = 0;
let playerDashing = 0; let playerDashCooldown = 0;
let playerBlink = 0; let playerSquash = 1; let playerStretch = 1;

let currentWeapon = "shotgun"; 
let minigunInterval = null;
let isHoldingShoot = false;

let mermaids = []; let sharks = []; let trees = []; let gopniks = []; let foreground = [];

let rat = { x: 0, y: 0, vx: 0, vy: 0, onGround: false, facing: 1, shootTimer: 0, alive: true, r: 10, animFrame: 0 };
let levelBannerTimer = 0;

// === МУЗЫКАЛЬНАЯ СИСТЕМА ===
let musicEnabled = true;
let musicNodes = [];
let musicInterval = null;
let currentMusicKey = -1;

const musicPatterns = [
  // 0: Лесная тропинка - легкая, веселая
  { notes: [523, 659, 784, 659, 523, 659, 784, 880], tempo: 280, type: "sine", bass: [130, 164, 196, 164] },
  // 1: Волчий лес - таинственная
  { notes: [440, 415, 392, 415, 440, 392, 349, 392], tempo: 320, type: "triangle", bass: [110, 130, 146, 130] },
  // 2: Медвежья поляна - добродушная
  { notes: [349, 392, 440, 523, 440, 392, 349, 294], tempo: 300, type: "sine", bass: [87, 98, 110, 98] },
  // 3: Лисья опушка - хитрая
  { notes: [587, 523, 494, 523, 587, 659, 587, 523], tempo: 260, type: "triangle", bass: [146, 130, 123, 130] },
  // 4: Болото - мрачная
  { notes: [294, 311, 294, 277, 294, 311, 330, 311], tempo: 380, type: "sine", bass: [73, 77, 73, 69] },
  // 5: Пещера тролля - тяжелая
  { notes: [220, 246, 220, 196, 220, 246, 261, 246], tempo: 340, type: "sawtooth", bass: [55, 61, 55, 49] },
  // 6: Замок Кощея - зловещая
  { notes: [330, 311, 294, 277, 261, 277, 294, 311], tempo: 360, type: "square", bass: [82, 77, 73, 69] },
  // 7: Гора Дракона - эпическая
  { notes: [392, 440, 494, 523, 587, 523, 494, 440], tempo: 240, type: "sawtooth", bass: [98, 110, 123, 130] },
  // 8: Тёмный бор - тревожная
  { notes: [261, 277, 261, 246, 220, 246, 261, 277], tempo: 330, type: "triangle", bass: [65, 69, 65, 61] },
  // 9: Огненная пустошь - агрессивная
  { notes: [494, 523, 587, 659, 587, 523, 494, 440], tempo: 220, type: "sawtooth", bass: [123, 130, 146, 110] },
  // 10: Подводное царство - плавная
  { notes: [440, 523, 659, 784, 659, 523, 440, 392], tempo: 350, type: "sine", bass: [110, 130, 164, 98] },
  // 11: Дремучий лес - мрачная
  { notes: [196, 220, 246, 220, 196, 174, 196, 220], tempo: 400, type: "triangle", bass: [49, 55, 61, 55] }
];

function initAudio() {
  if (!soundContext) {
    try {
      soundContext = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { console.warn("Audio not supported"); }
  }
  if (soundContext && soundContext.state === 'suspended') {
    soundContext.resume();
  }
}

function stopMusic() {
  if (musicInterval) { clearInterval(musicInterval); musicInterval = null; }
  for (const node of musicNodes) {
    try { node.stop(); } catch(e) {}
    try { node.disconnect(); } catch(e) {}
  }
  musicNodes = [];
  currentMusicKey = -1;
}

function playLevelMusic(worldIdx) {
  if (!musicEnabled) return;
  initAudio();
  if (!soundContext) return;
  
  if (currentMusicKey === worldIdx) return;
  stopMusic();
  currentMusicKey = worldIdx;
  
  const pattern = musicPatterns[worldIdx % musicPatterns.length];
  let noteIndex = 0;
  let bassIndex = 0;
  
  function playNote() {
    if (!musicEnabled || currentMusicKey !== worldIdx) return;
    
    const now = soundContext.currentTime;
    
    // Мелодия
    const osc = soundContext.createOscillator();
    const gain = soundContext.createGain();
    osc.type = pattern.type;
    osc.frequency.value = pattern.notes[noteIndex % pattern.notes.length];
    gain.gain.setValueAtTime(0, now);
    gain.gain.linearRampToValueAtTime(0.04, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + pattern.tempo / 1000 * 0.9);
    osc.connect(gain);
    gain.connect(soundContext.destination);
    osc.start(now);
    osc.stop(now + pattern.tempo / 1000);
    musicNodes.push(osc);
    
    // Бас (каждые 2 ноты)
    if (noteIndex % 2 === 0) {
      const bassOsc = soundContext.createOscillator();
      const bassGain = soundContext.createGain();
      bassOsc.type = "sine";
      bassOsc.frequency.value = pattern.bass[bassIndex % pattern.bass.length];
      bassGain.gain.setValueAtTime(0, now);
      bassGain.gain.linearRampToValueAtTime(0.06, now + 0.05);
      bassGain.gain.exponentialRampToValueAtTime(0.001, now + pattern.tempo / 1000 * 1.8);
      bassOsc.connect(bassGain);
      bassGain.connect(soundContext.destination);
      bassOsc.start(now);
      bassOsc.stop(now + pattern.tempo / 1000 * 2);
      musicNodes.push(bassOsc);
      bassIndex++;
    }
    
    noteIndex++;
    
    // Очистка старых узлов
    if (musicNodes.length > 20) {
      const old = musicNodes.splice(0, 10);
      for (const n of old) try { n.disconnect(); } catch(e) {}
    }
  }
  
  musicInterval = setInterval(playNote, pattern.tempo);
  playNote();
}

musicToggle.addEventListener("click", () => {
  musicEnabled = !musicEnabled;
  musicToggle.textContent = musicEnabled ? "🎵" : "🔇";
  if (musicEnabled) {
    playLevelMusic(world);
  } else {
    stopMusic();
  }
});

// === ЗВУКОВЫЕ ЭФФЕКТЫ ===
function getGravity() { return world === 10 ? 0.15 : 0.55; }
function triggerShake(intensity, duration = 10) { shakeIntensity = intensity; shakeTime = duration; }

function addFloatingText(x, y, text, color, size = 24) {
  floatingTexts.push({ x, y, text, color, life: 50, maxLife: 50, size });
}

function spawnParticles(x, y, color, count, speed = 6, sizeBase = 3) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * speed,
      vy: (Math.random() - 0.5) * speed - 2,
      life: 20 + Math.random() * 30,
      maxLife: 50,
      color: color,
      size: sizeBase + Math.random() * 3,
      gravity: world === 10 ? 0.05 : 0.2
    });
  }
}

function spawnExplosion(x, y) {
  spawnParticles(x, y, "#f4cf43", 15, 8, 4);
  spawnParticles(x, y, "#e85b50", 10, 6, 3);
  spawnParticles(x, y, "#ffffff", 5, 4, 2);
  floatingTexts.push({ x: x - camera, y: y - 20, text: "БАМ!", color: "#fff", life: 30, maxLife: 30, size: 36 });
  triggerShake(6, 8);
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.95;
    p.life--;
    p.size *= 0.95;
    if (p.life <= 0 || p.size < 0.5) particles.splice(i, 1);
  }
}

function drawShadow(c, x, y, width, height, alpha = 0.3, yOffset = 0) {
  c.save();
  c.fillStyle = `rgba(0,0,0,${alpha})`;
  c.beginPath();
  c.ellipse(x, y + yOffset, width, height, 0, 0, Math.PI * 2);
  c.fill();
  c.restore();
}

function drawHatching(c, x, y, w, h, color = "#000", alpha = 0.2, spacing = 4) {
  c.save();
  c.globalAlpha = alpha;
  c.strokeStyle = color;
  c.lineWidth = 1;
  for (let i = -h; i < w + h; i += spacing) {
    c.beginPath();
    c.moveTo(x + i, y);
    c.lineTo(x + i - h, y + h);
    c.stroke();
  }
  c.restore();
}

function saveProgress() {
  try {
    const data = {
      version: 9, world, totalStars, lastSafeX, currentWeapon,
      player: { x: player.x, y: player.y, health: player.health, facing: player.facing },
      bossBattle, gameOver, victory
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (error) { console.warn("save error", error); }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || data.version !== 9 || !Number.isInteger(data.world) || data.world < 0 || data.world >= TOTAL_LEVELS) return false;
    world = data.world; totalStars = Math.max(0, Number(data.totalStars) || 0); lastSafeX = Number(data.lastSafeX) || 70;
    if (["minigun", "shotgun", "ak47"].includes(data.currentWeapon)) currentWeapon = data.currentWeapon;
    makeLevel();
    if (data.player) {
      player.x = Math.max(19, Math.min(LEVEL_WIDTH - 20, Number(data.player.x) || 70));
      player.y = Math.max(30, Math.min(GROUND_Y - 5, Number(data.player.y) || GROUND_Y - 19));
      player.health = Math.max(1, Math.min(3, Number(data.player.health) || 3));
      player.facing = data.player.facing === -1 ? -1 : 1;
      player.vx = 0; player.vy = 0; player.invincible = 0;
    }
    bossBattle = data.bossBattle === true; gameOver = data.gameOver === true; victory = data.victory === true;
    camera = Math.max(0, Math.min(LEVEL_WIDTH - W, player.x - W * 0.38));
    updateInfo(); return true;
  } catch (e) { console.warn(e); return false; }
}

function deleteSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

function say(text) {
  message.textContent = text;
  if ("speechSynthesis" in window) { 
    speechSynthesis.cancel(); 
    const u = new SpeechSynthesisUtterance(text); 
    u.lang = "ru-RU"; u.rate = 1.1; u.pitch = 1.3;
    speechSynthesis.speak(u); 
  }
}

function soundShoot() {
  initAudio();
  if (!soundContext) return;
  try {
    const t = soundContext.currentTime;
    if (currentWeapon === "shotgun") {
      const crack = soundContext.createBufferSource();
      const bufferSize = soundContext.sampleRate * 0.05;
      const buffer = soundContext.createBuffer(1, bufferSize, soundContext.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      crack.buffer = buffer;
      const crackFilter = soundContext.createBiquadFilter(); crackFilter.type = "highpass"; crackFilter.frequency.value = 1500;
      const crackGain = soundContext.createGain(); crackGain.gain.setValueAtTime(0.3, t); crackGain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      crack.connect(crackFilter); crackFilter.connect(crackGain); crackGain.connect(soundContext.destination); crack.start(t);
      const boom = soundContext.createOscillator(); boom.type = "sine"; boom.frequency.setValueAtTime(120, t); boom.frequency.exponentialRampToValueAtTime(40, t + 0.15);
      const boomGain = soundContext.createGain(); boomGain.gain.setValueAtTime(0.4, t); boomGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      boom.connect(boomGain); boomGain.connect(soundContext.destination); boom.start(t); boom.stop(t + 0.2);
    } else if (currentWeapon === "minigun") {
      const osc = soundContext.createOscillator(); osc.type = "square"; osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.05);
      const gain = soundContext.createGain(); gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      osc.connect(gain); gain.connect(soundContext.destination); osc.start(t); osc.stop(t + 0.07);
    } else if (currentWeapon === "ak47") {
      const osc = soundContext.createOscillator(); osc.type = "sawtooth"; osc.frequency.setValueAtTime(400, t); osc.frequency.exponentialRampToValueAtTime(80, t + 0.04);
      const gain = soundContext.createGain(); gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      osc.connect(gain); gain.connect(soundContext.destination); osc.start(t); osc.stop(t + 0.06);
    }
  } catch(e) {}
}

function sound(freq=440, duration=0.1, type="square") {
  initAudio();
  if (!soundContext) return;
  try {
    const o = soundContext.createOscillator(); const g = soundContext.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = 0.07;
    o.connect(g); g.connect(soundContext.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, soundContext.currentTime + duration);
    o.stop(soundContext.currentTime + duration);
  } catch(e) {}
}

// === ОТРИСОВКА ОКРУЖЕНИЯ ===

function drawBackground(c) {
  const theme = worlds[world];
  const skyGrad = c.createLinearGradient(0, 0, 0, H);
  
  if (world === 10) {
    skyGrad.addColorStop(0, "#002244"); skyGrad.addColorStop(0.5, "#006699"); skyGrad.addColorStop(1, "#33cccc");
  } else if (world === 11) {
    skyGrad.addColorStop(0, "#1a2a1a"); skyGrad.addColorStop(0.5, "#2b4a2b"); skyGrad.addColorStop(1, "#3e5c3e");
  } else {
    skyGrad.addColorStop(0, theme.sky); skyGrad.addColorStop(0.4, "#a8d8f0"); skyGrad.addColorStop(0.8, "#d4eecf"); skyGrad.addColorStop(1, "#e8f5d4");
  }
  c.fillStyle = skyGrad; c.fillRect(0, 0, W, H);
  
  // Анимированные облака
  if (world !== 10 && world !== 11) {
    c.fillStyle = "rgba(255,255,255,0.6)";
    for (let i = 0; i < 6; i++) {
      const cx = ((i * 250 - camera * 0.2) % (W + 200)) - 100;
      const cy = 60 + i * 30 + Math.sin(frame * 0.01 + i) * 10;
      c.beginPath(); c.arc(cx, cy, 30, 0, Math.PI * 2); c.arc(cx + 25, cy - 10, 35, 0, Math.PI * 2); c.arc(cx + 50, cy, 30, 0, Math.PI * 2); c.fill();
    }
    
    // Солнце
    const sunGrad = c.createRadialGradient(W-150, 100, 10, W-150, 100, 80);
    sunGrad.addColorStop(0, "#fff8c0"); sunGrad.addColorStop(1, "rgba(255, 251, 208, 0)");
    c.fillStyle = sunGrad; c.beginPath(); c.arc(W-150, 100, 80, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#fff8c0"; c.beginPath(); c.arc(W-150, 100, 50, 0, Math.PI * 2); c.fill();
  }
  
  // Подводные пузырьки
  if (world === 10) {
    c.fillStyle = "rgba(255,255,255,0.4)";
    for(let i=0; i<20; i++) {
      const bx = (i*100 - camera*0.5 + frame*0.5) % W;
      const by = (i*150 - frame*1.5) % H;
      c.beginPath(); c.arc(bx, by, 5 + (i%3)*5, 0, Math.PI * 2); c.fill();
    }
  }
  
  // Холмы на фоне
  if (world !== 10 && world !== 11) {
    c.fillStyle = world%4===3?"#a8bd62":"#70ad68";
    c.beginPath(); c.moveTo(0, 430);
    for(let x=0;x<=W+20;x+=20) { const wx=x+camera*0.42; c.lineTo(x, 400+Math.sin(wx*0.008)*25+Math.sin(wx*0.018)*10); }
    c.lineTo(W, H); c.lineTo(0, H); c.fill();
    c.strokeStyle = "#000"; c.lineWidth = 4; c.stroke();
    
    for(let i=0;i<15;i++) drawTree3D(c, ((i*140-camera*0.48)%1800+1800)%1800-100, 450, 0.6);
    for(let i=0;i<20;i++) drawBush3D(c, ((i*100-camera*0.72)%1600+1600)%1600-70, 465, 0.8);
  }
  
  if (world === 11) {
    for(let i=0;i<10;i++) drawTree3D(c, ((i*200-camera*0.5)%2000+2000)%2000-100, 450, 1.2);
  }
  
  // Ямы
  const sorted = gaps.slice().sort((a,b)=>a.x-b.x);
  for (const gap of sorted) {
    const gx = gap.x - camera; if (gx + gap.w < -50 || gx > W + 50) continue;
    const vg = c.createLinearGradient(0, GROUND_Y, 0, H); vg.addColorStop(0,"#0a0f0a"); vg.addColorStop(1,"#000");
    c.fillStyle=vg; c.fillRect(gx, GROUND_Y, gap.w, H-GROUND_Y);
    c.fillStyle = "#8b0000";
    for(let ix = gx; ix < gx + gap.w; ix += 20) {
        c.beginPath();
        c.moveTo(ix, GROUND_Y);
        c.lineTo(ix + 10, GROUND_Y + 20);
        c.lineTo(ix + 20, GROUND_Y);
        c.fill();
    }
  }
  
  // Земля
  let cursor = 0;
  for (const gap of sorted) { if (gap.x > cursor) drawGroundSegment3D(c, cursor, gap.x-cursor, theme); cursor = gap.x + gap.w; }
  if (cursor < LEVEL_WIDTH) drawGroundSegment3D(c, cursor, LEVEL_WIDTH-cursor, theme);
}

function drawGroundSegment3D(c, startX, width, theme) {
  const sx = startX - camera;
  if (sx + width < -50 || sx > W + 50) return;

  c.fillStyle = theme.ground;
  c.fillRect(sx, GROUND_Y, width, H - GROUND_Y);
  c.strokeStyle = "#000"; c.lineWidth = 4; 
  c.beginPath(); c.moveTo(sx, GROUND_Y); c.lineTo(sx + width, GROUND_Y); c.stroke();
  
  c.fillStyle = "#7bd66a";
  c.fillRect(sx, GROUND_Y, width, 15);
  c.strokeStyle = "#000"; c.lineWidth = 3; c.strokeRect(sx, GROUND_Y, width, 15);

  // Анимированная трава
  c.fillStyle = "#a8e88e";
  for (let i = 0; i < width; i += 22) {
    const tx = sx + i;
    if (tx < -20 || tx > W + 20) continue;
    const sway = Math.sin(frame * 0.05 + i) * 3;
    c.beginPath();
    c.moveTo(tx, GROUND_Y);
    c.quadraticCurveTo(tx + 5 + sway, GROUND_Y - 12, tx + 10 + sway, GROUND_Y);
    c.fill();
  }
}

function drawPlatform3D(c, p) {
  const x = p.x - camera;
  if (x < -200 || x > W + 200) return;
  
  drawShadow(c, x + p.w/2, p.y + p.h + 30, p.w/2 + 10, 12, 0.4);
  
  c.fillStyle = "#4a3020";
  c.fillRect(x, p.y, p.w, p.h);
  c.strokeStyle = "#000"; c.lineWidth = 4; c.strokeRect(x, p.y, p.w, p.h);
  
  c.fillStyle = "#7bd66a";
  c.fillRect(x, p.y, p.w, 8);
  c.strokeStyle = "#000"; c.lineWidth = 3; c.strokeRect(x, p.y, p.w, 8);
  
  drawHatching(c, x, p.y + 8, p.w, 10, "#000", 0.15, 5);
}

function drawTree3D(c, x, y, s=1) {
  c.save(); c.translate(x,y); c.scale(s,s);
  c.fillStyle="rgba(0,0,0,0.2)"; c.beginPath(); c.ellipse(0, 5, 18, 5, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle="#4a2e15"; c.fillRect(-7,-55,14,58);
  c.fillStyle="#6b4522"; c.fillRect(-5,-55,4,58);
  const grad = c.createRadialGradient(-8, -75, 5, 0, -65, 35); grad.addColorStop(0, "#43a047"); grad.addColorStop(0.7, "#2e7d32"); grad.addColorStop(1, "#1b5e20");
  c.fillStyle = grad; c.beginPath(); c.arc(0,-65,27,0,Math.PI*2); c.arc(-18,-48,19,0,Math.PI*2); c.arc(18,-48,19,0,Math.PI*2); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 4; c.stroke();
  c.restore();
}

function drawBush3D(c, x, y, s=1) {
  c.save(); c.translate(x,y); c.scale(s,s);
  const grad = c.createRadialGradient(-5, -5, 5, 0, 0, 25); grad.addColorStop(0, "#2e7d32"); grad.addColorStop(1, "#1b5e20");
  c.fillStyle = grad; c.beginPath(); c.arc(0,0,22,0,Math.PI*2); c.arc(-18,5,16,0,Math.PI*2); c.arc(18,5,16,0,Math.PI*2); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 4; c.stroke();
  c.restore();
}

function drawForeground(c) {
  for (const fg of foreground) {
    const x = fg.x - camera * fg.speedFactor;
    if (x < -100 || x > W + 100) continue;
    
    c.save();
    c.translate(x, fg.y);
    c.scale(fg.scale, fg.scale);
    
    if (fg.type === "grass") {
      c.fillStyle = "#2e7d32";
      c.beginPath();
      c.moveTo(-15, 20);
      c.lineTo(-10, 0);
      c.lineTo(-5, 15);
      c.lineTo(0, -5);
      c.lineTo(5, 15);
      c.lineTo(10, 0);
      c.lineTo(15, 20);
      c.closePath();
      c.fill();
      c.strokeStyle = "#000"; c.lineWidth = 3; c.stroke();
    } else {
      c.fillStyle = "#666";
      c.beginPath();
      c.ellipse(0, 0, 20, 15, 0, 0, Math.PI * 2);
      c.fill();
      c.strokeStyle = "#000"; c.lineWidth = 3; c.stroke();
      drawHatching(c, -15, -10, 30, 20, "#000", 0.3, 4);
    }
    c.restore();
  }
}

// === ПЕРСОНАЖИ ===

function drawPlayer(c) {
  const x = player.x - camera, y = player.y;
  const isMoving = Math.abs(player.vx) > 0.5 || keys.left || keys.right;
  
  let drawScaleX = playerSquash;
  let drawScaleY = playerStretch;
  
  drawShadow(c, x, GROUND_Y, 22 * drawScaleX, 6 * drawScaleX, 0.3, (1 - drawScaleX) * 10);
  
  if (player.invincible > 0 && Math.floor(frame / 4) % 2 === 0) return;
  
  const barW = 44, barH = 8, barX = x - barW / 2, barY = y - 65;
  c.fillStyle = "#000";
  c.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
  for (let i = 0; i < player.health; i++) {
    c.fillStyle = "#e33";
    c.fillRect(barX + i * (barW / 3), barY, (barW / 3) - 2, barH);
    c.strokeStyle = "#fff"; c.lineWidth = 1; c.strokeRect(barX + i * (barW / 3), barY, (barW / 3) - 2, barH);
  }
  
  c.save();
  c.translate(x, y);
  c.scale(player.facing * drawScaleX, drawScaleY);
  
  const breath = Math.sin(frame * 0.15) * 1.5;
  const legSwing = isMoving ? Math.sin(frame * 0.35) * 8 : 0;
  const armSwing = isMoving ? Math.sin(frame * 0.35) * 5 : 0;
  
  // Ноги
  c.fillStyle = "#3a2015";
  c.beginPath();
  c.ellipse(-8 + legSwing, 18, 7, 10, 0.3, 0, Math.PI * 2);
  c.ellipse(8 - legSwing, 18, 7, 10, -0.3, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 3; c.stroke();
  
  // Тело (куртка)
  const bodyGrad = c.createRadialGradient(-5, -5, 5, 0, 0, 25);
  bodyGrad.addColorStop(0, "#e87a2f");
  bodyGrad.addColorStop(1, "#c45a12");
  c.fillStyle = bodyGrad;
  c.beginPath();
  if (c.roundRect) c.roundRect(-16, -8 + breath, 32, 26, 8);
  else c.rect(-16, -8 + breath, 32, 26);
  c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 3.5; c.stroke();
  
  // Плечи
  c.fillStyle = "#c45a12";
  c.beginPath(); c.ellipse(-16, 5 + breath, 8, 12, 0.5, 0, Math.PI * 2); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(16, 5 + breath, 8, 12, -0.5, 0, Math.PI * 2); c.fill(); c.stroke();
  
  // Молния
  c.strokeStyle = "#8b4513"; c.lineWidth = 2;
  c.beginPath(); c.moveTo(0, -8 + breath); c.lineTo(0, 18 + breath); c.stroke();
  
  drawHatching(c, -16, -8 + breath, 32, 26, "#000", 0.15, 5);
  
  // Голова
  const headGrad = c.createRadialGradient(-5, -15 + breath, 5, 0, -12 + breath, 22);
  headGrad.addColorStop(0, "#ffe066");
  headGrad.addColorStop(1, "#f4cf43");
  c.fillStyle = headGrad;
  c.beginPath(); c.arc(0, -12 + breath, 22, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 3.5; c.stroke();
  
  // Глаза
  playerBlink--;
  if (playerBlink > 0) {
    c.strokeStyle = "#000"; c.lineWidth = 2.5;
    c.beginPath(); c.moveTo(-12, -16 + breath); c.lineTo(-2, -16 + breath); c.stroke();
    c.beginPath(); c.moveTo(2, -16 + breath); c.lineTo(12, -16 + breath); c.stroke();
  } else {
    c.fillStyle = "#fff";
    c.beginPath(); c.ellipse(-7, -16 + breath, 6, 8, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(7, -16 + breath, 6, 8, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "#000"; c.lineWidth = 2; c.stroke();
    
    const lookX = player.facing * 2.5;
    c.fillStyle = "#000";
    c.beginPath(); c.arc(-7 + lookX, -16 + breath, 3, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(7 + lookX, -16 + breath, 3, 0, Math.PI * 2); c.fill();
    
    c.fillStyle = "#fff";
    c.beginPath(); c.arc(-8 + lookX, -18 + breath, 1.5, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(6 + lookX, -18 + breath, 1.5, 0, Math.PI * 2); c.fill();
  }
  if (Math.random() < 0.008) playerBlink = 8;
  
  // Рот
  c.strokeStyle = "#000"; c.lineWidth = 2.5;
  c.beginPath(); c.arc(0, -4 + breath, 7, 0.3, Math.PI - 0.3); c.stroke();
  
  c.fillStyle = "#fff";
  c.beginPath(); c.moveTo(-4, -4 + breath); c.lineTo(-2, 2 + breath); c.lineTo(0, -4 + breath); c.fill();
  c.beginPath(); c.moveTo(4, -4 + breath); c.lineTo(2, 2 + breath); c.lineTo(0, -4 + breath); c.fill();
  
  // Руки
  c.fillStyle = "#f4cf43";
  c.beginPath(); c.ellipse(-18, 0 + breath + armSwing, 6, 9, 0.6, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 2.5; c.stroke();
  c.beginPath(); c.ellipse(18, 0 + breath - armSwing, 6, 9, -0.6, 0, Math.PI * 2); c.fill();
  c.stroke();
  
  // Оружие
  const recoil = (frame % 8 < 3 && isHoldingShoot) ? 0.85 : 1.0;
  c.save(); 
  c.translate(18, 0 + breath - armSwing); 
  c.scale(recoil, recoil);
  
  if (currentWeapon === "shotgun") {
    c.fillStyle = "#49382b"; c.fillRect(0, -5, 28, 7); 
    c.fillStyle = "#222"; c.fillRect(22, -8, 18, 5); 
    c.fillStyle = "#a7a7a7"; c.fillRect(32, -9, 10, 3);
    c.strokeStyle = "#000"; c.lineWidth = 2; c.strokeRect(0, -5, 28, 7);
  } else if (currentWeapon === "minigun") {
    c.fillStyle = "#2a2a2a"; c.fillRect(0, -7, 32, 10);
    c.fillStyle = "#555"; c.fillRect(28, -9, 20, 5); c.fillRect(28, -1, 20, 5);
    c.fillStyle = "#a7a7a7"; c.fillRect(42, -8, 5, 2); c.fillRect(42, 0, 5, 2);
    c.strokeStyle = "#000"; c.lineWidth = 2; c.strokeRect(0, -7, 32, 10);
  } else if (currentWeapon === "ak47") {
    c.fillStyle = "#5c3a21"; c.fillRect(0, -4, 16, 8);
    c.fillStyle = "#222"; c.fillRect(14, -5, 26, 4);
    c.fillStyle = "#8b4513"; c.fillRect(8, -1, 10, 7);
    c.fillStyle = "#555"; c.fillRect(26, -6, 8, 2);
    c.strokeStyle = "#000"; c.lineWidth = 2; c.strokeRect(0, -4, 16, 8);
  }
  c.restore();
  
  c.restore();
  
  // Эффект рывка
  if (playerDashing > 0) {
    c.save();
    c.globalAlpha = 0.4;
    c.strokeStyle = "#9c27b0";
    c.lineWidth = 3;
    for(let i=1; i<=3; i++) {
      c.beginPath();
      c.arc(x - player.facing * i * 15, y, 24, 0, Math.PI * 2);
      c.stroke();
    }
    c.restore();
    c.save();
    c.strokeStyle = "rgba(255,255,255,0.5)";
    c.lineWidth = 2;
    for(let i=0; i<5; i++) {
      const ly = y - 20 + Math.random() * 40;
      const lx = x - player.facing * (30 + Math.random() * 50);
      c.beginPath();
      c.moveTo(lx, ly);
      c.lineTo(lx - player.facing * 20, ly);
      c.stroke();
    }
    c.restore();
  }
}

function drawRat(c) {
  if (!rat.alive) return;
  const x = rat.x - camera, y = rat.y;
  
  drawShadow(c, x, GROUND_Y, 15, 5, 0.25);

  c.fillStyle = "#ff0066"; c.beginPath(); c.arc(0, -26 + breath, 14, Math.PI, 0); c.fill(); c.stroke();
  
  c.fillStyle = "#111"; c.beginPath(); c.arc(-5, -20 + breath, 2.5, 0, Math.PI * 2); c.arc(5, -20 + breath, 2.5, 0, Math.PI * 2); c.fill();
  
  c.restore();
}

function drawShark(c, x, y, isMoving, facing) {
  drawShadow(c, x, GROUND_Y, 30, 10, 0.3);
  
  const bob = Math.sin(frame * 0.1) * 8;
  const breath = Math.sin(frame * 0.15) * 1.5;
  
  c.save(); c.translate(x, y + bob); c.scale(facing, 1);
  
  const bodyGrad = c.createLinearGradient(0, -18, 0, 18);
  bodyGrad.addColorStop(0, "#99aabb");
  bodyGrad.addColorStop(1, "#667788");
  c.fillStyle = bodyGrad;
  c.beginPath(); c.ellipse(0, 0 + breath, 34, 18, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 3.5; c.stroke();
  
  drawHatching(c, -25, -10 + breath, 50, 20, "#000", 0.2, 5);
  
  c.beginPath(); c.moveTo(-5, 0 + breath); c.lineTo(-12, -18 + breath); c.lineTo(6, 0 + breath); c.fill(); c.stroke();
  
  c.fillStyle = "white"; c.beginPath(); c.arc(22, -2 + breath, 4, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#111"; c.beginPath(); c.arc(23, -2 + breath, 2, 0, Math.PI * 2); c.fill();
  
  c.fillStyle = "#fff"; c.beginPath(); c.moveTo(26, 4 + breath); c.lineTo(28, 8 + breath); c.lineTo(30, 4 + breath); c.fill();
  
  c.restore();
}

function drawTreeMonster(c, x, y, isMoving, facing) {
  drawShadow(c, x, GROUND_Y, 30, 10, 0.4);
  
  const breath = Math.sin(frame * 0.1) * 2;
  
  c.save(); c.translate(x, y);
  
  const trunkGrad = c.createLinearGradient(-18, 0, 18, 0);
  trunkGrad.addColorStop(0, "#2e1a10");
  trunkGrad.addColorStop(0.5, "#4e2e1a");
  trunkGrad.addColorStop(1, "#2e1a10");
  c.fillStyle = trunkGrad;
  c.fillRect(-18, -45 + breath, 36, 90);
  c.strokeStyle = "#000"; c.lineWidth = 4; c.strokeRect(-18, -45 + breath, 36, 90);
  
  drawHatching(c, -18, -45 + breath, 36, 90, "#000", 0.2, 6);
  
  const leavesGrad = c.createRadialGradient(0, -55, 5, 0, -55, 40);
  leavesGrad.addColorStop(0, "#2e7d32");
  leavesGrad.addColorStop(1, "#1b5e20");
  c.fillStyle = leavesGrad;
  c.beginPath(); c.arc(0, -55 + breath, 40, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 4; c.stroke();
  
  c.fillStyle = "#ff3300"; c.beginPath(); c.arc(-12, -35 + breath, 6, 0, Math.PI * 2); c.arc(12, -35 + breath, 6, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#111"; c.beginPath(); c.arc(-12, -35 + breath, 3, 0, Math.PI * 2); c.arc(12, -35 + breath, 3, 0, Math.PI * 2); c.fill();
  
  c.fillStyle = "#2e7d32"; c.beginPath(); c.ellipse(0, -18 + breath, 14, 10, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  
  c.restore();
}

function drawLizard(c, l) {
  const x=l.x-camera; if(x<-90||x>W+90||!l.alive) return;
  
  drawShadow(c, x, GROUND_Y, 20, 6, 0.3);
  
  const f=l.facing;
  c.save(); c.translate(x, l.y); c.scale(f,1);
  
  const bodyGrad = c.createRadialGradient(-5, -5, 5, 0, 0, 20);
  bodyGrad.addColorStop(0, "#43c043");
  bodyGrad.addColorStop(1, "#2ea82e");
  c.fillStyle = bodyGrad;
  c.beginPath(); c.ellipse(0,0,20,16,0,0,Math.PI*2); c.fill();
  c.strokeStyle="#000"; c.lineWidth = 3; c.stroke();
  
  drawHatching(c, -14, -8, 28, 16, "#000", 0.2, 4);
  
  c.fillStyle="white"; c.beginPath(); c.arc(21,-11,5,0,Math.PI*2); c.fill();
  c.fillStyle="#111"; c.beginPath(); c.arc(22,-11,2.5,0,Math.PI*2); c.fill();
  
  c.fillStyle="#1b5e20"; c.beginPath(); c.moveTo(-10,-10); c.lineTo(-15,-20); c.lineTo(-5,-10); c.fill();
  
  c.restore();
}

function drawBear(c, b) {
  const x=b.x-camera; if(x<-100||x>W+100||!b.alive) return;
  
  drawShadow(c, x, GROUND_Y, 28, 9, 0.35);
  
  const flash=b.hurtFlash>0&&Math.floor(frame/4)%2===0;
  const breath = Math.sin(frame * 0.1) * 2;
  
  c.save(); c.translate(x,b.y); c.scale(b.facing,1);
  
  const bodyColor = flash ? "#ffd27a" : "#a86b1e";
  const bodyGrad = c.createRadialGradient(-5, -5, 5, 0, 0, 28);
  bodyGrad.addColorStop(0, flash ? "#ffe0a0" : "#c88532");
  bodyGrad.addColorStop(1, bodyColor);
  
  c.fillStyle = bodyGrad;
  c.beginPath(); c.ellipse(0, 0 + breath, 24, 26, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 4; c.stroke();
  
  drawHatching(c, -16, -10 + breath, 32, 25, "#000", 0.2, 5);
  
  c.fillStyle = flash ? "#ffe0a0" : "#b87522"; c.beginPath(); c.arc(0, -28 + breath, 20, 0, Math.PI * 2); c.fill(); c.stroke();
  
  c.fillStyle = "white"; c.beginPath(); c.arc(-6, -34 + breath, 6, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#111"; c.beginPath(); c.arc(-5, -34 + breath, 3, 0, Math.PI * 2); c.fill();
  
  c.fillStyle = "#fff"; c.beginPath(); c.moveTo(8, -22 + breath); c.lineTo(10, -14 + breath); c.lineTo(12, -22 + breath); c.fill();
  
  c.restore();
  
  if (b.hp < b.maxHp) { 
    const hx = x - 22, hy = b.y - 75 + breath; 
    c.fillStyle = "rgba(0,0,0,0.8)"; c.fillRect(hx - 2, hy - 2, 48, 10); 
    for(let i = 0; i < b.maxHp; i++) { 
      c.fillStyle = i < b.hp ? "#e33" : "#444"; 
      c.fillRect(hx + i * 15, hy, 13, 5); 
    } 
  }
}

function drawWitch(c, w) {
  const x=w.x-camera; if(x<-100||x>W+100||!w.alive) return;
  
  drawShadow(c, x, GROUND_Y, 25, 8, 0.3);
  
  const breath = Math.sin(frame * 0.1) * 2;
  
  c.fillStyle="#5a3a22"; c.beginPath(); c.ellipse(x, w.y+25 + breath, 24, 30, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle="#000"; c.lineWidth = 4; c.stroke();
  
  c.fillStyle="#3b2414"; c.fillRect(x-26, w.y+5 + breath, 52, 8);
  c.strokeRect(x-26, w.y+5 + breath, 52, 8);
  
  c.strokeStyle="#c9a26b"; c.lineWidth=6; c.beginPath(); c.moveTo(x+16, w.y+18 + breath); c.lineTo(x+42, w.y-10 + breath); c.stroke();
  c.strokeStyle="#000"; c.lineWidth=2; c.stroke();
  
  c.font="44px Arial"; c.textAlign="center"; c.fillText("🧙‍♀️", x, w.y + breath);
  
  c.fillStyle="#ff0000"; c.beginPath(); c.arc(x, w.y-36 + breath, 4, 0, Math.PI * 2); c.fill();
}

function drawBoss(c) {
  if(!boss || !boss.isBossLevel || !bossBattle || !boss.alive) return;
  const x=boss.x-camera;
  const breath = Math.sin(frame * 0.08) * 3;
  const tailSway = Math.sin(frame * 0.12) * 0.3;
  
  drawShadow(c, x, GROUND_Y, 45, 14, 0.4);
  
  c.save(); c.translate(x, boss.y + breath);
  
  // Хвосты
  for (let i = 0; i < 3; i++) {
    c.save();
    c.translate(-20, 10);
    c.rotate(-0.5 + tailSway + i * 0.3);
    const tailGrad = c.createLinearGradient(0, 0, -40, 20);
    tailGrad.addColorStop(0, "#e87a2f");
    tailGrad.addColorStop(1, "#fff");
    c.fillStyle = tailGrad;
    c.beginPath();
    c.moveTo(0, 0);
    c.quadraticCurveTo(-30, 10 + Math.sin(frame * 0.2 + i) * 10, -50, 30 + Math.sin(frame * 0.15 + i) * 15);
    c.quadraticCurveTo(-40, 40, -10, 15);
    c.fill();
    c.strokeStyle = "#000"; c.lineWidth = 3; c.stroke();
    c.restore();
  }
  
  // Тело
  const bodyGrad = c.createRadialGradient(-10, 10, 10, 0, 10, 40);
  bodyGrad.addColorStop(0, "#ff9966");
  bodyGrad.addColorStop(1, "#d96a1e");
  c.fillStyle = bodyGrad;
  c.beginPath(); c.ellipse(0, 10, 42, 38, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 5; c.stroke();
  
  // Голова
  c.beginPath(); c.arc(0, -35, 38, 0, Math.PI * 2); c.fill(); c.stroke();
  
  // Уши
  c.beginPath(); c.moveTo(-22, -55); c.lineTo(-35, -90); c.lineTo(-5, -60); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(22, -55); c.lineTo(35, -90); c.lineTo(5, -60); c.fill(); c.stroke();
  c.fillStyle = "#ffb6c1"; 
  c.beginPath(); c.moveTo(-20, -58); c.lineTo(-28, -80); c.lineTo(-10, -60); c.fill();
  c.beginPath(); c.moveTo(20, -58); c.lineTo(28, -80); c.lineTo(10, -60); c.fill();
  
  // Глаза
  c.fillStyle = "#fff"; c.beginPath(); c.ellipse(-14, -42, 10, 12, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  c.beginPath(); c.ellipse(14, -42, 10, 12, 0, 0, Math.PI * 2); c.fill(); c.stroke();
  
  c.fillStyle = "#ff3300"; c.beginPath(); c.arc(-12, -42, 6, 0, Math.PI * 2); c.arc(16, -42, 6, 0, Math.PI * 2); c.fill();
  c.fillStyle = "#111"; c.beginPath(); c.arc(-12, -42, 3, 0, Math.PI * 2); c.arc(16, -42, 3, 0, Math.PI * 2); c.fill();
  
  // Зловещая улыбка
  c.strokeStyle = "#000"; c.lineWidth = 3;
  c.beginPath(); c.arc(0, -25, 18, 0.2, Math.PI - 0.2); c.stroke();
  c.fillStyle = "#fff"; c.fillRect(-12, -25, 24, 6);
  c.fillStyle = "#000"; 
  for(let i=0; i<4; i++) { c.beginPath(); c.moveTo(-10 + i*7, -25); c.lineTo(-7 + i*7, -19); c.lineTo(-4 + i*7, -25); c.fill(); }
  
  c.restore();
  
  // Полоска здоровья босса
  c.fillStyle="#381d1d"; c.fillRect(x-50, boss.y-105, 100, 14);
  c.strokeStyle="#000"; c.lineWidth = 3; c.strokeRect(x-50, boss.y-105, 100, 14);
  c.fillStyle="#e33"; c.fillRect(x-48, boss.y-103, 96*(boss.hp/boss.maxHp), 10);
}

function drawBullets(c) {
  for(const b of bullets){ 
    c.beginPath(); c.arc(b.x-camera, b.y, 6, 0, Math.PI * 2); 
    c.fillStyle="#292929"; c.fill(); 
    c.strokeStyle="#fff"; c.lineWidth = 2; c.stroke(); 
    // След
    c.globalAlpha = 0.5;
    c.beginPath(); c.arc(b.x - camera - b.vx, b.y, 4, 0, Math.PI * 2); c.fill();
    c.globalAlpha = 1;
  }
  for(const b of enemyBullets){ 
    c.save(); c.translate(b.x-camera, b.y); c.rotate(b.angle||0); 
    if (b.isGreen) c.fillStyle = "#44ff44"; 
    else if (b.isSeed) { c.fillStyle = "#222"; c.fillRect(-5,-3,10,6); c.strokeStyle="#fff"; c.lineWidth=1; c.strokeRect(-5,-3,10,6); }
    else c.fillStyle = "#ffdb45";
    c.beginPath(); c.ellipse(0, 0, 10, 6, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = "#000"; c.lineWidth = 2; c.stroke();
    c.restore(); 
  }
}

function drawStars(c) {
  for(const s of stars){ 
    if(s.taken) continue; 
    const x=s.x-camera; if(x<-40||x>W+40) continue; 
    c.font="36px Arial"; c.textAlign="center"; 
    const floatY = s.y + Math.sin(frame * 0.1 + s.x) * 5;
    c.fillText("⭐", x, floatY); 
  }
}

function drawPickups(c) {
  for (const p of pickups) {
    const x = p.x - camera;
    if (x < -50 || x > W + 50) continue;
    c.save(); c.translate(x, p.y + Math.sin(frame * 0.1) * 5);
    c.font="30px Arial"; c.textAlign="center";
    if (p.type === "apple") c.fillText("🍎", 0, 10);
    else if (p.type === "lightning") c.fillText("⚡", 0, 10);
    else if (p.type === "shield") c.fillText("🛡️", 0, 10);
    c.restore();
  }
}

function drawParticles(c) {
  for (let p of particles) {
    c.globalAlpha = Math.max(0, p.life / p.maxLife);
    c.fillStyle = p.color;
    c.beginPath();
    c.arc(p.x - camera, p.y, p.size, 0, Math.PI * 2);
    c.fill();
  }
  c.globalAlpha = 1;
}

function drawFloatingTexts(c) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y -= 1.5;
    t.life--;
    c.globalAlpha = Math.max(0, t.life / t.maxLife);
    c.fillStyle = t.color || "#fff";
    c.strokeStyle = "#000";
    c.lineWidth = 4;
    c.font = "900 " + (t.size || 24) + "px 'Courier New'";
    c.textAlign = "center";
    c.strokeText(t.text, t.x, t.y);
    c.fillText(t.text, t.x, t.y);
    c.globalAlpha = 1;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
}

function drawLevelBanner(c) {
    if (levelBannerTimer <= 0) return;
    levelBannerTimer--;
    
    c.save();
    c.translate(W / 2, 100);
    const scale = levelBannerTimer > 150 ? (180 - levelBannerTimer) / 30 : (levelBannerTimer < 30 ? levelBannerTimer / 30 : 1);
    c.scale(scale, scale);
    
    c.fillStyle = "#f4cf43";
    c.strokeStyle = "#000";
    c.lineWidth = 5;
    c.beginPath();
    if (c.roundRect) c.roundRect(-220, -35, 440, 70, 12);
    else c.rect(-220, -35, 440, 70);
    c.fill();
    c.stroke();
    
    // Comic dots
    c.fillStyle = "rgba(0,0,0,0.1)";
    for(let i=0; i<440; i+=8) {
      for(let j=0; j<70; j+=8) {
        c.beginPath(); c.arc(-220 + i, -35 + j, 1.5, 0, Math.PI*2); c.fill();
      }
    }
    
    c.fillStyle = "#000";
    c.font = "900 26px 'Courier New'";
    c.textAlign = "center";
    c.textBaseline = "middle";
    c.fillText(worlds[world].name.toUpperCase(), 0, 2);
    
    c.restore();
}

function draw() {
  octx.clearRect(0, 0, OW, OH);
  octx.save();
  octx.scale(SCALE, SCALE);
  
  if (shakeTime > 0) {
    octx.save();
    const sx = (Math.random() - 0.5) * shakeIntensity;
    const sy = (Math.random() - 0.5) * shakeIntensity;
    octx.translate(sx, sy);
  }
  
  drawBackground(octx);
  
  for(const p of platforms) drawPlatform3D(octx, p);
  
  const hutX = LEVEL_WIDTH - 140;
  const hutScreenX = hutX - camera;
  if (hutScreenX > -200 && hutScreenX < W + 200) {
    octx.fillStyle = "#8b5a2b"; octx.fillRect(hutScreenX, GROUND_Y - 110, 120, 110);
    octx.strokeStyle = "#000"; octx.lineWidth = 5; octx.strokeRect(hutScreenX, GROUND_Y - 110, 120, 110);
    octx.fillStyle = "#a8322b"; octx.beginPath(); octx.moveTo(hutScreenX - 10, GROUND_Y - 110); octx.lineTo(hutScreenX + 60, GROUND_Y - 180); octx.lineTo(hutScreenX + 130, GROUND_Y - 110); octx.closePath(); octx.fill();
    octx.strokeStyle = "#000"; octx.lineWidth = 5; octx.stroke();
    octx.fillStyle = "#3b2414"; octx.fillRect(hutScreenX + 45, GROUND_Y - 80, 35, 80);
    octx.strokeRect(hutScreenX + 45, GROUND_Y - 80, 35, 80);
    octx.fillStyle = "#f4cf43"; octx.fillRect(hutScreenX + 15, GROUND_Y - 85, 25, 25);
    octx.strokeRect(hutScreenX + 15, GROUND_Y - 85, 25, 25);
  }
  
  drawStars(octx);
  drawPickups(octx);
  
  for(const g of gopniks) drawGopnik(octx, g);
  
  for(const e of enemies) {
    const x = e.x - camera; if (x < -80 || x > W + 80 || !e.alive) continue;
    const type = worlds[world].enemy;
    const isMoving = Math.abs(e.vx) > 0.2;
    const facing = e.vx >= 0 ? 1 : -1;
    if (type === "rabbit") drawRabbit(octx, e);
    else if (type === "wolf") drawWolf(octx, e);
    else if (type === "bear") drawBearBody(octx, x, e.y, isMoving, facing);
    else if (type === "fox") drawFoxBody(octx, x, e.y, isMoving, facing);
    else if (type === "frog") drawFrog(octx, x, e.y, isMoving, facing);
    else if (type === "troll") drawTroll(octx, x, e.y, isMoving, facing);
    else if (type === "skeleton") drawSkeleton(octx, x, e.y, isMoving, facing);
    else if (type === "dragon") drawDragon(octx, x, e.y, isMoving, facing);
    else if (type === "goblin") drawGoblin(octx, x, e.y, isMoving, facing);
    else if (type === "fire") drawFireMonster(octx, x, e.y, isMoving, facing);
  }
  
  for(const w of witches) drawWitch(octx, w);
  for(const l of lizards) drawLizard(octx, l);
  for(const b of bears) drawBear(octx, b);
  
  if (world === 10) {
    for (const m of mermaids) { if(m.alive) { const x=m.x-camera; if(x>=-100&&x<=W+100) drawMermaid(octx, x, m.y); } }
    for (const s of sharks) { if(s.alive) { const x=s.x-camera; if(x>=-100&&x<=W+100) drawShark(octx, x, s.y, 0, s.vx >= 0 ? 1 : -1); } }
  } else if (world === 11) {
    for (const t of trees) { if(t.alive) { const x=t.x-camera; if(x>=-100&&x<=W+100) drawTreeMonster(octx, x, t.y); } }
  }
  
  drawBoss(octx);
  drawBullets(octx);
  drawParticles(octx);
  drawRat(octx);
  drawPlayer(octx);
  drawFloatingTexts(octx);
  
  drawForeground(octx);
  
  if (shakeTime > 0) {
    octx.restore();
    shakeTime--;
  }
  
  octx.restore();
  
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(offCanvas, 0, 0, OW, OH, 0, 0, W, H);
  
  // Comic frame
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 12; ctx.strokeRect(6, 6, W - 12, H - 12);
  ctx.strokeStyle = "#000"; ctx.lineWidth = 4; ctx.strokeRect(12, 12, W - 24, H - 24);
  
  drawLevelBanner(ctx);
  
  if(gameOver||victory) {
    ctx.fillStyle="rgba(0,0,0,0.8)"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = victory ? "#4caf50" : "#e85b50";
    ctx.textAlign="center"; ctx.font="900 56px 'Courier New'";
    ctx.strokeStyle = "#000"; ctx.lineWidth = 6;
    const txt = victory ? "ПОБЕДА!" : "ИГРА ОКОНЧЕНА";
    ctx.strokeText(txt, W/2, 230); ctx.fillText(txt, W/2, 230);
    
    ctx.fillStyle = "#fff"; ctx.font = "28px 'Courier New'"; ctx.lineWidth = 3;
    const subTxt = victory ? "Колобок спас лес!" : "Попробуй ещё раз!";
    ctx.strokeText(subTxt, W/2, 290); ctx.fillText(subTxt, W/2, 290);
  }
}

// === ДЕЙСТВИЯ ===

function jump() { 
  if(gameOver||victory||isTransitioning) return; 
  if(world === 10) {
    player.vy = -3.5;
    player.onGround = false;
    sound(520,0.08);
    spawnParticles(player.x, player.y + player.r, "rgba(255,255,255,0.5)", 5);
  } else {
    if(player.onGround || player.jumpsLeft > 0){ 
      player.vy = player.onGround ? -11 : -9; 
      player.onGround = false; 
      player.jumpsLeft--; 
      playerSquash = 0.7; playerStretch = 1.3;
      sound(520,0.08); 
      spawnParticles(player.x, player.y + player.r, "#d4c9a8", 8, 4, 2);
    } 
  }
}

function dash() {
  if(gameOver||victory||isTransitioning) return;
  if (playerDashCooldown <= 0) {
    playerDashing = 15; playerDashCooldown = 45;
    player.vx = player.facing * (world === 10 ? 8 : 12);
    sound(300, 0.1, "sawtooth");
    spawnParticles(player.x, player.y, "#9c27b0", 10, 5, 3);
  }
}

function startShoot() {
  if(gameOver||victory||isTransitioning) return;
  initAudio();
  isHoldingShoot = true;
  if (currentWeapon === "shotgun") {
    shootShotgun();
  } else {
    if (!minigunInterval) {
      shootAuto();
      const speed = currentWeapon === "minigun" ? 80 : 100;
      minigunInterval = setInterval(shootAuto, speed);
    }
  }
}

function stopShoot() {
  isHoldingShoot = false;
  if (minigunInterval) {
    clearInterval(minigunInterval);
    minigunInterval = null;
  }
}

function shootShotgun() {
  const now=Date.now(); if(now-(player.lastShot||0)<260) return; player.lastShot=now;
  bullets.push({ x:player.x+player.facing*25, y:player.y-7, vx:player.facing*8, life:100 });
  soundShoot();
  triggerShake(4, 5);
  spawnParticles(player.x + player.facing * 25, player.y - 7, "#ffff99", 6, 5, 2); 
}

function shootAuto() {
  if(gameOver||victory) { stopShoot(); return; }
  const now=Date.now(); if(now-(player.lastShot||0)<50) return; player.lastShot=now;
  if (currentWeapon === "minigun") {
    bullets.push({ x:player.x+player.facing*30, y:player.y-7 + (Math.random()-0.5)*5, vx:player.facing*11, life:100 });
    triggerShake(2, 3);
    spawnParticles(player.x + player.facing * 30, player.y - 7, "#ffcc00", 2, 3, 1); 
  } else if (currentWeapon === "ak47") {
    bullets.push({ x:player.x+player.facing*35, y:player.y-7, vx:player.facing*13, life:100 });
    triggerShake(3, 4);
    spawnParticles(player.x + player.facing * 35, player.y - 7, "#ffaa00", 3, 4, 2); 
  }
  soundShoot();
}

function hurtPlayer() {
  if(player.invincible>0||gameOver||victory||isTransitioning) return;
  player.health--; player.invincible=90; player.vy=-6; player.vx=-player.facing*3;
  playerSquash = 1.3; playerStretch = 0.7;
  triggerShake(12, 15);
  sound(100,0.2,"sawtooth"); updateInfo();
  spawnParticles(player.x, player.y, "#ff3333", 15, 6, 3);
  say("Ой-ой-ой!"); 
  if(player.health<=0){ 
    gameOver=true; 
    stopMusic();
    stopShoot();
    say("Колобок, попробуй ещё раз!"); 
  }
  saveProgress();
}

function respawnFromGap() {
  player.x=lastSafeX; player.y=GROUND_Y-19; player.vx=0; player.vy=0; player.invincible=90;
  triggerShake(15, 20);
  stopShoot();
  hurtPlayer(); if(!gameOver) say("Осторожно, обрыв!");
}

function updateRat() {
  if (!rat.alive) return;
  
  rat.animFrame++;
  
  const distance = player.x - rat.x;
  const absDist = Math.abs(distance);
  
  if (absDist > 60) {
    rat.vx = Math.sign(distance) * 3.5;
    rat.facing = Math.sign(distance) || 1;
  } else if (absDist < 40) {
    rat.vx = -Math.sign(distance) * 1.5;
  } else {
    rat.vx *= 0.8;
  }
  
  rat.vy += getGravity();
  rat.x += rat.vx;
  rat.y += rat.vy;
  
  rat.onGround = false;
  if (rat.y + rat.r >= GROUND_Y) {
    rat.y = GROUND_Y - rat.r;
    rat.vy = 0;
    rat.onGround = true;
  }
  
  for (const p of platforms) {
    if (rat.vy >= 0 && rat.x + rat.r > p.x && rat.x - rat.r < p.x + p.w && rat.y + rat.r >= p.y && rat.y + rat.r <= p.y + 15) {
      rat.y = p.y - rat.r;
      rat.vy = 0;
      rat.onGround = true;
    }
  }
  
  if (rat.onGround && absDist > 60) {
    const checkX = rat.x + rat.facing * 40;
    const overGap = gaps.some(g => checkX > g.x && checkX < g.x + g.w);
    if (overGap) {
      rat.vy = -10;
      rat.onGround = false;
    }
    
    for (const p of platforms) {
      if (checkX > p.x && checkX < p.x + p.w && rat.y > p.y && rat.y < p.y + p.h + 20) {
        rat.vy = -9;
        rat.onGround = false;
      }
    }
  }
  
  rat.x = Math.max(20, Math.min(LEVEL_WIDTH - 20, rat.x));
  
  if (rat.y > H + 50) {
    rat.x = player.x - 60;
    rat.y = GROUND_Y - 10;
    rat.vy = 0;
  }
  
  rat.shootTimer--;
  if (rat.shootTimer <= 0) {
    let closestEnemy = null;
    let minDist = 400;
    
    for (const e of enemies) {
      if (e.alive) {
        const dist = Math.abs(player.x - e.x);
        if (dist < minDist) { minDist = dist; closestEnemy = e; }
      }
    }
    for (const g of gopniks) {
      if (g.alive) {
        const dist = Math.abs(player.x - g.x);
        if (dist < minDist) { minDist = dist; closestEnemy = g; }
      }
    }
    
    if (closestEnemy) {
      const dx = closestEnemy.x - rat.x;
      const dy = closestEnemy.y - rat.y;
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      bullets.push({ x: rat.x, y: rat.y - 5, vx: dx/len*10, vy: dy/len*10, life: 100 });
      sound(800, 0.05, "sine");
      rat.shootTimer = 60;
    }
  }
}

function updatePlayer() {
  if (isTransitioning) return;
  
  if (playerDashCooldown > 0) playerDashCooldown--;
  if (playerDashing > 0) {
    playerDashing--;
    player.x += player.vx;
    if (frame % 3 === 0) spawnParticles(player.x, player.y + 10, "rgba(156, 39, 176, 0.5)", 2, 2, 4);
  } else {
    let moving=false;
    if(keys.left){ player.vx=-player.speed; player.facing=-1; moving=true; }
    if(keys.right){ player.vx=player.speed; player.facing=1; moving=true; }
    if(!moving) player.vx*=0.78;
    player.x+=player.vx;
  }
  
  // Squash & stretch recovery
  playerSquash += (1 - playerSquash) * 0.2;
  playerStretch += (1 - playerStretch) * 0.2;
  
  if (world === 10) {
    player.vy += getGravity(); 
    if (player.vy > 4) player.vy = 4;
    if (keys.up || isHoldingShoot) player.vy -= 0.4;
  } else {
    player.vy+=getGravity(); 
  }
  
  player.y+=player.vy;
  
  const overGap=isOverGap(player.x);
  
  if (world === 10) {
    if(player.y > H - player.r) { 
      if (player.vy > 2) { playerSquash = 1.3; playerStretch = 0.7; spawnParticles(player.x, H - player.r, "#fff", 8, 4, 2); }
      player.y = H - player.r; player.vy = 0; player.onGround = true; 
    }
    if(player.y < player.r) { player.y = player.r; player.vy = 0; }
    player.onGround = false; 
    player.jumpsLeft = player.maxJumps;
  } else {
    if(player.y>H+40){ if(overGap||player.y>H+60){ respawnFromGap(); return; } }
    if(!overGap && player.y+player.r>=GROUND_Y){ 
      if (player.vy > 3) { playerSquash = 1.2; playerStretch = 0.8; spawnParticles(player.x, GROUND_Y, "#d4c9a8", 6, 3, 2); }
      player.y=GROUND_Y-player.r; player.vy=0; player.onGround=true; player.jumpsLeft = player.maxJumps; lastSafeX=player.x; 
    }
    else { if(player.y+player.r<GROUND_Y) player.onGround=false; }
    for(const p of platforms){
      if(player.vy>=0 && player.x+player.r>p.x && player.x-player.r<p.x+p.w && player.y+player.r>=p.y && player.y+player.r<=p.y+15){
        if (player.vy > 3) { playerSquash = 1.2; playerStretch = 0.8; spawnParticles(player.x, p.y, "#d4c9a8", 6, 3, 2); }
        player.y=p.y-player.r; player.vy=0; player.onGround=true; player.jumpsLeft = player.maxJumps; lastSafeX=player.x;
      }
    }
  }
  
  player.x=Math.max(player.r,Math.min(LEVEL_WIDTH-20,player.x));
  if(player.invincible>0) player.invincible--;
  camera=player.x-W*0.38; camera=Math.max(0,Math.min(LEVEL_WIDTH-W,camera));
}

function updateGopniks() {
  for(const g of gopniks) {
    if(!g.alive) continue;
    const dist = player.x - g.x;
    if (Math.abs(dist) < 300) {
      if (Math.abs(dist) > 100) {
        g.vx = Math.sign(dist) * 0.8;
      } else {
        g.vx = 0;
      }
      g.shootTimer--;
      if(g.shootTimer <= 0) {
        const dx = player.x - g.x;
        const dy = player.y - (g.y - 20);
        const len = Math.sqrt(dx*dx + dy*dy) || 1;
        enemyBullets.push({ x:g.x, y:g.y-20, vx:dx/len*4, vy:dy/len*4, angle:Math.atan2(dy,dx), life:120, isSeed: true });
        g.shootTimer = 100 + Math.random()*50;
        sound(600, 0.05, "square");
      }
    } else {
      if (g.x < g.min) g.vx = Math.abs(g.vx) || 0.8;
      if (g.x > g.max) g.vx = -Math.abs(g.vx) || -0.8;
    }
    g.x += g.vx;
    
    if(Math.abs(player.x-g.x)<35 && Math.abs(player.y-g.y)<35) {
      if (player.vy > 0 && player.y < g.y - 10) {
        g.alive = false;
        player.vy = -10;
        sound(600, 0.1, "square");
        spawnExplosion(g.x, g.y);
        totalStars += 1; saveProgress();
        say("А семки есть?");
      } else {
        hurtPlayer();
      }
    }
  }
}

function updateEnemies() {
  for(const e of enemies){
    if(!e.alive) continue; e.jumpTimer--; const distance=player.x-e.x;
    if(e.jumpTimer<=0&&e.onGround){ e.vy=-(7+(world%4)*0.5); e.onGround=false; e.jumpTimer=95+Math.random()*85; }
    if(Math.abs(distance)<230){ e.vx+=Math.sign(distance)*0.025; e.vx=Math.max(-2-(world%4)*0.2,Math.min(2+(world%4)*0.2,e.vx)); }
    else { if(e.x<e.min) e.vx=Math.abs(e.vx); if(e.x>e.max) e.vx=-Math.abs(e.vx); }
    e.x+=e.vx; e.y+=e.vy; e.vy+=getGravity();
    if(e.y>=GROUND_Y - 20){ e.y=GROUND_Y - 20; e.vy=0; e.onGround=true; }
    
    if(Math.abs(player.x-e.x)<35 && Math.abs(player.y-e.y)<35) {
      if (player.vy > 0 && player.y < e.y - 10) {
        e.alive = false;
        player.vy = -10;
        sound(600, 0.1, "square");
        spawnExplosion(e.x, e.y);
        totalStars += 1; saveProgress();
        say("Ай!");
      } else {
        hurtPlayer();
      }
    }
  }
}

function updateLizards() {
  for(const l of lizards){

    if(l.dashTimer<=0&&l.onGround&&Math.abs(distance)<260){ l.vx=Math.sign(distance)*(3.2+(world%4)*0.2); l.facing=Math.sign(distance)||1; l.dashTimer=160+Math.random()*80; sound(420,0.06,"square"); }

    if(Math.abs(player.x-l.x)<35 && Math.abs(player.y-l.y)<35) {
      if (player.vy > 0 && player.y < l.y - 10) {
        l.alive = false;
        player.vy = -10;
        sound(600, 0.1, "square");
        spawnExplosion(l.x, l.y);
        totalStars += 1; saveProgress();

      }

function updateBears() {
  for(const b of bears){
    if(!b.alive) continue; if(b.hurtFlash>0) b.hurtFlash--;
    const distance=player.x-b.x; b.facing=Math.sign(distance)||1;
    if(Math.abs(distance)>60) b.vx=Math.sign(distance)*0.6; else b.vx=0;
    b.x+=b.vx; b.y+=b.vy; b.vy+=getGravity();
    if(b.y>=GROUND_Y - 30){ b.y=GROUND_Y - 30; b.vy=0; b.onGround=true; }
    b.throwTimer--;
    if(b.throwTimer<=0&&Math.abs(distance)<380){
      const dx=player.x-b.x, dy=player.y-(b.y-30), len=Math.sqrt(dx*dx+dy*dy)||1;
      enemyBullets.push({ x:b.x, y:b.y-30, vx:dx/len*3.2, vy:dy/len*3.2-1.2, angle:Math.atan2(dy,dx), life:180 });
      b.throwTimer=150+Math.random()*80; sound(200,0.1,"square");
    }
    
    if(Math.abs(player.x-b.x)<45 && Math.abs(player.y-b.y)<45) {
      if (player.vy > 0 && player.y < b.y - 15) {
        b.hp--; b.hurtFlash=20; player.vy = -10;
        sound(200, 0.08);
        spawnParticles(b.x, b.y, "#ff5555", 10, 5, 3);
        if(b.hp<=0){ b.alive=false; pickups.push({ x: b.x, y: b.y - 30, type: "shield" }); spawnExplosion(b.x, b.y); say("Ай!"); totalStars+=5; }
        saveProgress();
      } else {
        hurtPlayer();
      }
    }
  }
}

function updateWitches() {
  for(const w of witches){
    if(!w.alive) continue; w.phase+=0.03; w.x+=w.vx;
    if(w.x<80){ w.x=80; w.vx=Math.abs(w.vx); }
    if(w.x>LEVEL_WIDTH-80){ w.x=LEVEL_WIDTH-80; w.vx=-Math.abs(w.vx); }
    w.y=w.baseY+Math.sin(w.phase)*25;
    w.shootTimer--;
    if(w.shootTimer<=0){
      const dx=player.x-w.x, dy=player.y-w.y, len=Math.sqrt(dx*dx+dy*dy)||1;
      enemyBullets.push({ x:w.x, y:w.y, vx:dx/len*3.4, vy:dy/len*3.4, angle:Math.atan2(dy,dx), life:150 });

    }
    if(Math.abs(player.x-w.x)<40&&Math.abs(player.y-w.y)<40) hurtPlayer();
  }
}

function updateBoss() {
  if(!boss || !boss.isBossLevel) return;
  if(!bossBattle&&player.x>1950&&boss.alive){ bossBattle=true; say("Лиса! Вот это сюрприз!"); saveProgress(); }
  if(!bossBattle||!boss.alive) return;
  const distance=player.x-boss.x; if(Math.abs(distance)>70) boss.vx=Math.sign(distance)*1.1; else boss.vx=0;
  boss.x+=boss.vx; boss.jumpTimer--;
  if(boss.jumpTimer<=0&&boss.y>=GROUND_Y - 45){ boss.vy=-8.5; boss.jumpTimer=100; }
  boss.y+=boss.vy; boss.vy+=getGravity();
  if(boss.y>GROUND_Y - 45){ boss.y=GROUND_Y - 45; boss.vy=0; }
  boss.shootTimer--;
  if(boss.shootTimer<=0){
    const dx=player.x-boss.x, dy=(player.y-10)-(boss.y-10), len=Math.sqrt(dx*dx+dy*dy)||1;
    enemyBullets.push({ x:boss.x, y:boss.y-10, vx:dx/len*4.8, vy:dy/len*4.8, angle:Math.atan2(dy,dx), life:130 });
    boss.shootTimer=85; sound(260,0.1,"sawtooth");
  }
  if(Math.abs(player.x-boss.x)<50 && Math.abs(player.y-boss.y)<50) {
    if (player.vy > 0 && player.y < boss.y - 15) {
      boss.hp--; player.vy = -10;
      sound(240, 0.08);
      spawnParticles(boss.x, boss.y, "#ff5555", 8, 5, 3);
      if(boss.hp<=0){ boss.alive=false; spawnExplosion(boss.x, boss.y); say("Охохонюшки, Хо-Хо!"); totalStars+=10; }
      saveProgress();
    } else {
      hurtPlayer();
    }
  }
}

function updateBullets() {
  for(const b of bullets){
    b.x+=b.vx; b.life--;
    
    for(const g of gopniks) if(g.alive&&Math.abs(b.x-g.x)<30&&Math.abs(b.y-g.y)<30){ 
      g.alive=false; b.life=0; 
      spawnExplosion(g.x, g.y);
      say("А семки есть?"); sound(330,0.12); totalStars+=1; saveProgress(); 
    }
    for(const e of enemies) if(e.alive&&Math.abs(b.x-e.x)<30&&Math.abs(b.y-e.y)<35){ 
      e.alive=false; b.life=0; 
      spawnExplosion(e.x, e.y);
      if(Math.random() < 0.2) pickups.push({ x: e.x, y: e.y - 20, type: ["apple", "lightning", "shield"][Math.floor(Math.random()*3)] });
      say("Ай!"); sound(330,0.12); saveProgress(); 
    }
    for(const w of witches) if(w.alive&&Math.abs(b.x-w.x)<35&&Math.abs(b.y-w.y)<40){ 
      w.alive=false; b.life=0; 
      spawnExplosion(w.x, w.y);
      if(Math.random() < 0.3) pickups.push({ x: w.x, y: w.y, type: "apple" });
      say("Ай!"); sound(220,0.15,"triangle"); saveProgress(); 
    }
    for(const bear of bears) if(bear.alive&&Math.abs(b.x-bear.x)<30&&Math.abs(b.y-bear.y)<30){
      bear.hp--; bear.hurtFlash=20; b.life=0; sound(200,0.08);
      spawnParticles(bear.x, bear.y, "#ff5555", 5, 4, 2);
      if(bear.hp<=0){ bear.alive=false; pickups.push({ x: bear.x, y: bear.y - 30, type: "shield" }); spawnExplosion(bear.x, bear.y); say("Ай!"); totalStars+=5; }
      saveProgress();
    }
    if (world === 10) {
      for(const m of mermaids) if(m.alive&&Math.abs(b.x-m.x)<30&&Math.abs(b.y-m.y)<30){ m.alive=false; b.life=0; spawnExplosion(m.x, m.y); say("Ай!"); totalStars+=2; saveProgress(); }
      for(const s of sharks) if(s.alive&&Math.abs(b.x-s.x)<40&&Math.abs(b.y-s.y)<30){ s.alive=false; b.life=0; spawnExplosion(s.x, s.y); say("Ай!"); totalStars+=2; saveProgress(); }
    } else if (world === 11) {
      for(const t of trees) if(t.alive&&Math.abs(b.x-t.x)<40&&Math.abs(b.y-t.y)<50){ 
        t.hp--; b.life=0; spawnParticles(t.x, t.y, "#44ff44", 10, 5, 3); sound(200,0.08);
        if(t.hp<=0){ t.alive=false; spawnExplosion(t.x, t.y); say("Ай!"); totalStars+=3; }
        saveProgress();
      }
    }
    
    if(boss && boss.isBossLevel && bossBattle && boss.alive && Math.abs(b.x-boss.x)<45 && Math.abs(b.y-boss.y)<50){
      boss.hp--; b.life=0; sound(240,0.08);
      spawnParticles(boss.x, boss.y, "#ff5555", 8, 5, 3);
      if(boss.hp<=0){ boss.alive=false; spawnExplosion(boss.x, boss.y); say("Охохонюшки, Хо-Хо!"); totalStars+=10; }
      saveProgress();
    }
  }
  bullets=bullets.filter(b=>b.life>0&&b.x>-100&&b.x<LEVEL_WIDTH+100);
  
  for(const b of enemyBullets){
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if(Math.abs(b.x-player.x)<25&&Math.abs(b.y-player.y)<25){ b.life=0; hurtPlayer(); }
  }
  enemyBullets=enemyBullets.filter(b=>b.life>0);
}

function updatePickups() {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    if (Math.abs(player.x - p.x) < 30 && Math.abs(player.y - p.y) < 30) {
      if (p.type === "apple") { 
        player.health = Math.min(3, player.health + 1); 
        addFloatingText(player.x - camera, player.y - 40, "+1 ❤️", "#e33");
      }
      else if (p.type === "lightning") { 
        player.lastShot = Date.now() - 200; 
        addFloatingText(player.x - camera, player.y - 40, "БЫСТРО!", "#0af");
      }
      else if (p.type === "shield") { 
        player.invincible = 180; 
        addFloatingText(player.x - camera, player.y - 40, "ЩИТ!", "#0f0");
      }
      sound(880, 0.15, "sine");
      pickups.splice(i, 1);
      updateInfo();
    }
  }
}

function updateStars() {
  for(const s of stars) if(!s.taken&&Math.abs(player.x-s.x)<30&&Math.abs(player.y-s.y)<40){ 
    s.taken=true; totalStars++; 
    addFloatingText(player.x - camera, player.y - 40, "+1 ⭐", "#ffd700");
    sound(760,0.12,"sine"); updateInfo(); saveProgress(); 
  }
}

function checkLevelEnd() {
  if (isTransitioning || gameOver || victory) return;
  const hutX = LEVEL_WIDTH - 140;
  if (player.x > hutX + 40 && player.x < hutX + 85) {
    isTransitioning = true; 
    stopShoot();
    say("В избушку!"); sound(880, 0.3, "sine");
    setTimeout(() => {
      if (world < TOTAL_LEVELS - 1) {
        world++; makeLevel(); say("Мир " + (world+1) + ": " + worlds[world].name); saveProgress(); isTransitioning = false;
      } else {
        victory = true; say("Победа! Колобок спас лес!"); saveProgress(); isTransitioning = false;
        stopMusic();
      }
    }, 1000);
  }
  if (boss && boss.isBossLevel && bossBattle && boss.alive && player.x > 2110) { player.x = 2110; }
}

function update() {
  if(gameOver||victory){ draw(); gameLoopRunning=false; return; }
  frame++; 
  updatePlayer(); updateEnemies(); updateWitches(); updateLizards(); updateBears(); updateBoss(); updateBullets(); updateStars(); updatePickups();
  updateMermaidsSharks();
  updateTrees();
  updateGopniks();
  updateRat();
  updateParticles();
  checkLevelEnd(); updateInfo(); draw();
  if(frame-lastSaveFrame>=60){ saveProgress(); lastSaveFrame=frame; }
  requestAnimationFrame(update);
}
function startGameLoop() { if(gameLoopRunning) return; gameLoopRunning=true; requestAnimationFrame(update); }

// === УПРАВЛЕНИЕ ===
document.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code)) e.preventDefault();
  if(e.code==="ArrowLeft"||e.code==="KeyA") keys.left=true;
  if(e.code==="ArrowRight"||e.code==="KeyD") keys.right=true;
  if((e.code==="ArrowUp"||e.code==="Space"||e.code==="KeyW")&&!e.repeat) jump();
  if(e.code==="ArrowUp"||e.code==="KeyW") keys.up = true;
  if((e.code==="KeyJ"||e.code==="KeyF")&&!e.repeat) startShoot();
  if((e.code==="ShiftLeft"||e.code==="KeyK")&&!e.repeat) dash();
});
document.addEventListener("keyup",e=>{
  if(e.code==="ArrowLeft"||e.code==="KeyA") keys.left=false;
  if(e.code==="ArrowRight"||e.code==="KeyD") keys.right=false;
  if(e.code==="ArrowUp"||e.code==="KeyW") keys.up = false;
  if(e.code==="KeyJ"||e.code==="KeyF") stopShoot();
});

function bindHold(id,key) {
  const button=document.getElementById(id);
  button.addEventListener("pointerdown",e=>{ e.preventDefault(); keys[key]=true; try{ button.setPointerCapture(e.pointerId); }catch(err){} });
  const release=e=>{ e.preventDefault(); keys[key]=false; };
  button.addEventListener("pointerup",release); button.addEventListener("pointercancel",release);
  button.addEventListener("lostpointercapture",()=>keys[key]=false);
  button.addEventListener("contextmenu",e=>e.preventDefault()); button.addEventListener("selectstart",e=>e.preventDefault());
}
bindHold("left","left"); bindHold("right","right");

function bindShoot() {
  const button = document.getElementById("shoot");
  button.addEventListener("pointerdown", e => { 
    e.preventDefault(); 
    startShoot(); 
    try{ button.setPointerCapture(e.pointerId); }catch(err){} 
  });
  const stop = e => { 
    e.preventDefault(); 
    stopShoot(); 
  };
  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("lostpointercapture", stop);
  button.addEventListener("contextmenu", e => e.preventDefault());
  button.addEventListener("selectstart", e => e.preventDefault());
}
bindShoot();

function bindJump() {
  const button = document.getElementById("jump");
  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    jump();
    keys.up = true;
    try{ button.setPointerCapture(e.pointerId); }catch(err){}
  });
  const stop = e => {
    e.preventDefault();
    keys.up = false;
  };
  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("lostpointercapture", stop);
  button.addEventListener("contextmenu", e => e.preventDefault());
  button.addEventListener("selectstart", e => e.preventDefault());
}
bindJump();

function bindTap(id,action) {
  const button=document.getElementById(id);
  button.addEventListener("pointerdown",e=>{ e.preventDefault(); action(); });
  button.addEventListener("contextmenu",e=>e.preventDefault()); button.addEventListener("selectstart",e=>e.preventDefault());
}
bindTap("dash",dash);

// === МЕНЮ ===

const wpnMinigunBtn = document.getElementById("wpn-minigun");
const wpnAk47Btn = document.getElementById("wpn-ak47");

wpnShotgunBtn.addEventListener("click", () => {
    currentWeapon = "shotgun";
    wpnShotgunBtn.classList.add("active");
    wpnMinigunBtn.classList.remove("active");
    wpnAk47Btn.classList.remove("active");
    document.getElementById("shoot").textContent = "🔫";
});

wpnMinigunBtn.addEventListener("click", () => {
    currentWeapon = "minigun";
    wpnMinigunBtn.classList.add("active");
    wpnShotgunBtn.classList.remove("active");
    wpnAk47Btn.classList.remove("active");
    document.getElementById("shoot").textContent = "💥";
});

wpnAk47Btn.addEventListener("click", () => {
    currentWeapon = "ak47";
    wpnAk47Btn.classList.add("active");
    wpnShotgunBtn.classList.remove("active");
    wpnMinigunBtn.classList.remove("active");
    document.getElementById("shoot").textContent = "🔫";
});

const hasSave = loadProgress();
if (!hasSave) {
  document.getElementById("btn-continue").style.display = "none";
}

document.getElementById("btn-continue").addEventListener("click", () => {
  initAudio();
  menuScreen.classList.add("hidden");
  makeLevel();
  loadProgress();
  draw();
  startGameLoop();
});

document.getElementById("btn-new").addEventListener("click", () => {
  if (confirm("Начать новую игру? Старое сохранение будет удалено.")) {
    initAudio();
    deleteSave();
    world = 0; totalStars = 0; gameOver = false; victory = false; frame = 0;
    makeLevel();
    menuScreen.classList.add("hidden");
    say("Новое приключение начинается!");
    saveProgress();
    draw();
    startGameLoop();
  }
});

document.getElementById("restart").addEventListener("click",()=>{
  if(!confirm("Начать игру заново? Старое сохранение будет удалено.")) return;
  deleteSave(); world=0; totalStars=0; gameOver=false; victory=false; frame=0; lastSaveFrame=0; keys={};
  makeLevel(); say("Новое приключение начинается!"); saveProgress(); draw(); startGameLoop();
});

// === ЗАЩИТА ===
document.addEventListener("contextmenu",e=>{ if(e.target.tagName==="BUTTON"||e.target.tagName==="CANVAS") e.preventDefault(); });
window.addEventListener("blur",()=>{ keys.left=false; keys.right=false; keys.up=false; stopShoot(); saveProgress(); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ keys.left=false; keys.right=false; keys.up=false; stopShoot(); saveProgress(); } });
window.addEventListener("pagehide",()=>{ saveProgress(); });
</script>
