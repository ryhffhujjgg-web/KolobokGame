<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Колобок: Comix Zone — Alive Edition</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#08080f;color:#fff;font-family:'Courier New',monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}

#menu-screen{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#26264a 0%,#12122a 60%,#08080f 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;transition:opacity .45s;overflow:hidden}
#menu-screen::before{content:'';position:absolute;inset:-20%;background-image:radial-gradient(rgba(255,255,255,.07) 1.5px,transparent 1.6px);background-size:12px 12px;animation:drift 18s linear infinite}
@keyframes drift{to{transform:translate(60px,60px)}}
#menu-screen.hidden{opacity:0;pointer-events:none}
#menu-screen h1{position:relative;font-size:clamp(38px,9vw,68px);color:#f4cf43;text-shadow:4px 4px 0 #000,-2px -2px 0 #e85b50;letter-spacing:6px;margin-bottom:6px;text-align:center}
#menu-screen p{position:relative;font-size:clamp(12px,2.6vw,18px);color:#a8d8f0;text-shadow:2px 2px 0 #000;margin-bottom:26px;text-align:center;letter-spacing:2px}
.weapon-select{position:relative;display:flex;gap:14px;margin-bottom:24px;flex-wrap:wrap;justify-content:center}
.weapon-btn{padding:10px 18px;border:3px solid #000;background:#2a2a3e;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:5px 5px 0 #000;transition:transform .12s,background .2s;font-family:inherit}
.weapon-btn.active{border-color:#f4cf43;color:#f4cf43;background:#3b3b60;transform:translate(-3px,-3px);box-shadow:8px 8px 0 #000}
.weapon-btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.weapon-icon{font-size:26px;filter:drop-shadow(2px 2px 0 #000)}
.weapon-name{font-size:11px;letter-spacing:1px;font-weight:bold}
.menu-btn{position:relative;padding:14px 42px;font-size:18px;font-weight:bold;border:4px solid #000;margin:7px;cursor:pointer;box-shadow:6px 6px 0 #000;letter-spacing:3px;font-family:inherit;color:#fff}
.menu-btn:active{transform:translate(4px,4px);box-shadow:2px 2px 0 #000}
#btn-continue{background:#4aa9ef}#btn-new{background:#e85b50}
.menu-hint{position:relative;margin-top:16px;font-size:11px;color:#8f8fb5;text-align:center;line-height:1.6}

#rotate-hint{display:none;position:fixed;inset:0;background:#12122a;z-index:150;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;font-size:19px;line-height:1.5}
#rotate-hint .icon{font-size:62px;margin-bottom:14px;animation:rot 2s infinite ease-in-out}
@keyframes rot{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
@media (orientation:portrait) and (max-width:900px){#rotate-hint{display:flex}}

#game-wrap{position:relative;width:100vw;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%;object-fit:contain;touch-action:none}

#topbar{position:absolute;top:0;left:0;right:0;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;z-index:20;pointer-events:none}
#info{font-size:14px;background:#000;padding:7px 11px;border:3px solid #fff;box-shadow:3px 3px 0 #f4cf43;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold;pointer-events:auto}
.topbtns{display:flex;gap:6px;pointer-events:auto}
.iconbtn{border:3px solid #000;background:#2a2a3e;color:#fff;font-size:15px;padding:6px 9px;box-shadow:3px 3px 0 #000;cursor:pointer;font-family:inherit}
.iconbtn.off{background:#4a2020;color:#a88}
.iconbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
#restart{border:3px solid #000;font-size:13px;padding:7px 11px;background:#e85b50;color:#fff;font-weight:bold;box-shadow:3px 3px 0 #000;cursor:pointer;font-family:inherit}
#message{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-size:16px;font-weight:bold;color:#000;background:#f4cf43;padding:7px 16px;border:3px solid #000;box-shadow:4px 4px 0 #000;z-index:21;max-width:70vw;text-align:center;pointer-events:none}

.controls{width:100%;height:116px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;background:#12122a;border-top:4px solid #000;z-index:30;flex-shrink:0}
.left-group,.right-group{display:flex;gap:14px;align-items:center}
button.ctrl{border:3px solid #000;background:#2a2a3e;color:#fff;font-size:22px;font-weight:bold;box-shadow:5px 5px 0 #000;touch-action:none;display:flex;align-items:center;justify-content:center;width:66px;height:66px;min-width:66px;font-family:inherit}
button.ctrl:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #000;background:#3b3b60}
#jump{background:#4aa9ef;width:78px;height:78px;font-size:13px}
#shoot{background:#e85b50;width:78px;height:78px;font-size:26px}
#dash{background:#9c27b0}
#dash.cool{opacity:.45}
@media (max-height:450px){button.ctrl{width:54px;height:54px;min-width:54px;font-size:18px}#jump,#shoot,#dash{width:64px;height:64px;font-size:12px}.controls{height:88px;padding:0 10px}#message{font-size:13px;top:48px}#info{font-size:11px;padding:5px 8px}}
</style>
</head>
<body>

<div id="menu-screen">
  <h1>КОЛОБОК</h1>
  <p>COMIX ZONE · ALIVE EDITION</p>
  <div class="weapon-select">
    <button class="weapon-btn active" id="wpn-shotgun" data-weapon="shotgun"><span class="weapon-icon">🔫</span><span class="weapon-name">ДРОБОВИК</span></button>
    <button class="weapon-btn" id="wpn-minigun" data-weapon="minigun"><span class="weapon-icon">💥</span><span class="weapon-name">МИНИГАН</span></button>
    <button class="weapon-btn" id="wpn-ak47" data-weapon="ak47"><span class="weapon-icon">🔫</span><span class="weapon-name">АК-47</span></button>
  </div>
  <button class="menu-btn" id="btn-continue">ПРОДОЛЖИТЬ</button>
  <button class="menu-btn" id="btn-new">НОВАЯ ИГРА</button>
  <div class="menu-hint">← → движение · SPACE прыжок (двойной) · J огонь · SHIFT рывок<br>🎵 музыка каждого мира · 🔊 звуки и голоса</div>
</div>

<div id="rotate-hint"><div class="icon">📱</div><div>Поверните телефон<br>горизонтально для игры</div></div>

<div id="game-wrap">
  <canvas id="game" width="1200" height="540"></canvas>
  <div id="topbar">
    <div id="info">Мир 1/12 | ⭐ 0 | ❤️ 3</div>
    <div class="topbtns">
      <button class="iconbtn" id="btn-music" title="Музыка">🎵</button>
      <button class="iconbtn" id="btn-sfx" title="Звуки и голоса">🔊</button>
      <button id="restart">↻ ЗАНОВО</button>
    </div>
  </div>
  <div id="message">Вперёд, Колобок!</div>
</div>

<div class="controls">
  <div class="left-group"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
  <div class="right-group"><button class="ctrl" id="dash">⚡</button><button class="ctrl" id="jump">ПРЫЖОК</button><button class="ctrl" id="shoot">🔫</button></div>
</div>

<script>
/* ============================================================
   КОЛОБОК · COMIX ZONE · ALIVE EDITION
   ============================================================ */
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const info=document.getElementById('info'),message=document.getElementById('message'),menuScreen=document.getElementById('menu-screen');
const W=canvas.width,H=canvas.height,GROUND_Y=470,LEVEL_WIDTH=2400,TOTAL_LEVELS=12,SAVE_KEY='kolobok_comixzone_v9';
const TAU=Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
ctx.lineJoin='round'; ctx.lineCap='round';

/* ================= МИРЫ + МУЗЫКАЛЬНЫЕ ТЕМЫ ================= */
const SCALES={major:[0,2,4,5,7,9,11],minor:[0,2,3,5,7,8,10],pent:[0,2,4,7,9],dorian:[0,2,3,5,7,9,10],phryg:[0,1,3,5,7,8,10],harm:[0,2,3,5,7,8,11],lyd:[0,2,4,6,7,9,11]};
const MEL={
 a:[0,2,4,2,5,4,2,-1,0,2,4,5,7,5,4,-1],
 b:[0,3,4,3,2,0,-1,2,4,5,4,2,0,-1,-1,-1],
 c:[7,5,4,2,4,5,7,-1,5,4,2,0,2,-1,0,-1],
 d:[0,0,2,3,5,3,2,0,-1,4,3,2,0,-1,2,-1],
 e:[0,4,7,4,2,5,4,2,0,2,4,7,9,7,4,-1],
 f:[4,2,0,2,4,4,4,-1,5,4,2,4,5,7,-1,-1]
};
const worlds=[
 {name:"Лесная тропинка",sky:"#8bd7f5",ground:"#55a84c",enemy:"rabbit",weather:"leaves",light:.0,
  music:{tempo:112,root:261.63,scale:'pent',mel:'a',wave:'triangle',drums:'soft',pad:'warm'}},
 {name:"Волчий лес",sky:"#829ac5",ground:"#477b42",enemy:"wolf",weather:"rain",light:.15,
  music:{tempo:100,root:220,scale:'minor',mel:'b',wave:'sine',drums:'soft',pad:'cold',echo:true}},
 {name:"Медвежья поляна",sky:"#a6d5a0",ground:"#438b46",enemy:"bear",weather:"none",light:0,
  music:{tempo:94,root:196,scale:'major',mel:'f',wave:'triangle',drums:'soft',pad:'warm'}},
 {name:"Лисья опушка",sky:"#ffc47b",ground:"#68a34b",enemy:"fox",weather:"leaves",light:.05,
  music:{tempo:120,root:293.66,scale:'lyd',mel:'c',wave:'triangle',drums:'soft',pad:'warm'}},
 {name:"Болото Кикиморы",sky:"#7a9e7e",ground:"#3e6b3a",enemy:"frog",weather:"rain",light:.25,
  music:{tempo:84,root:174.61,scale:'dorian',mel:'d',wave:'sine',drums:'none',pad:'murky',echo:true}},
 {name:"Пещера тролля",sky:"#6b7c93",ground:"#4b5a4a",enemy:"troll",weather:"dust",light:.45,
  music:{tempo:88,root:146.83,scale:'phryg',mel:'b',wave:'triangle',drums:'kick',pad:'dark',echo:true}},
 {name:"Замок Кощея",sky:"#c09bd6",ground:"#5a4b6e",enemy:"skeleton",weather:"sparks",light:.35,
  music:{tempo:104,root:233.08,scale:'harm',mel:'e',wave:'triangle',drums:'soft',pad:'dark',echo:true}},
 {name:"Гора Дракона",sky:"#ff9a76",ground:"#7a4a3a",enemy:"dragon",weather:"ash",light:.2,
  music:{tempo:126,root:196,scale:'minor',mel:'c',wave:'sawtooth',drums:'kick',pad:'dark'}},
 {name:"Тёмный бор",sky:"#5b6d8b",ground:"#2e4a3a",enemy:"goblin",weather:"rain",light:.5,
  music:{tempo:92,root:164.81,scale:'minor',mel:'d',wave:'sine',drums:'none',pad:'cold',echo:true}},
 {name:"Огненная пустошь",sky:"#ff7e5f",ground:"#8b3a2a",enemy:"fire",weather:"ash",light:.15,
  music:{tempo:132,root:185,scale:'phryg',mel:'e',wave:'square',drums:'kick',pad:'dark'}},
 {name:"Подводное царство",sky:"#006699",ground:"#ccaa55",enemy:"mermaid",weather:"bubbles",light:.3,
  music:{tempo:76,root:261.63,scale:'lyd',mel:'a',wave:'sine',drums:'none',pad:'water',echo:true}},
 {name:"Дремучий лес",sky:"#2b4a2b",ground:"#1a3a1a",enemy:"tree",weather:"rain",light:.55,
  music:{tempo:108,root:146.83,scale:'harm',mel:'b',wave:'triangle',drums:'kick',pad:'dark',echo:true}}
];
const BOSS_MUSIC={tempo:142,root:146.83,scale:'harm',mel:'e',wave:'sawtooth',drums:'kick',pad:'dark',echo:true};

/* ================= СОСТОЯНИЕ ================= */
let world=0,camera=0,player,enemies=[],witches=[],lizards=[],bears=[],bullets=[],enemyBullets=[],stars=[],platforms=[],gaps=[],boss;
let bossBattle=false,gameOver=false,victory=false,totalStars=0,frame=0,keys={},lastSaveFrame=0,lastSafeX=70,gameLoopRunning=false,isTransitioning=false;
let pickups=[],particles=[],rings=[],floatingTexts=[],weather=[],foreground=[];
let shakeTime=0,shakeAmp=0,hitFlash=0;
let playerDashing=0,playerDashCooldown=0;
let currentWeapon='shotgun',minigunInterval=null,isHoldingShoot=false;
let mermaids=[],sharks=[],trees=[],gopniks=[];
let rat=null,levelBannerTimer=0,messageTimer=0;

function getGravity(){return world===10?0.15:0.55;}
function triggerShake(amp,dur=10){shakeAmp=Math.max(shakeAmp,amp);shakeTime=Math.max(shakeTime,dur);}

/* ================= АУДИО: ЗВУКИ, ГОЛОСА, МУЗЫКА ================= */
const A={ctx:null,master:null,sfx:null,mus:null,delay:null,noise:null,sfxOn:true,musicOn:true,
 init(){ if(this.ctx)return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  this.ctx=new AC();
  this.master=this.ctx.createGain(); this.master.gain.value=.9; this.master.connect(this.ctx.destination);
  this.sfx=this.ctx.createGain(); this.sfx.gain.value=.85; this.sfx.connect(this.master);
  this.mus=this.ctx.createGain(); this.mus.gain.value=0; this.mus.connect(this.master);
  this.delay=this.ctx.createDelay(1.0); this.delay.delayTime.value=.3;
  const fb=this.ctx.createGain(); fb.gain.value=.28;
  const dw=this.ctx.createGain(); dw.gain.value=.35;
  this.delay.connect(fb); fb.connect(this.delay); this.delay.connect(dw); dw.connect(this.mus);
  const len=Math.floor(this.ctx.sampleRate*.5), buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  this.noise=buf;
 },
 resume(){ this.init(); if(this.ctx&&this.ctx.state!=='running') this.ctx.resume().catch(()=>{}); }
};
function noiseHit(t,dur,type,freq,vol,dest){
 if(!A.ctx)return; const s=A.ctx.createBufferSource(); s.buffer=A.noise;
 const f=A.ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq;
 const g=A.ctx.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
 s.connect(f); f.connect(g); g.connect(dest||A.sfx); s.start(t); s.stop(t+dur+.02);
}
function sound(freq=440,dur=.1,type='square',vol=.07){
 if(!A.sfxOn)return; A.resume(); if(!A.ctx)return;
 const t=A.ctx.currentTime,o=A.ctx.createOscillator(),g=A.ctx.createGain();
 o.type=type; o.frequency.setValueAtTime(freq,t); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
 o.connect(g); g.connect(A.sfx); o.start(t); o.stop(t+dur+.02);
}
function sweep(f1,f2,dur,type='sine',vol=.12){
 if(!A.sfxOn)return; A.resume(); if(!A.ctx)return;
 const t=A.ctx.currentTime,o=A.ctx.createOscillator(),g=A.ctx.createGain();
 o.type=type; o.frequency.setValueAtTime(f1,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
 g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0008,t+dur);
 o.connect(g); g.connect(A.sfx); o.start(t); o.stop(t+dur+.02);
}
function soundShoot(){
 if(!A.sfxOn)return; A.resume(); if(!A.ctx)return; const t=A.ctx.currentTime;
 if(currentWeapon==='shotgun'){ noiseHit(t,.12,'highpass',1400,.35); sweep(140,38,.2,'sine',.4); }
 else if(currentWeapon==='minigun'){ noiseHit(t,.05,'bandpass',2200,.16); sweep(300,110,.06,'square',.1); }
 else { noiseHit(t,.06,'highpass',1800,.2); sweep(420,90,.07,'sawtooth',.14); }
}
const SFX={
 jump(){sweep(420,760,.12,'square',.09);},
 land(){noiseHit(A.ctx?A.ctx.currentTime:0,.1,'lowpass',420,.18);},
 dash(){sweep(220,900,.18,'sawtooth',.1);},
 star(){sound(880,.09,'sine',.09); setTimeout(()=>sound(1320,.1,'sine',.07),60);},
 pickup(){sound(660,.1,'triangle',.1); setTimeout(()=>sound(990,.14,'sine',.09),80);},
 hurt(){sweep(300,70,.28,'sawtooth',.18); noiseHit(A.ctx?A.ctx.currentTime:0,.18,'lowpass',900,.2);},
 boom(){ if(!A.sfxOn||!A.ctx)return; const t=A.ctx.currentTime; noiseHit(t,.3,'lowpass',1200,.3); sweep(180,40,.3,'sine',.22); },
 hit(){sound(210,.07,'square',.09);},
 kill(){sound(520,.08,'square',.08); setTimeout(()=>sound(300,.1,'triangle',.07),60);}
};
/* --- ГОЛОСА --- */
let voices=[],lastSay=0,lastSayText='';
function loadVoices(){ if('speechSynthesis' in window) voices=speechSynthesis.getVoices()||[]; }
loadVoices(); if('speechSynthesis' in window) speechSynthesis.onvoiceschanged=loadVoices;
function say(text,opts={}){
 message.textContent=text; messageTimer=180;
 if(!A.sfxOn||!('speechSynthesis' in window))return;
 const now=Date.now();
 if(text===lastSayText&&now-lastSay<1600)return;
 if(now-lastSay<450)return;
 lastSay=now; lastSayText=text;
 try{
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  const ru=voices.find(v=>/ru/i.test(v.lang));
  if(ru)u.voice=ru;
  u.lang='ru-RU'; u.rate=opts.rate||1.05; u.pitch=opts.pitch||1.15; u.volume=opts.volume||.95;
  speechSynthesis.speak(u);
 }catch(e){}
}
const VOICE={hero:{pitch:1.35,rate:1.1},fox:{pitch:.8,rate:.95},rat:{pitch:1.7,rate:1.25},narr:{pitch:1,rate:1}};

/* --- ЛЁГКАЯ ПРОЦЕДУРНАЯ МУЗЫКА --- */
const MUS={timer:null,step:0,next:0,cfg:null};
function tone(f,t,dur,type,vol,echo){
 if(!A.ctx)return;
 const o=A.ctx.createOscillator(),g=A.ctx.createGain(),lp=A.ctx.createBiquadFilter();
 lp.type='lowpass'; lp.frequency.value=2600;
 o.type=type; o.frequency.setValueAtTime(f,t);
 g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02);
 g.gain.exponentialRampToValueAtTime(.0006,t+dur);
 o.connect(lp); lp.connect(g); g.connect(A.mus); if(echo&&A.delay)g.connect(A.delay);
 o.start(t); o.stop(t+dur+.05);
}
function pad(root,t,dur,cfg){
 if(!A.ctx)return;
 const map={warm:[0,4,7],cold:[0,3,7],murky:[0,3,6],dark:[0,3,7],water:[0,5,9]};
 const iv=map[cfg.pad]||[0,4,7];
 iv.forEach((semi,i)=>{
  const o=A.ctx.createOscillator(),g=A.ctx.createGain(),lp=A.ctx.createBiquadFilter();
  lp.type='lowpass'; lp.frequency.value=900;
  o.type=cfg.pad==='water'?'sine':'triangle';
  o.frequency.value=root*Math.pow(2,semi/12); o.detune.value=(i-1)*7;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.035,t+dur*.35); g.gain.linearRampToValueAtTime(0,t+dur);
  o.connect(lp); lp.connect(g); g.connect(A.mus); o.start(t); o.stop(t+dur+.1);
 });
}
function kick(t,v=1){ if(!A.ctx)return; const o=A.ctx.createOscillator(),g=A.ctx.createGain();
 o.type='sine'; o.frequency.setValueAtTime(110,t); o.frequency.exponentialRampToValueAtTime(42,t+.14);
 g.gain.setValueAtTime(.16*v,t); g.gain.exponentialRampToValueAtTime(.0008,t+.16);
 o.connect(g); g.connect(A.mus); o.start(t); o.stop(t+.18); }
function hat(t,v=.05){ noiseHit(t,.05,'highpass',6500,v,A.mus); }
function musicStep(step,t,cfg){
 const sc=SCALES[cfg.scale],mel=MEL[cfg.mel],spb=60/cfg.tempo/2;
 const deg=mel[step%mel.length];
 if(deg>=0){
  const semi=sc[deg%sc.length]+12*Math.floor(deg/sc.length);
  tone(cfg.root*Math.pow(2,semi/12),t,spb*1.7,cfg.wave,cfg.wave==='sawtooth'||cfg.wave==='square'?.045:.075,cfg.echo);
 }
 if(step%4===0){
  const prog=[0,5,3,4],bd=prog[Math.floor(step/8)%prog.length];
  tone(cfg.root/2*Math.pow(2,sc[bd%sc.length]/12),t,spb*3.4,'sine',.1);
 }
 if(step%16===0&&cfg.pad) pad(cfg.root/2,t,spb*15.5,cfg);
 if(cfg.drums!=='none'){
  if(step%8===0)kick(t);
  if(step%4===2)hat(t,.035);
  if(cfg.drums==='kick'&&step%8===4)kick(t,.6);
 }
 if(cfg.pad==='water'&&step%6===3) tone(cfg.root*4,t,.25,'sine',.03,true);
}
function musicTick(){
 if(!A.ctx||!MUS.cfg)return;
 const spb=60/MUS.cfg.tempo/2;
 while(MUS.next<A.ctx.currentTime+.5){ musicStep(MUS.step,MUS.next,MUS.cfg); MUS.step++; MUS.next+=spb; }
}
function musicStart(){
 A.resume(); if(!A.ctx)return;
 MUS.cfg=bossBattle?BOSS_MUSIC:worlds[world].music;
 MUS.step=0; MUS.next=A.ctx.currentTime+.12;
 A.mus.gain.cancelScheduledValues(A.ctx.currentTime);
 A.mus.gain.setValueAtTime(A.mus.gain.value,A.ctx.currentTime);
 A.mus.gain.linearRampToValueAtTime(A.musicOn?.5:0,A.ctx.currentTime+1.2);

function grad(c,x,y,r,c1,c2){const g=c.createRadialGradient(x-r*.35,y-r*.45,r*.08,x,y,r*1.05);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;}
function ink(c,w=3){c.strokeStyle='#0d0d12';c.lineWidth=w;c.stroke();}
function blob(c,x,y,rx,ry,c1,c2,lw=3){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fillStyle=grad(c,x,y,Math.max(rx,ry),c1,c2);c.fill();ink(c,lw);}
function tri(c,x1,y1,x2,y2,x3,y3,fill,lw=3){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineTo(x3,y3);c.closePath();c.fillStyle=fill;c.fill();ink(c,lw);}
function eye(c,x,y,r,lx,ly,blink,white='#fff',pupil='#141420'){
 if(blink){c.strokeStyle='#0d0d12';c.lineWidth=Math.max(2,r*.55);c.beginPath();c.moveTo(x-r,y);c.quadraticCurveTo(x,y+r*.5,x+r,y);c.stroke();return;}
 c.beginPath();c.ellipse(x,y,r,r*1.15,0,0,TAU);c.fillStyle=white;c.fill();ink(c,Math.max(1.4,r*.34));
 c.beginPath();c.arc(x+lx*r*.34,y+ly*r*.3,r*.5,0,TAU);c.fillStyle=pupil;c.fill();
 c.beginPath();c.arc(x+lx*r*.34-r*.22,y+ly*r*.3-r*.26,r*.19,0,TAU);c.fillStyle='#fff';c.fill();
}
function drawShadow(c,x,y,w,h,a=.3){c.save();c.fillStyle=`rgba(0,0,0,${a})`;c.beginPath();c.ellipse(x,y,w,h,0,0,TAU);c.fill();c.restore();}
function entShadow(c,x,y,w){const k=clamp((GROUND_Y-y)/220,0,1);drawShadow(c,x,GROUND_Y+6,w*(1-k*.45),w*.3*(1-k*.45),.33*(1-k*.55));}
function drawHatching(c,x,y,w,h,color='#000',alpha=.18,sp=5){
 c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.globalAlpha=alpha;c.strokeStyle=color;c.lineWidth=1;
 for(let i=-h;i<w+h;i+=sp){c.beginPath();c.moveTo(x+i,y);c.lineTo(x+i-h,y+h);c.stroke();}
 c.restore();
}
function initAnim(o){o.t=rnd(0,120);o.blink=0;o.sq=1;o.st=1;o.walk=0;return o;}
function tickAnim(o,moving,sp=.3){
 o.t=(o.t||0)+1;
 if(o.blink>0)o.blink--; else if(Math.random()<.006)o.blink=8;
 o.sq+=(1-(o.sq||1))*.18; o.st+=(1-(o.st||1))*.18;
 if(moving)o.walk=(o.walk||0)+sp;
}

function makeWeather(){
 weather=[]; const type=worlds[world].weather; if(type==='none')return;
 const n=type==='rain'?150:type==='bubbles'?55:70;
 for(let i=0;i<n;i++)weather.push({x:rnd(0,W),y:rnd(0,H),s:rnd(.5,1.6),a:rnd(0,TAU),sp:rnd(.6,1.6),type});
}
function updateWeather(){
 for(const p of weather){
  if(p.type==='rain'){p.y+=12*p.sp;p.x-=3*p.sp;}
  else if(p.type==='leaves'){p.y+=1.3*p.sp;p.x+=Math.sin(frame*.03+p.a)*1.2-.4;p.a+=.05;}
  else if(p.type==='ash'){p.y+=.9*p.sp;p.x+=Math.sin(frame*.02+p.a)*.6;}
  else if(p.type==='dust'){p.y+=Math.sin(frame*.02+p.a)*.3;p.x-=.4*p.sp;}
  else if(p.type==='sparks'){p.y-=1.5*p.sp;p.x+=Math.sin(frame*.05+p.a)*.8;}
  else if(p.type==='bubbles'){p.y-=1.1*p.sp;p.x+=Math.sin(frame*.04+p.a)*.7;}
  if(p.y>H+20){p.y=-20;p.x=rnd(0,W);} if(p.y<-30){p.y=H+10;p.x=rnd(0,W);}
  if(p.x<-30)p.x=W+20; if(p.x>W+30)p.x=-20;
 }
}

 for(const p of weather){

  else if(p.type==='leaves'){c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=['#d98a2b','#c96a1e','#e8b23c'][Math.floor(p.s*2)%3];c.globalAlpha=.85;c.beginPath();c.ellipse(0,0,6*p.s,3*p.s,0,0,TAU);c.fill();}
  else if(p.type==='ash'){c.fillStyle='rgba(90,80,80,.6)';c.beginPath();c.arc(p.x,p.y,2*p.s,0,TAU);c.fill();}
  else if(p.type==='dust'){c.fillStyle='rgba(230,220,190,.35)';c.beginPath();c.arc(p.x,p.y,2.2*p.s,0,TAU);c.fill();}

 }

const ENEMY_DRAW={rabbit:drawRabbit,wolf:drawWolf,bear:drawBearEnemy,fox:drawFox,frog:drawFrog,troll:drawTroll,skeleton:drawSkeleton,dragon:drawDragon,goblin:drawGoblin,fire:drawFire};
function draw(){
 ctx.clearRect(0,0,W,H);
 ctx.save();
 if(shakeTime>0){ctx.translate(rnd(-shakeAmp,shakeAmp),rnd(-shakeAmp,shakeAmp));shakeTime--;shakeAmp*=.88;}
 drawBackground(ctx);
 for(const p of platforms)drawPlatform3D(ctx,p);
 drawHut(ctx);
 drawStars(ctx);drawPickups(ctx);
 for(const g of gopniks)drawGopnik(ctx,g);
 const ed=ENEMY_DRAW[worlds[world].enemy]||drawRabbit;
 for(const e of enemies){if(!e.alive)continue;const x=e.x-camera;if(x<-90||x>W+90)continue;ed(ctx,e);}
 for(const w of witches)drawWitch(ctx,w);
 for(const l of lizards)drawLizard(ctx,l);
 for(const b of bears)drawBear(ctx,b);
 for(const m of mermaids){if(m.alive&&Math.abs(m.x-camera-W/2)<W)drawMermaid(ctx,m);}
 for(const s of sharks){if(s.alive&&Math.abs(s.x-camera-W/2)<W)drawShark(ctx,s);}
 for(const t of trees){if(t.alive&&Math.abs(t.x-camera-W/2)<W)drawTreeMonster(ctx,t);}
 drawBoss(ctx);
 drawBullets(ctx);
 drawParticles(ctx);
 drawRat(ctx);
 drawPlayer(ctx);
 drawFloatingTexts(ctx);
 drawWeather(ctx);
 drawForeground(ctx);
 ctx.restore();
 drawComicFrame(ctx);
 drawLevelBanner(ctx);
 drawOverlay(ctx);
}

/* ================= СОХРАНЕНИЯ ================= */
function saveProgress(){
 try{localStorage.setItem(SAVE_KEY,JSON.stringify({version:9,world,totalStars,lastSafeX,currentWeapon,
  musicOn:A.musicOn,sfxOn:A.sfxOn,
  player:{x:player.x,y:player.y,health:player.health,facing:player.facing},bossBattle,gameOver,victory}));}catch(e){}
}
function loadProgress(){
 try{
  const raw=localStorage.getItem(SAVE_KEY); if(!raw)return false;
  const d=JSON.parse(raw);
  if(!d||d.version!==9||!Number.isInteger(d.world)||d.world<0||d.world>=TOTAL_LEVELS)return false;
  world=d.world;totalStars=Math.max(0,Number(d.totalStars)||0);lastSafeX=Number(d.lastSafeX)||70;
  if(['minigun','shotgun','ak47'].includes(d.currentWeapon))currentWeapon=d.currentWeapon;
  A.musicOn=d.musicOn!==false;A.sfxOn=d.sfxOn!==false;
  makeLevel();
  if(d.player){
   player.x=clamp(Number(d.player.x)||70,19,LEVEL_WIDTH-20);
   player.y=clamp(Number(d.player.y)||GROUND_Y-19,30,GROUND_Y-5);
   player.health=clamp(Number(d.player.health)||3,1,3);
   player.facing=d.player.facing===-1?-1:1;player.vx=0;player.vy=0;player.invincible=0;
  }
  bossBattle=d.bossBattle===true;gameOver=d.gameOver===true;victory=d.victory===true;
  camera=clamp(player.x-W*.38,0,LEVEL_WIDTH-W);
  updateInfo();syncUI();return true;
 }catch(e){return false;}
}
function deleteSave(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function syncUI(){
 document.querySelectorAll('.weapon-btn').forEach(b=>b.classList.toggle('active',b.dataset.weapon===currentWeapon));
 document.getElementById('shoot').textContent=currentWeapon==='minigun'?'💥':'🔫';
 document.getElementById('btn-music').classList.toggle('off',!A.musicOn);
 document.getElementById('btn-sfx').classList.toggle('off',!A.sfxOn);
 document.getElementById('btn-sfx').textContent=A.sfxOn?'🔊':'🔇';
}

/* ================= ДЕЙСТВИЯ ================= */
function jump(){
 if(gameOver||victory||isTransitioning)return;
 if(world===10){player.vy=-3.5;player.onGround=false;SFX.jump();spawnParticles(player.x,player.y+player.r,'rgba(255,255,255,.6)',6,3,2,.02);return;}
 if(player.onGround||player.jumpsLeft>0){
  player.vy=player.onGround?-11:-9;player.onGround=false;player.jumpsLeft--;
  player.sq=.78;player.st=1.28;SFX.jump();spawnDust(player.x,player.y+player.r,7);
 }
}
function dash(){
 if(gameOver||victory||isTransitioning)return;
 if(playerDashCooldown<=0){
  playerDashing=15;playerDashCooldown=45;player.vx=player.facing*(world===10?8:12);
  player.sq=1.25;player.st=.8;SFX.dash();spawnParticles(player.x,player.y,'#c158dc',10,5,3);
 }
}
function startShoot(){
 if(gameOver||victory||isTransitioning)return;
 isHoldingShoot=true;
 if(currentWeapon==='shotgun')shootShotgun();
 else if(!minigunInterval){shootAuto();minigunInterval=setInterval(shootAuto,currentWeapon==='minigun'?80:100);}
}
function stopShoot(){isHoldingShoot=false;if(minigunInterval){clearInterval(minigunInterval);minigunInterval=null;}}
function shootShotgun(){
 const now=Date.now(); if(now-(player.lastShot||0)<260)return; player.lastShot=now;
 for(let i=-1;i<=1;i++)bullets.push({x:player.x+player.facing*25,y:player.y-7,vx:player.facing*8,vy:i*1.1,life:70});
 soundShoot();triggerShake(4,5);player.sq=1.12;player.st=.9;
 spawnParticles(player.x+player.facing*30,player.y-7,'#fff0a0',7,5,2);
}
function shootAuto(){
 if(gameOver||victory){stopShoot();return;}
 const now=Date.now(); if(now-(player.lastShot||0)<50)return; player.lastShot=now;
 if(currentWeapon==='minigun'){
  bullets.push({x:player.x+player.facing*30,y:player.y-7+rnd(-3,3),vx:player.facing*11,vy:rnd(-.4,.4),life:100});
  triggerShake(1.5,3);spawnParticles(player.x+player.facing*32,player.y-7,'#ffcc00',2,3,1);
 }else{
  bullets.push({x:player.x+player.facing*35,y:player.y-7,vx:player.facing*13,vy:0,life:100});
  triggerShake(2.5,4);spawnParticles(player.x+player.facing*36,player.y-7,'#ffaa00',3,4,2);
 }
 player.sq=1.07;player.st=.95;soundShoot();
}
function hurtPlayer(){
 if(player.invincible>0||gameOver||victory||isTransitioning)return;
 player.health--;player.invincible=90;player.vy=-6;player.vx=-player.facing*3;
 player.sq=1.3;player.st=.72;triggerShake(12,15);hitFlash=16;
 SFX.hurt();spawnParticles(player.x,player.y,'#ff4444',16,6,3);
 updateInfo();say('Ой-ой-ой!',VOICE.hero);
 if(player.health<=0){gameOver=true;stopShoot();musicStop();say('Колобок, попробуй ещё раз!',VOICE.narr);}
 saveProgress();
}
function respawnFromGap(){
 player.x=lastSafeX;player.y=GROUND_Y-19;player.vx=0;player.vy=0;player.invincible=90;
 triggerShake(14,18);stopShoot();hurtPlayer();
 if(!gameOver)say('Осторожно, обрыв!',VOICE.hero);
}
function killReward(x,y,stars_=1,line='Ай!'){
 spawnExplosion(x,y);totalStars+=stars_;SFX.kill();
 if(line)say(line,VOICE.hero);updateInfo();saveProgress();
}

/* ================= ОБНОВЛЕНИЯ ================= */
function updatePlayer(){
 if(isTransitioning)return;
 const moving=(keys.left||keys.right)&&player.onGround;
 tickAnim(player,moving,.35);
 if(playerDashCooldown>0){playerDashCooldown--;document.getElementById('dash').classList.add('cool');}
 else document.getElementById('dash').classList.remove('cool');
 if(playerDashing>0){playerDashing--;player.x+=player.vx;if(frame%3===0)spawnParticles(player.x,player.y+8,'rgba(180,80,220,.55)',2,2,4,.02);}
 else{
  let mv=false;
  if(keys.left){player.vx=-player.speed;player.facing=-1;mv=true;}
  if(keys.right){player.vx=player.speed;player.facing=1;mv=true;}
  if(!mv)player.vx*=.78;
  player.x+=player.vx;
  if(mv&&frame%8===0)spawnDust(player.x-player.facing*10,player.y+player.r,2);
 }
 player.vy+=getGravity();
 if(world===10){if(player.vy>4)player.vy=4;if(keys.up||isHoldingShoot)player.vy-=.4;}
 player.y+=player.vy;
 const overGap=isOverGap(player.x);
 if(world===10){
  if(player.y>H-player.r){if(player.vy>2){player.sq=1.2;player.st=.8;spawnParticles(player.x,H-player.r,'#fff',6,3,2,.02);}player.y=H-player.r;player.vy=0;}
  if(player.y<player.r){player.y=player.r;player.vy=0;}
  player.onGround=false;player.jumpsLeft=player.maxJumps;
 }else{
  if(player.y>H+40){respawnFromGap();return;}
  if(!overGap&&player.y+player.r>=GROUND_Y){
   if(player.vy>3.5){player.sq=1.24;player.st=.78;SFX.land();spawnDust(player.x,GROUND_Y,7);}
   player.y=GROUND_Y-player.r;player.vy=0;player.onGround=true;player.jumpsLeft=player.maxJumps;lastSafeX=player.x;
  }else if(player.y+player.r<GROUND_Y)player.onGround=false;
  for(const p of platforms){
   if(player.vy>=0&&player.x+player.r>p.x&&player.x-player.r<p.x+p.w&&player.y+player.r>=p.y&&player.y+player.r<=p.y+15){
    if(player.vy>3.5){player.sq=1.22;player.st=.8;SFX.land();spawnDust(player.x,p.y,6);}
    player.y=p.y-player.r;player.vy=0;player.onGround=true;player.jumpsLeft=player.maxJumps;lastSafeX=player.x;
   }
  }
 }
 player.x=clamp(player.x,player.r,LEVEL_WIDTH-20);
 if(player.invincible>0)player.invincible--;
 camera=clamp(player.x-W*.38,0,LEVEL_WIDTH-W);
}
function updateRat(){
 if(!rat||!rat.alive)return;
 const dist=player.x-rat.x,ad=Math.abs(dist);
 tickAnim(rat,Math.abs(rat.vx)>.4,.4);
 if(ad>60){rat.vx=Math.sign(dist)*3.5;rat.facing=Math.sign(dist)||1;}
 else if(ad<40){rat.vx=-Math.sign(dist)*1.5;rat.facing=Math.sign(dist)||1;}
 else rat.vx*=.8;
 rat.vy+=getGravity();rat.x+=rat.vx;rat.y+=rat.vy;
 rat.onGround=false;
 if(rat.y+rat.r>=GROUND_Y){rat.y=GROUND_Y-rat.r;rat.vy=0;rat.onGround=true;}
 for(const p of platforms)
  if(rat.vy>=0&&rat.x+rat.r>p.x&&rat.x-rat.r<p.x+p.w&&rat.y+rat.r>=p.y&&rat.y+rat.r<=p.y+15){rat.y=p.y-rat.r;rat.vy=0;rat.onGround=true;}
 if(rat.onGround&&ad>60){
  const cx=rat.x+rat.facing*40;
  if(gaps.some(g=>cx>g.x&&cx<g.x+g.w)){rat.vy=-10;rat.onGround=false;rat.st=1.2;rat.sq=.85;}
  for(const p of platforms)if(cx>p.x&&cx<p.x+p.w&&rat.y>p.y&&rat.y<p.y+p.h+20){rat.vy=-9;rat.onGround=false;}
 }
 rat.x=clamp(rat.x,20,LEVEL_WIDTH-20);
 if(rat.y>H+50){rat.x=player.x-60;rat.y=GROUND_Y-10;rat.vy=0;}
 rat.shootTimer--;
 if(rat.shootTimer<=0){
  let target=null,md=400;
  for(const e of enemies)if(e.alive){const d=Math.abs(player.x-e.x);if(d<md){md=d;target=e;}}
  for(const g of gopniks)if(g.alive){const d=Math.abs(player.x-g.x);if(d<md){md=d;target=g;}}
  for(const b of bears)if(b.alive){const d=Math.abs(player.x-b.x);if(d<md){md=d;target=b;}}
  if(target){
   const dx=target.x-rat.x,dy=target.y-rat.y,len=Math.hypot(dx,dy)||1;
   bullets.push({x:rat.x,y:rat.y-5,vx:dx/len*10,vy:dy/len*10,life:90});
   sound(880,.05,'sine',.05);rat.shootTimer=60;rat.sq=1.15;rat.st=.9;
  }else rat.shootTimer=30;
 }
}
function updateEnemies(){
 for(const e of enemies){
  if(!e.alive)continue;
  tickAnim(e,Math.abs(e.vx)>.2,.32);
  e.jumpTimer--;
  const dist=player.x-e.x;
  if(e.jumpTimer<=0&&e.onGround){e.vy=-(7+(world%4)*.5);e.onGround=false;e.jumpTimer=95+Math.random()*85;e.sq=.8;e.st=1.25;}
  if(Math.abs(dist)<230){e.vx+=Math.sign(dist)*.025;e.vx=clamp(e.vx,-2-(world%4)*.2,2+(world%4)*.2);}
  else{if(e.x<e.min)e.vx=Math.abs(e.vx);if(e.x>e.max)e.vx=-Math.abs(e.vx);}
  e.x+=e.vx;e.y+=e.vy;e.vy+=getGravity();
  if(e.y>=GROUND_Y-20){
   if(e.vy>4){e.sq=1.2;e.st=.8;spawnDust(e.x,GROUND_Y,3);}
   e.y=GROUND_Y-20;e.vy=0;e.onGround=true;
  }
  if(Math.abs(player.x-e.x)<35&&Math.abs(player.y-e.y)<35){
   if(player.vy>0&&player.y<e.y-10){e.alive=false;player.vy=-10;player.sq=1.2;player.st=.8;killReward(e.x,e.y,1,'Ай!');}
   else hurtPlayer();
  }
 }
}
function updateGopniks(){
 for(const g of gopniks){
  if(!g.alive)continue;
  const dist=player.x-g.x;
  tickAnim(g,Math.abs(g.vx)>.2,.25);
  g.facing=Math.sign(dist)||g.facing||1;
  if(Math.abs(dist)<300){
   g.vx=Math.abs(dist)>100?Math.sign(dist)*.8:0;
   g.shootTimer--;
   if(g.shootTimer<=0){
    const dx=player.x-g.x,dy=player.y-(g.y-20),len=Math.hypot(dx,dy)||1;
    enemyBullets.push({x:g.x,y:g.y-20,vx:dx/len*4,vy:dy/len*4,angle:Math.atan2(dy,dx),life:120,isSeed:true});
    g.shootTimer=100+Math.random()*50;sound(620,.05,'square',.05);g.sq=1.1;g.st=.94;
   }
  }else{if(g.x<g.min)g.vx=Math.abs(g.vx)||.8;if(g.x>g.max)g.vx=-Math.abs(g.vx)||-.8;}
  g.x+=g.vx;
  if(Math.abs(player.x-g.x)<35&&Math.abs(player.y-g.y)<35){
   if(player.vy>0&&player.y<g.y-10){g.alive=false;player.vy=-10;killReward(g.x,g.y,1,'А семки есть?');}
   else hurtPlayer();
  }
 }
}
function updateLizards(){
 for(const l of lizards){
  if(!l.alive)continue;
  tickAnim(l,Math.abs(l.vx)>.4,.45);
  l.dashTimer--;
  const dist=player.x-l.x;
  if(l.dashTimer<=0&&l.onGround&&Math.abs(dist)<260){
   l.vx=Math.sign(dist)*(3.2+(world%4)*.2);l.facing=Math.sign(dist)||1;l.dashTimer=160+Math.random()*80;
   l.sq=1.2;l.st=.85;sound(430,.06,'square',.06);
  }else if(l.dashTimer>0)l.vx*=.93;
  else{l.vx=l.facing*l.speed;if(l.x<80)l.facing=1;if(l.x>LEVEL_WIDTH-80)l.facing=-1;}
  l.x+=l.vx;l.y+=l.vy;l.vy+=getGravity();
  if(l.y>=GROUND_Y-15){l.y=GROUND_Y-15;l.vy=0;l.onGround=true;}else l.onGround=false;
  if(Math.abs(player.x-l.x)<35&&Math.abs(player.y-l.y)<35){
   if(player.vy>0&&player.y<l.y-10){l.alive=false;player.vy=-10;killReward(l.x,l.y,1,'Ай!');}
   else hurtPlayer();
  }
 }
}
function updateBears(){
 for(const b of bears){
  if(!b.alive)continue;
  if(b.hurtFlash>0)b.hurtFlash--;
  const dist=player.x-b.x;b.facing=Math.sign(dist)||1;

  if(b.y>=GROUND_Y-30){b.y=GROUND_Y-30;b.vy=0;b.onGround=true;}

   const dx=player.x-b.x,dy=player.y-(b.y-30),len=Math.hypot(dx,dy)||1;
   enemyBullets.push({x:b.x,y:b.y-30,vx:dx/len*3.2,vy:dy/len*3.2-1.2,angle:Math.atan2(dy,dx),life:180,grav:.08});

   if(player.vy>0&&player.y<b.y-15){

  t.shootTimer--;
  if(t.shootTimer<=0){
   const dx=player.x-t.x,dy=player.y-(t.y-50),len=Math.hypot(dx,dy)||1;
   enemyBullets.push({x:t.x,y:t.y-50,vx:dx/len*3.5,vy:dy/len*3.5-3,angle:Math.atan2(dy,dx),life:150,isGreen:true,grav:.06});
   t.shootTimer=120+Math.random()*60;sound(150,.1,'sawtooth',.08);t.sq=1.12;t.st=.9;
  }
  if(Math.abs(player.x-t.x)<40&&Math.abs(player.y-t.y)<40)hurtPlayer();
 }
}
function updateBoss(){
 if(!boss||!boss.isBossLevel)return;
 if(!bossBattle&&player.x>1950&&boss.alive){
  bossBattle=true;say('Лиса! Вот это сюрприз!',VOICE.fox);musicStart();triggerShake(8,14);saveProgress();
 }
 if(!bossBattle||!boss.alive)return;
 tickAnim(boss,Math.abs(boss.vx)>.1,.2);
 if(boss.hurtFlash>0)boss.hurtFlash--;
 const dist=player.x-boss.x;
 boss.facing=Math.sign(dist)||1;
 boss.vx=Math.abs(dist)>70?Math.sign(dist)*1.1:0;
 boss.x+=boss.vx;boss.jumpTimer--;
 if(boss.jumpTimer<=0&&boss.y>=GROUND_Y-45){boss.vy=-8.5;boss.jumpTimer=100;boss.sq=.85;boss.st=1.2;}
 boss.y+=boss.vy;boss.vy+=getGravity();
 if(boss.y>GROUND_Y-45){if(boss.vy>4){boss.sq=1.15;boss.st=.85;spawnDust(boss.x,GROUND_Y,8);triggerShake(4,6);}boss.y=GROUND_Y-45;boss.vy=0;}
 boss.shootTimer--;
 if(boss.shootTimer<=0){
  const dx=player.x-boss.x,dy=(player.y-10)-(boss.y-10),len=Math.hypot(dx,dy)||1;
  enemyBullets.push({x:boss.x,y:boss.y-10,vx:dx/len*4.8,vy:dy/len*4.8,angle:Math.atan2(dy,dx),life:130});
  boss.shootTimer=85;sound(260,.1,'sawtooth',.09);
 }
 if(Math.abs(player.x-boss.x)<50&&Math.abs(player.y-boss.y)<50){
  if(player.vy>0&&player.y<boss.y-15){
   boss.hp--;boss.hurtFlash=14;player.vy=-10;SFX.hit();spawnParticles(boss.x,boss.y,'#ff5555',10,5,3);
   if(boss.hp<=0)defeatBoss();
   saveProgress();
  }else hurtPlayer();
 }
}
function defeatBoss(){
 boss.alive=false;spawnExplosion(boss.x,boss.y);totalStars+=10;
 say('Охохонюшки, Хо-Хо!',VOICE.fox);musicStart();updateInfo();saveProgress();
}
function updateBullets(){
 for(const b of bullets){
  b.x+=b.vx;b.y+=(b.vy||0);b.life--;
  for(const g of gopniks)if(g.alive&&Math.abs(b.x-g.x)<30&&Math.abs(b.y-g.y)<32){g.alive=false;b.life=0;killReward(g.x,g.y,1,'А семки есть?');}
  for(const e of enemies)if(e.alive&&Math.abs(b.x-e.x)<30&&Math.abs(b.y-e.y)<35){
   e.alive=false;b.life=0;
   if(Math.random()<.25)pickups.push({x:e.x,y:e.y-20,type:['apple','lightning','shield'][Math.floor(Math.random()*3)]});
   killReward(e.x,e.y,1,'Ай!');
  }
  for(const w of witches)if(w.alive&&Math.abs(b.x-w.x)<35&&Math.abs(b.y-w.y)<40){
   w.alive=false;b.life=0;
   if(Math.random()<.35)pickups.push({x:w.x,y:w.y,type:'apple'});
   killReward(w.x,w.y,2,'Ай!');
  }
  for(const l of lizards)if(l.alive&&Math.abs(b.x-l.x)<30&&Math.abs(b.y-l.y)<26){l.alive=false;b.life=0;killReward(l.x,l.y,1,'Ай!');}
  for(const br of bears)if(br.alive&&Math.abs(b.x-br.x)<32&&Math.abs(b.y-br.y)<34){
   br.hp--;br.hurtFlash=20;b.life=0;SFX.hit();spawnParticles(br.x,br.y,'#ff5555',5,4,2);
   if(br.hp<=0){br.alive=false;pickups.push({x:br.x,y:br.y-30,type:'shield'});killReward(br.x,br.y,5,'Ай!');}
   saveProgress();
  }
  for(const m of mermaids)if(m.alive&&Math.abs(b.x-m.x)<30&&Math.abs(b.y-m.y)<32){m.alive=false;b.life=0;killReward(m.x,m.y,2,'Ай!');}
  for(const s of sharks)if(s.alive&&Math.abs(b.x-s.x)<40&&Math.abs(b.y-s.y)<30){s.alive=false;b.life=0;killReward(s.x,s.y,2,'Ай!');}
  for(const t of trees)if(t.alive&&Math.abs(b.x-t.x)<40&&Math.abs(b.y-t.y)<50){
   t.hp--;b.life=0;spawnParticles(t.x,t.y,'#5cff5c',10,5,3);SFX.hit();t.sq=1.1;t.st=.92;
   if(t.hp<=0){t.alive=false;killReward(t.x,t.y,3,'Ай!');}
   saveProgress();
  }
  if(boss&&boss.isBossLevel&&bossBattle&&boss.alive&&Math.abs(b.x-boss.x)<45&&Math.abs(b.y-boss.y)<52){
   boss.hp--;boss.hurtFlash=12;b.life=0;SFX.hit();spawnParticles(boss.x,boss.y,'#ff5555',8,5,3);
   if(boss.hp<=0)defeatBoss();
   saveProgress();
  }
 }
 bullets=bullets.filter(b=>b.life>0&&b.x>-100&&b.x<LEVEL_WIDTH+100&&b.y<H+60&&b.y>-60);
 for(const b of enemyBullets){
  b.x+=b.vx;b.y+=b.vy;if(b.grav)b.vy+=b.grav;b.life--;
  b.angle=Math.atan2(b.vy,b.vx);
  if(Math.abs(b.x-player.x)<25&&Math.abs(b.y-player.y)<25){b.life=0;hurtPlayer();}
 }
 enemyBullets=enemyBullets.filter(b=>b.life>0&&b.y<H+80);
}
function updatePickups(){
 for(let i=pickups.length-1;i>=0;i--){
  const p=pickups[i];
  if(Math.abs(player.x-p.x)<32&&Math.abs(player.y-p.y)<34){
   if(p.type==='apple'){player.health=Math.min(3,player.health+1);addFloatingText(player.x-camera,player.y-44,'+1 ❤️','#ff6b6b');}
   else if(p.type==='lightning'){player.lastShot=Date.now()-300;playerDashCooldown=0;addFloatingText(player.x-camera,player.y-44,'БЫСТРО!','#4ac8ff');}
   else{player.invincible=200;addFloatingText(player.x-camera,player.y-44,'ЩИТ!','#7fe07f');}
   SFX.pickup();spawnParticles(p.x,p.y,'#fff6a0',10,4,2,.05);
   pickups.splice(i,1);updateInfo();saveProgress();
  }
 }
}
function updateStars(){
 for(const s of stars)if(!s.taken&&Math.abs(player.x-s.x)<32&&Math.abs(player.y-s.y)<42){
  s.taken=true;totalStars++;addFloatingText(player.x-camera,player.y-44,'+1 ⭐','#ffd700');
  spawnParticles(s.x,s.y,'#ffe45a',8,4,2,.05);SFX.star();updateInfo();saveProgress();
 }
}
function checkLevelEnd(){
 if(isTransitioning||gameOver||victory)return;
 const hutX=LEVEL_WIDTH-140;
 if(player.x>hutX+40&&player.x<hutX+90){
  if(boss&&boss.isBossLevel&&boss.alive){player.x=hutX+38;say('Сначала одолeй Лису!',VOICE.fox);return;}
  isTransitioning=true;stopShoot();
  say('В избушку!',VOICE.hero);sound(880,.3,'sine',.1);
  spawnParticles(player.x,player.y,'#fff',20,6,3,.02);
  setTimeout(()=>{
   if(world<TOTAL_LEVELS-1){
    world++;makeLevel();say('Мир '+(world+1)+': '+worlds[world].name,VOICE.narr);
    musicStart();saveProgress();isTransitioning=false;
   }else{
    victory=true;musicStop();say('Победа! Колобок спас лес!',VOICE.narr);saveProgress();isTransitioning=false;
   }
  },1000);
 }
 if(boss&&boss.isBossLevel&&bossBattle&&boss.alive&&player.x>2110)player.x=2110;
}
function update(){
 if(gameOver||victory){draw();gameLoopRunning=false;return;}
 frame++;
 updatePlayer();updateEnemies();updateWitches();updateLizards();updateBears();updateGopniks();
 updateMermaidsSharks();updateTrees();updateBoss();updateBullets();updateRat();
 updateStars();updatePickups();updateEffects();updateWeather();
 checkLevelEnd();updateInfo();draw();
 if(frame-lastSaveFrame>=90){saveProgress();lastSaveFrame=frame;}
 requestAnimationFrame(update);
}
function startGameLoop(){if(gameLoopRunning)return;gameLoopRunning=true;requestAnimationFrame(update);}

/* ================= УПРАВЛЕНИЕ ================= */
document.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp','Space'].includes(e.code))e.preventDefault();
 A.resume();
 if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=true;
 if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=true;
 if((e.code==='ArrowUp'||e.code==='Space'||e.code==='KeyW')&&!e.repeat)jump();
 if(e.code==='ArrowUp'||e.code==='KeyW')keys.up=true;
 if((e.code==='KeyJ'||e.code==='KeyF')&&!e.repeat)startShoot();
 if((e.code==='ShiftLeft'||e.code==='KeyK')&&!e.repeat)dash();
 if(e.code==='KeyM'&&!e.repeat)musicToggle();
});
document.addEventListener('keyup',e=>{
 if(e.code==='ArrowLeft'||e.code==='KeyA')keys.left=false;
 if(e.code==='ArrowRight'||e.code==='KeyD')keys.right=false;
 if(e.code==='ArrowUp'||e.code==='KeyW')keys.up=false;
 if(e.code==='KeyJ'||e.code==='KeyF')stopShoot();
});
function bindHold(id,key){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();A.resume();keys[key]=true;try{b.setPointerCapture(e.pointerId);}catch(x){}});
 const rel=e=>{e.preventDefault();keys[key]=false;};
 b.addEventListener('pointerup',rel);b.addEventListener('pointercancel',rel);
 b.addEventListener('lostpointercapture',()=>keys[key]=false);
 b.addEventListener('contextmenu',e=>e.preventDefault());
}
bindHold('left','left');bindHold('right','right');
function bindPress(id,down,up){
 const b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();A.resume();down();try{b.setPointerCapture(e.pointerId);}catch(x){}});
 const stop=e=>{e.preventDefault();if(up)up();};
 b.addEventListener('pointerup',stop);b.addEventListener('pointercancel',stop);b.addEventListener('lostpointercapture',stop);
 b.addEventListener('contextmenu',e=>e.preventDefault());
}
bindPress('shoot',startShoot,stopShoot);
bindPress('jump',()=>{jump();keys.up=true;},()=>keys.up=false);
bindPress('dash',dash);

/* ================= МЕНЮ ================= */
document.querySelectorAll('.weapon-btn').forEach(btn=>{
 btn.addEventListener('click',()=>{
  stopShoot();currentWeapon=btn.dataset.weapon;syncUI();A.resume();sound(700,.06,'triangle',.06);saveProgress();
 });
});
document.getElementById('btn-music').addEventListener('click',musicToggle);
document.getElementById('btn-sfx').addEventListener('click',sfxToggle);

const hasSave=loadProgress();
if(!hasSave){document.getElementById('btn-continue').style.display='none';makeLevel();}
syncUI();draw();

function enterGame(){
 A.resume();menuScreen.classList.add('hidden');musicStart();draw();startGameLoop();
}
document.getElementById('btn-continue').addEventListener('click',()=>{
 loadProgress();syncUI();enterGame();say('Продолжаем приключение!',VOICE.hero);
});
document.getElementById('btn-new').addEventListener('click',()=>{
 if(!confirm('Начать новую игру? Старое сохранение будет удалено.'))return;
 deleteSave();world=0;totalStars=0;gameOver=false;victory=false;frame=0;lastSaveFrame=0;keys={};
 makeLevel();enterGame();say('Новое приключение начинается!',VOICE.narr);saveProgress();
});
document.getElementById('restart').addEventListener('click',()=>{
 if(!confirm('Начать игру заново? Старое сохранение будет удалено.'))return;
 deleteSave();world=0;totalStars=0;gameOver=false;victory=false;frame=0;lastSaveFrame=0;keys={};
 stopShoot();makeLevel();A.resume();musicStart();say('Новое приключение начинается!',VOICE.narr);saveProgress();startGameLoop();
});

/* ================= ЗАЩИТА / ЖИЗНЕННЫЙ ЦИКЛ ================= */
document.addEventListener('contextmenu',e=>{if(e.target.tagName==='BUTTON'||e.target.tagName==='CANVAS')e.preventDefault();});
function pauseAudioKeys(){keys.left=keys.right=keys.up=false;stopShoot();saveProgress();}
window.addEventListener('blur',pauseAudioKeys);
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseAudioKeys();if(A.ctx&&A.ctx.state==='running')A.ctx.suspend();}else if(A.ctx){A.resume();}});
window.addEventListener('pagehide',saveProgress);
window.addEventListener('pointerdown',()=>A.resume(),{once:true});
</script>
