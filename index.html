<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Колобок: Большое приключение</title>
<style>
* {
  box-sizing: border-box;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
body {
  margin: 0;
  padding: 12px 12px 140px;
  background: #17283c;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
}
header {
  background: #263e59;
  padding: 12px;
  border-radius: 12px;
  margin-bottom: 10px;
}
h1 {
  margin: 4px 0 8px;
  font-size: 26px;
}
#info {
  font-size: 15px;
  color: #dcecff;
}
canvas {
  display: block;
  width: 100%;
  max-width: 900px;
  height: auto;
  margin: 10px auto;
  border: 4px solid white;
  border-radius: 8px;
  background: #8bd7f5;
  touch-action: none;
}
.controls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding: 0 14px;
  gap: 12px;
  pointer-events: none;
  z-index: 10;
}
.left-group,
.right-group {
  display: flex;
  gap: 12px;
  pointer-events: auto;
}
button {
  border: 0;
  border-radius: 50%;
  background: #f4cf43;
  color: #263238;
  font-size: 26px;
  font-weight: bold;
  box-shadow: 0 4px 0 #b28d20;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 74px;
  height: 74px;
  min-width: 74px;
}
button:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 #b28d20;
}
#jump {
  background: #4aa9ef;
  color: white;
  box-shadow: 0 4px 0 #2673ae;
  width: 84px;
  height: 84px;
  font-size: 18px;
}
#shoot {
  background: #e85b50;
  color: white;
  box-shadow: 0 4px 0 #a8322b;
  width: 84px;
  height: 84px;
  font-size: 18px;
}
#restart {
  position: fixed;
  top: 12px;
  right: 12px;
  z-index: 11;
  width: auto;
  height: auto;
  min-width: 0;
  border-radius: 14px;
  font-size: 14px;
  padding: 10px 14px;
  background: #f4cf43;
  color: #263238;
  box-shadow: 0 4px 0 #b28d20;
}
#message {
  min-height: 28px;
  font-size: 18px;
  font-weight: bold;
  color: #ffe77b;
  margin: 8px;
}
@media (max-height: 620px) {
  .left-group button,
  .right-group button { width: 64px; height: 64px; min-width: 64px; font-size: 22px; }
  #jump, #shoot { width: 72px; height: 72px; font-size: 16px; }
  body { padding-bottom: 120px; }
}
</style>
</head>
<body>

<header>
  <h1>🥯 Колобок: Большое приключение</h1>
  <div id="info">Мир 1: Лесная тропинка | Собирай звёзды и побеждай врагов!</div>
</header>

<canvas id="game" width="900" height="440"></canvas>

<div id="message">Вперёд, Колобок!</div>

<div class="controls">
  <div class="left-group">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <div class="right-group">
    <button id="jump">ПРЫЖОК</button>
    <button id="shoot">🔫 ОГОНЬ</button>
  </div>
</div>

<button id="restart">↻ ЗАНОВО</button>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");
const message = document.getElementById("message");

const W = canvas.width;
const H = canvas.height;
const LEVEL_WIDTH = 2400;
const GRAVITY = 0.65;
const GROUND_Y = 385;

const SAVE_KEY = "kolobok_adventure_save_v4";

const worlds = [
  {name:"Лесная тропинка", sky:"#8bd7f5", ground:"#55a84c", enemy:"🐰"},
  {name:"Волчий лес", sky:"#829ac5", ground:"#477b42", enemy:"🐺"},
  {name:"Медвежья поляна", sky:"#a6d5a0", ground:"#438b46", enemy:"🐻"},
  {name:"Лисья опушка", sky:"#ffc47b", ground:"#68a34b", enemy:"🦊"}
];

let world = 0;
let camera = 0;
let player;
let enemies = [];
let witches = [];
let lizards = [];
let bears = [];
let bullets = [];
let enemyBullets = [];
let stars = [];
let platforms = [];
let gaps = [];
let boss;
let bossBattle = false;
let gameOver = false;
let victory = false;
let totalStars = 0;
let frame = 0;
let keys = {};
let soundContext = null;
let lastSaveFrame = 0;
let lastSafeX = 70;

/* ===== СОХРАНЕНИЕ ===== */
function saveProgress() {
  try {
    const data = {
      version: 4,
      world: world,
      totalStars: totalStars,
      lastSafeX: lastSafeX,
      player: {
        x: player.x, y: player.y,
        health: player.health, facing: player.facing
      },
      enemies: enemies.map(e => ({
        x: e.x, y: e.y, vx: e.vx, vy: e.vy,
        alive: e.alive, jumpTimer: e.jumpTimer, onGround: e.onGround
      })),
      witches: witches.map(w => ({
        x: w.x, baseY: w.baseY, vx: w.vx,
        alive: w.alive, shootTimer: w.shootTimer, phase: w.phase
      })),
      lizards: lizards.map(l => ({
        x: l.x, y: l.y, vx: l.vx, vy: l.vy,
        alive: l.alive, dashTimer: l.dashTimer, onGround: l.onGround, facing: l.facing
      })),
      bears: bears.map(b => ({
        x: b.x, y: b.y, vx: b.vx, vy: b.vy,
        hp: b.hp, alive: b.alive, throwTimer: b.throwTimer, onGround: b.onGround, facing: b.facing
      })),
      stars: stars.map(s => s.taken),
      boss: {
        x: boss.x, y: boss.y, hp: boss.hp, alive: boss.alive,
        shootTimer: boss.shootTimer, jumpTimer: boss.jumpTimer
      },
      bossBattle: bossBattle,
      gameOver: gameOver,
      victory: victory
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (error) {
    console.warn("Не удалось сохранить игру:", error);
  }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || data.version !== 4) return false;
    if (!Number.isInteger(data.world) || data.world < 0 || data.world > 3) return false;

    world = data.world;
    totalStars = Math.max(0, Number(data.totalStars) || 0);
    lastSafeX = Number(data.lastSafeX) || 70;

    makeLevel();

    if (data.player) {
      player.x = Math.max(19, Math.min(LEVEL_WIDTH - 20, Number(data.player.x) || 70));
      player.y = Math.max(30, Math.min(GROUND_Y - 5, Number(data.player.y) || 330));
      player.health = Math.max(1, Math.min(3, Number(data.player.health) || 3));
      player.facing = data.player.facing === -1 ? -1 : 1;
      player.vx = 0;
      player.vy = 0;
      player.invincible = 0;
    }

    if (Array.isArray(data.enemies)) {
      data.enemies.forEach((saved, i) => {
        if (!enemies[i] || !saved) return;
        enemies[i].x = Number(saved.x) || enemies[i].x;
        enemies[i].y = Number(saved.y) || enemies[i].y;
        enemies[i].vx = Number(saved.vx) || enemies[i].vx;
        enemies[i].vy = Number(saved.vy) || 0;
        enemies[i].alive = saved.alive !== false;
        enemies[i].jumpTimer = Number(saved.jumpTimer) || 60;
        enemies[i].onGround = saved.onGround !== false;
      });
    }

    if (Array.isArray(data.witches)) {
      data.witches.forEach((saved, i) => {
        if (!witches[i] || !saved) return;
        witches[i].x = Number(saved.x) || witches[i].x;
        witches[i].baseY = Number(saved.baseY) || witches[i].baseY;
        witches[i].vx = Number(saved.vx) || witches[i].vx;
        witches[i].alive = saved.alive !== false;
        witches[i].shootTimer = Number(saved.shootTimer) || 120;
        witches[i].phase = Number(saved.phase) || 0;
      });
    }

    if (Array.isArray(data.lizards)) {
      data.lizards.forEach((saved, i) => {
        if (!lizards[i] || !saved) return;
        lizards[i].x = Number(saved.x) || lizards[i].x;
        lizards[i].y = Number(saved.y) || lizards[i].y;
        lizards[i].vx = Number(saved.vx) || lizards[i].vx;
        lizards[i].vy = Number(saved.vy) || 0;
        lizards[i].alive = saved.alive !== false;
        lizards[i].dashTimer = Number(saved.dashTimer) || 120;
        lizards[i].onGround = saved.onGround !== false;
        lizards[i].facing = saved.facing === -1 ? -1 : 1;
      });
    }

    if (Array.isArray(data.bears)) {
      data.bears.forEach((saved, i) => {
        if (!bears[i] || !saved) return;
        bears[i].x = Number(saved.x) || bears[i].x;
        bears[i].y = Number(saved.y) || bears[i].y;
        bears[i].vx = Number(saved.vx) || bears[i].vx;
        bears[i].vy = Number(saved.vy) || 0;
        bears[i].hp = Math.max(1, Math.min(3, Number(saved.hp) || 3));
        bears[i].alive = saved.alive !== false;
        bears[i].throwTimer = Number(saved.throwTimer) || 100;
        bears[i].onGround = saved.onGround !== false;
        bears[i].facing = saved.facing === -1 ? -1 : 1;
      });
    }

    if (Array.isArray(data.stars)) {
      data.stars.forEach((taken, i) => {
        if (stars[i]) stars[i].taken = taken === true;
      });
    }

    if (data.boss) {
      boss.x = Number(data.boss.x) || boss.x;
      boss.y = Number(data.boss.y) || boss.y;
      boss.hp = Math.max(0, Math.min(10, Number(data.boss.hp)));
      if (!Number.isFinite(boss.hp)) boss.hp = 10;
      boss.alive = data.boss.alive !== false && boss.hp > 0;
      boss.shootTimer = Number(data.boss.shootTimer) || 100;
      boss.jumpTimer = Number(data.boss.jumpTimer) || 90;
    }

    bossBattle = data.bossBattle === true;
    gameOver = data.gameOver === true;
    victory = data.victory === true;

    camera = Math.max(0, Math.min(LEVEL_WIDTH - W, player.x - W * 0.38));
    updateInfo();
    return true;
  } catch (error) {
    console.warn("Не удалось загрузить сохранение:", error);
    return false;
  }
}

function deleteSave() {
  try { localStorage.removeItem(SAVE_KEY); }
  catch (error) { console.warn("Не удалось удалить сохранение:", error); }
}

/* ===== ЗВУК И РЕЧЬ ===== */
function say(text) {
  message.textContent = text;
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "ru-RU";
    utterance.rate = 1;
    speechSynthesis.speak(utterance);
  }
}

function sound(freq=440, duration=0.1, type="square") {
  try {
    soundContext = soundContext || new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = soundContext.createOscillator();
    const gain = soundContext.createGain();
    oscillator.type = type;
    oscillator.frequency.value = freq;
    gain.gain.value = 0.07;
    oscillator.connect(gain);
    gain.connect(soundContext.destination);
    oscillator.start();
    gain.gain.exponentialRampToValueAtTime(0.001, soundContext.currentTime + duration);
    oscillator.stop(soundContext.currentTime + duration);
  } catch(e) {}
}

/* ===== УРОВЕНЬ ===== */
function makeLevel() {
  player = {
    x:70, y:330, vx:0, vy:0,
    r:19, speed:4.2, facing:1,
    onGround:false, health:3, invincible:0
  };
  lastSafeX = 70;

  camera = 0;
  bullets = [];
  enemyBullets = [];
  enemies = [];
  witches = [];
  lizards = [];
  bears = [];
  stars = [];
  platforms = [];
  gaps = [];
  bossBattle = false;

  gaps = [
    {x: 760,  w: 90},
    {x: 1450, w: 110},
    {x: 2050, w: 90}
  ];

  for (let i=0; i<5; i++) {
    const x = 390 + i*370;
    const overGap = gaps.some(g => x > g.x - 20 && x < g.x + g.w + 20);
    if (overGap) continue;

    enemies.push({
      x, y:350, vx:1.2 + world*0.18,
      vy:0, min:x-95, max:x+95,
      alive:true, onGround:false,
      jumpTimer:60 + i*27,
      hp:1
    });
  }

  if (world > 0) {
    witches.push({
      x: 650, baseY: 220, y: 220,
      vx: 1.6 + world*0.15,
      phase: Math.random()*Math.PI*2,
      shootTimer: 110,
      alive: true
    });
    witches.push({
      x: 1750, baseY: 200, y: 200,
      vx: -(1.4 + world*0.15),
      phase: Math.random()*Math.PI*2,
      shootTimer: 160,
      alive: true
    });
  }

  if (world > 0) {
    lizards.push({
      x: 1100, y: 350, vx: 1.8, vy: 0,
      alive: true, onGround: true, facing: 1,
      dashTimer: 140, speed: 1.8 + world*0.2
    });
    lizards.push({
      x: 1850, y: 350, vx: -1.8, vy: 0,
      alive: true, onGround: true, facing: -1,
      dashTimer: 200, speed: 1.8 + world*0.2
    });
  }

  if (world >= 2) {
    bears.push({
      x: 1350, y: 350, vx: 0.9, vy: 0,
      hp: 3, maxHp: 3, alive: true, onGround: true, facing: 1,
      throwTimer: 140, hurtFlash: 0
    });
  }

  platforms = [
    {x:260,y:310,w:120,h:16},
    {x:570,y:275,w:135,h:16},
    {x:900,y:305,w:140,h:16},
    {x:1250,y:270,w:150,h:16},
    {x:1590,y:305,w:130,h:16},
    {x:1900,y:275,w:150,h:16}
  ];

  for (let i=0; i<13; i++) {
    const sx = 240 + i*165;
    const overGap = gaps.some(g => sx > g.x - 10 && sx < g.x + g.w + 10);
    if (overGap) continue;
    stars.push({
      x: sx,
      y: i%2===0 ? 245 : 335,
      taken:false
    });
  }

  boss = {
    x:2180, y:335, vx:1.8, vy:0,
    hp:10, maxHp:10, alive:true,
    shootTimer:100, jumpTimer:90
  };

  updateInfo();
}

function updateInfo() {
  info.textContent =
    "Мир " + (world+1) + ": " + worlds[world].name +
    " | ⭐ " + totalStars +
    " | ❤️ " + (player ? player.health : 3);
}

/* ===== ПРОПАСТЬ ===== */
function isOverGap(x) {
  return gaps.some(g => x + player.r * 0.5 > g.x && x - player.r * 0.5 < g.x + g.w);
}

/* ===== ФОН ===== */
function drawCloud(x,y,scale=1) {
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  ctx.fillStyle="rgba(255,255,255,0.85)";
  ctx.beginPath();
  ctx.arc(0,10,20,0,Math.PI*2);
  ctx.arc(22,0,25,0,Math.PI*2);
  ctx.arc(48,12,19,0,Math.PI*2);
  ctx.arc(25,17,24,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawMountain(x,y,w,h,color) {
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x+w/2,y-h);
  ctx.lineTo(x+w,y);
  ctx.closePath();
  ctx.fill();
}

function drawTree(x,y,scale=1) {
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);
  ctx.fillStyle="#68452b";
  ctx.fillRect(-7,-55,14,58);
  ctx.fillStyle="#276b3c";
  ctx.beginPath();
  ctx.arc(0,-65,27,0,Math.PI*2);
  ctx.arc(-18,-48,19,0,Math.PI*2);
  ctx.arc(18,-48,19,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawBackground() {
  const theme = worlds[world];
  const gradient = ctx.createLinearGradient(0,0,0,H);
  gradient.addColorStop(0,theme.sky);
  gradient.addColorStop(1,"#e8f5d4");
  ctx.fillStyle=gradient;
  ctx.fillRect(0,0,W,H);

  for (let i=0;i<7;i++) {
    let x = ((i*190 - camera*0.12) % 1100 + 1100) % 1100 - 80;
    drawCloud(x,55+(i%3)*40,0.8+(i%2)*0.2);
  }

  for (let i=0;i<8;i++) {
    let x = i*180 - (camera*0.20 % 180);
    drawMountain(x,290,190,125,world===3?"#dba36c":"#83b5a0");
  }

  ctx.fillStyle=world===3?"#a8bd62":"#70ad68";
  ctx.beginPath();
  ctx.moveTo(0,350);
  for(let x=0;x<=W+20;x+=20) {
    const wx=x+camera*0.42;
    const y=325+Math.sin(wx*0.008)*20+Math.sin(wx*0.018)*9;
    ctx.lineTo(x,y);
  }
  ctx.lineTo(W,H);
  ctx.lineTo(0,H);
  ctx.fill();

  for(let i=0;i<13;i++) {
    let x=((i*125-camera*0.48)%1250+1250)%1250-100;
    drawTree(x,360,0.65);
  }

  ctx.fillStyle=world===3?"#598c39":"#347b3d";
  for(let i=0;i<18;i++) {
    let x=((i*85-camera*0.72)%1100+1100)%1100-70;
    ctx.beginPath();
    ctx.arc(x,382,24,Math.PI,0);
    ctx.fill();
  }

  const sorted = gaps.slice().sort((a,b)=>a.x-b.x);

  for (const g of sorted) {
    const gx = g.x - camera;
    if (gx + g.w < -50 || gx > W + 50) continue;

    const voidGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    voidGrad.addColorStop(0, "#0a0f0a");
    voidGrad.addColorStop(1, "#000000");
    ctx.fillStyle = voidGrad;
    ctx.fillRect(gx, GROUND_Y, g.w, H - GROUND_Y);

    ctx.fillStyle = "#000";
    ctx.fillRect(gx, GROUND_Y, 4, H - GROUND_Y);
    ctx.fillRect(gx + g.w - 4, GROUND_Y, 4, H - GROUND_Y);
  }

  let cursor = 0;
  for (const g of sorted) {
    if (g.x > cursor) {
      drawGroundSegment(cursor, g.x - cursor, theme);
    }
    cursor = g.x + g.w;
  }
  if (cursor < LEVEL_WIDTH) {
    drawGroundSegment(cursor, LEVEL_WIDTH - cursor, theme);
  }
}

function drawGroundSegment(startX, width, theme) {
  const sx = startX - camera;
  if (sx + width < -50 || sx > W + 50) return;

  ctx.fillStyle = theme.ground;
  ctx.fillRect(sx, GROUND_Y, width, H - GROUND_Y);

  ctx.fillStyle = "#7bd66a";
  ctx.fillRect(sx, GROUND_Y, width, 6);

  ctx.fillStyle = "#2e5c2a";
  ctx.fillRect(sx, GROUND_Y + 6, width, 4);

  const lowerGrad = ctx.createLinearGradient(0, GROUND_Y + 10, 0, H);
  lowerGrad.addColorStop(0, "rgba(0,0,0,0)");
  lowerGrad.addColorStop(1, "rgba(0,0,0,0.45)");
  ctx.fillStyle = lowerGrad;
  ctx.fillRect(sx, GROUND_Y + 10, width, H - GROUND_Y - 10);

  const sortedGaps = gaps.slice().sort((a,b)=>a.x-b.x);
  for (const g of sortedGaps) {
    if (Math.abs((g.x) - (startX + width)) < 1) {
      ctx.fillStyle = "#8b5a2b";
      ctx.fillRect(sx + width - 8, GROUND_Y, 8, H - GROUND_Y);
      ctx.fillStyle = "#c98a4b";
      ctx.fillRect(sx + width - 8, GROUND_Y, 8, 8);
    }
    if (Math.abs((g.x + g.w) - startX) < 1) {
      ctx.fillStyle = "#8b5a2b";
      ctx.fillRect(sx, GROUND_Y, 8, H - GROUND_Y);
      ctx.fillStyle = "#c98a4b";
      ctx.fillRect(sx, GROUND_Y, 8, 8);
    }
  }
}

/* ===== ОТРИСОВКА ===== */
function drawPlatforms() {
  for(const p of platforms) {
    const x=p.x-camera;
    if(x<-180 || x>W+180) continue;
    ctx.fillStyle="#80552f";
    ctx.fillRect(x,p.y,p.w,p.h);
    ctx.fillStyle="#55a84c";
    ctx.fillRect(x,p.y,p.w,5);
  }
}

function drawPlayer() {
  const x=player.x-camera;
  const y=player.y;
  if(player.invincible>0 && Math.floor(frame/5)%2===0) return;

  ctx.fillStyle="#4b3025";
  ctx.fillRect(x-12,y+11,10,12);
  ctx.fillRect(x+3,y+11,10,12);

  ctx.fillStyle="#70452c";
  ctx.beginPath();
  ctx.roundRect(x-17,y-5,34,25,8);
  ctx.fill();

  ctx.fillStyle="#e7a72f";
  ctx.beginPath();
  ctx.arc(x,y-9,19,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#a86a1e";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.fillStyle="#382719";
  ctx.beginPath();
  ctx.arc(x-6,y-12,2,0,Math.PI*2);
  ctx.arc(x+6,y-12,2,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#6b301b";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(x,y-5,6,0.15,Math.PI-0.15);
  ctx.stroke();

  ctx.save();
  ctx.translate(x,y-1);
  ctx.scale(player.facing,1);
  ctx.fillStyle="#49382b";
  ctx.fillRect(8,-5,27,5);
  ctx.fillStyle="#222";
  ctx.fillRect(27,-8,13,3);
  ctx.fillStyle="#a7a7a7";
  ctx.fillRect(34,-9,8,2);
  ctx.restore();
}

function drawEnemy(e) {
  const x=e.x-camera;
  if(x<-60 || x>W+60 || !e.alive) return;
  ctx.font="34px Arial";
  ctx.textAlign="center";
  ctx.fillText(worlds[world].enemy,x,e.y+5);
  if(Math.abs(e.vy)>1) {
    ctx.fillStyle="rgba(0,0,0,0.12)";
    ctx.beginPath();
    ctx.ellipse(x,GROUND_Y,17,4,0,0,Math.PI*2);
    ctx.fill();
  }
}

function drawLizard(l) {
  const x = l.x - camera;
  if (x < -70 || x > W + 70 || !l.alive) return;

  const f = l.facing;
  const bob = l.onGround && Math.abs(l.vx) > 0.3 ? Math.sin(frame*0.25) * 2 : 0;

  ctx.save();
  ctx.translate(x, l.y + bob);
  ctx.scale(f, 1);

  ctx.fillStyle = "#1f7a1f";
  ctx.beginPath();
  ctx.moveTo(-14, 4);
  ctx.quadraticCurveTo(-34, 10 + Math.sin(frame*0.2)*4, -38, -4);
  ctx.quadraticCurveTo(-30, 4, -12, 8);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#1f7a1f";
  ctx.fillRect(-10, 8, 9, 12);
  ctx.fillRect(2, 8, 9, 12);

  ctx.fillStyle = "#2ea82e";
  ctx.beginPath();
  ctx.ellipse(0, 0, 16, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#0f5c0f";
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(i*5 - 3, -10);
    ctx.lineTo(i*5, -19);
    ctx.lineTo(i*5 + 3, -10);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = "#35c235";
  ctx.beginPath();
  ctx.ellipse(14, -6, 11, 9, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#8ee88e";
  ctx.beginPath();
  ctx.ellipse(22, -4, 6, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(17, -8, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(18, -8, 1.8, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = "#0a4a0a";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(20, 0);
  ctx.lineTo(26, 0);
  ctx.stroke();

  ctx.restore();
}

function drawBear(b) {
  const x = b.x - camera;
  if (x < -80 || x > W + 80 || !b.alive) return;

  const f = b.facing;
  const flash = b.hurtFlash > 0 && Math.floor(frame/4) % 2 === 0;

  ctx.save();
  ctx.translate(x, b.y);
  ctx.scale(f, 1);

  ctx.fillStyle = flash ? "#ffd27a" : "#a86b1e";
  ctx.beginPath();
  ctx.ellipse(0, 0, 20, 22, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = flash ? "#fff0c0" : "#e8a53c";
  ctx.beginPath();
  ctx.ellipse(2, 4, 12, 15, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = flash ? "#ffd27a" : "#8a5416";
  ctx.beginPath();
  ctx.ellipse(-9, 20, 8, 6, 0, 0, Math.PI * 2);
  ctx.ellipse(10, 20, 8, 6, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = flash ? "#ffd27a" : "#b87522";
  ctx.beginPath();
  ctx.ellipse(0, -22, 15, 14, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(-12, -33, 6, 0, Math.PI * 2);
  ctx.arc(12, -33, 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = flash ? "#fff0c0" : "#e8a53c";
  ctx.beginPath();
  ctx.ellipse(8, -20, 9, 7, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#3a1f0a";
  ctx.beginPath();
  ctx.arc(15, -21, 3, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "white";
  ctx.beginPath();
  ctx.arc(4, -26, 3.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(5, -26, 1.8, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = "#3b2a17";
  ctx.beginPath();
  ctx.ellipse(0, -36, 20, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#4a3520";
  ctx.beginPath();
  ctx.roundRect(-11, -50, 22, 15, 4);
  ctx.fill();
  ctx.fillStyle = "#7a5a2b";
  ctx.fillRect(-11, -39, 22, 4);

  ctx.restore();

  if (b.hp < b.maxHp) {
    const hx = x - 20;
    const hy = b.y - 58;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(hx - 2, hy - 2, 44, 8);
    for (let i = 0; i < b.maxHp; i++) {
      ctx.fillStyle = i < b.hp ? "#e33" : "#444";
      ctx.fillRect(hx + i * 14, hy, 12, 4);
    }
  }
}

function drawWitch(w) {
  const x = w.x - camera;
  if (x < -80 || x > W + 80 || !w.alive) return;

  ctx.fillStyle = "#5a3a22";
  ctx.beginPath();
  ctx.ellipse(x, w.y + 22, 20, 26, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#3b2414";
  ctx.fillRect(x - 22, w.y + 4, 44, 6);

  ctx.strokeStyle = "#c9a26b";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(x + 12, w.y + 16);
  ctx.lineTo(x + 34, w.y - 6);
  ctx.stroke();
  ctx.fillStyle = "#d9b87c";
  ctx.beginPath();
  ctx.arc(x + 36, w.y - 8, 6, 0, Math.PI * 2);
  ctx.fill();

  ctx.font = "36px Arial";
  ctx.textAlign = "center";
  ctx.fillText("🧙‍♀️", x, w.y);

  ctx.fillStyle = "rgba(255,0,0,0.7)";
  ctx.beginPath();
  ctx.arc(x, w.y - 28, 3, 0, Math.PI * 2);
  ctx.fill();
}

function drawBoss() {
  if(world!==3 || !bossBattle || !boss.alive) return;
  const x=boss.x-camera;
  ctx.font="58px Arial";
  ctx.textAlign="center";
  ctx.fillText("🦊",x,boss.y+10);
  ctx.fillStyle="#381d1d";
  ctx.fillRect(x-32,boss.y-49,64,8);
  ctx.fillStyle="#e33";
  ctx.fillRect(x-32,boss.y-49,64*(boss.hp/boss.maxHp),8);
  ctx.fillStyle="white";
  ctx.font="13px Arial";
  ctx.fillText("БОСС",x,boss.y-55);
}

function drawBullets() {
  ctx.fillStyle="#292929";
  for(const b of bullets) {
    ctx.beginPath();
    ctx.arc(b.x-camera,b.y,5,0,Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle="#ffdb45";
  for(const b of enemyBullets) {
    ctx.save();
    ctx.translate(b.x-camera,b.y);
    ctx.rotate(b.angle || 0);
    if (b.rock) {
      ctx.fillStyle = "#8b5a2b";
      ctx.beginPath();
      ctx.arc(0, 0, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#5a3a1a";
      ctx.beginPath();
      ctx.arc(-2, -1, 2, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(-8,-3,16,6);
    }
    ctx.restore();
  }
}

function drawStars() {
  for(const s of stars) {
    if(s.taken) continue;
    const x=s.x-camera;
    if(x<-30 || x>W+30) continue;
    ctx.font="24px Arial";
    ctx.textAlign="center";
    ctx.fillText("⭐",x,s.y);
  }
}

function draw() {
  drawBackground();
  drawPlatforms();
  drawStars();
  for(const e of enemies) drawEnemy(e);
  for(const w of witches) drawWitch(w);
  for(const l of lizards) drawLizard(l);
  for(const b of bears) drawBear(b);
  drawBoss();
  drawBullets();
  drawPlayer();

  if(gameOver || victory) {
    ctx.fillStyle="rgba(0,0,0,0.58)";
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle="white";
    ctx.textAlign="center";
    ctx.font="bold 42px Arial";
    ctx.fillText(victory?"ПОБЕДА!":"ИГРА ОКОНЧЕНА",W/2,190);
    ctx.font="24px Arial";
    ctx.fillText(victory?"Колобок спас лес!":"Попробуй ещё раз!",W/2,235);
  }
}

/* ===== ДЕЙСТВИЯ ===== */
function jump() {
  if(gameOver || victory) return;
  if(player.onGround) {
    player.vy=-12.5;
    player.onGround=false;
    sound(520,0.08);
  }
}

function shoot() {
  if(gameOver || victory) return;
  const now=Date.now();
  if(now-(player.lastShot||0)<260) return;
  player.lastShot=now;
  bullets.push({
    x:player.x+player.facing*25,
    y:player.y-7,
    vx:player.facing*9,
    life:100
  });
  sound(180,0.07,"sawtooth");
}

function hurtPlayer() {
  if(player.invincible>0 || gameOver || victory) return;
  player.health--;
  player.invincible=90;
  player.vy=-6;
  player.vx=-player.facing*3;
  sound(100,0.2,"sawtooth");
  updateInfo();
  if(player.health<=0) {
    gameOver=true;
    say("Колобок, попробуй ещё раз!");
  }
  saveProgress();
}

function respawnFromGap() {
  player.x = lastSafeX;
  player.y = 330;
  player.vx = 0;
  player.vy = 0;
  player.invincible = 90;
  hurtPlayer();
  if (!gameOver) {
    say("Осторожно, обрыв!");
  }
}

function updatePlayer() {
  let moving=false;
  if(keys.left) {
    player.vx=-player.speed;
    player.facing=-1;
    moving=true;
  }
  if(keys.right) {
    player.vx=player.speed;
    player.facing=1;
    moving=true;
  }
  if(!moving) player.vx*=0.78;

  player.x+=player.vx;
  player.vy+=GRAVITY;
  player.y+=player.vy;

  const overGap = isOverGap(player.x);

  if (player.y > H + 40) {
    if (overGap || player.y > H + 60) {
      respawnFromGap();
      return;
    }
  }

  if(!overGap && player.y+player.r>=GROUND_Y) {
    player.y=GROUND_Y-player.r;
    player.vy=0;
    player.onGround=true;
    lastSafeX = player.x;
  } else {
    if (player.y + player.r < GROUND_Y) player.onGround=false;
  }

  for(const p of platforms) {
    if(player.vy>=0 &&
       player.x+player.r>p.x &&
       player.x-player.r<p.x+p.w &&
       player.y+player.r>=p.y &&
       player.y+player.r<=p.y+15) {
      player.y=p.y-player.r;
      player.vy=0;
      player.onGround=true;
      lastSafeX = player.x;
    }
  }

  player.x=Math.max(player.r,Math.min(LEVEL_WIDTH-20,player.x));
  if(player.invincible>0) player.invincible--;

  camera=player.x-W*0.38;
  camera=Math.max(0,Math.min(LEVEL_WIDTH-W,camera));
}

/* ===== ВРАГИ ===== */
function updateEnemies() {
  for(const e of enemies) {
    if(!e.alive) continue;
    e.jumpTimer--;
    const distance=player.x-e.x;

    if(e.jumpTimer<=0 && e.onGround) {
      e.vy=-(8+world*0.7);
      e.onGround=false;
      e.jumpTimer=95+Math.random()*85;
    }

    if(Math.abs(distance)<230) {
      e.vx += Math.sign(distance)*0.035;
      e.vx=Math.max(-2.5-world*0.25, Math.min(2.5+world*0.25,e.vx));
    } else {
      if(e.x<e.min) e.vx=Math.abs(e.vx);
      if(e.x>e.max) e.vx=-Math.abs(e.vx);
    }

    e.x+=e.vx;
    e.y+=e.vy;
    e.vy+=GRAVITY;

    if(e.y>=350) {
      e.y=350;
      e.vy=0;
      e.onGround=true;
    }

    if(Math.abs(player.x-e.x)<31 && Math.abs(player.y-e.y)<30) {
      hurtPlayer();
    }
  }
}

function updateLizards() {
  for (const l of lizards) {
    if (!l.alive) continue;

    l.dashTimer--;
    const distance = player.x - l.x;

    if (l.dashTimer <= 0 && l.onGround && Math.abs(distance) < 260) {
      l.vx = Math.sign(distance) * (4.5 + world * 0.3);
      l.facing = Math.sign(distance) || 1;
      l.dashTimer = 160 + Math.random() * 80;
      sound(420, 0.06, "square");
    } else if (l.dashTimer > 0) {
      l.vx *= 0.93;
    } else {
      l.vx = l.facing * l.speed;
      if (l.x < 80) l.facing = 1;
      if (l.x > LEVEL_WIDTH - 80) l.facing = -1;
    }

    l.x += l.vx;
    l.y += l.vy;
    l.vy += GRAVITY;

    if (l.y >= 350) {
      l.y = 350;
      l.vy = 0;
      l.onGround = true;
    } else {
      l.onGround = false;
    }

    if (Math.abs(player.x - l.x) < 28 && Math.abs(player.y - l.y) < 30) {
      hurtPlayer();
    }
  }
}

function updateBears() {
  for (const b of bears) {
    if (!b.alive) continue;

    if (b.hurtFlash > 0) b.hurtFlash--;

    const distance = player.x - b.x;
    b.facing = Math.sign(distance) || 1;

    if (Math.abs(distance) > 60) {
      b.vx = Math.sign(distance) * 0.9;
    } else {
      b.vx = 0;
    }

    b.x += b.vx;
    b.y += b.vy;
    b.vy += GRAVITY;

    if (b.y >= 350) {
      b.y = 350;
      b.vy = 0;
      b.onGround = true;
    }

    b.throwTimer--;
    if (b.throwTimer <= 0 && Math.abs(distance) < 380) {
      const dx = player.x - b.x;
      const dy = player.y - (b.y - 30);
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      enemyBullets.push({
        x: b.x, y: b.y - 30,
        vx: dx/len * 4,
        vy: dy/len * 4 - 1.2,
        angle: Math.atan2(dy, dx),
        life: 180,
        rock: true
      });
      b.throwTimer = 150 + Math.random() * 80;
      sound(200, 0.1, "square");
    }

    if (Math.abs(player.x - b.x) < 35 && Math.abs(player.y - b.y) < 32) {
      hurtPlayer();
    }
  }
}

function updateWitches() {
  for (const w of witches) {
    if (!w.alive) continue;

    w.phase += 0.03;
    w.x += w.vx;

    if (w.x < 80) { w.x = 80; w.vx = Math.abs(w.vx); }
    if (w.x > LEVEL_WIDTH - 80) { w.x = LEVEL_WIDTH - 80; w.vx = -Math.abs(w.vx); }

    w.y = w.baseY + Math.sin(w.phase) * 22;

    w.shootTimer--;
    if (w.shootTimer <= 0) {
      const dx = player.x - w.x;
      const dy = player.y - w.y;
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      enemyBullets.push({
        x: w.x, y: w.y,
        vx: dx/len*4.2,
        vy: dy/len*4.2,
        angle: Math.atan2(dy, dx),
        life: 150,
        fromWitch: true
      });
      w.shootTimer = 130 + Math.random()*60;
      sound(300, 0.08, "sawtooth");
    }

    if (Math.abs(player.x - w.x) < 30 && Math.abs(player.y - w.y) < 30) {
      hurtPlayer();
    }
  }
}

/* ===== БОСС ===== */
function updateBoss() {
  if(world!==3) return;

  if(!bossBattle && player.x>1950 && boss.alive) {
    bossBattle=true;
    say("Лиса! Вот это сюрприз!");
    saveProgress();
  }

  if(!bossBattle || !boss.alive) return;

  const distance=player.x-boss.x;
  if(Math.abs(distance)>70) boss.vx=Math.sign(distance)*1.5;
  else boss.vx=0;

  boss.x+=boss.vx;
  boss.jumpTimer--;

  if(boss.jumpTimer<=0 && boss.y>=350) {
    boss.vy=-10;
    boss.jumpTimer=100;
  }

  boss.y+=boss.vy;
  boss.vy+=GRAVITY;

  if(boss.y>350) {
    boss.y=350;
    boss.vy=0;
  }

  boss.shootTimer--;
  if(boss.shootTimer<=0) {
    const dx=player.x-boss.x;
    const dy=(player.y-10)-(boss.y-10);
    const length=Math.sqrt(dx*dx+dy*dy)||1;
    enemyBullets.push({
      x:boss.x, y:boss.y-10,
      vx:dx/length*6, vy:dy/length*6,
      angle:Math.atan2(dy,dx), life:130
    });
    boss.shootTimer=85;
    sound(260,0.1,"sawtooth");
  }

  if(Math.abs(player.x-boss.x)<43 && Math.abs(player.y-boss.y)<40) {
    hurtPlayer();
  }
}

/* ===== ПУЛИ ===== */
function updateBullets() {
  for(const b of bullets) {
    b.x+=b.vx;
    b.life--;

    for(const e of enemies) {
      if(e.alive &&
         Math.abs(b.x-e.x)<25 &&
         Math.abs(b.y-e.y)<30) {
        e.alive=false;
        b.life=0;
        say("Ай!");
        sound(330,0.12);
        saveProgress();
      }
    }

    for(const w of witches) {
      if(w.alive &&
         Math.abs(b.x-w.x)<30 &&
         Math.abs(b.y-w.y)<34) {
        w.alive=false;
        b.life=0;
        say("Куда ты, бабуля?");
        sound(220,0.15,"triangle");
        saveProgress();
      }
    }

    for(const l of lizards) {
      if(l.alive &&
         Math.abs(b.x-l.x)<24 &&
         Math.abs(b.y-l.y)<24) {
        l.alive=false;
        b.life=0;
        say("Хвост отвалился!");
        sound(280,0.12,"triangle");
        saveProgress();
      }
    }

    for(const bear of bears) {
      if(bear.alive &&
         Math.abs(b.x-bear.x)<26 &&
         Math.abs(b.y-bear.y)<26) {
        bear.hp--;
        bear.hurtFlash = 20;
        b.life=0;
        sound(200,0.08);
        if (bear.hp <= 0) {
          bear.alive = false;
          say("Медведь ушёл в лес!");
          totalStars += 5;
        }
        saveProgress();
      }
    }

    if(world===3 && bossBattle && boss.alive &&
       Math.abs(b.x-boss.x)<38 &&
       Math.abs(b.y-boss.y)<45) {
      boss.hp--;
      b.life=0;
      sound(240,0.08);
      if(boss.hp<=0) {
        boss.alive=false;
        say("А меня за что?");
        setTimeout(()=>{
          if(!victory) message.textContent="⭐ Лиса побеждена!";
        },1800);
        totalStars+=10;
      }
      saveProgress();
    }
  }

  bullets=bullets.filter(b=>b.life>0 && b.x>-100 && b.x<LEVEL_WIDTH+100);

  for(const b of enemyBullets) {
    b.x+=b.vx;
    b.y+=b.vy;
    b.life--;
    if(Math.abs(b.x-player.x)<20 && Math.abs(b.y-player.y)<20) {
      b.life=0;
      hurtPlayer();
    }
  }

  enemyBullets=enemyBullets.filter(b=>b.life>0);
}

/* ===== ЗВЁЗДЫ ===== */
function updateStars() {
  for(const s of stars) {
    if(!s.taken &&
       Math.abs(player.x-s.x)<27 &&
       Math.abs(player.y-s.y)<35) {
      s.taken=true;
      totalStars++;
      sound(760,0.12,"sine");
      updateInfo();
      saveProgress();
    }
  }
}

function checkLevelEnd() {
  if(world<3 && player.x>LEVEL_WIDTH-90) {
    world++;
    makeLevel();
    say("Алби Бэк!");
    saveProgress();
    return;
  }

  if(world===3 && player.x>LEVEL_WIDTH-90 && !boss.alive) {
    victory=true;
    say("Алби Бэк! Мы победили!");
    saveProgress();
  }

  if(world===3 && bossBattle && boss.alive && player.x>2110) {
    player.x=2110;
  }
}

/* ===== ЦИКЛ ===== */
function update() {
  if(gameOver || victory) {
    draw();
    return;
  }

  frame++;
  updatePlayer();
  updateEnemies();
  updateWitches();
  updateLizards();
  updateBears();
  updateBoss();
  updateBullets();
  updateStars();
  checkLevelEnd();
  updateInfo();
  draw();

  if(frame-lastSaveFrame>=60) {
    saveProgress();
    lastSaveFrame=frame;
  }

  requestAnimationFrame(update);
}

/* ===== КЛАВИАТУРА ===== */
document.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code)) {
    e.preventDefault();
  }
  if(e.code==="ArrowLeft" || e.code==="KeyA") keys.left=true;
  if(e.code==="ArrowRight" || e.code==="KeyD") keys.right=true;
  if((e.code==="ArrowUp" || e.code==="Space" || e.code==="KeyW") && !e.repeat) {
    jump();
  }
  if((e.code==="KeyJ" || e.code==="KeyF") && !e.repeat) {
    shoot();
  }
});

document.addEventListener("keyup",e=>{
  if(e.code==="ArrowLeft" || e.code==="KeyA") keys.left=false;
  if(e.code==="ArrowRight" || e.code==="KeyD") keys.right=false;
});

/* ===== МОБИЛЬНЫЕ КНОПКИ ===== */
function bindHold(id,key) {
  const button=document.getElementById(id);
  button.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[key]=true;
    try { button.setPointerCapture(e.pointerId); } catch(err) {}
  });
  const release=e=>{
    e.preventDefault();
    keys[key]=false;
  };
  button.addEventListener("pointerup",release);
  button.addEventListener("pointercancel",release);
  button.addEventListener("lostpointercapture",()=>keys[key]=false);
  button.addEventListener("contextmenu",e=>e.preventDefault());
  button.addEventListener("selectstart",e=>e.preventDefault());
}

bindHold("left","left");
bindHold("right","right");

function bindTap(id,action) {
  const button=document.getElementById(id);
  button.addEventListener("pointerdown",e=>{
    e.preventDefault();
    action();
  });
  button.addEventListener("contextmenu",e=>e.preventDefault());
  button.addEventListener("selectstart",e=>e.preventDefault());
}

bindTap("jump",jump);
bindTap("shoot",shoot);

/* ===== НОВАЯ ИГРА ===== */
document.getElementById("restart").addEventListener("click",()=>{
  const confirmed = confirm("Начать игру заново? Старое сохранение будет удалено.");
  if(!confirmed) return;

  deleteSave();
  world=0;
  totalStars=0;
  gameOver=false;
  victory=false;
  frame=0;
  lastSaveFrame=0;
  keys={};

  makeLevel();
  say("Новое приключение начинается!");
  saveProgress();
  draw();
  requestAnimationFrame(update);
});

/* ===== ЗАЩИТА ===== */
document.addEventListener("contextmenu",e=>{
  if(e.target.tagName==="BUTTON" || e.target.tagName==="CANVAS") {
    e.preventDefault();
  }
});

window.addEventListener("blur",()=>{
  keys.left=false;
  keys.right=false;
  saveProgress();
});

document.addEventListener("visibilitychange",()=>{
  if(document.hidden) {
    keys.left=false;
    keys.right=false;
    saveProgress();
  }
});

window.addEventListener("pagehide",()=>{
  saveProgress();
});

/* ===== ЗАПУСК ===== */
makeLevel();

const hasSave = loadProgress();

if(hasSave) {
  say("Сохранение загружено! Продолжаем приключение!");
} else {
  say("Вперёд, Колобок!");
  saveProgress();
}

draw();
requestAnimationFrame(update);
</script>
