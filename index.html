
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Колобок: Возвращение</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial;overflow:hidden;touch-action:none}
#game{display:block;width:100vw;height:100vh;background:#73c8ef}
#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.group{display:flex;gap:12px;pointer-events:auto}
button{width:65px;height:65px;border:3px solid white;border-radius:18px;background:#222b;color:white;font-size:25px;font-weight:bold;opacity:.85;touch-action:none}
#shoot{background:#9b2424}
#message{position:fixed;top:12%;left:0;width:100%;text-align:center;font-size:25px;font-weight:bold;color:#fff;text-shadow:2px 3px 4px #000;pointer-events:none}
#help{position:fixed;top:8px;left:10px;font-size:13px;text-shadow:1px 1px 2px #000}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="help">← → движение · ↑ прыжок · 🔫 выстрел</div>
<div id="message"></div>
<div id="controls">
  <div class="group">
    <button id="left">◀</button>
    <button id="right">▶</button>
  </div>
  <div class="group">
    <button id="jump">⬆</button>
    <button id="shoot">🔫</button>
  </div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const message=document.getElementById("message");

function resize(){
  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;
}
window.addEventListener("resize",resize);
resize();

const W=2600;
const ground=()=>canvas.height-90;
let level=1, camera=0, gameOver=false, victory=false;
let transition=false, transitionTimer=0;
let keys={left:false,right:false,jump:false,shoot:false};
let bullets=[], darts=[], stars=[];
let boss=null, bossDefeated=false;
let lastShot=0, frame=0;

const player={
 x:80,y:0,w:42,h:48,vx:0,vy:0,
 speed:4.2,jumping:false,face:1,
 lives:3,invincible:0
};

function say(text){
 message.textContent=text;
 if("speechSynthesis" in window){
   speechSynthesis.cancel();
   const utter=new SpeechSynthesisUtterance(text);
   utter.lang="ru-RU";
   utter.rate=0.9;
   utter.pitch=1.1;
   speechSynthesis.speak(utter);
 }
}
function sound(freq=300,duration=.12){
 try{
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const osc=ac.createOscillator();
  const gain=ac.createGain();
  osc.connect(gain);gain.connect(ac.destination);
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(.12,ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);
  osc.start();osc.stop(ac.currentTime+duration);
 }catch(e){}
}

const levelNames=["Лес","Поле","Горы","Логово лисы"];
const enemies=[];
function createEnemies(){
 enemies.length=0;
 const positions=[
  [430,850,1300,1750],
  [350,760,1180,1640,1950],
  [400,900,1400,1850],
  [420,900,1400,1850]
 ];
 positions[level-1].forEach((x,i)=>{
  enemies.push({x,y:0,w:40,h:42,dir:i%2? -1:1,
   min:x-90,max:x+90,alive:true,speed:1.1+i*.12});
 });
}
function createBoss(){
 boss={
  x:2240,y:0,w:65,h:75,hp:10,maxHp:10,
  vx:-1.5,vy:0,dir:-1,shootTimer:0,jumpTimer:0
 };
 bossDefeated=false;
 darts=[];
}
function startLevel(n){
 level=n;
 player.x=80;player.y=ground()-player.h;
 player.vx=0;player.vy=0;
 camera=0;
 bullets=[];darts=[];stars=[];
 boss=null;bossDefeated=false;
 createEnemies();
 if(level===4) boss=null;
 message.textContent="УРОВЕНЬ "+level+" — "+levelNames[level-1];
 setTimeout(()=>{if(!transition&&!gameOver)message.textContent="";},1800);
}
startLevel(1);

function drawBackground(){
 const g=ctx.createLinearGradient(0,0,0,canvas.height);
 const colors=[
  ["#66c9f5","#d5f6ff"],
  ["#ffcc76","#fff0bd"],
  ["#7896bd","#d8e8f6"],
  ["#382b48","#9b5266"]
 ];
 g.addColorStop(0,colors[level-1][0]);
 g.addColorStop(1,colors[level-1][1]);
 ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);

 // Облака
 ctx.fillStyle="rgba(255,255,255,.65)";
 for(let i=0;i<7;i++){
  let x=((i*370-camera*.25)%(canvas.width+200)+canvas.width+200)%(canvas.width+200)-70;
  let y=65+(i%3)*55;
  ctx.beginPath();ctx.arc(x,y,24,0,Math.PI*2);
  ctx.arc(x+25,y-10,30,0,Math.PI*2);
  ctx.arc(x+52,y,22,0,Math.PI*2);ctx.fill();
 }
 // Дальний пейзаж
 ctx.fillStyle=level===4?"#49354f":"rgba(50,110,90,.35)";
 for(let i=0;i<12;i++){
  let x=i*270-camera*.45;
  ctx.beginPath();ctx.moveTo(x,ground());
  ctx.lineTo(x+135,ground()-180-(i%3)*35);
  ctx.lineTo(x+270,ground());ctx.fill();
 }
}
function drawGround(){
 ctx.fillStyle=level===4?"#493b35":"#39853b";
 ctx.fillRect(0,ground(),canvas.width,canvas.height-ground());
 ctx.fillStyle="#245b2b";
 ctx.fillRect(0,ground()+13,canvas.width,canvas.height-ground());
 for(let x=0;x<canvas.width;x+=35){
  ctx.fillStyle="#65ad49";
  ctx.fillRect(x,ground()+2,17,5);
 }
}
function drawPlayer(){
 const x=player.x-camera,y=player.y;
 ctx.save();
 if(player.invincible>0&&frame%8<4)ctx.globalAlpha=.35;
 // Ноги
 ctx.fillStyle="#292329";
 ctx.fillRect(x+8,y+35,11,13);
 ctx.fillRect(x+25,y+35,11,13);
 // Колобок
 ctx.fillStyle="#e8a83c";
 ctx.beginPath();ctx.arc(x+21,y+18,20,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#9a5c22";ctx.lineWidth=2;ctx.stroke();
 // Лицо
 ctx.fillStyle="#222";
 ctx.beginPath();ctx.arc(x+14,y+15,2.5,0,7);ctx.arc(x+27,y+15,2.5,0,7);ctx.fill();
 ctx.strokeStyle="#642d18";ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(x+21,y+21,7,.15,Math.PI-.15);ctx.stroke();
 // Кожаная куртка
 ctx.fillStyle="#512b19";
 ctx.fillRect(x+5,y+28,32,12);
 ctx.strokeStyle="#d4a15c";ctx.strokeRect(x+5,y+28,32,12);
 ctx.fillStyle="#e2c17a";ctx.fillRect(x+20,y+29,2,10);
 // Ружьё
 ctx.save();
 if(player.face<0){ctx.translate(x+21,y+28);ctx.scale(-1,1);ctx.translate(-(x+21),-(y+28));}
 ctx.fillStyle="#292929";ctx.fillRect(x+27,y+24,29,5);
 ctx.fillStyle="#79502b";ctx.fillRect(x+25,y+27,12,7);
 ctx.restore();
 ctx.restore();
}
function drawEnemy(e){
 const x=e.x-camera,y=e.y;
 ctx.fillStyle="#703a29";
 ctx.beginPath();ctx.ellipse(x+20,y+23,19,19,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff";
 ctx.fillRect(x+8,y+15,8,8);ctx.fillRect(x+25,y+15,8,8);
 ctx.fillStyle="#111";
 ctx.fillRect(x+11,y+18,4,4);ctx.fillRect(x+28,y+18,4,4);
 ctx.fillStyle="#302019";ctx.fillRect(x+5,y+39,12,4);ctx.fillRect(x+25,y+39,12,4);
}
function drawBoss(){
 if(!boss||bossDefeated)return;
 const x=boss.x-camera,y=boss.y;
 // Лиса
 ctx.fillStyle="#e66b22";
 ctx.beginPath();ctx.ellipse(x+32,y+43,29,32,0,0,Math.PI*2);ctx.fill();
 // Голова
 ctx.beginPath();ctx.arc(x+32,y+14,25,0,Math.PI*2);ctx.fill();
 // Уши
 ctx.beginPath();ctx.moveTo(x+10,y+2);ctx.lineTo(x+7,y-24);ctx.lineTo(x+25,y-5);
 ctx.moveTo(x+42,y-5);ctx.lineTo(x+59,y-24);ctx.lineTo(x+55,y+4);ctx.fill();
 // Мордочка
 ctx.fillStyle="#fff0d7";
 ctx.beginPath();ctx.ellipse(x+32,y+23,17,11,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#111";
 ctx.beginPath();ctx.arc(x+23,y+12,3,0,7);ctx.arc(x+42,y+12,3,0,7);ctx.fill();
 ctx.beginPath();ctx.arc(x+32,y+22,4,0,7);ctx.fill();
 // Хвост
 ctx.fillStyle="#e66b22";
 ctx.beginPath();ctx.moveTo(x+50,y+48);ctx.quadraticCurveTo(x+85,y+25,x+65,y+4);
 ctx.quadraticCurveTo(x+88,y+44,x+50,y+60);ctx.fill();
 ctx.fillStyle="#fff";ctx.fillRect(x+60,y+5,10,10);
 // Здоровье босса
 ctx.fillStyle="#222";ctx.fillRect(x-5,y-42,75,9);
 ctx.fillStyle="#e22";ctx.fillRect(x-5,y-42,75*boss.hp/boss.maxHp,9);
 ctx.fillStyle="white";ctx.font="14px Arial";
 ctx.fillText("ЛИСА "+boss.hp+"/10",x-5,y-49);
}
function drawBullets(){
 ctx.fillStyle="#ffe66a";
 bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x-camera,b.y,5,0,7);ctx.fill();});
 ctx.fillStyle="#222";
 darts.forEach(d=>{
  ctx.save();ctx.translate(d.x-camera,d.y);ctx.rotate(d.angle);
  ctx.fillRect(-12,-2,24,4);
  ctx.fillStyle="#ddd";ctx.beginPath();ctx.moveTo(12,-5);ctx.lineTo(19,0);ctx.lineTo(12,5);ctx.fill();
  ctx.restore();ctx.fillStyle="#222";
 });
}
function drawHUD(){
 ctx.fillStyle="white";ctx.font="bold 20px Arial";
 ctx.fillText("Уровень: "+level+"/4",15,35);
 ctx.fillText("❤️ "+player.lives,15,62);
 ctx.fillText("⭐ "+stars.length,15,89);
}
function overlap(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
}

function killEnemy(e){
 e.alive=false;
 stars.push({x:e.x,y:e.y});
 say("Ёба-Боба!");
 sound(180,.2);
}
function damagePlayer(){
 if(player.invincible>0)return;
 player.lives--;
 player.invincible=100;
 sound(100,.25);
 if(player.lives<=0){
  gameOver=true;say("Колобок проиграл!");
  message.textContent="ИГРА ОКОНЧЕНА — обнови страницу";
 }
}
function shoot(){
 if(frame-lastShot<16)return;
 lastShot=frame;
 bullets.push({x:player.x+(player.face>0?48:-8),y:player.y+27,vx:player.face*9});
 sound(520,.05);
}
function update(){
 if(gameOver||victory||transition)return;
 frame++;
 if(player.invincible>0)player.invincible--;

 player.vx=0;
 if(keys.left){player.vx=-player.speed;player.face=-1;}
 if(keys.right){player.vx=player.speed;player.face=1;}
 if(keys.jump&&!player.jumping){
  player.vy=-12;player.jumping=true;sound(350,.08);
 }
 if(keys.shoot)shoot();

 player.x+=player.vx;
 player.vy+=.55;
 player.y+=player.vy;
 if(player.y+player.h>=ground()){
  player.y=ground()-player.h;
  player.vy=0;player.jumping=false;
 }
 player.x=Math.max(0,Math.min(W-player.w,player.x));

 // Враги только обычные, лисы среди них нет
 enemies.forEach(e=>{
  if(!e.alive)return;
  e.y=ground()-e.h;
  e.x+=e.dir*e.speed;
  if(e.x<e.min||e.x>e.max)e.dir*=-1;
  if(overlap(player,e))damagePlayer();
 });

 // Пули Колобка
 bullets.forEach(b=>{
  b.x+=b.vx;
  enemies.forEach(e=>{
   if(e.alive&&b.x>e.x&&b.x<e.x+e.w&&b.y>e.y&&b.y<e.y+e.h){
    killEnemy(e);b.x=-9999;
   }
  });
  // Босс существует только на четвёртом уровне
  if(level===4&&boss&&!bossDefeated&&
     b.x>boss.x&&b.x<boss.x+boss.w&&
     b.y>boss.y&&b.y<boss.y+boss.h){
    boss.hp--;b.x=-9999;sound(240,.08);
    if(boss.hp<=0){
     bossDefeated=true;darts=[];
     stars.push({x:boss.x,y:boss.y});
     say("А меня за что?!");
     message.textContent="🦊 А МЕНЯ ЗА ЧТО?!";
    }
   }
  });
 bullets=bullets.filter(b=>b.x>-100&&b.x<W+100);

 // Лиса создаётся только в конце четвёртого уровня
 if(level===4&&player.x>1950&&!boss&&!bossDefeated){
  createBoss();
  boss.y=ground()-boss.h;
  message.textContent="ОСТОРОЖНО! ЛИСА-БОСС!";
  sound(120,.4);
 }
 if(level===4&&boss&&!bossDefeated){
  boss.y=ground()-boss.h;
  boss.jumpTimer++;
  boss.shootTimer++;
  // Лиса прыгает
  if(boss.jumpTimer>85){
   boss.vy=-11;boss.jumpTimer=0;
  }
  if(boss.vy===undefined)boss.vy=0;
  boss.vy+=.5;boss.y+=boss.vy;
  if(boss.y+boss.h>=ground()){
   boss.y=ground()-boss.h;boss.vy=0;
  }
  // Лиса перемещается возле конца уровня
  if(boss.x>player.x+100)boss.x-=1.1;
  else if(boss.x<player.x+230)boss.x+=.6;
  boss.x=Math.max(2110,Math.min(2320,boss.x));
  // Дротики летят в сторону Колобка
  if(boss.shootTimer>=55){
   boss.shootTimer=0;
   const dx=(player.x+20)-(boss.x+30);
   const dy=(player.y+20)-(boss.y+30);
   const len=Math.sqrt(dx*dx+dy*dy)||1;
   darts.push({x:boss.x+30,y:boss.y+30,
    vx:dx/len*7,vy:dy/len*7,angle:Math.atan2(dy,dx),w:20,h:5});
   sound(700,.06);
  }
 }
 darts.forEach(d=>{
  d.x+=d.vx;d.y+=d.vy;
  if(overlap(player,{x:d.x-8,y:d.y-4,w:16,h:8}))damagePlayer();
 });
 darts=darts.filter(d=>d.x>-100&&d.x<W+100&&d.y>-100&&d.y<canvas.height+100);

 // Нельзя пройти мимо живого босса
 if(level===4&&boss&&!bossDefeated&&player.x>2110)player.x=2110;

 // Завершение уровня
 const endPoint=level===4?2440:W-120;
 if(player.x>=endPoint){
  if(level<4){
   transition=true;transitionTimer=130;
   say("Алби Бэк!");
   message.textContent="АЛБИ БЭК! УРОВЕНЬ ПРОЙДЕН!";
  }else if(bossDefeated){
   victory=true;
   say("Алби Бэк!");
   message.textContent="ПОБЕДА! КОЛОБОК СПАС МИР!";
  }
 }
 camera=Math.max(0,Math.min(W-canvas.width,player.x-canvas.width*.35));
}
function draw(){
 drawBackground();
 drawGround();
 enemies.forEach(e=>{if(e.alive)drawEnemy(e);});
 if(level===4)drawBoss();
 drawPlayer();
 drawBullets();
 drawHUD();
}
function loop(){
 update();
 draw();
 if(transition){
  transitionTimer--;
  if(transitionTimer<=0){
   transition=false;
   startLevel(level+1);
  }
 }
 requestAnimationFrame(loop);
}
loop();

// Кнопки управления
function bindButton(id,key){
 const el=document.getElementById(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true;});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>
  el.addEventListener(ev,e=>{e.preventDefault();keys[key]=false;}));
}
bindButton("left","left");
bindButton("right","right");
bindButton("jump","jump");
bindButton("shoot","shoot");

window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if(e.key==="ArrowUp"||e.key===" "||e.key==="w")keys.jump=true;
 if(e.key==="x"||e.key==="Control")keys.shoot=true;
});
window.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
 if(e.key==="ArrowUp"||e.key===" "||e.key==="w")keys.jump=false;
 if(e.key==="x"||e.key==="Control")keys.shoot=false;
});
</script>
</body>
</html>
