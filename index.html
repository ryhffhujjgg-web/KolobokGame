<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Колобок: Побег</title>
    <style>
        body { margin: 0; padding: 0; background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { background: #87CEEB; display: block; max-width: 100%; max-height: 100%; touch-action: none; image-rendering: pixelated; }
        #controls { position: absolute; bottom: 20px; display: flex; width: 100%; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; }
        .btn { background: rgba(255,255,255,0.6); border: 2px solid #fff; border-radius: 10px; width: 70px; height: 70px; font-size: 30px; font-weight: bold; color: #333; display: flex; justify-content: center; align-items: center; user-select: none; pointer-events: auto; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
        .btn:active { background: rgba(255,255,255,0.9); transform: translateY(2px); }
        #btnShoot { position: absolute; right: 20px; bottom: 100px; background: rgba(255,0,0,0.7); color: white; border-color: white; }
        #startScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; z-index: 10; }
        h1 { font-size: 32px; margin-bottom: 10px; color: #FFD700; }
        p { font-size: 18px; line-height: 1.5; margin-bottom: 20px; }
        #startBtn { padding: 15px 30px; font-size: 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="startScreen">
        <h1>КОЛОБОК: ПОБЕГ</h1>
        <p>Бабушка и дедушка хотели тебя съесть!<br>Хватай дробовик, собирай монеты и беги к заправке, чтобы уехать в закат.</p>
        <button id="startBtn">НАЧАТЬ ИГРУ</button>
    </div>

    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div id="controls">
        <div class="btn" id="btnLeft">◀</div>
        <div class="btn" id="btnRight">▶</div>
    </div>
    <div class="btn" id="btnShoot">🔫</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');

    let keys = { right: false, left: false };
    let score = 0;
    let gameOver = false;
    let gameStarted = false;

    const player = {
        x: 50, y: 300, width: 40, height: 40, 
        speed: 5, vy: 0, gravity: 0.6, jumpPower: -12,
        grounded: false, cooldown: 0
    };

    let bullets = [];
    // Заяц (эмодзи)
    let enemies = [{ x: 600, y: 300, width: 40, height: 40, speed: 1.5, type: '🐇' }];
    let coins = [{ x: 300, y: 250, width: 20, height: 20 }, { x: 500, y: 200, width: 20, height: 20 }];
    
    const platforms = [
        { x: 0, y: 340, width: 800, height: 60 }
    ];

    // Запуск игры
    startBtn.addEventListener('click', () => {
        startScreen.style.display = 'none';
        gameStarted = true;
    });

    // Управление
    window.addEventListener('keydown', (e) => {
        if (!gameStarted) return;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            if (player.grounded) { player.vy = player.jumpPower; player.grounded = false; }
        }
        if (e.code === 'KeyF') shoot();
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    });

    document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
    document.getElementById('btnRight').addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
    document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
    document.getElementById('btnLeft').addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
    document.getElementById('btnShoot').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
    
    canvas.addEventListener('touchstart', (e) => { 
        if (gameStarted && player.grounded) { player.vy = player.jumpPower; player.grounded = false; }
    });

    function shoot() {
        if (gameOver || !gameStarted) return;
        if (player.cooldown <= 0) {
            bullets.push({ x: player.x + player.width, y: player.y + 20, width: 15, height: 8, speed: 10 });
            player.cooldown = 15;
        }
    }

    function update() {
        if (gameOver || !gameStarted) return;
        if (player.cooldown > 0) player.cooldown--;

        if (keys.right) player.x += player.speed;
        if (keys.left) player.x -= player.speed;

        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        player.vy += player.gravity;
        player.y += player.vy;
        player.grounded = false;

        platforms.forEach(p => {
            if (player.x < p.x + p.width && player.x + player.width > p.x &&
                player.y < p.y + p.height && player.y + player.height > p.y) {
                if (player.vy > 0 && player.y + player.height - player.vy <= p.y) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            }
        });

        bullets.forEach((b, index) => {
            b.x += b.speed;
            if (b.x > canvas.width) bullets.splice(index, 1);
        });

        enemies.forEach((e, index) => {
            e.x -= e.speed;
            if (e.x < 0) e.x = canvas.width;

            if (player.x < e.x + e.width && player.x + player.width > e.x &&
                player.y < e.y + e.height && player.y + player.height > e.y) {
                gameOver = true;
            }

            bullets.forEach((b, bIndex) => {
                if (b.x < e.x + e.width && b.x + b.width > e.x &&
                    b.y < e.y + e.height && b.y + b.height > e.y) {
                    enemies.splice(index, 1);
                    bullets.splice(bIndex, 1);
                    score += 10;
                    setTimeout(() => {
                        if(!gameOver) enemies.push({ x: canvas.width, y: 300, width: 40, height: 40, speed: 1.5, type: '🐇' });
                    }, 2000);
                }
            });
        });

        coins.forEach((c, index) => {
            if (player.x < c.x + c.width && player.x + player.width > c.x &&
                player.y < c.y + c.height && player.y + player.height > c.y) {
                coins.splice(index, 1);
                score += 5;
            }
        });
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Фон (Небо и земля)
        ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#8B4513';
        platforms.forEach(p => ctx.fillRect(p.x, p.y, p.width, p.height));

        // Трава
        ctx.fillStyle = '#228B22';
        ctx.fillRect(0, 340, canvas.width, 10);

        // Монеты (эмодзи)
        ctx.font = '24px Arial';
        coins.forEach(c => {
            ctx.fillText('🪙', c.x - 5, c.y + 20);
        });

        // Враги (эмодзи)
        ctx.font = '40px Arial';
        enemies.forEach(e => {
            ctx.fillText(e.type, e.x, e.y + 35);
        });

        // Пули
        ctx.fillStyle = '#FF0000';
        bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

        // Колобок (эмодзи)
        ctx.font = '40px Arial';
        ctx.fillText('🥯', player.x, player.y + 35);

        // Интерфейс
        ctx.fillStyle = '#000'; ctx.font = 'bold 24px "Courier New", Courier, monospace';
        ctx.fillText(`Счет: ${score}`, 20, 40);

        if (gameOver) {
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#FFF'; ctx.font = '48px "Courier New", Courier, monospace';
            ctx.fillText('ИГРА ОКОНЧЕНА', 200, 180);
            ctx.font = '24px "Courier New", Courier, monospace';
            ctx.fillText('Нажмите чтобы перезапустить', 230, 240);
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    canvas.addEventListener('click', () => { if (gameOver) location.reload(); });

    loop();
</script>
</body>
</html>
