<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Колобок: Побег</title>
    <style>
        body { margin: 0; padding: 0; background: #111; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        canvas { display: block; width: 100vw; height: 100vh; touch-action: none; image-rendering: pixelated; }
        
        /* Подсказка "Поверните телефон" */
        #rotateMsg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #222; color: #FFD700; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; z-index: 20; font-size: 24px; padding: 20px; box-sizing: border-box; }
        #rotateMsg span { font-size: 60px; margin-bottom: 20px; animation: rotate 2s infinite ease-in-out; }
        @keyframes rotate { 0% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } 100% { transform: rotate(0deg); } }

        /* Кнопки управления */
        #controls { position: absolute; bottom: 20px; display: flex; width: 100%; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none; }
        .btn { background: rgba(255,255,255,0.4); border: 2px solid #fff; border-radius: 15px; width: 70px; height: 70px; font-size: 30px; font-weight: bold; color: #000; display: flex; justify-content: center; align-items: center; user-select: none; pointer-events: auto; box-shadow: 2px 2px 5px rgba(0,0,0,0.5); backdrop-filter: blur(2px); }
        .btn:active { background: rgba(255,255,255,0.8); transform: translateY(2px); }
        #btnShoot { position: absolute; right: 20px; bottom: 100px; background: rgba(255,0,0,0.6); color: white; border-color: white; }
        
        /* Стартовый экран */
        #startScreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; z-index: 10; }
        h1 { font-size: 32px; margin-bottom: 10px; color: #FFD700; text-shadow: 2px 2px #000; }
        p { font-size: 16px; line-height: 1.5; margin-bottom: 20px; max-width: 400px; }
        #startBtn { padding: 15px 30px; font-size: 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; box-shadow: 0 4px #2E7D32; }
        #startBtn:active { transform: translateY(4px); box-shadow: 0 0 #2E7D32; }
    </style>
</head>
<body>
    <div id="rotateMsg">
        <span>📱</span>
        <p>Пожалуйста, поверните телефон<br>горизонтально для игры</p>
    </div>

    <div id="startScreen">
        <h1>КОЛОБОК: ПОБЕГ</h1>
        <p>Бабушка и дедушка хотели тебя съесть!<br>Хватай дробовик, собирай монеты и беги к заправке, чтобы уехать в закат.</p>
        <button id="startBtn">НАЧАТЬ ИГРУ</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <div id="controls">
        <div class="btn" id="btnLeft">◀</div>
        <div class="btn" id="btnRight">▶</div>
    </div>
    <div class="btn" id="btnShoot">🔫</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    const rotateMsg = document.getElementById('rotateMsg');

    let canvasWidth = window.innerWidth;
    let canvasHeight = window.innerHeight;

    function checkOrientation() {
        // Показываем подсказку, только если игра уже запущена и телефон вертикально
        if (gameStarted && window.innerHeight > window.innerWidth) {
            rotateMsg.style.display = 'flex';
        } else {
            rotateMsg.style.display = 'none';
        }
    }

    function resizeCanvas() {
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        checkOrientation();
        
        if (gameStarted && platforms.length > 0) {
            platforms[0].y = canvasHeight - 80;
            if (player.y > canvasHeight - 150) {
                player.y = canvasHeight - 130;
            }
        }
    }
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));
    
    resizeCanvas();

    let keys = { right: false, left: false };
    let score = 0;
    let gameOver = false;
    let gameStarted = false;
    let level = 1;
    let levelGoal = 1500;

    const player = {
        x: 100, y: 0, width: 50, height: 50, 
        speed: 6, vy: 0, gravity: 0.8, jumpPower: -15,
        grounded: false, cooldown: 0, facingRight: true
    };

    let bullets = [];
    let enemies = [];
    let coins = [];
    let platforms = [];
    let cameraX = 0;

    function setupLevel(lvl) {
        player.x = 100;
        // Ставим игрока на землю, даже если экран горизонтальный
        player.y = canvasHeight - 130; 
        bullets = [];
        enemies = [];
        coins = [];
        platforms = [];
        cameraX = 0;
        levelGoal = 1500 * lvl; 

        platforms.push({ x: -2000, y: canvasHeight - 80, width: 10000, height: 100 });

        if (lvl === 1) {
            enemies.push({ x: canvasWidth + 300, y: canvasHeight - 110, width: 40, height: 40, speed: 1.5, type: '🐇' });
        } else if (lvl === 2) {
            enemies.push({ x: canvasWidth + 300, y: canvasHeight - 110, width: 40, height: 40, speed: 1.8, type: '🐺' });
            enemies.push({ x: canvasWidth + 800, y: canvasHeight - 110, width: 40, height: 40, speed: 1.8, type: '🐻' });
        } else if (lvl === 3) {
            enemies.push({ x: canvasWidth + 300, y: canvasHeight - 110, width: 40, height: 40, speed: 2.2, type: '🦊' });
            enemies.push({ x: canvasWidth + 800, y: canvasHeight - 110, width: 40, height: 40, speed: 2.2, type: '🐺' });
        }

        for (let i = 0; i < 15; i++) {
            coins.push({ x: 400 + i * 150, y: canvasHeight - 150 - Math.random() * 50, width: 20, height: 20 });
        }
    }

    startBtn.addEventListener('click', () => {
        startScreen.style.display = 'none';
        gameStarted = true;
        level = 1;
        score = 0;
        setupLevel(level);
        checkOrientation(); // Проверяем ориентацию сразу после старта
    });

    window.addEventListener('keydown', (e) => {
        if (!gameStarted) return;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') { keys.right = true; player.facingRight = true; }
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') { keys.left = true; player.facingRight = false; }
        if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
            if (player.grounded) { player.vy = player.jumpPower; player.grounded = false; }
        }
        if (e.code === 'KeyF') shoot();
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
    });

    document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; player.facingRight = true; });
    document.getElementById('btnRight').addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
    document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; player.facingRight = false; });
    document.getElementById('btnLeft').addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
    document.getElementById('btnShoot').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); });
    
    canvas.addEventListener('touchstart', (e) => { 
        if (gameStarted && player.grounded) { player.vy = player.jumpPower; player.grounded = false; }
    });

    function shoot() {
        if (gameOver || !gameStarted) return;
        if (player.cooldown <= 0) {
            let startX = player.facingRight ? player.x + player.width : player.x - 15;
            let speed = player.facingRight ? 15 : -15;
            bullets.push({ x: startX, y: player.y + 20, width: 15, height: 8, speed: speed });
            player.cooldown = 15;
        }
    }

    function update() {
        if (gameOver || !gameStarted || window.innerHeight > window.innerWidth) return; // Пауза, если вертикально
        
        if (player.cooldown > 0) player.cooldown--;

        if (keys.right) player.x += player.speed;
        if (keys.left) player.x -= player.speed;

        if (player.x > canvasWidth / 2) {
            cameraX = player.x - canvasWidth / 2;
        } else {
            cameraX = 0;
        }

        player.vy += player.gravity;
        player.y += player.vy;
        player.grounded = false;

        platforms.forEach(p => {
            if (player.x + player.width > p.x && player.x < p.x + p.width &&
                player.y + player.height > p.y && player.y < p.y + p.height) {
                if (player.vy > 0 && player.y + player.height - player.vy <= p.y) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }
            }
        });

        bullets.forEach((b, index) => {
            b.x += b.speed;
            if (b.x > player.x + canvasWidth || b.x < player.x - canvasWidth) bullets.splice(index, 1);
        });

        enemies.forEach((e, index) => {
            if (e.x > player.x) e.x -= e.speed;
            else e.x += e.speed;

            if (player.x < e.x + e.width && player.x + player.width > e.x &&
                player.y < e.y + e.height && player.y + player.height > e.y) {
                gameOver = true;
            }

            bullets.forEach((b, bIndex) => {
                if (b.x < e.x + e.width && b.x + b.width > e.x &&
                    b.y < e.y + e.height && b.y + b.height > e.y) {
                    enemies.splice(index, 1);
                    bullets.splice(bIndex, 1);
                    score += 10;
                }
            });
        });

        coins.forEach((c, index) => {
            if (player.x < c.x + c.width && player.x + player.width > c.x &&
                player.y < c.y + c.height && player.y + player.height > c.y) {
                coins.splice(index, 1);
                score += 5;
            }
        });

        if (player.x > levelGoal) {
            if (level < 3) {
                level++;
                setupLevel(level);
                alert(`Уровень ${level}!`);
            } else {
                gameOver = true; 
                showWinScreen();
            }
        }
    }

    function showWinScreen() {
        ctx.fillStyle = '#FF8C00'; 
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
        ctx.fillStyle = '#FFFF00'; 
        ctx.beginPath(); ctx.arc(canvasWidth / 2, canvasHeight / 2, 80, 0, Math.PI * 2); ctx.fill();
        
        ctx.font = '100px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🚗', canvasWidth / 2, canvasHeight - 100);
        ctx.fillText('🥯', canvasWidth / 2 - 60, canvasHeight - 100);

        ctx.fillStyle = '#FFF'; ctx.font = 'bold 40px "Courier New", Courier, monospace';
        ctx.fillText('ПОБЕГ УДАЛСЯ!', canvasWidth / 2, 100);
        ctx.font = '24px "Courier New", Courier, monospace';
        ctx.fillText('Колобок уехал в закат', canvasWidth / 2, 150);

        ctx.fillStyle = '#000'; ctx.fillRect(canvasWidth / 2 - 100, canvasHeight - 50, 200, 40);
        ctx.fillStyle = '#FFF'; ctx.font = '20px Arial';
        ctx.fillText('Играть снова', canvasWidth / 2, canvasHeight - 25);
        ctx.textAlign = 'left';
    }

    function drawKolobok(x, y, w, h, facingRight) {
        ctx.save();
        ctx.fillStyle = '#D2B48C';
        ctx.beginPath(); ctx.arc(x + w/2, y + h/2, w/2, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = '#333';
        ctx.beginPath(); ctx.arc(x + w/2, y + h/2, w/2 - 1, 0, Math.PI, false); ctx.fill();
        ctx.strokeStyle = '#CCC'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x + w/2, y + h/2 + 5); ctx.lineTo(x + w/2, y + h - 5); ctx.stroke();
        ctx.fillStyle = '#000';
        if (facingRight) {
            ctx.beginPath(); ctx.arc(x + w/2 + 8, y + h/2 - 5, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + w/2 + 16, y + h/2 - 5, 3, 0, Math.PI*2); ctx.fill();
        } else {
            ctx.beginPath(); ctx.arc(x + w/2 - 16, y + h/2 - 5, 3, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(x + w/2 - 8, y + h/2 - 5, 3, 0, Math.PI*2); ctx.fill();
        }
        ctx.beginPath(); ctx.arc(x + w/2, y + h/2 + 5, 6, 0.1, Math.PI - 0.1); ctx.stroke();
        ctx.fillStyle = '#555';
        ctx.fillRect(facingRight ? x + w - 5 : x - 15, y + h/2 + 5, 20, 6);
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(facingRight ? x + w - 15 : x + 5, y + h/2 + 7, 10, 8);
        ctx.restore();
    }

    function draw() {
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);

        if (level === 1) { ctx.fillStyle = '#87CEEB'; ctx.fillRect(0, 0, canvasWidth, canvasHeight); }
        else if (level === 2) { ctx.fillStyle = '#2E8B57'; ctx.fillRect(0, 0, canvasWidth, canvasHeight); }
        else { ctx.fillStyle = '#FF8C00'; ctx.fillRect(0, 0, canvasWidth, canvasHeight); }

        ctx.save();
        ctx.translate(-cameraX, 0);

        ctx.fillStyle = level === 2 ? '#556B2F' : '#8B4513';
        platforms.forEach(p => ctx.fillRect(p.x, p.y, p.width, p.height));

        ctx.fillStyle = '#228B22';
        ctx.fillRect(-2000, canvasHeight - 80, 10000, 15);

        ctx.font = '30px Arial';
        coins.forEach(c => { ctx.fillText('🪙', c.x, c.y + 30); });

        ctx.font = '50px Arial';
        enemies.forEach(e => { ctx.fillText(e.type, e.x, e.y + 45); });

        ctx.fillStyle = '#FF0000';
        bullets.forEach(b => ctx.fillRect(b.x, b.y, b.width, b.height));

        drawKolobok(player.x, player.y, player.width, player.height, player.facingRight);
        ctx.restore();

        ctx.fillStyle = '#000'; ctx.font = 'bold 24px "Courier New", Courier, monospace';
        ctx.fillText(`Счет: ${score}`, 20, 40);
        ctx.fillText(`Уровень: ${level} / 3`, 20, 70);

        if (gameOver && level < 3) {
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0, 0, canvasWidth, canvasHeight);
            ctx.fillStyle = '#FFF'; ctx.textAlign = 'center';
            ctx.font = '48px "Courier New", Courier, monospace';
            ctx.fillText('ИГРА ОКОНЧЕНА', canvasWidth / 2, canvasHeight / 2 - 50);
            ctx.font = '24px "Courier New", Courier, monospace';
            ctx.fillText('Нажмите чтобы перезапустить', canvasWidth / 2, canvasHeight / 2);
            ctx.textAlign = 'left';
        }
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    canvas.addEventListener('click', () => { if (gameOver && level < 3) location.reload(); });

    loop();
</script>
</body>
</html>
