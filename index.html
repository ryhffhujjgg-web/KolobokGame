<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Колобок: Большое приключение</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17283c;color:white;font-family:Arial;text-align:center}
header{padding:10px;background:#263e59}
h1{font-size:22px;margin:5px}
#info{font-size:16px;margin:8px}
canvas{display:block;width:100%;max-width:900px;margin:auto;background:#8bd7f5;border:2px solid white;touch-action:none}
#controls{display:flex;justify-content:center;gap:9px;margin:12px auto;flex-wrap:wrap}
button{font-size:20px;padding:13px 17px;border:0;border-radius:12px;background:#ffcf55;font-weight:bold;touch-action:none}
#shoot{background:#e95b43;color:white}
#jump{background:#69c7ff}
#message{padding:8px;min-height:30px}
</style>
</head>
<body>
<header>
<h1>🥯 Колобок: Большое приключение</h1>
<div id="info"></div>
</header>

<canvas id="game" width="900" height="440"></canvas>
<div id="message">Нажми любую кнопку, чтобы начать приключение!</div>

<div id="controls">
<button id="left">◀</button>
<button id="right">▶</button>
<button id="jump">ПРЫЖОК</button>
<button id="shoot">🔫 ОГОНЬ</button>
</div>

<script>
"use strict";

// Полифилл roundRect для старых браузеров/WebView (иначе игра падала намертво)
if(!CanvasRenderingContext2D.prototype.roundRect){
 CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h);return this;};
}

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const info=document.getElementById("info");
const message=document.getElementById("message");

const worlds=[
 {name:"Лесная тропинка",sky:"#8bd7f5",ground:"#55a84c",enemy:"🐰"},
 {name:"Волчий лес",sky:"#829ac5",ground:"#477b42",enemy:"🐺"},
 {name:"Медвежья поляна",sky:"#a6d5a0",ground:"#438b46",enemy:"🐻"},
 {name:"Лисья опушка",sky:"#ffc47b",ground:"#68a34b",enemy:"🦊"}
];

let world=0,stars=0,lives=3,finished=false;
let camera=0;
let keys={left:false,right:false};
let bullets=[];
let audioStarted=false;
let audioCtx=null;

const player={
 x:70,y:300,vx:0,vy:0,r:19,
 onGround:false,face:1,cooldown:0,inv:0
};

let platforms=[],enemies=[],items=[];
const gravity=.55;
const levelWidth=2400;

function sound(freq=400,duration=.12,type="square"){
 try{
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type=type;
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(.12,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
  osc.connect(gain);gain.connect(audioCtx.destination);
  osc.start();osc.stop(audioCtx.currentTime+duration);
 }catch(e){}
}

function scream(){
 try{
  if("speechSynthesis" in window){
   speechSynthesis.cancel();
   const voice=new SpeechSynthesisUtterance("Ай, блядь!");
   voice.lang="ru-RU";
   voice.rate=1.15;
   voice.pitch=1.1;
   speechSynthesis.speak(voice);
  }
 }catch(e){}
 sound(180,.25,"sawtooth");
}

function startAudio(){
 if(audioStarted)return;
 audioStarted=true;
 sound(500,.12);
 // Разблокировка речи на iOS: первый speak должен быть внутри жеста пользователя
 try{
  if("speechSynthesis" in window){
   const u=new SpeechSynthesisUtterance(" ");
   u.volume=0;
   speechSynthesis.speak(u);
  }
 }catch(e){}
}

function makeLevel(){
 platforms=[
  {x:0,y:385,w:500,h:60},
  {x:560,y:385,w:280,h:60},
  {x:900,y:385,w:400,h:60},
  {x:1370,y:385,w:350,h:60},
  {x:1800,y:385,w:600,h:60},
  {x:300,y:310,w:130,h:18},
  {x:650,y:295,w:130,h:18},
  {x:1020,y:305,w:140,h:18},
  {x:1460,y:285,w:140,h:18},
  {x:1850,y:300,w:150,h:18}
 ];

 enemies=[
  {x:380,y:350,alive:true,min:330,max:470,dir:1},
  {x:760,y:350,alive:true,min:590,max:810,dir:-1},
  {x:1160,y:350,alive:true,min:950,max:1260,dir:1},
  {x:1550,y:350,alive:true,min:1400,max:1680,dir:-1},
  {x:2000,y:350,alive:true,min:1850,max:2250,dir:1}
 ];

 items=[
  {x:350,y:270,taken:false},
  {x:700,y:255,taken:false},
  {x:1080,y:265,taken:false},
  {x:1510,y:245,taken:false},
  {x:1900,y:260,taken:false},
  {x:2200,y:340,taken:false}
 ];

 bullets=[];
 player.x=70;
 player.y=300;
 player.vx=0;
 player.vy=0;
 player.onGround=false;
 player.face=1;
 player.cooldown=0;
 player.inv=0;
 camera=0;
}

function resetGame(text){
 world=0;stars=0;lives=3;finished=false;
 makeLevel();
 message.textContent=text;
}

function drawBackground(){
 ctx.fillStyle=worlds[world].sky;
 ctx.fillRect(0,0,900,440);

 ctx.fillStyle="#fff";
 for(let i=0;i<5;i++){
  let x=((i*230-camera*.25)%1100+1100)%1100;
  ctx.beginPath();
  ctx.arc(x,75+i%2*35,24,0,Math.PI*2);
  ctx.arc(x+25,75+i%2*35,30,0,Math.PI*2);
  ctx.fill();
 }

 for(let i=0;i<12;i++){
  let x=((i*190-camera*.45)%1100+1100)%1100;
  ctx.fillStyle="#397e48";
  ctx.beginPath();
  ctx.arc(x,360,55,Math.PI,0);
  ctx.fill();
  ctx.fillStyle="#23613b";
  ctx.fillRect(x-5,290,10,75);
 }
}

function drawPlayer(){
 ctx.save();
 ctx.translate(player.x,player.y);

 // Мигание во время неуязвимости
 if(player.inv>0&&Math.floor(player.inv/4)%2===0)ctx.globalAlpha=.35;

 // Ноги (укорочены, чтобы не тонули в земле)
 ctx.fillStyle="#34251c";
 ctx.fillRect(-12,12,10,7);
 ctx.fillRect(3,12,10,7);

 // Кожаная куртка
 ctx.fillStyle="#5a301b";
 ctx.beginPath();
 ctx.roundRect(-17,-8,34,27,8);
 ctx.fill();

 ctx.strokeStyle="#c18a4c";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(0,-5);ctx.lineTo(0,15);
 ctx.stroke();

 // Колобок
 ctx.beginPath();
 ctx.arc(0,-12,19,0,Math.PI*2);
 ctx.fillStyle="#f5b83d";
 ctx.fill();
 ctx.lineWidth=3;
 ctx.strokeStyle="#a96b17";
 ctx.stroke();

 // Глаза и улыбка
 ctx.fillStyle="#38240b";
 ctx.beginPath();
 ctx.arc(-7,-16,2.8,0,7);
 ctx.arc(7,-16,2.8,0,7);
 ctx.fill();
 ctx.strokeStyle="#8b3c16";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(0,-10,7,.2,2.9);
 ctx.stroke();

 // Дробовик
 ctx.save();
 if(player.face<0)ctx.scale(-1,1);
 ctx.fillStyle="#654321";
 ctx.fillRect(10,-8,22,7);
 ctx.fillStyle="#252525";
 ctx.fillRect(24,-7,23,4);
 ctx.fillStyle="#999";
 ctx.fillRect(43,-8,5,6);
 ctx.restore();

 ctx.restore();
}

function draw(){
 drawBackground();
 ctx.save();
 ctx.translate(-camera,0);

 platforms.forEach(p=>{
  ctx.fillStyle=worlds[world].ground;
  ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#9b6335";
  ctx.fillRect(p.x,p.y+12,p.w,p.h);
 });

 items.forEach(s=>{
  if(!s.taken){
   ctx.font="27px Arial";
   ctx.fillText("⭐",s.x-12,s.y+10);
  }
 });

 enemies.forEach(e=>{
  if(e.alive){
   ctx.font="38px Arial";
   ctx.fillText(worlds[world].enemy,e.x-18,e.y+12);
  }
 });

 bullets.forEach(b=>{
  ctx.fillStyle="#ffeb68";
  ctx.fillRect(b.x,b.y,19,5);
  ctx.fillStyle="#ff713b";
  ctx.fillRect(b.x+15,b.y,5,5);
 });

 ctx.fillStyle="#fff";
 ctx.fillRect(2320,245,8,140);
 ctx.fillStyle="#ff4444";
 ctx.fillRect(2328,245,65,38);
 ctx.font="25px Arial";
 ctx.fillText("🏁",2310,230);

 drawPlayer();
 ctx.restore();

 info.textContent="Мир "+(world+1)+" — "+worlds[world].name+
 " · Жизни: "+"❤️".repeat(lives)+" · Звёзды: "+stars;
}

function jump(){
 startAudio();
 if(player.onGround){
  player.vy=-12;
  player.onGround=false;
  sound(550,.13,"sine");
 }
}

function shoot(){
 startAudio();
 if(player.cooldown>0)return;
 player.cooldown=18;
 bullets.push({
  x:player.x+player.face*35,
  y:player.y-17,
  vx:player.face*10
 });
 sound(100,.16,"sawtooth");
 setTimeout(()=>sound(65,.1,"square"),65);
}

// Один шаг физики = 1/60 секунды (не зависит от частоты экрана)
function step(){
 if(finished)return;

 player.vx=0;
 if(keys.left){
  player.vx=-4;
  player.face=-1;
 }
 if(keys.right){
  player.vx=4;
  player.face=1;
 }

 player.x+=player.vx;
 player.x=Math.max(player.r,Math.min(levelWidth-player.r,player.x));

 player.vy+=gravity;
 player.y+=player.vy;
 player.onGround=false;

 platforms.forEach(p=>{
  if(player.x+player.r>p.x &&
     player.x-player.r<p.x+p.w &&
     player.y+player.r>=p.y &&
     player.y+player.r<=p.y+22 &&
     player.vy>=0){
   player.y=p.y-player.r;
   player.vy=0;
   player.onGround=true;
  }
 });

 // Движение врагов (с прижатием к границам патруля — больше не застревают)
 enemies.forEach(e=>{
  if(!e.alive)return;
  e.x+=e.dir*1.25;
  if(e.x<e.min){e.x=e.min;e.dir=1;}
  else if(e.x>e.max){e.x=e.max;e.dir=-1;}

  // Враг приближается к Колобку
  if(Math.abs(player.x-e.x)<160){
   e.x+=Math.sign(player.x-e.x)*.5;
   e.x=Math.max(e.min,Math.min(e.max,e.x));
  }
 });

 // Пули (одна пуля — один враг)
 bullets.forEach(b=>{
  b.x+=b.vx;
  enemies.forEach(e=>{
   if(b.hit)return;
   if(e.alive && Math.abs(b.x-e.x)<28 && Math.abs(b.y-e.y)<35){
    e.alive=false;
    b.hit=true;
    stars++;
    scream();
    message.textContent="💥 Враг побеждён!";
   }
  });
 });
 bullets=bullets.filter(b=>!b.hit&&b.x>camera-50&&b.x<camera+1000);

 if(player.cooldown>0)player.cooldown--;
 if(player.inv>0)player.inv--;

 items.forEach(s=>{
  if(!s.taken && Math.abs(player.x-s.x)<28 &&
     Math.abs(player.y-s.y)<30){
   s.taken=true;
   stars++;
   sound(800,.2,"sine");
   message.textContent="Ты нашёл звёздочку ⭐";
  }
 });

 // Урон от врага (с неуязвимостью после удара)
 enemies.forEach(e=>{
  if(!e.alive)return;
  let dx=Math.abs(player.x-e.x);
  let dy=Math.abs(player.y-e.y);
  if(dx<31&&dy<32&&player.inv<=0){
   lives--;
   player.inv=90;
   e.x+=player.x<e.x?80:-80;
   e.x=Math.max(e.min,Math.min(e.max,e.x));
   player.x=Math.max(70,player.x-100);
   player.y=280;
   player.vy=-6;
   sound(120,.3,"sawtooth");
   if(lives<=0){
    resetGame("Колобок потерял все жизни. Начнём сначала!");
    return;
   }
   message.textContent="Осторожно! Колобок получил урон!";
  }
 });

 // Падение в яму (во время неуязвимости жизнь не отнимается повторно)
 if(player.y>490){
  if(player.inv<=0){
   lives--;
   player.inv=90;
   message.textContent="Колобок упал в яму!";
  }
  player.x=Math.max(70,player.x-120);
  player.y=280;
  player.vy=0;
  if(lives<=0)resetGame("Колобок потерял все жизни. Начнём сначала!");
 }

 if(player.x>2320){
  if(world<3){
   world++;
   makeLevel();
   message.textContent="Новый мир: "+worlds[world].name+"!";
   sound(700,.3,"sine");
  }else{
   finished=true;
   message.textContent="🎉 Победа! Колобок прошёл все четыре мира! Тапни по экрану или нажми Enter, чтобы сыграть снова.";
   sound(900,.5,"sine");
  }
 }

 camera=Math.max(0,Math.min(levelWidth-900,player.x-300));
}

// Главный цикл: фиксированный шаг физики, отрисовка каждый кадр
const STEP=1000/60;
let acc=0,lastTime=0;
function frame(t){
 if(!lastTime)lastTime=t;
 let dt=t-lastTime;
 lastTime=t;
 if(dt>250)dt=250; // вкладка была свёрнута — не проматываем время рывком
 acc+=dt;
 while(acc>=STEP){
  step();
  acc-=STEP;
 }
 draw();
 requestAnimationFrame(frame);
}

// Кнопки телефона
function bindButton(id,key){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  startAudio();
  keys[key]=true;
  b.setPointerCapture(e.pointerId);
 });
 b.addEventListener("pointerup",()=>keys[key]=false);
 b.addEventListener("pointercancel",()=>keys[key]=false);
 b.addEventListener("lostpointercapture",()=>keys[key]=false);
}
bindButton("left","left");
bindButton("right","right");

document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();jump();
});
document.getElementById("shoot").addEventListener("pointerdown",e=>{
 e.preventDefault();shoot();
});

// Рестарт после победы: тап по экрану
canvas.addEventListener("pointerdown",e=>{
 e.preventDefault();
 startAudio();
 if(finished)resetGame("Новое приключение!");
});

// Клавиатура
document.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault();
 startAudio();
 if(finished&&(e.key==="Enter"||e.key===" ")){resetGame("Новое приключение!");return;}
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if((e.key==="ArrowUp"||e.key===" "||e.key==="w")&&!e.repeat)jump();
 if((e.key==="z"||e.key==="x")&&!e.repeat)shoot();
});
document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});

makeLevel();
draw();
requestAnimationFrame(frame);
</script>
</body>
</html>
