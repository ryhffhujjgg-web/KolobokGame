
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Колобок: Большое приключение</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17283c;color:white;font-family:Arial;text-align:center}
header{padding:10px;background:#263e59}
h1{font-size:22px;margin:5px}
#info{font-size:16px;margin:8px}
canvas{display:block;width:100%;max-width:900px;margin:auto;background:#8bd7f5;border:2px solid white;touch-action:none}
#controls{display:flex;justify-content:center;gap:9px;margin:12px auto;flex-wrap:wrap}
button{font-size:20px;padding:13px 17px;border:0;border-radius:12px;background:#ffcf55;font-weight:bold;touch-action:none}
#shoot{background:#e95b43;color:white}
#jump{background:#69c7ff}
#message{padding:8px;min-height:30px}
</style>
</head>
<body>
<header>
<h1>🥯 Колобок: Большое приключение</h1>
<div id="info"></div>
</header>

<canvas id="game" width="900" height="440"></canvas>
<div id="message">Помоги Колобку пройти все четыре мира!</div>

<div id="controls">
<button id="left">◀</button>
<button id="right">▶</button>
<button id="jump">ПРЫЖОК</button>
<button id="shoot">🔫 ОГОНЬ</button>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const info=document.getElementById("info");
const message=document.getElementById("message");

const worlds=[
 {name:"Лесная тропинка",sky:"#8bd7f5",ground:"#55a84c",enemy:"🐰"},
 {name:"Волчий лес",sky:"#829ac5",ground:"#477b42",enemy:"🐺"},
 {name:"Медвежья поляна",sky:"#a6d5a0",ground:"#438b46",enemy:"🐻"},
 {name:"Лисья опушка",sky:"#ffc47b",ground:"#68a34b",enemy:"🦊"}
];

let world=0,stars=0,lives=3,finished=false;
let camera=0;
let keys={left:false,right:false};
let bullets=[];
let darts=[];
let audioCtx=null;
let audioStarted=false;

const player={
 x:70,y:300,vx:0,vy:0,r:19,
 onGround:false,face:1,cooldown:0,
 invulnerable:0
};

let platforms=[],enemies=[],items=[];

let boss={
 x:2200,y:340,hp:10,maxHp:10,
 alive:true,vy:0,jumpTimer:70,
 dartTimer:100,hitCooldown:0,face:-1
};
let bossBattle=false;
let bossDefeated=false;

const gravity=.55;
const levelWidth=2400;

function sound(freq=400,duration=.12,type="square"){
 try{
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.type=type;
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(.12,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime+duration);
 }catch(e){}
}

function startAudio(){
 if(audioStarted)return;
 audioStarted=true;
 sound(500,.12);
}

function speak(text){
 try{
  if("speechSynthesis" in window){
   speechSynthesis.cancel();
   const voice=new SpeechSynthesisUtterance(text);
   voice.lang="ru-RU";
   voice.rate=1.05;
   voice.pitch=1.15;
   speechSynthesis.speak(voice);
  }
 }catch(e){}
}

function makeLevel(){
 platforms=[
  {x:0,y:385,w:500,h:60},
  {x:560,y:385,w:280,h:60},
  {x:900,y:385,w:400,h:60},
  {x:1370,y:385,w:350,h:60},
  {x:1800,y:385,w:600,h:60},
  {x:300,y:310,w:130,h:18},
  {x:650,y:295,w:130,h:18},
  {x:1020,y:305,w:140,h:18},
  {x:1460,y:285,w:140,h:18},
  {x:1850,y:300,w:150,h:18}
 ];

 enemies=[
  {x:380,y:350,alive:true,min:330,max:470,dir:1},
  {x:760,y:350,alive:true,min:590,max:810,dir:-1},
  {x:1160,y:350,alive:true,min:950,max:1260,dir:1},
  {x:1550,y:350,alive:true,min:1400,max:1680,dir:-1},
  {x:1900,y:350,alive:true,min:1850,max:2050,dir:1}
 ];

 items=[
  {x:350,y:270,taken:false},
  {x:700,y:255,taken:false},
  {x:1080,y:265,taken:false},
  {x:1510,y:245,taken:false},
  {x:1900,y:260,taken:false},
  {x:2100,y:340,taken:false}
 ];

 bullets=[];
 darts=[];
 boss={
  x:2220,y:340,hp:10,maxHp:10,
  alive:true,vy:0,jumpTimer:70,
  dartTimer:100,hitCooldown:0,face:-1
 };
 bossBattle=false;
 bossDefeated=false;

 player.x=70;
 player.y=300;
 player.vx=0;
 player.vy=0;
 player.onGround=false;
 player.face=1;
 player.cooldown=0;
 player.invulnerable=0;
 camera=0;
}

function drawBackground(){
 ctx.fillStyle=worlds[world].sky;
 ctx.fillRect(0,0,900,440);

 ctx.fillStyle="#fff";
 for(let i=0;i<5;i++){
  let x=((i*230-camera*.25)%1100+1100)%1100;
  ctx.beginPath();
  ctx.arc(x,75+i%2*35,24,0,Math.PI*2);
  ctx.arc(x+25,75+i%2*35,30,0,Math.PI*2);
  ctx.fill();
 }

 for(let i=0;i<12;i++){
  let x=((i*190-camera*.45)%1100+1100)%1100;
  ctx.fillStyle="#397e48";
  ctx.beginPath();
  ctx.arc(x,360,55,Math.PI,0);
  ctx.fill();
  ctx.fillStyle="#23613b";
  ctx.fillRect(x-5,290,10,75);
 }
}

function drawPlayer(){
 ctx.save();
 ctx.translate(player.x,player.y);

 ctx.fillStyle="#34251c";
 ctx.fillRect(-12,12,10,12);
 ctx.fillRect(3,12,10,12);

 // Кожаная куртка
 ctx.fillStyle="#5a301b";
 ctx.beginPath();
 ctx.roundRect(-17,-8,34,27,8);
 ctx.fill();

 ctx.strokeStyle="#c18a4c";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.moveTo(0,-5);
 ctx.lineTo(0,15);
 ctx.stroke();

 // Голова Колобка
 ctx.beginPath();
 ctx.arc(0,-12,19,0,Math.PI*2);
 ctx.fillStyle="#f5b83d";
 ctx.fill();
 ctx.lineWidth=3;
 ctx.strokeStyle="#a96b17";
 ctx.stroke();

 ctx.fillStyle="#38240b";
 ctx.beginPath();
 ctx.arc(-7,-16,2.8,0,7);
 ctx.arc(7,-16,2.8,0,7);
 ctx.fill();

 ctx.strokeStyle="#8b3c16";
 ctx.lineWidth=2;
 ctx.beginPath();
 ctx.arc(0,-10,7,.2,2.9);
 ctx.stroke();

 // Дробовик
 ctx.save();
 if(player.face<0)ctx.scale(-1,1);
 ctx.fillStyle="#654321";
 ctx.fillRect(10,-8,22,7);
 ctx.fillStyle="#252525";
 ctx.fillRect(24,-7,23,4);
 ctx.fillStyle="#999";
 ctx.fillRect(43,-8,5,6);
 ctx.restore();

 ctx.restore();
}

function drawBoss(){
 if(!boss.alive)return;

 ctx.save();
 ctx.translate(boss.x,boss.y);

 // Хвост
 ctx.fillStyle="#e87824";
 ctx.beginPath();
 ctx.ellipse(-25,7,25,9,-.3,0,Math.PI*2);
 ctx.fill();
 ctx.fillStyle="#fff";
 ctx.beginPath();
 ctx.arc(-44,1,8,0,Math.PI*2);
 ctx.fill();

 // Тело
 ctx.fillStyle="#d96820";
 ctx.beginPath();
 ctx.ellipse(0,0,25,29,0,0,Math.PI*2);
 ctx.fill();

 // Белая грудка
 ctx.fillStyle="#fff0d5";
 ctx.beginPath();
 ctx.ellipse(0,9,14,17,0,0,Math.PI*2);
 ctx.fill();

 // Уши
 ctx.fillStyle="#d96820";
 ctx.beginPath();
 ctx.moveTo(-16,-20);ctx.lineTo(-21,-48);ctx.lineTo(-3,-28);
 ctx.fill();
 ctx.beginPath();
 ctx.moveTo(10,-27);ctx.lineTo(20,-49);ctx.lineTo(23,-18);
 ctx.fill();

 // Морда
 ctx.fillStyle="#fff0d5";
 ctx.beginPath();
 ctx.ellipse(0,-17,17,12,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#20130c";
 ctx.beginPath();
 ctx.arc(-7,-23,3,0,7);
 ctx.arc(8,-23,3,0,7);
 ctx.arc(2,-14,3,0,7);
 ctx.fill();

 // Лапы
 ctx.fillStyle="#b95319";
 ctx.fillRect(-18,19,12,12);
 ctx.fillRect(7,19,12,12);

 ctx.restore();

 // Полоска здоровья
 const bx=boss.x-40;
 const by=boss.y-65;
 ctx.fillStyle="#222";
 ctx.fillRect(bx,by,80,10);
 ctx.fillStyle="#e32e36";
 ctx.fillRect(bx,by,80*(boss.hp/boss.maxHp),10);
 ctx.strokeStyle="white";
 ctx.strokeRect(bx,by,80,10);

 ctx.fillStyle="#fff";
 ctx.font="bold 14px Arial";
 ctx.textAlign="center";
 ctx.fillText("БОСС ЛИСА",boss.x,boss.y-72);
 ctx.textAlign="left";
}

function draw(){
 drawBackground();
 ctx.save();
 ctx.translate(-camera,0);

 platforms.forEach(p=>{
  ctx.fillStyle=worlds[world].ground;
  ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#9b6335";
  ctx.fillRect(p.x,p.y+12,p.w,p.h);
 });

 items.forEach(s=>{
  if(!s.taken){
   ctx.font="27px Arial";
   ctx.fillText("⭐",s.x-12,s.y+10);
  }
 });

 enemies.forEach(e=>{
  if(e.alive){
   ctx.font="38px Arial";
   ctx.fillText(worlds[world].enemy,e.x-18,e.y+12);
  }
 });

 bullets.forEach(b=>{
  ctx.fillStyle="#ffeb68";
  ctx.fillRect(b.x,b.y,19,5);
  ctx.fillStyle="#ff713b";
  ctx.fillRect(b.x+15,b.y,5,5);
 });

 darts.forEach(d=>{
  ctx.save();
  ctx.translate(d.x,d.y);
  ctx.rotate(d.vx>0?0:Math.PI);
  ctx.fillStyle="#292929";
  ctx.fillRect(-10,-2,20,4);
  ctx.fillStyle="#eee";
  ctx.beginPath();
  ctx.moveTo(10,-5);
  ctx.lineTo(18,0);
  ctx.lineTo(10,5);
  ctx.fill();
  ctx.restore();
 });

 drawBoss();

 ctx.fillStyle="#fff";
 ctx.fillRect(2320,245,8,140);
 ctx.fillStyle="#ff4444";
 ctx.fillRect(2328,245,65,38);
 ctx.font="25px Arial";
 ctx.fillText("🏁",2310,230);

 drawPlayer();
 ctx.restore();

 info.textContent="Мир "+(world+1)+" — "+worlds[world].name+
 " · Жизни: "+"❤️".repeat(lives)+" · Звёзды: "+stars;
}

function jump(){
 startAudio();
 if(player.onGround){
  player.vy=-12;
  player.onGround=false;
  sound(550,.13,"sine");
 }
}

function shoot(){
 startAudio();
 if(player.cooldown>0||finished)return;

 player.cooldown=18;
 bullets.push({
  x:player.x+player.face*35,
  y:player.y-17,
  vx:player.face*10,
  hit:false
 });
 sound(100,.16,"sawtooth");
 setTimeout(()=>sound(65,.1,"square"),65);
}

function hitPlayer(){
 if(player.invulnerable>0)return;

 lives--;
 player.invulnerable=90;
 player.vy=-7;
 player.x=Math.max(70,player.x-35);
 sound(120,.3,"sawtooth");

 if(lives<=0){
  lives=3;
  stars=0;
  world=0;
  makeLevel();
  message.textContent="Колобок проиграл! Начнём сначала.";
 }else{
  message.textContent="Осторожно! Колобок получил урон!";
 }
}

function updateBoss(){
 if(world!==3||!boss.alive)return;

 if(player.x>1950)bossBattle=true;
 if(!bossBattle)return;

 // Лиса прыгает
 boss.jumpTimer--;
 if(boss.jumpTimer<=0&&boss.y>=340){
  boss.vy=-13;
  boss.jumpTimer=100;
  sound(260,.12,"sine");
 }

 boss.vy+=.48;
 boss.y+=boss.vy;
 if(boss.y>340){
  boss.y=340;
  boss.vy=0;
 }

 // Лиса перемещается к Колобку
 boss.face=player.x<boss.x?-1:1;
 boss.x+=Math.sign(player.x-boss.x)*.9;
 boss.x=Math.max(2110,Math.min(2310,boss.x));

 // Бросок дротиков
 boss.dartTimer--;
 if(boss.dartTimer<=0){
  boss.dartTimer=95;
  const direction=player.x<boss.x?-1:1;
  darts.push({
   x:boss.x,
   y:boss.y-15,
   vx:direction*5.5,
   vy:-1.2
  });
  sound(300,.1,"triangle");
 }

 // Столкновение с Лисой
 if(Math.abs(player.x-boss.x)<40&&
    Math.abs(player.y-boss.y)<42){
  hitPlayer();
 }

 if(boss.hitCooldown>0)boss.hitCooldown--;
}

function update(){
 if(finished){
  draw();
  return;
 }

 player.vx=0;
 if(keys.left){
  player.vx=-4;
  player.face=-1;
 }
 if(keys.right){
  player.vx=4;
  player.face=1;
 }

 // Пока Лиса жива, не даём пройти за неё
 let nextX=player.x+player.vx;
 if(world===3&&bossBattle&&boss.alive&&nextX>2110){
  nextX=2110;
 }
 player.x=Math.max(player.r,Math.min(levelWidth-player.r,nextX));

 player.vy+=gravity;
 player.y+=player.vy;
 player.onGround=false;

 platforms.forEach(p=>{
  if(player.x+player.r>p.x&&
     player.x-player.r<p.x+p.w&&
     player.y+player.r>=p.y&&
     player.y+player.r<=p.y+22&&
     player.vy>=0){
   player.y=p.y-player.r;
   player.vy=0;
   player.onGround=true;
  }
 });

 // Движение обычных врагов
 enemies.forEach(e=>{
  if(!e.alive)return;
  e.x+=e.dir*1.25;
  if(e.x<e.min||e.x>e.max)e.dir*=-1;

  if(Math.abs(player.x-e.x)<160){
   e.x+=Math.sign(player.x-e.x)*.5;
  }
 });

 // Пули Колобка
 bullets.forEach(b=>{
  b.x+=b.vx;
  enemies.forEach(e=>{
   if(e.alive&&Math.abs(b.x-e.x)<28&&Math.abs(b.y-e.y)<35){
    e.alive=false;
    b.hit=true;
    stars++;
    sound(180,.2,"sawtooth");
    speak("Ай, блядь!");
    message.textContent="Враг побеждён!";
   }
  });

  // Попадание по боссу
  if(world===3&&bossBattle&&boss.alive&&
     Math.abs(b.x-boss.x)<36&&
     Math.abs(b.y-(boss.y-15))<45&&
     boss.hitCooldown<=0){
   boss.hp--;
   boss.hitCooldown=15;
   b.hit=true;
   sound(200,.15,"square");
   message.textContent="Попадание по Лисе! Осталось здоровья: "+boss.hp;

   if(boss.hp<=0){
    boss.alive=false;
    bossDefeated=true;
    darts=[];
    stars+=5;
    speak("А меня за что?");
    message.textContent="🦊 Лиса побеждена! А меня за что?!";
   }
  }
 });

 bullets=bullets.filter(b=>!b.hit&&b.x>camera-50&&b.x<camera+1000);

 // Дротики Лисы
 darts.forEach(d=>{
  d.x+=d.vx;
  d.y+=d.vy;
  d.vy+=.025;

  if(Math.abs(d.x-player.x)<22&&Math.abs(d.y-(player.y-10))<25){
   d.hit=true;
   hitPlayer();
  }
 });
 darts=darts.filter(d=>!d.hit&&d.x>camera-100&&d.x<camera+1000&&d.y<450);

 // Звёзды
 items.forEach(s=>{
  if(!s.taken&&Math.abs(player.x-s.x)<28&&Math.abs(player.y-s.y)<30){
   s.taken=true;
   stars++;
   sound(800,.2,"sine");
   message.textContent="Ты нашёл звёздочку ⭐";
  }
 });

 // Столкновение с обычными врагами
 enemies.forEach(e=>{
  if(!e.alive)return;
  if(Math.abs(player.x-e.x)<31&&Math.abs(player.y-e.y)<32){
   hitPlayer();
   e.x+=player.x<e.x?80:-80;
  }
 });

 if(player.invulnerable>0)player.invulnerable--;
 if(player.cooldown>0)player.cooldown--;

 updateBoss();

 if(player.y>490){
  hitPlayer();
  player.y=280;
  player.vy=0;
 }

 // Переходы между мирами
 if(player.x>2320){
  if(world<3){
   world++;
   makeLevel();
   message.textContent="Новый мир: "+worlds[world].name+"!";
   sound(700,.3,"sine");
  }else if(bossDefeated){
   finished=true;
   message.textContent="🏆 ПОБЕДА! Колобок победил Лису и прошёл игру!";
   speak("Ура! Я победил!");
   sound(900,.5,"sine");
  }
 }

 camera=Math.max(0,Math.min(levelWidth-900,player.x-300));
 draw();
 requestAnimationFrame(update);
}

// Кнопки телефона
function bindButton(id,key){
 const b=document.getElementById(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();
  startAudio();
  keys[key]=true;
  b.setPointerCapture(e.pointerId);
 });
 b.addEventListener("pointerup",()=>keys[key]=false);
 b.addEventListener("pointercancel",()=>keys[key]=false);
 b.addEventListener("lostpointercapture",()=>keys[key]=false);
}

bindButton("left","left");
bindButton("right","right");

document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();
 jump();
});

document.getElementById("shoot").addEventListener("pointerdown",e=>{
 e.preventDefault();
 shoot();
});

// Управление клавиатурой
document.addEventListener("keydown",e=>{
 startAudio();
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=true;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=true;
 if((e.key==="ArrowUp"||e.key===" "||e.key==="w")&&!e.repeat)jump();
 if((e.key==="z"||e.key==="x")&&!e.repeat)shoot();
});

document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")keys.left=false;
 if(e.key==="ArrowRight"||e.key==="d")keys.right=false;
});

makeLevel();
draw();
requestAnimationFrame(update);
</script>
</body>
</html>
