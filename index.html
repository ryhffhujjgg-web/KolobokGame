 {name:"Пещера тролля",sky:"#6b7c93",ground:"#4b5a4a",enemy:"troll",weather:"dust",light:.45,ambient:"cave",music:{tempo:88,root:146.83,scale:'phryg',mel:'b',wave:'triangle',drums:'kick',pad:'dark',echo:true}},
 {name:"Замок Кощея",sky:"#c09bd6",ground:"#5a4b6e",enemy:"skeleton",weather:"sparks",light:.35,ambient:"castle",music:{tempo:104,root:233.08,scale:'harm',mel:'e',wave:'triangle',drums:'soft',pad:'dark',echo:true}},

 {name:"Туманный лес",sky:"#6a7a8a",ground:"#3a4a3a",enemy:"goblin",weather:"fog",light:.55,ambient:"forest",music:{tempo:82,root:146.83,scale:'minor',mel:'d',wave:'sine',drums:'none',pad:'cold',echo:true}},
 {name:"Древний храм",sky:"#8a7a6a",ground:"#5a4a3a",enemy:"troll",weather:"dust",light:.4,ambient:"temple",music:{tempo:102,root:220,scale:'harm',mel:'g',wave:'triangle',drums:'kick',pad:'dark',echo:true}},
 {name:"Финальный лес",sky:"#2b4a2b",ground:"#1a3a1a",enemy:"tree",weather:"rain",light:.55,ambient:"forest",music:{tempo:108,root:146.83,scale:'harm',mel:'b',wave:'triangle',drums:'kick',pad:'dark',echo:true}}
];
const BOSS_MUSIC={tempo:142,root:146.83,scale:'harm',mel:'e',wave:'sawtooth',drums:'kick',pad:'dark',echo:true};
const COMBAT_MUSIC_MOD={tempoMul:1.15};

let world=0,camera=0,player,enemies=[],witches=[],lizards=[],bears=[],bullets=[],enemyBullets=[],stars=[],platforms=[],gaps=[],boss;
let bossBattle=false,gameOver=false,victory=false,totalStars=0,frame=0,keys={},lastSaveFrame=0,lastSafeX=70,gameLoopRunning=false,isTransitioning=false;
let pickups=[],particles=[],rings=[],floatingTexts=[],weather=[],foreground=[];
let shakeTime=0,shakeAmp=0,hitFlash=0;
let playerDashing=0,playerDashCooldown=0;
let currentWeapon='shotgun',minigunInterval=null,isHoldingShoot=false;
let mermaids=[],sharks=[],trees=[],gopniks=[];
let rat=null,levelBannerTimer=0,messageTimer=0;
let gamePhase='playing';
let cutscene={timer:0,phase:0};

function getGravity(){return world===10?0.15:0.55;}
function triggerShake(amp,dur=10){shakeAmp=Math.max(shakeAmp,amp);shakeTime=Math.max(shakeTime,dur);}
function isBossLevel(){return (world+1)%5===0;}
function getBossType(){if(world===4)return 'wolf_alpha';if(world===9)return 'bear_shaman';if(world===14)return 'dragon';if(world===19)return 'fox';return null;}

const A={ctx:null,master:null,sfx:null,mus:null,delay:null,noise:null,sfxOn:true,musicOn:true,ambientOn:true,
 combatGain:null,bossGain:null,baseGain:null,
 init(){if(this.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  this.ctx=new AC();
  this.master=this.ctx.createGain();this.master.gain.value=.9;this.master.connect(this.ctx.destination);
  this.sfx=this.ctx.createGain();this.sfx.gain.value=.85;this.sfx.connect(this.master);
  this.mus=this.ctx.createGain();this.mus.gain.value=0;this.mus.connect(this.master);
  this.baseGain=this.ctx.createGain();this.baseGain.gain.value=1;this.baseGain.connect(this.mus);
  this.combatGain=this.ctx.createGain();this.combatGain.gain.value=0;this.combatGain.connect(this.mus);
  this.bossGain=this.ctx.createGain();this.bossGain.gain.value=0;this.bossGain.connect(this.mus);
  this.delay=this.ctx.createDelay(1.0);this.delay.delayTime.value=.3;
  const fb=this.ctx.createGain();fb.gain.value=.28;const dw=this.ctx.createGain();dw.gain.value=.35;
  this.delay.connect(fb);fb.connect(this.delay);this.delay.connect(dw);dw.connect(this.mus);
  const len=Math.floor(this.ctx.sampleRate*.5),buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.noise=buf;},
 resume(){this.init();if(this.ctx&&this.ctx.state!=='running')this.ctx.resume().catch(()=>{});}
};

function noiseHit(t,dur,type,freq,vol,dest){if(!A.ctx)return;const s=A.ctx.createBufferSource();s.buffer=A.noise;const f=A.ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=A.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);s.connect(f);f.connect(g);g.connect(dest||A.sfx);s.start(t);s.stop(t+dur+.02);}
function sound(freq=440,dur=.1,type='square',vol=.07){if(!A.sfxOn)return;A.resume();if(!A.ctx)return;const t=A.ctx.currentTime,o=A.ctx.createOscillator(),g=A.ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(A.sfx);o.start(t);o.stop(t+dur+.02);}
function sweep(f1,f2,dur,type='sine',vol=.12){if(!A.sfxOn)return;A.resume();if(!A.ctx)return;const t=A.ctx.currentTime,o=A.ctx.createOscillator(),g=A.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(A.sfx);o.start(t);o.stop(t+dur+.02);}
function soundShoot(){if(!A.sfxOn)return;A.resume();if(!A.ctx)return;const t=A.ctx.currentTime;if(currentWeapon==='shotgun'){noiseHit(t,.12,'highpass',1400,.35);sweep(140,38,.2,'sine',.4);}else if(currentWeapon==='minigun'){noiseHit(t,.05,'bandpass',2200,.16);sweep(300,110,.06,'square',.1);}else{noiseHit(t,.06,'highpass',1800,.2);sweep(420,90,.07,'sawtooth',.14);}}

const SFX={jump(){sweep(420,760,.12,'square',.09);},land(){noiseHit(A.ctx?A.ctx.currentTime:0,.1,'lowpass',420,.18);},dash(){sweep(220,900,.18,'sawtooth',.1);},star(){sound(880,.09,'sine',.09);setTimeout(()=>sound(1320,.1,'sine',.07),60);},pickup(){sound(660,.1,'triangle',.1);setTimeout(()=>sound(990,.14,'sine',.09),80);},hurt(){sweep(300,70,.28,'sawtooth',.18);noiseHit(A.ctx?A.ctx.currentTime:0,.18,'lowpass',900,.2);},boom(){if(!A.sfxOn||!A.ctx)return;const t=A.ctx.currentTime;noiseHit(t,.3,'lowpass',1200,.3);sweep(180,40,.3,'sine',.22);},hit(){sound(210,.07,'square',.09);},kill(){sound(520,.08,'square',.08);setTimeout(()=>sound(300,.1,'triangle',.07),60);}};

let voices=[],lastSay=0,lastSayText='';

loadVoices();if('speechSynthesis' in window)speechSynthesis.onvoiceschanged=loadVoices;
function say(text,opts={}){message.textContent=text;messageTimer=180;if(!A.sfxOn||!('speechSynthesis' in window))return;const now=Date.now();if(text===lastSayText&&now-lastSay<1600)return;if(now-lastSay<450)return;lastSay=now;lastSayText=text;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const ru=voices.find(v=>/ru/i.test(v.lang));if(ru)u.voice=ru;u.lang='ru-RU';u.rate=opts.rate||1.05;u.pitch=opts.pitch||1.15;u.volume=opts.volume||.95;speechSynthesis.speak(u);}catch(e){}}

const MUS={timer:null,step:0,next:0,cfg:null,boss:false};
function tone(f,t,dur,type,vol,echo,dest){if(!A.ctx)return;const o=A.ctx.createOscillator(),g=A.ctx.createGain(),lp=A.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0006,t+dur);o.connect(lp);lp.connect(g);g.connect(dest||A.baseGain);if(echo&&A.delay)g.connect(A.delay);o.start(t);o.stop(t+dur+.05);}
function pad(root,t,dur,cfg,dest){if(!A.ctx)return;const map={warm:[0,4,7],cold:[0,3,7],murky:[0,3,6],dark:[0,3,7],water:[0,5,9]};const iv=map[cfg.pad]||[0,4,7];iv.forEach((semi,i)=>{const o=A.ctx.createOscillator(),g=A.ctx.createGain(),lp=A.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=900;o.type=cfg.pad==='water'?'sine':'triangle';o.frequency.value=root*Math.pow(2,semi/12);o.detune.value=(i-1)*7;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+dur*.35);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(lp);lp.connect(g);g.connect(dest||A.baseGain);o.start(t);o.stop(t+dur+.1);});}
function kick(t,v=1,dest){if(!A.ctx)return;const o=A.ctx.createOscillator(),g=A.ctx.createGain();o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);g.gain.setValueAtTime(.16*v,t);g.gain.exponentialRampToValueAtTime(.0008,t+.16);o.connect(g);g.connect(dest||A.baseGain);o.start(t);o.stop(t+.18);}
function hat(t,v=.05,dest){noiseHit(t,.05,'highpass',6500,v,dest||A.baseGain);}
function musicStep(step,t,cfg,dest){const sc=SCALES[cfg.scale],mel=MEL[cfg.mel],spb=60/cfg.tempo/2;const deg=mel[step%mel.length];if(deg>=0){const semi=sc[deg%sc.length]+12*Math.floor(deg/sc.length);tone(cfg.root*Math.pow(2,semi/12),t,spb*1.7,cfg.wave,cfg.wave==='sawtooth'||cfg.wave==='square'?.045:.075,cfg.echo,dest);}if(step%4===0){const prog=[0,5,3,4],bd=prog[Math.floor(step/8)%prog.length];tone(cfg.root/2*Math.pow(2,sc[bd%sc.length]/12),t,spb*3.4,'sine',.1,dest);}if(step%16===0&&cfg.pad)pad(cfg.root/2,t,spb*15.5,cfg,dest);if(cfg.drums!=='none'){if(step%8===0)kick(t,1,dest);if(step%4===2)hat(t,.035,dest);if(cfg.drums==='kick'&&step%8===4)kick(t,.6,dest);}}
function musicTick(){if(!A.ctx||!MUS.cfg)return;const spb=60/MUS.cfg.tempo/2;while(MUS.next<A.ctx.currentTime+.5){if(MUS.boss){musicStep(MUS.step,MUS.next,BOSS_MUSIC,A.bossGain);}else{musicStep(MUS.step,MUS.next,MUS.cfg,A.baseGain);const nearEnemy=enemies.some(e=>e.alive&&Math.abs(e.x-player.x)<300);if(nearEnemy){const combatCfg={...MUS.cfg,tempo:MUS.cfg.tempo*COMBAT_MUSIC_MOD.tempoMul};musicStep(MUS.step,MUS.next,combatCfg,A.combatGain);}}MUS.step++;MUS.next+=spb;}}
function musicStart(){A.resume();if(!A.ctx)return;MUS.cfg=worlds[world].music;MUS.step=0;MUS.next=A.ctx.currentTime+.12;MUS.boss=bossBattle;A.mus.gain.cancelScheduledValues(A.ctx.currentTime);A.mus.gain.setValueAtTime(A.mus.gain.value,A.ctx.currentTime);A.mus.gain.linearRampToValueAtTime(A.musicOn?.5:0,A.ctx.currentTime+1.2);if(!MUS.timer)MUS.timer=setInterval(musicTick,60);}
function musicStop(){if(MUS.timer){clearInterval(MUS.timer);MUS.timer=null;}if(A.ctx)A.mus.gain.linearRampToValueAtTime(0,A.ctx.currentTime+.4);}
function musicToggle(){A.musicOn=!A.musicOn;A.resume();document.getElementById('btn-music').classList.toggle('off',!A.musicOn);if(A.musicOn){musicStart();}else if(A.ctx){A.mus.gain.cancelScheduledValues(A.ctx.currentTime);A.mus.gain.linearRampToValueAtTime(0,A.ctx.currentTime+.3);}}
function sfxToggle(){A.sfxOn=!A.sfxOn;document.getElementById('btn-sfx').classList.toggle('off',!A.sfxOn);document.getElementById('btn-sfx').textContent=A.sfxOn?'🔊':'🔇';if(!A.sfxOn&&'speechSynthesis' in window)speechSynthesis.cancel();}

const AMBIENT_CONFIGS={forest:{sounds:[{freq:800,dur:.1,type:'sine',vol:.03,interval:3000},{freq:1200,dur:.08,type:'sine',vol:.02,interval:5000}]},swamp:{sounds:[{freq:200,dur:.3,type:'sine',vol:.04,interval:4000}]},cave:{sounds:[{freq:100,dur:.5,type:'sine',vol:.05,interval:5000}]},castle:{sounds:[{freq:300,dur:.2,type:'square',vol:.03,interval:4500}]},mountain:{sounds:[{freq:400,dur:.3,type:'triangle',vol:.04,interval:5500}]},fire:{sounds:[{freq:150,dur:.4,type:'sawtooth',vol:.05,interval:3500}]},ice:{sounds:[{freq:1000,dur:.15,type:'sine',vol:.03,interval:4000}]},desert:{sounds:[{freq:250,dur:.3,type:'triangle',vol:.04,interval:5000}]},sky:{sounds:[{freq:600,dur:.2,type:'sine',vol:.03,interval:4500}]},space:{sounds:[{freq:180,dur:.5,type:'sine',vol:.05,interval:6000}]},temple:{sounds:[{freq:220,dur:.35,type:'triangle',vol:.04,interval:5000}]}};
let ambientTimers=[];
function startAmbient(){stopAmbient();if(!A.ambientOn||!A.ctx)return;const cfg=AMBIENT_CONFIGS[worlds[world].ambient];if(!cfg)return;cfg.sounds.forEach((s,i)=>{const timer=setInterval(()=>{if(A.ctx&&A.ambientOn){const t=A.ctx.currentTime,o=A.ctx.createOscillator(),g=A.ctx.createGain();o.type=s.type;o.frequency.setValueAtTime(s.freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(s.vol,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+s.dur);o.connect(g);g.connect(A.mus);o.start(t);o.stop(t+s.dur+.1);}},s.interval+i*500);ambientTimers.push(timer);});}
function stopAmbient(){ambientTimers.forEach(t=>clearInterval(t));ambientTimers=[];}

function grad(c,x,y,r,c1,c2){const g=c.createRadialGradient(x-r*.35,y-r*.45,r*.08,x,y,r*1.05);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;}
function ink(c,w=3){c.strokeStyle='#0d0d12';c.lineWidth=w;c.stroke();}
function blob(c,x,y,rx,ry,c1,c2,lw=3){c.beginPath();c.ellipse(x,y,rx,ry,0,0,TAU);c.fillStyle=grad(c,x,y,Math.max(rx,ry),c1,c2);c.fill();ink(c,lw);}
function tri(c,x1,y1,x2,y2,x3,y3,fill,lw=3){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineTo(x3,y3);c.closePath();c.fillStyle=fill;c.fill();ink(c,lw);}
function eye(c,x,y,r,lx,ly,blink,white='#fff',pupil='#141420'){if(blink){c.strokeStyle='#0d0d12';c.lineWidth=Math.max(2,r*.55);c.beginPath();c.moveTo(x-r,y);c.quadraticCurveTo(x,y+r*.5,x+r,y);c.stroke();return;}c.beginPath();c.ellipse(x,y,r,r*1.15,0,0,TAU);c.fillStyle=white;c.fill();ink(c,Math.max(1.4,r*.34));c.beginPath();c.arc(x+lx*r*.34,y+ly*r*.3,r*.5,0,TAU);c.fillStyle=pupil;c.fill();c.beginPath();c.arc(x+lx*r*.34-r*.22,y+ly*r*.3-r*.26,r*.19,0,TAU);c.fillStyle='#fff';c.fill();}
function drawShadow(c,x,y,w,h,a=.3){c.save();c.fillStyle=`rgba(0,0,0,${a})`;c.beginPath();c.ellipse(x,y,w,h,0,0,TAU);c.fill();c.restore();}
function entShadow(c,x,y,w){const k=clamp((GROUND_Y-y)/220,0,1);drawShadow(c,x,GROUND_Y+6,w*(1-k*.45),w*.3*(1-k*.45),.33*(1-k*.55));}
function drawHatching(c,x,y,w,h,color='#000',alpha=.18,sp=5){c.save();c.beginPath();c.rect(x,y,w,h);c.clip();c.globalAlpha=alpha;c.strokeStyle=color;c.lineWidth=1;for(let i=-h;i<w+h;i+=sp){c.beginPath();c.moveTo(x+i,y);c.lineTo(x+i-h,y+h);c.stroke();}c.restore();}
function initAnim(o){o.t=rnd(0,120);o.blink=0;o.sq=1;o.st=1;o.walk=0;return o;}
function tickAnim(o,moving,sp=.3){o.t=(o.t||0)+1;if(o.blink>0)o.blink--;else if(Math.random()<.006)o.blink=8;o.sq+=(1-(o.sq||1))*.18;o.st+=(1-(o.st||1))*.18;if(moving)o.walk=(o.walk||0)+sp;}
function lookAt(e){return Math.sign(player.x-e.x)||1;}

function spawnParticles(x,y,color,count,speed=6,size=3,gravity){for(let i=0;i<count;i++)particles.push({x,y,vx:rnd(-speed,speed),vy:rnd(-speed,speed*.4)-1.5,life:22+Math.random()*26,maxLife:48,color,size:size+Math.random()*2.5,grav:gravity!==undefined?gravity:.22});}
function spawnDust(x,y,n=5){for(let i=0;i<n;i++)particles.push({x:x+rnd(-8,8),y,vx:rnd(-1.6,1.6),vy:rnd(-2.2,-.4),life:18+Math.random()*14,maxLife:32,color:'rgba(220,210,180,0.85)',size:2+Math.random()*3,grav:.05});}
function spawnExplosion(x,y){spawnParticles(x,y,'#f4cf43',16,8,4);spawnParticles(x,y,'#e85b50',12,6,3);spawnParticles(x,y,'#fff',6,4,2);rings.push({x,y,r:6,life:18,maxLife:18});floatingTexts.push({x:x-camera,y:y-24,text:['БАМ!','БАЦ!','ХРЯСЬ!'][Math.floor(Math.random()*3)],color:'#fff',life:34,maxLife:34,size:34});triggerShake(7,9);SFX.boom();}
function addFloatingText(x,y,text,color,size=22){floatingTexts.push({x,y,text,color,life:52,maxLife:52,size});}
function updateEffects(){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=p.grav;p.vx*=.96;p.life--;p.size*=.975;if(p.life<=0||p.size<.5)particles.splice(i,1);}for(let i=rings.length-1;i>=0;i--){const r=rings[i];r.r+=4.5;r.life--;if(r.life<=0)rings.splice(i,1);}}
function drawParticles(c){for(const p of particles){c.globalAlpha=clamp(p.life/p.maxLife,0,1);c.fillStyle=p.color;c.beginPath();c.arc(p.x-camera,p.y,p.size,0,TAU);c.fill();}c.globalAlpha=1;for(const r of rings){c.globalAlpha=r.life/r.maxLife*.8;c.strokeStyle='#fff';c.lineWidth=4;c.beginPath();c.arc(r.x-camera,r.y,r.r,0,TAU);c.stroke();c.strokeStyle='#f4cf43';c.lineWidth=2;c.beginPath();c.arc(r.x-camera,r.y,r.r*.7,0,TAU);c.stroke();}c.globalAlpha=1;}
function drawFloatingTexts(c){for(let i=floatingTexts.length-1;i>=0;i--){const t=floatingTexts[i];t.y-=1.4;t.life--;c.globalAlpha=clamp(t.life/t.maxLife,0,1);c.font=`bold ${t.size||22}px 'Courier New'`;c.textAlign='center';c.lineWidth=5;c.strokeStyle='#000';c.strokeText(t.text,t.x,t.y);c.fillStyle=t.color||'#fff';c.fillText(t.text,t.x,t.y);c.globalAlpha=1;if(t.life<=0)floatingTexts.splice(i,1);}}

function makeWeather(){weather=[];const type=worlds[world].weather;if(type==='none')return;const n=type==='rain'?150:type==='bubbles'?55:type==='snow'?120:type==='sand'?100:type==='stars'?80:type==='clouds'?40:type==='crystals'?60:type==='fog'?50:70;for(let i=0;i<n;i++)weather.push({x:rnd(0,W),y:rnd(0,H),s:rnd(.5,1.6),a:rnd(0,TAU),sp:rnd(.6,1.6),type});}
function updateWeather(){for(const p of weather){if(p.type==='rain'){p.y+=12*p.sp;p.x-=3*p.sp;}else if(p.type==='leaves'){p.y+=1.3*p.sp;p.x+=Math.sin(frame*.03+p.a)*1.2-.4;p.a+=.05;}else if(p.type==='ash'){p.y+=.9*p.sp;p.x+=Math.sin(frame*.02+p.a)*.6;}else if(p.type==='dust'){p.y+=Math.sin(frame*.02+p.a)*.3;p.x-=.4*p.sp;}else if(p.type==='sparks'){p.y-=1.5*p.sp;p.x+=Math.sin(frame*.05+p.a)*.8;}else if(p.type==='bubbles'){p.y-=1.1*p.sp;p.x+=Math.sin(frame*.04+p.a)*.7;}else if(p.type==='snow'){p.y+=1.5*p.sp;p.x+=Math.sin(frame*.03+p.a)*.8;}else if(p.type==='sand'){p.y+=.8*p.sp;p.x+=2*p.sp;}else if(p.type==='stars'){p.y+=.2*p.sp;p.x+=Math.sin(frame*.02+p.a)*.3;}else if(p.type==='clouds'){p.y+=.3*p.sp;p.x+=.5*p.sp;}else if(p.type==='crystals'){p.y+=Math.sin(frame*.04+p.a)*.5;p.x+=Math.cos(frame*.03+p.a)*.5;}else if(p.type==='fog'){p.y+=Math.sin(frame*.02+p.a)*.2;p.x+=.3*p.sp;}if(p.y>H+20){p.y=-20;p.x=rnd(0,W);}if(p.y<-30){p.y=H+10;p.x=rnd(0,W);}if(p.x<-30)p.x=W+20;if(p.x>W+30)p.x=-20;}}
function drawWeather(c){const th=worlds[world];for(const p of weather){c.save();if(p.type==='rain'){c.strokeStyle='rgba(180,215,255,.55)';c.lineWidth=1.6*p.s;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-4,p.y+14*p.s);c.stroke();}else if(p.type==='leaves'){c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=['#d98a2b','#c96a1e','#e8b23c'][Math.floor(p.s*2)%3];c.globalAlpha=.85;c.beginPath();c.ellipse(0,0,6*p.s,3*p.s,0,0,TAU);c.fill();}else if(p.type==='ash'){c.fillStyle='rgba(90,80,80,.6)';c.beginPath();c.arc(p.x,p.y,2*p.s,0,TAU);c.fill();}else if(p.type==='dust'){c.fillStyle='rgba(230,220,190,.35)';c.beginPath();c.arc(p.x,p.y,2.2*p.s,0,TAU);c.fill();}else if(p.type==='sparks'){c.fillStyle='rgba(255,190,90,.85)';c.beginPath();c.arc(p.x,p.y,1.8*p.s,0,TAU);c.fill();}else if(p.type==='bubbles'){c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=1.5;c.beginPath();c.arc(p.x,p.y,4*p.s+2,0,TAU);c.stroke();}else if(p.type==='snow'){c.fillStyle='rgba(255,255,255,.8)';c.beginPath();c.arc(p.x,p.y,3*p.s,0,TAU);c.fill();}else if(p.type==='sand'){c.fillStyle='rgba(230,200,140,.5)';c.beginPath();c.arc(p.x,p.y,2*p.s,0,TAU);c.fill();}else if(p.type==='stars'){c.fillStyle='rgba(255,255,200,.7)';c.beginPath();c.arc(p.x,p.y,1.5*p.s,0,TAU);c.fill();}else if(p.type==='clouds'){c.fillStyle='rgba(255,255,255,.3)';c.beginPath();c.arc(p.x,p.y,10*p.s,0,TAU);c.fill();}else if(p.type==='crystals'){c.fillStyle='rgba(180,220,255,.6)';c.beginPath();c.arc(p.x,p.y,2.5*p.s,0,TAU);c.fill();}else if(p.type==='fog'){c.fillStyle='rgba(200,200,220,.25)';c.beginPath();c.arc(p.x,p.y,8*p.s,0,TAU);c.fill();}c.restore();}c.globalAlpha=1;if(th.light>0){c.save();c.globalCompositeOperation='lighter';for(let i=0;i<4;i++){const bx=180+i*280-(camera*.25%280);const g=c.createLinearGradient(bx,0,bx+120,GROUND_Y);g.addColorStop(0,`rgba(255,245,200,${.10*th.light*2})`);g.addColorStop(1,'rgba(255,245,200,0)');c.fillStyle=g;c.beginPath();c.moveTo(bx,0);c.lineTo(bx+90,0);c.lineTo(bx+220,GROUND_Y);c.lineTo(bx+40,GROUND_Y);c.closePath();c.fill();}c.restore();}}
function drawSky(c){const th=worlds[world],g=c.createLinearGradient(0,0,0,H);if(world===10){g.addColorStop(0,'#001a33');g.addColorStop(.5,'#006699');g.addColorStop(1,'#2fb8b8');}else if(world===11){g.addColorStop(0,'#0d1a0d');g.addColorStop(.55,'#22401f');g.addColorStop(1,'#3a5a34');}else if(world===9){g.addColorStop(0,'#5a1a10');g.addColorStop(.45,'#ff7e5f');g.addColorStop(1,'#ffc08a');}else{g.addColorStop(0,th.sky);g.addColorStop(.45,'#a8d8f0');g.addColorStop(.82,'#d9eecf');g.addColorStop(1,'#eaf6d8');}c.fillStyle=g;c.fillRect(0,0,W,H);if(world!==10){const sx=W-170,sy=100+Math.sin(frame*.005)*4;const sg=c.createRadialGradient(sx,sy,8,sx,sy,110);sg.addColorStop(0,'rgba(255,250,205,.95)');sg.addColorStop(1,'rgba(255,250,205,0)');c.fillStyle=sg;c.beginPath();c.arc(sx,sy,110,0,TAU);c.fill();c.fillStyle='#fff8c0';c.beginPath();c.arc(sx,sy,46,0,TAU);c.fill();ink(c,3);c.fillStyle='rgba(255,255,255,.72)';for(let i=0;i<6;i++){const cx=((i*260-camera*.14)%(W+320)+W+320)%(W+320)-160,cy=55+i*26+Math.sin(frame*.012+i)*7;c.beginPath();c.arc(cx,cy,26,0,TAU);c.arc(cx+24,cy-11,33,0,TAU);c.arc(cx+50,cy,25,0,TAU);c.arc(cx+24,cy+9,24,0,TAU);c.fill();}}else{c.save();c.globalCompositeOperation='lighter';for(let i=0;i<5;i++){const bx=120+i*240-(camera*.2%240);const g2=c.createLinearGradient(bx,0,bx+80,H);g2.addColorStop(0,'rgba(160,240,255,.16)');g2.addColorStop(1,'rgba(160,240,255,0)');c.fillStyle=g2;c.beginPath();c.moveTo(bx,0);c.lineTo(bx+70,0);c.lineTo(bx+180,H);c.lineTo(bx+30,H);c.closePath();c.fill();}c.restore();}}
function drawTree3D(c,x,y,s=1){c.save();c.translate(x,y);c.scale(s,s);const sway=Math.sin(frame*.02+x*.01)*3;drawShadow(c,0,6,22,6,.22);const tg=c.createLinearGradient(-9,0,9,0);tg.addColorStop(0,'#33200f');tg.addColorStop(.45,'#6b4522');tg.addColorStop(1,'#33200f');c.fillStyle=tg;c.beginPath();c.moveTo(-9,4);c.lineTo(-6,-58);c.lineTo(6,-58);c.lineTo(9,4);c.closePath();c.fill();ink(c,3);const lg=grad(c,sway,-68,42,'#4fc35a','#1b5e20');c.fillStyle=lg;c.beginPath();c.arc(sway,-70,29,0,TAU);c.arc(-20+sway,-50,21,0,TAU);c.arc(20+sway,-50,21,0,TAU);c.fill();ink(c,4);drawHatching(c,-30,-92,60,50,'#000',.12,7);c.restore();}

function drawGroundSegment(c,startX,width,th){const sx=startX-camera;if(sx+width<-60||sx>W+60)return;const g=c.createLinearGradient(0,GROUND_Y,0,H);g.addColorStop(0,th.ground);g.addColorStop(1,'rgba(0,0,0,.55)');c.fillStyle=th.ground;c.fillRect(sx,GROUND_Y,width,H-GROUND_Y);c.fillStyle=g;c.fillRect(sx,GROUND_Y,width,H-GROUND_Y);c.fillStyle=world===10?'#e0c477':(world===9?'#c4562c':'#7bd66a');c.fillRect(sx,GROUND_Y,width,16);c.strokeStyle='#0d0d12';c.lineWidth=4;c.beginPath();c.moveTo(sx,GROUND_Y);c.lineTo(sx+width,GROUND_Y);c.stroke();drawHatching(c,sx,GROUND_Y+16,width,H-GROUND_Y-16,'#000',.16,9);c.fillStyle=world===10?'#f0dca0':'#a8e88e';for(let i=0;i<width;i+=24){const tx=sx+i;if(tx<-20||tx>W+20)continue;const sw=Math.sin(frame*.05+i*.3)*3;c.beginPath();c.moveTo(tx,GROUND_Y);c.quadraticCurveTo(tx+4+sw,GROUND_Y-13,tx+9+sw,GROUND_Y);c.fill();}}
function drawPlatform3D(c,p){const x=p.x-camera;if(x<-220||x>W+220)return;const d=26;drawShadow(c,x+p.w/2,p.y+52,p.w/2+16,12,.3);c.fillStyle='#4a3020';c.beginPath();c.moveTo(x,p.y+p.h);c.lineTo(x+p.w,p.y+p.h);c.lineTo(x+p.w-8,p.y+p.h+d);c.lineTo(x+8,p.y+p.h+d);c.closePath();c.fill();ink(c,3.5);c.fillStyle=world===10?'#e0c477':'#7bd66a';c.beginPath();c.moveTo(x,p.y);c.lineTo(x+p.w,p.y);c.lineTo(x+p.w+6,p.y+p.h);c.lineTo(x-6,p.y+p.h);c.closePath();c.fill();ink(c,4);drawHatching(c,x,p.y+p.h,p.w,d,'#000',.18,6);c.fillStyle='#8a5c31';c.fillRect(x+6,p.y+p.h+2,p.w-12,5);}

function drawPlayer(c){const x=player.x-camera,y=player.y;const moving=(keys.left||keys.right||Math.abs(player.vx)>.6)&&player.onGround;entShadow(c,x,y,24*player.sq);if(player.invincible>0&&Math.floor(frame/4)%2===0)return;const bh=44,bx=x-bh/2,by=y-64;c.fillStyle='#000';c.fillRect(bx-2,by-2,bh+4,10);for(let i=0;i<3;i++){c.fillStyle=i<player.health?'#e33':'#3a3a3a';c.fillRect(bx+i*(bh/3),by,bh/3-2,6);}const br=Math.sin(player.t*.13)*1.5,swing=moving?Math.sin(player.walk)*8:0;if(playerDashing>0){c.save();c.globalAlpha=.35;for(let i=1;i<=3;i++){c.strokeStyle='#c158dc';c.lineWidth=3;c.beginPath();c.arc(x-player.facing*i*16,y,24,0,TAU);c.stroke();}c.restore();c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=2;for(let i=0;i<6;i++){const ly=y-22+Math.random()*44,lx=x-player.facing*(28+Math.random()*40);c.beginPath();c.moveTo(lx,ly);c.lineTo(lx-player.facing*26,ly);c.stroke();}}c.save();c.translate(x,y);c.scale(player.facing*player.sq,player.st);c.fillStyle=grad(c,0,18,14,'#5a3a22','#2b1710');c.beginPath();c.ellipse(-8+swing,19,7,10,.3,0,TAU);c.fill();ink(c,3);c.beginPath();c.ellipse(8-swing,19,7,10,-.3,0,TAU);c.fill();ink(c,3);blob(c,0,5+br,17,15,'#f08a34','#b8500f',3.5);c.fillStyle='#8b4513';c.fillRect(-1.5,-8+br,3,24);drawHatching(c,-17,-9+br,34,28,'#000',.16,5);const arm=moving?Math.sin(player.walk)*5:0;blob(c,-18,2+br+arm,6,9,'#ffdc6b','#e0a92c',2.5);blob(c,0,-14+br,23,22,'#ffe783','#efc23c',3.5);drawHatching(c,-16,-24+br,32,16,'#a86a1e',.3,5);const lx=clamp(player.vx*.25,-1,1),ly=clamp(player.vy*.08,-1,1);eye(c,-8,-18+br,6.5,lx,ly,player.blink>0);eye(c,8,-18+br,6.5,lx,ly,player.blink>0);c.strokeStyle='#0d0d12';c.lineWidth=2.6;if(player.health<=1){c.beginPath();c.arc(0,-2+br,7,Math.PI+.3,TAU-.3);c.stroke();}else{c.beginPath();c.arc(0,-5+br,8,.25,Math.PI-.25);c.stroke();c.fillStyle='#fff';c.beginPath();c.moveTo(-4,-4+br);c.lineTo(-2,2+br);c.lineTo(0,-4+br);c.fill();c.beginPath();c.moveTo(4,-4+br);c.lineTo(2,2+br);c.lineTo(0,-4+br);c.fill();}const rec=(isHoldingShoot&& function drawBossWolfAlpha(c){if(!boss||!boss.alive)return;const x=boss.x-camera,br=Math.sin(boss.t*.08)*3;entShadow(c,x,boss.y,48);const flash=boss.hurtFlash>0&&Math.floor(frame/3)%2===0;c.save();c.translate(x,boss.y+br);c.scale((boss.facing||1)*boss.sq,boss.st);c.save();c.translate(-20,-8);c.rotate(-.6+Math.sin(boss.t*.12)*.4);blob(c,0,-12,7,20,flash?'#ffd0a0':'#8a8a94',flash?'#e8b860':'#4a4a54',3);c.restore();blob(c,0,0,44,38,flash?'#ffc890':'#6a6a74',flash?'#e8a070':'#3a3a44',5);drawHatching(c,-34,-18,68,40,'#000',.18,7);blob(c,5,-32,20,18,flash?'#ffd0a0':'#7a7a84',flash?'#e8a070':'#4a4a54',4);blob(c,18,-28,12,8,flash?'#ffe0b0':'#9a9aa4',flash?'#e8b080':'#5a5a64',3);c.fillStyle='#14141c';c.beginPath();c.arc(26,-30,4,0,TAU);c.fill();tri(c,-8,-44,-16,-62,0,-46,flash?'#ffc890':'#5a5a64',3);tri(c,14,-44,22,-62,8,-46,flash?'#ffc890':'#5a5a64',3);const lk=lookAt(boss)*(boss.facing||1);eye(c,-2,-36,6,lk,0,boss.blink>0,'#ff3300');c.fillStyle='#fff';for(let i=0;i<5;i++){c.beginPath();c.moveTo(12+i*3,-22);c.lineTo(14+i*3,-14);c.lineTo(16+i*3,-22);c.fill();}c.restore();const bw=120,bx=x-bw/2,by=boss.y-120;c.fillStyle='#2b1414';c.fillRect(bx-3,by-3,bw+6,18);ink(c,3);c.fillStyle='#e33';c.fillRect(bx,by,bw*(boss.hp/boss.maxHp),12);c.fillStyle='#fff';c.font="bold 11px 'Courier New'";c.textAlign='center';c.fillText('ВОЛК-ВОЖАК',x,by-8);}
function drawBossBearShaman(c){if(!boss||!boss.alive)return;const x=boss.x-camera,br=Math.sin(boss.t*.08)*3;entShadow(c,x,boss.y,52);const flash=boss.hurtFlash>0&&Math.floor(frame/3)%2===0;c.save();c.translate(x,boss.y+br);c.scale((boss.facing||1)*boss.sq,boss.st);blob(c,0,0,48,42,flash?'#ffe0a0':'#8a5c1c',flash?'#e8c070':'#5a3d1c',5);drawHatching(c,-38,-20,76,44,'#000',.2,7);blob(c,0,-36,22,20,flash?'#ffe8b8':'#a8752a',flash?'#e8c880':'#6b4514',4);blob(c,-16,-52,8,8,flash?'#ffe8b8':'#8a5c1c',flash?'#e8c070':'#5a3d1c',3);blob(c,16,-52,8,8,flash?'#ffe8b8':'#8a5c1c',flash?'#e8c070':'#5a3d1c',3);blob(c,7,-30,13,10,flash?'#ffe8b8':'#c08a34',flash?'#e8c880':'#7d5218',3);c.fillStyle='#14141c';c.beginPath();c.arc(9,-34,4.5,0,TAU);c.fill();const lk=lookAt(boss)*(boss.facing||1);eye(c,-6,-40,5.5,lk,0,boss.blink>0,'#ffaa00');eye(c,12,-40,5.5,lk,0,boss.blink>0,'#ffaa00');c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(0,-60,2,0,-60,18);g.addColorStop(0,'rgba(255,170,0,.6)');g.addColorStop(1,'rgba(255,170,0,0)');c.fillStyle=g;c.beginPath();c.arc(0,-60,18,0,TAU);c.fill();c.restore();c.restore();const bw=130,bx=x-bw/2,by=boss.y-130;c.fillStyle='#2b1414';c.fillRect(bx-3,by-3,bw+6,18);ink(c,3);c.fillStyle='#e33';c.fillRect(bx,by,bw*(boss.hp/boss.maxHp),12);c.fillStyle='#fff';c.font="bold 11px 'Courier New'";c.textAlign='center';c.fillText('МЕДВЕДЬ-ШАМАН',x,by-8);}
function drawBossDragon(c){if(!boss||!boss.alive)return;const x=boss.x-camera,br=Math.sin(boss.t*.08)*3,wing=Math.sin(boss.t*.12)*.5;entShadow(c,x,boss.y,56);const flash=boss.hurtFlash>0&&Math.floor(frame/3)%2===0;c.save();c.translate(x,boss.y+br);c.scale((boss.facing||1)*boss.sq,boss.st);c.save();c.translate(-24,-16);c.rotate(-.7+wing);tri(c,0,0,-40,-30,-12,12,flash?'#ffd0a0':'#8e1f1f',3);c.restore();blob(c,0,0,52,46,flash?'#ffc890':'#e85050',flash?'#e8a070':'#9c1f1f',5);c.fillStyle='#f5c14b';c.beginPath();c.ellipse(6,8,20,14,0,0,TAU);c.fill();drawHatching(c,-42,-22,84,48,'#000',.18,7);blob(c,8,-40,24,22,flash?'#ffd0a0':'#ea5a5a',flash?'#e8a070':'#a32222',4);blob(c,22,-34,14,10,flash?'#ffe0b0':'#f07070',flash?'#e8b080':'#b32626',3);c.fillStyle='#14141c';c.beginPath();c.arc(30,-36,5,0,TAU);c.fill();tri(c,-10,-52,-18,-72,2,-54,flash?'#ffc890':'#f5c14b',3);tri(c,18,-52,26,-72,10,-54,flash?'#ffc890':'#f5c14b',3);const lk=lookAt(boss)*(boss.facing||1);eye(c,-4,-44,7,lk,0,boss.blink>0,'#ffe45a');eye(c,14,-44,7,lk,0,boss.blink>0,'#ffe45a');c.fillStyle='#fff';for(let i=0;i<6;i++){c.beginPath();c.moveTo(16+i*3,-26);c.lineTo(18+i*3,-18);c.lineTo(20+i*3,-26);c.fill();}c.restore();const bw=140,bx=x-bw/2,by=boss.y-140;c.fillStyle='#2b1414';c.fillRect(bx-3,by-3,bw+6,18);ink(c,3);c.fillStyle='#e33';c.fillRect(bx,by,bw*(boss.hp/boss.maxHp),12);c.fillStyle='#fff';c.font="bold 11px 'Courier New'";c.textAlign='center';c.fillText('ДРАКОН',x,by-8);}
function drawBossFox(c){if(!boss||!boss.alive)return;const x=boss.x-camera,br=Math.sin(boss.t*.08)*3,sway=Math.sin(boss.t*.12)*.35;entShadow(c,x,boss.y,44);const flash=boss.hurtFlash>0&&Math.floor(frame/3)%2===0;c.save();c.translate(x,boss.y+br);c.scale((boss.facing||1)*boss.sq,boss.st);for(let i=0;i<3;i++){c.save();c.translate(-20,12);c.rotate(-.55+sway+i*.32);const tg=c.createLinearGradient(0,0,-52,26);tg.addColorStop(0,flash?'#ffd0a0':'#e8792a');tg.addColorStop(1,'#fff2e0');c.fillStyle=tg;c.beginPath();c.moveTo(0,-8);c.quadraticCurveTo(-32,8+Math.sin(boss.t*.2+i)*10,-54,28+Math.sin(boss.t*.16+i)*13);c.quadraticCurveTo(-38,40,-6,16);c.closePath();c.fill();ink(c,3);c.restore();}blob(c,0,10,40,35,flash?'#ffc890':'#f5964a',flash?'#e89860':'#c1521a',5);c.fillStyle='#fff2e0';c.beginPath();c.ellipse(0,18,22,20,0,0,TAU);c.fill();drawHatching(c,-30,-14,60,48,'#000',.16,7);blob(c,0,-34,36,33,flash?'#ffd0a0':'#f79f55',flash?'#e8a070':'#c85a1c',5);tri(c,-22,-56,-34,-92,-4,-60,flash?'#ffc890':'#d9601c',4);tri(c,22,-56,34,-92,4,-60,flash?'#ffc890':'#d9601c',4);c.fillStyle='#ffb6c1';tri(c,-20,-59,-28,-82,-10,-62,'#ffb6c1',1.5);tri(c,20,-59,28,-82,10,-62,'#ffb6c1',1.5);blob(c,0,-22,20,14,'#fff4e6','#e8c8a8',3);const lk=lookAt(boss)*(boss.facing||1),glow=.5+Math.sin(boss.t*.16)*.4;c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(0,-42,2,0,-42,40);g.addColorStop(0,`rgba(255,60,20,${glow*.4})`);g.addColorStop(1,'rgba(255,60,20,0)');c.fillStyle=g;c.beginPath();c.arc(0,-42,40,0,TAU);c.fill();c.restore();eye(c,-14,-43,9,lk,0,boss.blink>0,'#fff','#c81f00');eye(c,14,-43,9,lk,0,boss.blink>0,'#fff','#c81f00');c.fillStyle='#14141c';c.beginPath();c.arc(0,-27,4.5,0,TAU);c.fill();c.strokeStyle='#0d0d12';c.lineWidth=3;c.beginPath();c.arc(0,-22,16,.2,Math.PI-.2);c.stroke();c.fillStyle='#fff';for(let i=0;i<4;i++){c.beginPath();c.moveTo(-11+i*7,-21);c.lineTo(-8+i*7,-14);c.lineTo(-5+i*7,-21);c.fill();}c.restore();const bw=110,bx=x-bw/2,by=boss.y-112;c.fillStyle='#2b1414';c.fillRect(bx-3,by-3,bw+6,18);ink(c,3);c.fillStyle='#e33';c.fillRect(bx,by,bw*(boss.hp/boss.maxHp),12);c.fillStyle='#fff';c.font="bold 11px 'Courier New'";c.textAlign='center';c.fillText('ЛИСА',x,by-8);}
function drawBoss(c){if(!boss||!boss.isBossLevel||!bossBattle||!boss.alive)return;const bossType=getBossType();if(bossType==='wolf_alpha')drawBossWolfAlpha(c);else if(bossType==='bear_shaman')drawBossBearShaman(c);else if(bossType==='dragon')drawBossDragon(c);else if(bossType==='fox')drawBossFox(c);}

function drawStars(c){for(const s of stars){if(s.taken)continue;const x=s.x-camera;if(x<-40||x>W+40)continue;const fy=s.y+Math.sin(frame*.08+s.x*.02)*5,sc=1+Math.sin(frame*.1+s.x)*.08;c.save();c.translate(x,fy);c.rotate(Math.sin(frame*.03+s.x)*.2);c.scale(sc,sc);c.font='34px Arial';c.textAlign='center';c.fillText('⭐',0,0);c.restore();}}
function drawPickups(c){for(const p of pickups){const x=p.x-camera;if(x<-50||x>W+50)continue;const fy=p.y+Math.sin(frame*.1+p.x)*5;c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(x,fy,2,x,fy,26);g.addColorStop(0,'rgba(255,255,200,.35)');g.addColorStop(1,'rgba(255,255,200,0)');c.fillStyle=g;c.beginPath();c.arc(x,fy,26,0,TAU);c.fill();c.restore();c.font='30px Arial';c.textAlign='center';c.fillText(p.type==='apple'?'🍎':p.type==='lightning'?'⚡':'🛡️',x,fy+10);}}
function drawBullets(c){for(const b of bullets){const x=b.x-camera;c.globalAlpha=.4;c.fillStyle='#ffe45a';c.beginPath();c.arc(x-b.vx*.8,b.y-(b.vy||0)*.8,5,0,TAU);c.fill();c.globalAlpha=1;c.beginPath();c.arc(x,b.y,6,0,TAU);c.fillStyle='#2b2b33';c.fill();c.strokeStyle='#fff';c.lineWidth=2;c.stroke();}for(const b of enemyBullets){c.save();c.translate(b.x-camera,b.y);c.rotate(b.angle||0);if(b.isSeed){c.fillStyle='#22222a';c.fillRect(-6,-4,12,8);c.strokeStyle='#fff';c.lineWidth=1.2;c.strokeRect(-6,-4,12,8);}else{const col=b.isGreen?'#5cff5c':'#ffcf45';c.save();c.globalCompositeOperation='lighter';const g=c.createRadialGradient(0,0,1,0,0,16);g.addColorStop(0,b.isGreen?'rgba(90,255,90,.5)':'rgba(255,200,60,.5)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,16,0,TAU);c.fill();c.restore();c.beginPath();c.ellipse(0,0,10,6,0,0,TAU);c.fillStyle=col;c.fill();ink(c,2);}c.restore();}}
function drawComicFrame(c){c.strokeStyle='#fff';c.lineWidth=12;c.strokeRect(6,6,W-12,H-12);c.strokeStyle='#000';c.lineWidth=4;c.strokeRect(12,12,W-24,H-24);}
function drawLevelBanner(c){if(levelBannerTimer<=0)return;levelBannerTimer--;const k=levelBannerTimer>150?(180-levelBannerTimer)/30:(levelBannerTimer<30?levelBannerTimer/30:1);c.save();c.translate(W/2,104);c.scale(clamp(k,0,1),clamp(k,0,1));c.fillStyle='#f4cf43';c.beginPath();if(c.roundRect)c.roundRect(-225,-34,450,68,10);else c.rect(-225,-34,450,68);c.fill();ink(c,5);c.save();c.beginPath();c.rect(-225,-34,450,68);c.clip();c.fillStyle='rgba(0,0,0,.10)';for(let i=-225;i<225;i+=9)for(let j=-34;j<34;j+=9){c.beginPath();c.arc(i,j,1.6,0,TAU);c.fill();}c.restore();c.fillStyle='#000';c.font="bold 25px 'Courier New'";c.textAlign='center';c.textBaseline='middle';c.fillText(worlds[world].name.toUpperCase(),0,-4);c.font="12px 'Courier New'";c.fillText('МИР '+(world+1)+' / '+TOTAL_LEVELS,0,20);c.restore();}
function drawOverlay(c){if(hitFlash>0){c.fillStyle=`rgba(255,40,40,${hitFlash/40})`;c.fillRect(0,0,W,H);hitFlash--;}if(!gameOver&&!victory)return;c.fillStyle='rgba(0,0,0,.78)';c.fillRect(0,0,W,H);c.textAlign='center';c.font="bold 56px 'Courier New'";c.lineWidth=7;c.strokeStyle='#000';const t=victory?'ПОБЕДА!':'ИГРА ОКОНЧЕНА';c.strokeText(t,W/2,224);c.fillStyle=victory?'#7fe07f':'#e85b50';c.fillText(t,W/2,224);c.font="26px 'Courier New'";c.lineWidth=4;c.strokeStyle='#000';const s=victory?'Колобок спас лес! ⭐ '+totalStars:'Попробуй ещё раз! ⭐ '+totalStars;c.strokeText(s,W/2,282);c.fillStyle='#fff';c.fillText(s,W/2,282);c.font="16px 'Courier New'";c.fillText('Нажмите ↻ ЗАНОВО',W/2,330);}

const ENEMY_DRAW={rabbit:drawRabbit,wolf:drawWolf,bear:drawBearEnemy,fox:drawFox,frog:drawFrog,troll:drawTroll,skeleton:drawSkeleton,dragon:drawDragon,goblin:drawGoblin,fire:drawFire,tree:drawTreeMonster};
function draw(){ctx.clearRect(0,0,W,H);ctx.save();if(shakeTime>0){ctx.translate(rnd(-shakeAmp,shakeAmp),rnd(-shakeAmp,shakeAmp));shakeTime--;shakeAmp*=.88;}drawBackground(ctx);for(const p of platforms)drawPlatform3D(ctx,p);drawHut(ctx);drawStars(ctx);drawPickups(ctx);for(const g of gopniks)drawGopnik(ctx,g);const ed=ENEMY_DRAW[worlds[world].enemy]||drawRabbit;for(const e of enemies){if(!e.alive)continue;const x=e.x-camera;if(x<-90||x>W+90)continue;ed(ctx,e);}for(const w of witches)drawWitch(ctx,w);for(const l of lizards)drawLizard(ctx,l);for(const b of bears)drawBear(ctx,b);for(const m of mermaids){if(m.alive&&Math.abs(m.x-camera-W/2)<W)drawMermaid(ctx,m);}for(const s of sharks){if(s.alive&&Math.abs(s.x-camera-W/2)<W)drawShark(ctx,s);}for(const t of trees){if(t.alive&&Math.abs(t.x-camera-W/2)<W)drawTreeMonster(ctx,t);}drawBoss(ctx);drawBullets(ctx);drawParticles(ctx);drawRat(ctx);drawPlayer(ctx);drawFloatingTexts(ctx);drawWeather(ctx);drawForeground(ctx);ctx.restore();drawComicFrame(ctx);drawLevelBanner(ctx);drawOverlay(ctx);}
