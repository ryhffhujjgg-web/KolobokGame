<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Колобок: Comix Zone Style</title>
<style>
* { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a14; color: white; font-family: Arial, sans-serif; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; touch-action: none; }

#menu-screen { position: fixed; inset: 0; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; transition: opacity 0.5s; }
#menu-screen.hidden { opacity: 0; pointer-events: none; }
#menu-screen h1 { font-size: 52px; color: #f4cf43; text-shadow: 3px 3px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; margin-bottom: 5px; text-align: center; font-family: 'Courier New', monospace; letter-spacing: 4px; }
#menu-screen p { font-size: 18px; color: #fff; text-shadow: 2px 2px 0 #000; margin-bottom: 30px; text-align: center; font-family: 'Courier New', monospace; }

.weapon-select { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
.weapon-btn { padding: 12px 20px; font-size: 15px; font-weight: bold; border: 3px solid #000; border-radius: 0; background: #333; color: #fff; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; gap: 5px; font-family: 'Courier New', monospace; box-shadow: 4px 4px 0 #000; }
.weapon-btn.active { border-color: #f4cf43; color: #f4cf43; background: #555; transform: translate(-2px, -2px); box-shadow: 6px 6px 0 #000; }
.weapon-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
.weapon-icon { font-size: 24px; }
.weapon-name { font-size: 12px; }

.menu-btn { padding: 15px 40px; font-size: 18px; font-weight: bold; border: 3px solid #000; border-radius: 0; margin: 8px; cursor: pointer; box-shadow: 6px 6px 0 #000; transition: transform 0.1s; font-family: 'Courier New', monospace; letter-spacing: 2px; }
.menu-btn:active { transform: translate(3px, 3px); box-shadow: 3px 3px 0 #000; }
#btn-continue { background: #4aa9ef; color: white; }
#btn-new { background: #e85b50; color: white; }

#rotate-hint { display: none; position: fixed; inset: 0; background: #1a1a2e; color: white; z-index: 100; align-items: center; justify-content: center; flex-direction: column; text-align: center; padding: 24px; font-size: 20px; line-height: 1.4; font-family: 'Courier New', monospace; }
#rotate-hint .icon { font-size: 64px; margin-bottom: 16px; animation: rotate 2s infinite ease-in-out; }
@keyframes rotate { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
@media (orientation: portrait) and (max-width: 900px) { #rotate-hint { display: flex; } }

#game-wrap { position: relative; width: 100vw; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; object-fit: contain; background: #8bd7f5; touch-action: none; image-rendering: pixelated; image-rendering: crisp-edges; }

#topbar { position: absolute; top: 0; left: 0; right: 0; padding: 6px 10px; display: flex; align-items: center; justify-content: space-between; gap: 10px; z-index: 20; pointer-events: none; }
#info { font-size: 14px; color: #fff; background: #000; padding: 6px 10px; border: 2px solid #fff; border-radius: 0; pointer-events: auto; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: 'Courier New', monospace; font-weight: bold; }
#message { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 16px; font-weight: bold; color: #000; background: #f4cf43; padding: 6px 14px; border: 2px solid #000; border-radius: 0; pointer-events: none; z-index: 21; max-width: 60vw; text-align: center; font-family: 'Courier New', monospace; box-shadow: 3px 3px 0 #000; }
#restart { pointer-events: auto; border: 2px solid #000; border-radius: 0; font-size: 14px; padding: 8px 12px; background: #e85b50; color: #fff; font-weight: bold; box-shadow: 4px 4px 0 #000; -webkit-tap-highlight-color: transparent; font-family: 'Courier New', monospace; }

.controls { width: 100%; height: 110px; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; background: #1a1a2e; border-top: 3px solid #000; z-index: 30; flex-shrink: 0; }
.left-group, .right-group { display: flex; gap: 15px; }
button.ctrl { border: 3px solid #000; border-radius: 0; background: #444; color: #fff; font-size: 22px; font-weight: bold; box-shadow: 5px 5px 0 #000; touch-action: none; -webkit-tap-highlight-color: transparent; display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; min-width: 64px; font-family: 'Courier New', monospace; }
button.ctrl:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #000; background: #666; }
#jump { background: #4aa9ef; color: #fff; width: 76px; height: 76px; font-size: 15px; }
#shoot { background: #e85b50; color: #fff; width: 76px; height: 76px; font-size: 22px; }
#dash { background: #9c27b0; color: #fff; width: 64px; height: 64px; font-size: 22px; }

@media (max-height: 400px) { 
  button.ctrl { width: 52px; height: 52px; min-width: 52px; font-size: 18px; } 
  #jump, #shoot, #dash { width: 62px; height: 62px; font-size: 13px; } 
  .controls { height: 84px; padding: 0 10px; } 
  #message { font-size: 13px; padding: 4px 10px; } 
  #info { font-size: 11px; padding: 4px 8px; } 
}
</style>
</head>
<body>

<div id="menu-screen">
  <h1>КОЛОБОК</h1>
  <p>COMIX ZONE STYLE</p>
  
  <div class="weapon-select">
    <button class="weapon-btn active" id="wpn-shotgun" data-weapon="shotgun">
      <span class="weapon-icon">🔫</span>
      <span class="weapon-name">ДРОБОВИК</span>
    </button>
    <button class="weapon-btn" id="wpn-minigun" data-weapon="minigun">
      <span class="weapon-icon">💥</span>
      <span class="weapon-name">МИНИГАН</span>
    </button>
    <button class="weapon-btn" id="wpn-ak47" data-weapon="ak47">
      <span class="weapon-icon">🔫</span>
      <span class="weapon-name">АК-47</span>
    </button>
  </div>

  <button class="menu-btn" id="btn-continue">ПРОДОЛЖИТЬ</button>
  <button class="menu-btn" id="btn-new">НОВАЯ ИГРА</button>
</div>

<div id="rotate-hint"><div class="icon">📱</div><div>Поверните телефон<br>горизонтально для игры</div></div>
<div id="game-wrap">
  <canvas id="game" width="1200" height="540"></canvas>
  <div id="topbar"><div id="info">Мир 1/12 | ⭐ 0 | ❤️ 3</div><button id="restart">↻ ЗАНОВО</button></div>
  <div id="message">Вперёд, Колобок!</div>
</div>
<div class="controls">
  <div class="left-group"><button class="ctrl" id="left">◀</button><button class="ctrl" id="right">▶</button></div>
  <div class="right-group">
    <button class="ctrl" id="dash">⚡</button>
    <button class="ctrl" id="jump">ПРЫЖОК</button>
    <button class="ctrl" id="shoot">🔫</button>
  </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");
const message = document.getElementById("message");
const menuScreen = document.getElementById("menu-screen");

const W = canvas.width;
const H = canvas.height;
const LEVEL_WIDTH = 2400;
const GROUND_Y = 470;
const TOTAL_LEVELS = 12;
const SAVE_KEY = "kolobok_comixzone_v3";

const SCALE = 0.5;
const OW = Math.floor(W * SCALE);
const OH = Math.floor(H * SCALE);
const offCanvas = document.createElement('canvas');
offCanvas.width = OW;
offCanvas.height = OH;
const octx = offCanvas.getContext('2d');
octx.imageSmoothingEnabled = false;

const worlds = [
  {name:"Лесная тропинка", sky:"#8bd7f5", ground:"#55a84c", enemy:"rabbit", weather:"leaves"},
  {name:"Волчий лес", sky:"#829ac5", ground:"#477b42", enemy:"wolf", weather:"rain"},
  {name:"Медвежья поляна", sky:"#a6d5a0", ground:"#438b46", enemy:"bear", weather:"none"},
  {name:"Лисья опушка", sky:"#ffc47b", ground:"#68a34b", enemy:"fox", weather:"leaves"},
  {name:"Болото Кикиморы", sky:"#7a9e7e", ground:"#3e6b3a", enemy:"frog", weather:"rain"},
  {name:"Пещера тролля", sky:"#6b7c93", ground:"#4b5a4a", enemy:"troll", weather:"dust"},
  {name:"Замок Кощея", sky:"#c09bd6", ground:"#5a4b6e", enemy:"skeleton", weather:"sparks"},
  {name:"Гора Дракона", sky:"#ff9a76", ground:"#7a4a3a", enemy:"dragon", weather:"ash"},
  {name:"Тёмный бор", sky:"#5b6d8b", ground:"#2e4a3a", enemy:"goblin", weather:"rain"},
  {name:"Огненная пустошь", sky:"#ff7e5f", ground:"#8b3a2a", enemy:"fire", weather:"ash"},
  {name:"Подводное царство", sky:"#006699", ground:"#ccaa55", enemy:"mermaid", weather:"bubbles"},
  {name:"Дремучий лес", sky:"#2b4a2b", ground:"#1a3a1a", enemy:"tree", weather:"rain"}
];

let world = 0; let camera = 0; let player; let enemies = []; let witches = []; let lizards = []; let bears = []; let bullets = []; let enemyBullets = []; let stars = []; let platforms = []; let gaps = []; let boss;
let bossBattle = false; let gameOver = false; let victory = false; let totalStars = 0; let frame = 0; let keys = {}; let soundContext = null; let lastSaveFrame = 0; let lastSafeX = 70; let gameLoopRunning = false; let isTransitioning = false;

let pickups = []; let particles = []; let floatingTexts = []; let shakeTime = 0;
let playerDashing = 0; let playerDashCooldown = 0;

let currentWeapon = "shotgun"; 
let minigunInterval = null;
let isHoldingShoot = false;

let mermaids = [];
let sharks = [];
let trees = [];
let gopniks = [];

// Передний план (генерируется при создании уровня)
let foreground = [];

// КРЫСКА-ПОМОЩНИК
let rat = { x: 0, y: 0, vx: 0, vy: 0, onGround: false, facing: 1, shootTimer: 0, alive: true, r: 10, animFrame: 0 };

function getGravity() { return world === 10 ? 0.15 : 0.55; }

function triggerShake(intensity) { shakeTime = intensity; }

function addFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 60, maxLife: 60 });
}

function spawnParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 0.5) * 6 - 2,
      life: 30 + Math.random() * 20,
      maxLife: 50,
      color: color,
      size: 2 + Math.random() * 3
    });
  }
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += (world === 10 ? 0.05 : 0.2);
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles(c) {
  for (let p of particles) {
    c.globalAlpha = p.life / p.maxLife;
    c.fillStyle = p.color;
    c.beginPath();
    c.arc(p.x - camera, p.y, p.size, 0, 7);
    c.fill();
  }
  c.globalAlpha = 1;
}

function drawShadow(c, x, y, width, height, alpha=0.3) {
  c.save();
  c.fillStyle = `rgba(0,0,0,${alpha})`;
  c.beginPath();
  c.ellipse(x, y, width, height, 0, 0, 7);
  c.fill();
  c.restore();
}

// === ЭФФЕКТ ШТРИХОВКИ (КОМИКС) ===
function drawHatching(c, x, y, w, h, color="#000", alpha=0.3, spacing=4) {
  c.save();
  c.globalAlpha = alpha;
  c.strokeStyle = color;
  c.lineWidth = 1;
  for (let i = 0; i < w + h; i += spacing) {
    c.beginPath();
    c.moveTo(x + i, y);
    c.lineTo(x + i - h, y + h);
    c.stroke();
  }
  c.restore();
}

function saveProgress() {
  try {
    const data = {
      version: 1, world, totalStars, lastSafeX, currentWeapon,
      player: { x: player.x, y: player.y, health: player.health, facing: player.facing },
      bossBattle, gameOver, victory
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (error) { console.warn("save error", error); }
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    if (!data || data.version !== 1 || !Number.isInteger(data.world) || data.world < 0 || data.world >= TOTAL_LEVELS) return false;
    world = data.world; totalStars = Math.max(0, Number(data.totalStars) || 0); lastSafeX = Number(data.lastSafeX) || 70;
    if (["minigun", "shotgun", "ak47"].includes(data.currentWeapon)) currentWeapon = data.currentWeapon;
    makeLevel();
    if (data.player) {
      player.x = Math.max(19, Math.min(LEVEL_WIDTH - 20, Number(data.player.x) || 70));
      player.y = Math.max(30, Math.min(GROUND_Y - 5, Number(data.player.y) || GROUND_Y - 19));
      player.health = Math.max(1, Math.min(3, Number(data.player.health) || 3));
      player.facing = data.player.facing === -1 ? -1 : 1;
      player.vx = 0; player.vy = 0; player.invincible = 0;
    }
    bossBattle = data.bossBattle === true; gameOver = data.gameOver === true; victory = data.victory === true;
    camera = Math.max(0, Math.min(LEVEL_WIDTH - W, player.x - W * 0.38));
    updateInfo(); return true;
  } catch (e) { console.warn(e); return false; }
}

function deleteSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

function say(text) {
  message.textContent = text;
  if ("speechSynthesis" in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "ru-RU"; u.rate = 1; speechSynthesis.speak(u); }
}

function soundShoot() {
  try {
    soundContext = soundContext || new (window.AudioContext || window.webkitAudioContext)();
    const t = soundContext.currentTime;
    if (currentWeapon === "shotgun") {
      const crack = soundContext.createBufferSource();
      const bufferSize = soundContext.sampleRate * 0.05;
      const buffer = soundContext.createBuffer(1, bufferSize, soundContext.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      crack.buffer = buffer;
      const crackFilter = soundContext.createBiquadFilter(); crackFilter.type = "highpass"; crackFilter.frequency.value = 1500;
      const crackGain = soundContext.createGain(); crackGain.gain.setValueAtTime(0.3, t); crackGain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      crack.connect(crackFilter); crackFilter.connect(crackGain); crackGain.connect(soundContext.destination); crack.start(t);
      const boom = soundContext.createOscillator(); boom.type = "sine"; boom.frequency.setValueAtTime(120, t); boom.frequency.exponentialRampToValueAtTime(40, t + 0.15);
      const boomGain = soundContext.createGain(); boomGain.gain.setValueAtTime(0.4, t); boomGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      boom.connect(boomGain); boomGain.connect(soundContext.destination); boom.start(t); boom.stop(t + 0.2);
    } else if (currentWeapon === "minigun") {
      const osc = soundContext.createOscillator(); osc.type = "square"; osc.frequency.setValueAtTime(300, t); osc.frequency.exponentialRampToValueAtTime(100, t + 0.05);
      const gain = soundContext.createGain(); gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      osc.connect(gain); gain.connect(soundContext.destination); osc.start(t); osc.stop(t + 0.07);
    } else if (currentWeapon === "ak47") {
      const osc = soundContext.createOscillator(); osc.type = "sawtooth"; osc.frequency.setValueAtTime(400, t); osc.frequency.exponentialRampToValueAtTime(80, t + 0.04);
      const gain = soundContext.createGain(); gain.gain.setValueAtTime(0.15, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
      osc.connect(gain); gain.connect(soundContext.destination); osc.start(t); osc.stop(t + 0.06);
    }
  } catch(e) {}
}

function sound(freq=440, duration=0.1, type="square") {
  try {
    soundContext = soundContext || new (window.AudioContext || window.webkitAudioContext)();
    const o = soundContext.createOscillator(); const g = soundContext.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = 0.07;
    o.connect(g); g.connect(soundContext.destination); o.start();
    g.gain.exponentialRampToValueAtTime(0.001, soundContext.currentTime + duration);
    o.stop(soundContext.currentTime + duration);
  } catch(e) {}
}

function makeLevel() {
  player = { x:70, y:GROUND_Y - 19, vx:0, vy:0, r:19, speed: (world === 10 ? 2.2 : 3.2), facing:1, onGround:false, health:3, invincible:0, jumpsLeft:2, maxJumps:2 };
  
  rat = { x: player.x - 60, y: GROUND_Y - 10, vx: 0, vy: 0, onGround: true, facing: 1, shootTimer: 60, alive: true, r: 10, animFrame: 0 };
  
  // Генерация переднего плана
  foreground = [];
  for (let i = 0; i < 30; i++) {
    const type = Math.random() > 0.5 ? "grass" : "rock";
    foreground.push({
      x: Math.random() * LEVEL_WIDTH,
      y: H - 20 - Math.random() * 30,
      type: type,
      scale: 0.5 + Math.random() * 0.8,
      speedFactor: 1.5 + Math.random() * 0.5 // Движется быстрее фона
    });
  }
  
  lastSafeX = 70; camera = 0; bullets = []; enemyBullets = []; enemies = []; witches = []; lizards = []; bears = []; stars = []; platforms = []; gaps = []; bossBattle = false; isTransitioning = false; pickups = []; particles = []; floatingTexts = []; shakeTime = 0;
  mermaids = []; sharks = []; trees = []; gopniks = [];
  playerDashing = 0; playerDashCooldown = 0;
  gaps = [{x:760,w:90},{x:1450,w:110},{x:2050,w:90}];
  
  if (world === 10) {
    mermaids.push({ x:650, baseY:220, y:220, vx:1.0, phase:Math.random()*Math.PI*2, shootTimer:110, alive:true });
    mermaids.push({ x:1750, baseY:200, y:200, vx:-0.9, phase:Math.random()*Math.PI*2, shootTimer:160, alive:true });
    sharks.push({ x:1100, y:GROUND_Y - 30, vx:1.5, alive:true });
    sharks.push({ x:1850, y:GROUND_Y - 30, vx:-1.5, alive:true });
  } else if (world === 11) {
    trees.push({ x:500, y:GROUND_Y - 40, hp:3, maxHp:3, alive:true, shootTimer:100 });
    trees.push({ x:1200, y:GROUND_Y - 40, hp:3, maxHp:3, alive:true, shootTimer:140 });
    trees.push({ x:1900, y:GROUND_Y - 40, hp:3, maxHp:3, alive:true, shootTimer:120 });
  } else {
    for (let i=0; i<5; i++) {
      const x = 390 + i*370;
      if (gaps.some(g => x > g.x - 20 && x < g.x + g.w + 20)) continue;
      enemies.push({ x, y:GROUND_Y - 20, vx:0.6 + (world%4)*0.1, vy:0, min:x-95, max:x+95, alive:true, onGround:true, jumpTimer:60 + i*27, hp:1 });
    }
    if (world % 4 > 0) {
      witches.push({ x:650, baseY:220, y:220, vx:1.0+(world%4)*0.1, phase:Math.random()*Math.PI*2, shootTimer:110, alive:true });
      witches.push({ x:1750, baseY:200, y:200, vx:-(0.9+(world%4)*0.1), phase:Math.random()*Math.PI*2, shootTimer:160, alive:true });
      lizards.push({ x:1100, y:GROUND_Y - 15, vx:1.2, vy:0, alive:true, onGround:true, facing:1, dashTimer:140, speed:1.2+(world%4)*0.12 });
      lizards.push({ x:1850, y:GROUND_Y - 15, vx:-1.2, vy:0, alive:true, onGround:true, facing:-1, dashTimer:200, speed:1.2+(world%4)*0.12 });
    }
    if (world % 4 >= 2) bears.push({ x:1350, y:GROUND_Y - 30, vx:0.6, vy:0, hp:3, maxHp:3, alive:true, onGround:true, facing:1, throwTimer:140, hurtFlash:0 });
  }
  
  for(let i=0; i<3; i++) {
    gopniks.push({ x: 600 + i*500, y: GROUND_Y - 20, vx: 0.8, vy:0, min: 600 + i*500 - 50, max: 600 + i*500 + 50, alive: true, onGround: true, shootTimer: 120 + i*40 });
  }
  
  platforms = [{x:260,y:GROUND_Y - 75,w:120,h:16},{x:570,y:GROUND_Y - 110,w:135,h:16},{x:900,y:GROUND_Y - 80,w:140,h:16},{x:1250,y:GROUND_Y - 115,w:150,h:16},{x:1590,y:GROUND_Y - 80,w:130,h:16},{x:1900,y:GROUND_Y - 110,w:150,h:16}];
  
  for (let i=0; i<13; i++) {
    const sx = 240 + i*165;
    if (gaps.some(g => sx > g.x - 10 && sx < g.x + g.w + 10)) continue;
    stars.push({ x:sx, y:i%2===0?GROUND_Y - 140:GROUND_Y - 50, taken:false });
  }
  boss = { x:2180, y:GROUND_Y - 45, vx:1.2, vy:0, hp:10, maxHp:10, alive:true, shootTimer:100, jumpTimer:90, isBossLevel: (world === TOTAL_LEVELS - 1) };
  updateInfo();
}

function updateInfo() { 
  info.textContent = "Мир " + (world+1) + "/" + TOTAL_LEVELS + ": " + worlds[world].name + " | ⭐ " + totalStars + " | ❤️ " + (player ? player.health : 3);
}

function isOverGap(x) { return gaps.some(g => x + player.r * 0.5 > g.x && x - player.r * 0.5 < g.x + g.w); }

// ==================== ОТРИСОВКА ОКРУЖЕНИЯ ====================

function drawGroundSegment3D(c, startX, width, theme) {
  const sx = startX - camera;
  if (sx + width < -50 || sx > W + 50) return;

  const horizonY = GROUND_Y;
  const bottomY = H;
  const topInset = 150;
  const bottomInset = -100;

  c.fillStyle = theme.ground;
  c.beginPath();
  c.moveTo(sx + topInset, horizonY);
  c.lineTo(sx + width - topInset, horizonY);
  c.lineTo(sx + width + bottomInset, bottomY);
  c.lineTo(sx - bottomInset, bottomY);
  c.closePath();
  c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 5; c.stroke();

  const shadowGrad = c.createLinearGradient(0, GROUND_Y, 0, H);
  shadowGrad.addColorStop(0, "rgba(0,0,0,0)");
  shadowGrad.addColorStop(1, "rgba(0,0,0,0.4)");
  c.fillStyle = shadowGrad;
  c.beginPath();
  c.moveTo(sx + topInset, horizonY);
  c.lineTo(sx + width - topInset, horizonY);
  c.lineTo(sx + width + bottomInset, bottomY);
  c.lineTo(sx - bottomInset, bottomY);
  c.closePath();
  c.fill();

  c.fillStyle = "#7bd66a";
  c.fillRect(sx, GROUND_Y, width, 15);
  c.strokeStyle = "#000"; c.lineWidth = 4; c.strokeRect(sx, GROUND_Y, width, 15);

  c.fillStyle = "#a8e88e";
  for (let i = 0; i < width; i += 20) {
    const tx = sx + i;
    if (tx < -20 || tx > W + 20) continue;
    c.fillRect(tx, GROUND_Y - 8, 5, 8);
    c.fillRect(tx + 8, GROUND_Y - 12, 5, 12);
    c.fillRect(tx + 16, GROUND_Y - 6, 5, 6);
  }
}

function drawPlatform3D(c, p) {
  const x = p.x - camera;
  if (x < -200 || x > W + 200) return;
  
  const depth = 40;
  
  drawShadow(c, x + p.w/2, p.y + p.h + depth + 20, p.w/2 + depth, 15, 0.4);
  
  c.fillStyle = "#4a3020";
  c.beginPath();
  c.moveTo(x, p.y);
  c.lineTo(x + p.w, p.y);
  c.lineTo(x + p.w - depth*0.5, p.y + depth);
  c.lineTo(x - depth*0.5, p.y + depth);
  c.closePath();
  c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 4; c.stroke();
  
  c.fillStyle = "#7bd66a";
  c.beginPath();
  c.moveTo(x, p.y);
  c.lineTo(x + p.w, p.y);
  c.lineTo(x + p.w + depth*0.5, p.y + p.h + depth*0.5);
  c.lineTo(x - depth*0.5, p.y + p.h + depth*0.5);
  c.closePath();
  c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 4; c.stroke();
  
  // Штриховка на платформе (комикс-стиль)
  drawHatching(c, x, p.y + p.h + depth*0.5, p.w, 15, "#000", 0.15, 6);
  
  c.fillStyle = "#80552f";
  c.beginPath();
  c.moveTo(x - depth*0.5, p.y + p.h + depth*0.5);
  c.lineTo(x + p.w + depth*0.5, p.y + p.h + depth*0.5);
  c.lineTo(x + p.w, p.y + p.h + depth);
  c.lineTo(x, p.y + p.h + depth);
  c.closePath();
  c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 4; c.stroke();
}

function drawBackground(c) {
  const theme = worlds[world];
  const skyGrad = c.createLinearGradient(0, 0, 0, H);
  
  if (world === 10) {
    skyGrad.addColorStop(0, "#002244"); skyGrad.addColorStop(0.5, "#006699"); skyGrad.addColorStop(1, "#33cccc");
  } else if (world === 11) {
    skyGrad.addColorStop(0, "#1a2a1a"); skyGrad.addColorStop(0.5, "#2b4a2b"); skyGrad.addColorStop(1, "#3e5c3e");
  } else {
    skyGrad.addColorStop(0, theme.sky); skyGrad.addColorStop(0.4, "#a8d8f0"); skyGrad.addColorStop(0.8, "#d4eecf"); skyGrad.addColorStop(1, "#e8f5d4");
  }
  
  c.fillStyle = skyGrad; c.fillRect(0, 0, W, H);
  
  if (world === 10) {
    c.fillStyle = "rgba(255,255,255,0.4)";
    for(let i=0; i<20; i++) {
      const bx = (i*100 - camera*0.5 + frame*0.5) % W;
      const by = (i*150 - frame*1.5) % H;
      c.beginPath(); c.arc(bx, by, 5 + (i%3)*5, 0, 7); c.fill();
    }
  } else {
    const sunGrad = c.createRadialGradient(W-150, 100, 10, W-150, 100, 80);
    sunGrad.addColorStop(0, "#fff8c0"); sunGrad.addColorStop(1, "rgba(255, 251, 208, 0)");
    c.fillStyle = sunGrad; c.beginPath(); c.arc(W-150, 100, 80, 0, 7); c.fill();
    c.fillStyle = "#fff8c0"; c.beginPath(); c.arc(W-150, 100, 50, 0, 7); c.fill();
  }
  
  if (world === 11) {
    for(let i=0;i<10;i++) drawTree3D(c, ((i*200-camera*0.5)%2000+2000)%2000-100, 450, 1.2);
  } else if (world !== 10) {
    c.fillStyle = world%4===3?"#a8bd62":"#70ad68";
    c.beginPath(); c.moveTo(0, 430);
    for(let x=0;x<=W+20;x+=20) { const wx=x+camera*0.42; c.lineTo(x, 400+Math.sin(wx*0.008)*25+Math.sin(wx*0.018)*10); }
    c.lineTo(W, H); c.lineTo(0, H); c.fill();
    c.strokeStyle = "#000"; c.lineWidth = 4; c.stroke();
    
    for(let i=0;i<15;i++) drawTree3D(c, ((i*140-camera*0.48)%1800+1800)%1800-100, 450, 0.6);
    for(let i=0;i<20;i++) drawBush3D(c, ((i*100-camera*0.72)%1600+1600)%1600-70, 465, 0.8);
  }
  
  const sorted = gaps.slice().sort((a,b)=>a.x-b.x);
  for (const gap of sorted) {
    const gx = gap.x - camera; if (gx + gap.w < -50 || gx > W + 50) continue;
    const vg = c.createLinearGradient(0, GROUND_Y, 0, H); vg.addColorStop(0,"#0a0f0a"); vg.addColorStop(1,"#000");
    c.fillStyle=vg; c.fillRect(gx, GROUND_Y, gap.w, H-GROUND_Y);
  }
  let cursor = 0;
  for (const gap of sorted) { if (gap.x > cursor) drawGroundSegment3D(c, cursor, gap.x-cursor, theme); cursor = gap.x + gap.w; }
  if (cursor < LEVEL_WIDTH) drawGroundSegment3D(c, cursor, LEVEL_WIDTH-cursor, theme);
}

function drawTree3D(c, x, y, s=1) {
  c.save(); c.translate(x,y); c.scale(s,s);
  c.fillStyle="rgba(0,0,0,0.3)"; c.beginPath(); c.ellipse(0, 5, 18, 5, 0, 0, 7); c.fill();
  c.fillStyle="#4a2e15"; c.fillRect(-7,-55,14,58);
  c.fillStyle="#6b4522"; c.fillRect(-5,-55,4,58);
  const grad = c.createRadialGradient(-8, -75, 5, 0, -65, 35); grad.addColorStop(0, "#43a047"); grad.addColorStop(0.7, "#2e7d32"); grad.addColorStop(1, "#1b5e20");
  c.fillStyle = grad; c.beginPath(); c.arc(0,-65,27,0,7); c.arc(-18,-48,19,0,7); c.arc(18,-48,19,0,7); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 4; c.stroke();
  c.restore();
}

function drawBush3D(c, x, y, s=1) {
  c.save(); c.translate(x,y); c.scale(s,s);
  const grad = c.createRadialGradient(-5, -5, 5, 0, 0, 25); grad.addColorStop(0, "#2e7d32"); grad.addColorStop(1, "#1b5e20");
  c.fillStyle = grad; c.beginPath(); c.arc(0,0,22,0,7); c.arc(-18,5,16,0,7); c.arc(18,5,16,0,7); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 4; c.stroke();
  c.restore();
}

// === ПЕРЕДНИЙ ПЛАН (ГЛУБИНА) ===
function drawForeground(c) {
  for (const fg of foreground) {
    // Передний план движется быстрее (эффект параллакса)
    const x = fg.x - camera * fg.speedFactor;
    if (x < -100 || x > W + 100) continue;
    
    c.save();
    c.translate(x, fg.y);
    c.scale(fg.scale, fg.scale);
    
    if (fg.type === "grass") {
      c.fillStyle = "#2e7d32";
      c.beginPath();
      c.moveTo(-15, 20);
      c.lineTo(-10, 0);
      c.lineTo(-5, 15);
      c.lineTo(0, -5);
      c.lineTo(5, 15);
      c.lineTo(10, 0);
      c.lineTo(15, 20);
      c.closePath();
      c.fill();
      c.strokeStyle = "#000"; c.lineWidth = 3; c.stroke();
    } else {
      c.fillStyle = "#666";
      c.beginPath();
      c.ellipse(0, 0, 20, 15, 0, 0, 7);
      c.fill();
      c.strokeStyle = "#000"; c.lineWidth = 3; c.stroke();
      // Штриховка на камне
      drawHatching(c, -15, -10, 30, 20, "#000", 0.3, 4);
    }
    
    c.restore();
  }
}

function drawPlayer(c) {
  const x = player.x - camera, y = player.y;
  
  drawShadow(c, x, GROUND_Y, 25, 8, 0.3);
  
  if (player.invincible > 0 && Math.floor(frame/5) % 2 === 0) return;
  
  const barW = 40, barH = 6, barX = x - barW/2, barY = y - 50;
  c.fillStyle = "rgba(0,0,0,0.8)";
  c.fillRect(barX - 2, barY - 2, barW + 4, barH + 4);
  for (let i = 0; i < player.health; i++) {
    c.fillStyle = "#ff3b3b";
    c.fillRect(barX + i * (barW / 3), barY, (barW / 3) - 2, barH);
  }
  
  c.fillStyle = "#3a2015";
  c.beginPath();
  c.ellipse(x - 10, y + 20, 8, 10, 0.2, 0, 7);
  c.ellipse(x + 10, y + 20, 8, 10, -0.2, 0, 7);
  c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 3; c.stroke();
  
  c.fillStyle = "#d96a1e";
  c.beginPath();
  if (c.roundRect) { c.roundRect(x - 18, y - 5, 36, 25, 8); } 
  else { c.rect(x - 18, y - 5, 36, 25); }
  c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 3; c.stroke();
  
  // Штриховка на теле (комикс-стиль)
  drawHatching(c, x - 18, y - 5, 36, 25, "#000", 0.2, 5);
  
  c.fillStyle = "#f4cf43";
  c.beginPath(); c.arc(x, y - 12, 24, 0, 7); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 3.5; c.stroke();
  
  // Штриховка на голове (полутона)
  drawHatching(c, x - 15, y - 20, 30, 15, "#a86a1e", 0.4, 4);
  
  c.fillStyle = "#fff";
  c.beginPath(); c.ellipse(x - 8, y - 18, 7, 9, 0, 0, 7); c.fill();
  c.beginPath(); c.ellipse(x + 8, y - 18, 7, 9, 0, 0, 7); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 2; c.stroke();
  
  c.fillStyle = "#000";
  c.beginPath(); c.arc(x - 8 + player.facing * 2, y - 18, 3, 0, 7); c.fill();
  c.beginPath(); c.arc(x + 8 + player.facing * 2, y - 18, 3, 0, 7); c.fill();
  
  c.strokeStyle = "#000"; c.lineWidth = 2.5;
  c.beginPath(); c.arc(x, y - 4, 8, 0.2, Math.PI - 0.2); c.stroke();
  
  c.fillStyle = "#fff";
  c.beginPath(); c.moveTo(x - 4, y - 4); c.lineTo(x - 2, y + 2); c.lineTo(x, y - 4); c.fill();
  c.beginPath(); c.moveTo(x + 4, y - 4); c.lineTo(x + 2, y + 2); c.lineTo(x, y - 4); c.fill();
  
  c.fillStyle = "#f4cf43";
  c.beginPath(); c.ellipse(x - 22, y + 2, 6, 10, 0.5, 0, 7); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 2.5; c.stroke();
  c.beginPath(); c.ellipse(x + 22, y + 2, 6, 10, -0.5, 0, 7); c.fill();
  c.stroke();
  
  const recoil = (frame % 10 < 3 && isHoldingShoot) ? 1.3 : 1.0;
  c.save(); 
  c.translate(x + player.facing * 20, y - 2); 
  c.scale(player.facing * recoil, recoil);
  
  if (currentWeapon === "shotgun") {
    c.fillStyle = "#49382b"; c.fillRect(0, -6, 30, 8); 
    c.fillStyle = "#222"; c.fillRect(25, -10, 20, 6); 
    c.fillStyle = "#a7a7a7"; c.fillRect(35, -11, 12, 4);
    c.strokeStyle = "#000"; c.lineWidth = 2; c.strokeRect(0, -6, 30, 8);
  } else if (currentWeapon === "minigun") {
    c.fillStyle = "#2a2a2a"; c.fillRect(0, -8, 35, 12);
    c.fillStyle = "#555"; c.fillRect(30, -10, 22, 6); c.fillRect(30, -2, 22, 6);
    c.fillStyle = "#a7a7a7"; c.fillRect(45, -9, 6, 2); c.fillRect(45, -1, 6, 2);
    c.strokeStyle = "#000"; c.lineWidth = 2; c.strokeRect(0, -8, 35, 12);
  } else if (currentWeapon === "ak47") {
    c.fillStyle = "#5c3a21"; c.fillRect(0, -5, 18, 10);
    c.fillStyle = "#222"; c.fillRect(15, -6, 28, 5);
    c.fillStyle = "#8b4513"; c.fillRect(10, -2, 12, 8);
    c.fillStyle = "#555"; c.fillRect(28, -7, 10, 3);
    c.strokeStyle = "#000"; c.lineWidth = 2; c.strokeRect(0, -5, 18, 10);
  }
  c.restore();
  
  if (playerDashing > 0) {
    c.fillStyle = "rgba(156, 39, 176, 0.6)";
    c.beginPath(); c.arc(x, y, 28, 0, 7); c.fill();
    c.strokeStyle = "#fff"; c.lineWidth = 2; c.stroke();
  }
}

// === КРЫСКА С АНИМАЦИЕЙ ===
function drawRat(c) {
  if (!rat.alive) return;
  const x = rat.x - camera, y = rat.y;
  
  drawShadow(c, x, GROUND_Y, 15, 5, 0.25);
  
  // Анимация бега (лапки)
  const legAnim = Math.abs(Math.sin(rat.animFrame * 0.3)) * 3;
  const tailAnim = Math.sin(rat.animFrame * 0.2) * 5;
  const headBob = Math.sin(rat.animFrame * 0.15) * 1.5;
  
  c.save();
  c.translate(x, y);
  c.scale(rat.facing, 1);
  
  // Тело (белое с черными пятнами)
  c.fillStyle = "#fff";
  c.beginPath();
  c.ellipse(0, 0, 14, 10, 0, 0, 7);
  c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 2; c.stroke();
  
  // Штриховка на теле (тень)
  drawHatching(c, -10, -5, 20, 10, "#000", 0.2, 3);
  
  // Черные пятна
  c.fillStyle = "#000";
  c.beginPath(); c.arc(-4, -2, 3, 0, 7); c.fill();
  c.beginPath(); c.arc(5, 1, 2.5, 0, 7); c.fill();
  
  // Лапки (анимация)
  c.fillStyle = "#fff";
  c.beginPath(); c.ellipse(-8, 8 + legAnim, 3, 5, 0, 0, 7); c.fill(); c.strokeStyle = "#000"; c.lineWidth = 1; c.stroke();
  c.beginPath(); c.ellipse(8, 8 - legAnim, 3, 5, 0, 0, 7); c.fill(); c.stroke();
  
  // Хвост (взмах)
  c.strokeStyle = "#fff"; c.lineWidth = 3;
  c.beginPath(); c.moveTo(-14, 0); c.quadraticCurveTo(-25, -10 + tailAnim, -30, tailAnim); c.stroke();
  c.strokeStyle = "#000"; c.lineWidth = 1;
  c.beginPath(); c.moveTo(-14, 0); c.quadraticCurveTo(-25, -10 + tailAnim, -30, tailAnim); c.stroke();
  
  // Голова (поворот)
  c.fillStyle = "#fff";
  c.beginPath(); c.arc(12, -4 + headBob, 8, 0, 7); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 2; c.stroke();
  
  // Уши
  c.fillStyle = "#fff";
  c.beginPath(); c.arc(10, -12 + headBob, 4, 0, 7); c.fill(); c.stroke();
  c.beginPath(); c.arc(16, -12 + headBob, 4, 0, 7); c.fill(); c.stroke();
  
  // Глаз (смотрит вперед)
  c.fillStyle = "#000";
  c.beginPath(); c.arc(15, -5 + headBob, 2, 0, 7); c.fill();
  
  // Носик
  c.fillStyle = "#ff9999";
  c.beginPath(); c.arc(19, -4 + headBob, 1.5, 0, 7); c.fill();
  
  c.restore();
}

function drawBullets(c) {
  for(const b of bullets){ 
    c.beginPath(); c.arc(b.x-camera, b.y, 7, 0, 7); 
    c.fillStyle="#292929"; c.fill(); 
    c.strokeStyle="#fff"; c.lineWidth = 2; c.stroke(); 
  }
  for(const b of enemyBullets){ 
    c.save(); c.translate(b.x-camera, b.y); c.rotate(b.angle||0); 
    if (b.isGreen) c.fillStyle = "#44ff44"; 
    else if (b.isSeed) { c.fillStyle = "#222"; c.fillRect(-5,-3,10,6); c.strokeStyle="#fff"; c.lineWidth=1; c.strokeRect(-5,-3,10,6); }
    else c.fillStyle = "#ffdb45";
    c.fillRect(-10,-5,20,10); 
    c.restore(); 
  }
}

function drawStars(c) {
  for(const s of stars){ 
    if(s.taken) continue; 
    const x=s.x-camera; if(x<-40||x>W+40) continue; 
    c.font="34px Arial"; c.textAlign="center"; 
    c.fillText("⭐", x, s.y); 
  }
}

function drawPickups(c) {
  for (const p of pickups) {
    const x = p.x - camera;
    if (x < -50 || x > W + 50) continue;
    c.save(); c.translate(x, p.y + Math.sin(frame * 0.1) * 5);
    if (p.type === "apple") c.fillText("🍎", 0, 10);
    else if (p.type === "lightning") c.fillText("⚡", 0, 10);
    else if (p.type === "shield") c.fillText("🛡️", 0, 10);
    c.restore();
  }
}

function drawFloatingTexts(c) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y -= 1;
    t.life--;
    c.globalAlpha = t.life / t.maxLife;
    c.fillStyle = t.color || "#fff";
    c.font = "bold 22px 'Courier New'";
    c.textAlign = "center";
    c.fillText(t.text, t.x, t.y);
    c.globalAlpha = 1;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
}

function draw() {
  octx.clearRect(0, 0, OW, OH);
  octx.save();
  octx.scale(SCALE, SCALE);
  
  if (shakeTime > 0) {
    octx.save();
    octx.translate(Math.random() * shakeTime - shakeTime/2, Math.random() * shakeTime - shakeTime/2);
  }
  
  drawBackground(octx);
  
  for(const p of platforms) drawPlatform3D(octx, p);
  
  const hutX = LEVEL_WIDTH - 140;
  const hutScreenX = hutX - camera;
  if (hutScreenX > -200 && hutScreenX < W + 200) {
    octx.fillStyle = "#8b5a2b"; octx.fillRect(hutScreenX, GROUND_Y - 110, 120, 110);
    octx.strokeStyle = "#000"; octx.lineWidth = 5; octx.strokeRect(hutScreenX, GROUND_Y - 110, 120, 110);
    octx.fillStyle = "#a8322b"; octx.beginPath(); octx.moveTo(hutScreenX - 10, GROUND_Y - 110); octx.lineTo(hutScreenX + 60, GROUND_Y - 180); octx.lineTo(hutScreenX + 130, GROUND_Y - 110); octx.closePath(); octx.fill();
    octx.strokeStyle = "#000"; octx.lineWidth = 5; octx.stroke();
    octx.fillStyle = "#3b2414"; octx.fillRect(hutScreenX + 45, GROUND_Y - 80, 35, 80);
    octx.strokeRect(hutScreenX + 45, GROUND_Y - 80, 35, 80);
    octx.fillStyle = "#f4cf43"; octx.fillRect(hutScreenX + 15, GROUND_Y - 85, 25, 25);
    octx.strokeRect(hutScreenX + 15, GROUND_Y - 85, 25, 25);
  }
  
  drawStars(octx);
  drawPickups(octx);
  
  for(const g of gopniks) drawGopnik(octx, g);
  
  for(const e of enemies) {
    const x = e.x - camera; if (x < -80 || x > W + 80 || !e.alive) continue;
    const type = worlds[world].enemy;
    const isMoving = Math.abs(e.vx) > 0.2;
    const facing = e.vx >= 0 ? 1 : -1;
    if (type === "rabbit") drawRabbit(octx, x, e.y, isMoving, facing);
    else if (type === "wolf") drawWolf(octx, x, e.y, isMoving, facing);
    else if (type === "bear") drawBearBody(octx, x, e.y, isMoving, facing);
    else if (type === "fox") drawFoxBody(octx, x, e.y, isMoving, facing);
    else if (type === "frog") drawFrog(octx, x, e.y, isMoving, facing);
    else if (type === "troll") drawTroll(octx, x, e.y, isMoving, facing);
    else if (type === "skeleton") drawSkeleton(octx, x, e.y, isMoving, facing);
    else if (type === "dragon") drawDragon(octx, x, e.y, isMoving, facing);
    else if (type === "goblin") drawGoblin(octx, x, e.y, isMoving, facing);
    else if (type === "fire") drawFireMonster(octx, x, e.y, isMoving, facing);
  }
  
  for(const w of witches) drawWitch(octx, w);
  for(const l of lizards) drawLizard(octx, l);
  for(const b of bears) drawBear(octx, b);
  
  if (world === 10) {
    for (const m of mermaids) { if(m.alive) { const x=m.x-camera; if(x>=-100&&x<=W+100) drawMermaid(octx, x, m.y); } }
    for (const s of sharks) { if(s.alive) { const x=s.x-camera; if(x>=-100&&x<=W+100) drawShark(octx, x, s.y, 0, s.vx >= 0 ? 1 : -1); } }
  } else if (world === 11) {
    for (const t of trees) { if(t.alive) { const x=t.x-camera; if(x>=-100&&x<=W+100) drawTreeMonster(octx, x, t.y); } }
  }
  
  drawBoss(octx);
  drawBullets(octx);
  drawParticles(octx);
  drawRat(octx);
  drawPlayer(octx);
  drawFloatingTexts(octx);
  
  // ПЕРЕДНИЙ ПЛАН (поверх всего, для глубины)
  drawForeground(octx);
  
  if (shakeTime > 0) {
    octx.restore();
    shakeTime--;
  }
  
  octx.restore();
  
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(offCanvas, 0, 0, OW, OH, 0, 0, W, H);
  
  if(gameOver||victory) {
    ctx.fillStyle="rgba(0,0,0,0.75)"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff"; ctx.textAlign="center"; ctx.font="bold 52px 'Courier New'";
    ctx.fillText(victory?"ПОБЕДА!":"ИГРА ОКОНЧЕНА",W/2,230);
    ctx.font="30px 'Courier New'"; ctx.fillText(victory?"Колобок спас лес!":"Попробуй ещё раз!",W/2,290);
  }
}

// ==================== ДЕЙСТВИЯ ====================

function jump() { 
  if(gameOver||victory||isTransitioning) return; 
  if(world === 10) {
    player.vy = -3.5;
    player.onGround = false;
    sound(520,0.08);
    spawnParticles(player.x, player.y + player.r, "rgba(255,255,255,0.5)", 5);
  } else {
    if(player.onGround || player.jumpsLeft > 0){ 
      player.vy = player.onGround ? -11 : -9; 
      player.onGround = false; 
      player.jumpsLeft--; 
      sound(520,0.08); 
      spawnParticles(player.x, player.y + player.r, "#d4c9a8", 8);
    } 
  }
}

function dash() {
  if(gameOver||victory||isTransitioning) return;
  if (playerDashCooldown <= 0) {
    playerDashing = 15; playerDashCooldown = 45;
    player.vx = player.facing * (world === 10 ? 8 : 12);
    sound(300, 0.1, "sawtooth");
  }
}

function startShoot() {
  if(gameOver||victory||isTransitioning) return;
  isHoldingShoot = true;
  if (currentWeapon === "shotgun") {
    shootShotgun();
  } else {
    if (!minigunInterval) {
      shootAuto();
      const speed = currentWeapon === "minigun" ? 80 : 100;
      minigunInterval = setInterval(shootAuto, speed);
    }
  }
}

function stopShoot() {
  isHoldingShoot = false;
  if (minigunInterval) {
    clearInterval(minigunInterval);
    minigunInterval = null;
  }
}

function shootShotgun() {
  const now=Date.now(); if(now-(player.lastShot||0)<260) return; player.lastShot=now;
  bullets.push({ x:player.x+player.facing*25, y:player.y-7, vx:player.facing*8, life:100 });
  soundShoot();
  triggerShake(3);
  spawnParticles(player.x + player.facing * 25, player.y - 7, "#ffff99", 5); 
}

function shootAuto() {
  if(gameOver||victory) { stopShoot(); return; }
  const now=Date.now(); if(now-(player.lastShot||0)<50) return; player.lastShot=now;
  if (currentWeapon === "minigun") {
    bullets.push({ x:player.x+player.facing*30, y:player.y-7 + (Math.random()-0.5)*5, vx:player.facing*11, life:100 });
    triggerShake(1);
    spawnParticles(player.x + player.facing * 30, player.y - 7, "#ffcc00", 2); 
  } else if (currentWeapon === "ak47") {
    bullets.push({ x:player.x+player.facing*35, y:player.y-7, vx:player.facing*13, life:100 });
    triggerShake(2);
    spawnParticles(player.x + player.facing * 35, player.y - 7, "#ffaa00", 3); 
  }
  soundShoot();
}

function hurtPlayer() {
  if(player.invincible>0||gameOver||victory||isTransitioning) return;
  player.health--; player.invincible=90; player.vy=-6; player.vx=-player.facing*3;
  triggerShake(10);
  sound(100,0.2,"sawtooth"); updateInfo();
  spawnParticles(player.x, player.y, "#ff3333", 15);
  say("Ой-ой-ой!"); 
  if(player.health<=0){ 
    gameOver=true; 
    stopShoot();
    say("Колобок, попробуй ещё раз!"); 
  }
  saveProgress();
}

function respawnFromGap() {
  player.x=lastSafeX; player.y=GROUND_Y-19; player.vx=0; player.vy=0; player.invincible=90;
  triggerShake(15);
  stopShoot();
  hurtPlayer(); if(!gameOver) say("Осторожно, обрыв!");
}

// ==================== ОБНОВЛЕНИЕ ====================

function updateRat() {
  if (!rat.alive) return;
  
  rat.animFrame++;
  
  // Крыска следует за игроком на земле
  const distance = player.x - rat.x;
  const absDist = Math.abs(distance);
  
  // Если игрок далеко — бежим за ним
  if (absDist > 60) {
    rat.vx = Math.sign(distance) * 3.5;
    rat.facing = Math.sign(distance) || 1;
  } else if (absDist < 40) {
    // Слишком близко — отходим
    rat.vx = -Math.sign(distance) * 1.5;
  } else {
    rat.vx *= 0.8;
  }
  
  // Гравитация
  rat.vy += getGravity();
  rat.x += rat.vx;
  rat.y += rat.vy;
  
  // Проверка на землю
  rat.onGround = false;
  if (rat.y + rat.r >= GROUND_Y) {
    rat.y = GROUND_Y - rat.r;
    rat.vy = 0;
    rat.onGround = true;
  }
  
  // Проверка на платформы
  for (const p of platforms) {
    if (rat.vy >= 0 && rat.x + rat.r > p.x && rat.x - rat.r < p.x + p.w && rat.y + rat.r >= p.y && rat.y + rat.r <= p.y + 15) {
      rat.y = p.y - rat.r;
      rat.vy = 0;
      rat.onGround = true;
    }
  }
  
  // Прыжок, если перед крыской пропасть или препятствие
  if (rat.onGround && absDist > 60) {
    // Проверяем, есть ли пропасть впереди
    const checkX = rat.x + rat.facing * 40;
    const overGap = gaps.some(g => checkX > g.x && checkX < g.x + g.w);
    if (overGap) {
      rat.vy = -10;
      rat.onGround = false;
    }
    
    // Проверяем, есть ли платформа впереди (и мы под ней)
    for (const p of platforms) {
      if (checkX > p.x && checkX < p.x + p.w && rat.y > p.y && rat.y < p.y + p.h + 20) {
        rat.vy = -9;
        rat.onGround = false;
      }
    }
  }
  
  // Ограничение по краям уровня
  rat.x = Math.max(20, Math.min(LEVEL_WIDTH - 20, rat.x));
  
  // Если крыска упала в пропасть — телепортируем её к игроку
  if (rat.y > H + 50) {
    rat.x = player.x - 60;
    rat.y = GROUND_Y - 10;
    rat.vy = 0;
  }
  
  // Автоматическая стрельба
  rat.shootTimer--;
  if (rat.shootTimer <= 0) {
    let closestEnemy = null;
    let minDist = 400;
    
    for (const e of enemies) {
      if (e.alive) {
        const dist = Math.abs(player.x - e.x);
        if (dist < minDist) { minDist = dist; closestEnemy = e; }
      }
    }
    for (const g of gopniks) {
      if (g.alive) {
        const dist = Math.abs(player.x - g.x);
        if (dist < minDist) { minDist = dist; closestEnemy = g; }
      }
    }
    
    if (closestEnemy) {
      const dx = closestEnemy.x - rat.x;
      const dy = closestEnemy.y - rat.y;
      const len = Math.sqrt(dx*dx + dy*dy) || 1;
      bullets.push({ x: rat.x, y: rat.y - 5, vx: dx/len*10, vy: dy/len*10, life: 100 });
      sound(800, 0.05, "sine");
      rat.shootTimer = 60;
    }
  }
}

function updatePlayer() {
  if (isTransitioning) return;
  
  if (playerDashCooldown > 0) playerDashCooldown--;
  if (playerDashing > 0) {
    playerDashing--;
    player.x += player.vx;
  } else {
    let moving=false;
    if(keys.left){ player.vx=-player.speed; player.facing=-1; moving=true; }
    if(keys.right){ player.vx=player.speed; player.facing=1; moving=true; }
    if(!moving) player.vx*=0.78;
    player.x+=player.vx;
  }
  
  if (world === 10) {
    player.vy += getGravity(); 
    if (player.vy > 4) player.vy = 4;
    if (keys.up || isHoldingShoot) player.vy -= 0.4;
  } else {
    player.vy+=getGravity(); 
  }
  
  player.y+=player.vy;
  
  const overGap=isOverGap(player.x);
  
  if (world === 10) {
    if(player.y > H - player.r) { player.y = H - player.r; player.vy = 0; player.onGround = true; }
    if(player.y < player.r) { player.y = player.r; player.vy = 0; }
    player.onGround = false; 
    player.jumpsLeft = player.maxJumps;
  } else {
    if(player.y>H+40){ if(overGap||player.y>H+60){ respawnFromGap(); return; } }
    if(!overGap && player.y+player.r>=GROUND_Y){ player.y=GROUND_Y-player.r; player.vy=0; player.onGround=true; player.jumpsLeft = player.maxJumps; lastSafeX=player.x; }
    else { if(player.y+player.r<GROUND_Y) player.onGround=false; }
    for(const p of platforms){
      if(player.vy>=0 && player.x+player.r>p.x && player.x-player.r<p.x+p.w && player.y+player.r>=p.y && player.y+player.r<=p.y+15){
        player.y=p.y-player.r; player.vy=0; player.onGround=true; player.jumpsLeft = player.maxJumps; lastSafeX=player.x;
      }
    }
  }
  
  player.x=Math.max(player.r,Math.min(LEVEL_WIDTH-20,player.x));
  if(player.invincible>0) player.invincible--;
  camera=player.x-W*0.38; camera=Math.max(0,Math.min(LEVEL_WIDTH-W,camera));
}

function updateGopniks() {
  for(const g of gopniks) {
    if(!g.alive) continue;
    const dist = player.x - g.x;
    if (Math.abs(dist) < 300) {
      if (Math.abs(dist) > 100) {
        g.vx = Math.sign(dist) * 0.8;
      } else {
        g.vx = 0;
      }
      g.shootTimer--;
      if(g.shootTimer <= 0) {
        const dx = player.x - g.x;
        const dy = player.y - (g.y - 20);
        const len = Math.sqrt(dx*dx + dy*dy) || 1;
        enemyBullets.push({ x:g.x, y:g.y-20, vx:dx/len*4, vy:dy/len*4, angle:Math.atan2(dy,dx), life:120, isSeed: true });
        g.shootTimer = 100 + Math.random()*50;
        sound(600, 0.05, "square");
      }
    } else {
      if (g.x < g.min) g.vx = Math.abs(g.vx) || 0.8;
      if (g.x > g.max) g.vx = -Math.abs(g.vx) || -0.8;
    }
    g.x += g.vx;
    
    if(Math.abs(player.x-g.x)<35 && Math.abs(player.y-g.y)<35) {
      if (player.vy > 0 && player.y < g.y - 10) {
        g.alive = false;
        player.vy = -10;
        sound(600, 0.1, "square");
        spawnParticles(g.x, g.y, "#ff5555", 15);
        totalStars += 1; saveProgress();
        say("А семки есть?");
      } else {
        hurtPlayer();
      }
    }
  }
}

function updateEnemies() {
  for(const e of enemies){
    if(!e.alive) continue; e.jumpTimer--; const distance=player.x-e.x;
    if(e.jumpTimer<=0&&e.onGround){ e.vy=-(7+(world%4)*0.5); e.onGround=false; e.jumpTimer=95+Math.random()*85; }
    if(Math.abs(distance)<230){ e.vx+=Math.sign(distance)*0.025; e.vx=Math.max(-2-(world%4)*0.2,Math.min(2+(world%4)*0.2,e.vx)); }
    else { if(e.x<e.min) e.vx=Math.abs(e.vx); if(e.x>e.max) e.vx=-Math.abs(e.vx); }
    e.x+=e.vx; e.y+=e.vy; e.vy+=getGravity();
    if(e.y>=GROUND_Y - 20){ e.y=GROUND_Y - 20; e.vy=0; e.onGround=true; }
    
    if(Math.abs(player.x-e.x)<35 && Math.abs(player.y-e.y)<35) {
      if (player.vy > 0 && player.y < e.y - 10) {
        e.alive = false;
        player.vy = -10;
        sound(600, 0.1, "square");
        spawnParticles(e.x, e.y, "#ff5555", 15);
        totalStars += 1; saveProgress();
        say("Ай!");
      } else {
        hurtPlayer();
      }
    }
  }
}

function updateLizards() {
  for(const l of lizards){
    if(!l.alive) continue; l.dashTimer--; const distance=player.x-l.x;
    if(l.dashTimer<=0&&l.onGround&&Math.abs(distance)<260){ l.vx=Math.sign(distance)*(3.2+(world%4)*0.2); l.facing=Math.sign(distance)||1; l.dashTimer=160+Math.random()*80; sound(420,0.06,"square"); }
    else if(l.dashTimer>0) l.vx*=0.93;
    else { l.vx=l.facing*l.speed; if(l.x<80) l.facing=1; if(l.x>LEVEL_WIDTH-80) l.facing=-1; }
    l.x+=l.vx; l.y+=l.vy; l.vy+=getGravity();
    if(l.y>=GROUND_Y - 15){ l.y=GROUND_Y - 15; l.vy=0; l.onGround=true; } else l.onGround=false;
    
    if(Math.abs(player.x-l.x)<35 && Math.abs(player.y-l.y)<35) {
      if (player.vy > 0 && player.y < l.y - 10) {
        l.alive = false;
        player.vy = -10;
        sound(600, 0.1, "square");
        spawnParticles(l.x, l.y, "#ff5555", 15);
        totalStars += 1; saveProgress();
        say("Ай!");
      } else {
        hurtPlayer();
      }
    }
  }
}

function updateBears() {
  for(const b of bears){
    if(!b.alive) continue; if(b.hurtFlash>0) b.hurtFlash--;
    const distance=player.x-b.x; b.facing=Math.sign(distance)||1;
    if(Math.abs(distance)>60) b.vx=Math.sign(distance)*0.6; else b.vx=0;
    b.x+=b.vx; b.y+=b.vy; b.vy+=getGravity();
    if(b.y>=GROUND_Y - 30){ b.y=GROUND_Y - 30; b.vy=0; b.onGround=true; }
    b.throwTimer--;
    if(b.throwTimer<=0&&Math.abs(distance)<380){
      const dx=player.x-b.x, dy=player.y-(b.y-30), len=Math.sqrt(dx*dx+dy*dy)||1;
      enemyBullets.push({ x:b.x, y:b.y-30, vx:dx/len*3.2, vy:dy/len*3.2-1.2, angle:Math.atan2(dy,dx), life:180 });
      b.throwTimer=150+Math.random()*80; sound(200,0.1,"square");
    }
    
    if(Math.abs(player.x-b.x)<45 && Math.abs(player.y-b.y)<45) {
      if (player.vy > 0 && player.y < b.y - 15) {
        b.hp--; b.hurtFlash=20; player.vy = -10;
        sound(200, 0.08);
        spawnParticles(b.x, b.y, "#ff5555", 10);
        if(b.hp<=0){ b.alive=false; pickups.push({ x: b.x, y: b.y - 30, type: "shield" }); say("Ай!"); totalStars+=5; }
        saveProgress();
      } else {
        hurtPlayer();
      }
    }
  }
}

function updateWitches() {

    if(!w.alive) continue; w.phase+=0.03; w.x+=w.vx;
    if(w.x<80){ w.x=80; w.vx=Math.abs(w.vx); }
    if(w.x>LEVEL_WIDTH-80){ w.x=LEVEL_WIDTH-80; w.vx=-Math.abs(w.vx); }
    w.y=w.baseY+Math.sin(w.phase)*25;
    w.shootTimer--;
    if(w.shootTimer<=0){
      const dx=player.x-w.x, dy=player.y-w.y, len=Math.sqrt(dx*dx+dy*dy)||1;

    if(Math.abs(player.x-w.x)<40&&Math.abs(player.y-w.y)<40) hurtPlayer();

}

      for(const s of sharks) if(s.alive&&Math.abs(b.x-s.x)<40&&Math.abs(b.y-s.y)<30){ s.alive=false; b.life=0; spawnParticles(s.x, s.y, "#ff5555", 10); say("Ай!"); totalStars+=2; saveProgress(); }

      boss.hp--; b.life=0; sound(240,0.08);
      spawnParticles(boss.x, boss.y, "#ff5555", 8);
      if(boss.hp<=0){ boss.alive=false; say("Охохонюшки, Хо-Хо!"); totalStars+=10; }
      saveProgress();
    }
  }
  bullets=bullets.filter(b=>b.life>0&&b.x>-100&&b.x<LEVEL_WIDTH+100);
  
  for(const b of enemyBullets){
    b.x+=b.vx; b.y+=b.vy; b.life--;
    if(Math.abs(b.x-player.x)<25&&Math.abs(b.y-player.y)<25){ b.life=0; hurtPlayer(); }
  }
  enemyBullets=enemyBullets.filter(b=>b.life>0);
}

function updatePickups() {
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    if (Math.abs(player.x - p.x) < 30 && Math.abs(player.y - p.y) < 30) {
      if (p.type === "apple") { 
        player.health = Math.min(3, player.health + 1); 
        addFloatingText(player.x - camera, player.y - 40, "+1 ❤️", "#e33");
      }
      else if (p.type === "lightning") { 
        player.lastShot = Date.now() - 200; 
        addFloatingText(player.x - camera, player.y - 40, "БЫСТРО!", "#0af");
      }
      else if (p.type === "shield") { 
        player.invincible = 180; 
        addFloatingText(player.x - camera, player.y - 40, "ЩИТ!", "#0f0");
      }
      sound(880, 0.15, "sine");
      pickups.splice(i, 1);
      updateInfo();
    }
  }
}

function updateStars() {
  for(const s of stars) if(!s.taken&&Math.abs(player.x-s.x)<30&&Math.abs(player.y-s.y)<40){ 
    s.taken=true; totalStars++; 
    addFloatingText(player.x - camera, player.y - 40, "+1 ⭐", "#ffd700");
    sound(760,0.12,"sine"); updateInfo(); saveProgress(); 
  }
}

function checkLevelEnd() {
  if (isTransitioning || gameOver || victory) return;
  const hutX = LEVEL_WIDTH - 140;
  if (player.x > hutX + 40 && player.x < hutX + 85) {
    isTransitioning = true; 
    stopShoot();
    say("В избушку!"); sound(880, 0.3, "sine");
    setTimeout(() => {
      if (world < TOTAL_LEVELS - 1) {
        world++; makeLevel(); say("Мир " + (world+1) + ": " + worlds[world].name); saveProgress(); isTransitioning = false;
      } else {
        victory = true; say("Победа! Колобок спас лес!"); saveProgress(); isTransitioning = false;
      }
    }, 1000);
  }
  if (boss && boss.isBossLevel && bossBattle && boss.alive && player.x > 2110) { player.x = 2110; }
}

function update() {
  if(gameOver||victory){ draw(); gameLoopRunning=false; return; }
  frame++; 
  updatePlayer(); updateEnemies(); updateWitches(); updateLizards(); updateBears(); updateBoss(); updateBullets(); updateStars(); updatePickups();
  updateMermaidsSharks();
  updateTrees();
  updateGopniks();
  updateRat();
  updateParticles();
  checkLevelEnd(); updateInfo(); draw();
  if(frame-lastSaveFrame>=60){ saveProgress(); lastSaveFrame=frame; }
  requestAnimationFrame(update);
}
function startGameLoop() { if(gameLoopRunning) return; gameLoopRunning=true; requestAnimationFrame(update); }

/* ===== УПРАВЛЕНИЕ ===== */
document.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code)) e.preventDefault();
  if(e.code==="ArrowLeft"||e.code==="KeyA") keys.left=true;
  if(e.code==="ArrowRight"||e.code==="KeyD") keys.right=true;
  if((e.code==="ArrowUp"||e.code==="Space"||e.code==="KeyW")&&!e.repeat) jump();
  if(e.code==="ArrowUp"||e.code==="KeyW") keys.up = true;
  if((e.code==="KeyJ"||e.code==="KeyF")&&!e.repeat) startShoot();
  if((e.code==="ShiftLeft"||e.code==="KeyK")&&!e.repeat) dash();
});
document.addEventListener("keyup",e=>{
  if(e.code==="ArrowLeft"||e.code==="KeyA") keys.left=false;
  if(e.code==="ArrowRight"||e.code==="KeyD") keys.right=false;
  if(e.code==="ArrowUp"||e.code==="KeyW") keys.up = false;
  if(e.code==="KeyJ"||e.code==="KeyF") stopShoot();
});

function bindHold(id,key) {
  const button=document.getElementById(id);
  button.addEventListener("pointerdown",e=>{ e.preventDefault(); keys[key]=true; try{ button.setPointerCapture(e.pointerId); }catch(err){} });
  const release=e=>{ e.preventDefault(); keys[key]=false; };
  button.addEventListener("pointerup",release); button.addEventListener("pointercancel",release);
  button.addEventListener("lostpointercapture",()=>keys[key]=false);
  button.addEventListener("contextmenu",e=>e.preventDefault()); button.addEventListener("selectstart",e=>e.preventDefault());
}
bindHold("left","left"); bindHold("right","right");

function bindShoot() {
  const button = document.getElementById("shoot");
  button.addEventListener("pointerdown", e => { 
    e.preventDefault(); 
    startShoot(); 
    try{ button.setPointerCapture(e.pointerId); }catch(err){} 
  });
  const stop = e => { 
    e.preventDefault(); 
    stopShoot(); 
  };
  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("lostpointercapture", stop);
  button.addEventListener("contextmenu", e => e.preventDefault());
  button.addEventListener("selectstart", e => e.preventDefault());
}
bindShoot();

function bindJump() {
  const button = document.getElementById("jump");
  button.addEventListener("pointerdown", e => {
    e.preventDefault();
    jump();
    keys.up = true;
    try{ button.setPointerCapture(e.pointerId); }catch(err){}
  });
  const stop = e => {
    e.preventDefault();
    keys.up = false;
  };
  button.addEventListener("pointerup", stop);
  button.addEventListener("pointercancel", stop);
  button.addEventListener("lostpointercapture", stop);
  button.addEventListener("contextmenu", e => e.preventDefault());
  button.addEventListener("selectstart", e => e.preventDefault());
}
bindJump();

function bindTap(id,action) {
  const button=document.getElementById(id);
  button.addEventListener("pointerdown",e=>{ e.preventDefault(); action(); });
  button.addEventListener("contextmenu",e=>e.preventDefault()); button.addEventListener("selectstart",e=>e.preventDefault());
}
bindTap("dash",dash);

/* ===== МЕНЮ И ВЫБОР ОРУЖИЯ ===== */
const wpnShotgunBtn = document.getElementById("wpn-shotgun");
const wpnMinigunBtn = document.getElementById("wpn-minigun");
const wpnAk47Btn = document.getElementById("wpn-ak47");

wpnShotgunBtn.addEventListener("click", () => {
    currentWeapon = "shotgun";
    wpnShotgunBtn.classList.add("active");
    wpnMinigunBtn.classList.remove("active");
    wpnAk47Btn.classList.remove("active");
    document.getElementById("shoot").textContent = "🔫";
});

wpnMinigunBtn.addEventListener("click", () => {
    currentWeapon = "minigun";
    wpnMinigunBtn.classList.add("active");
    wpnShotgunBtn.classList.remove("active");
    wpnAk47Btn.classList.remove("active");
    document.getElementById("shoot").textContent = "💥";
});

wpnAk47Btn.addEventListener("click", () => {
    currentWeapon = "ak47";
    wpnAk47Btn.classList.add("active");
    wpnShotgunBtn.classList.remove("active");
    wpnMinigunBtn.classList.remove("active");
    document.getElementById("shoot").textContent = "🔫";
});

const hasSave = loadProgress();
if (!hasSave) {
  document.getElementById("btn-continue").style.display = "none";
}

document.getElementById("btn-continue").addEventListener("click", () => {
  menuScreen.classList.add("hidden");
  makeLevel();
  loadProgress();
  draw();
  startGameLoop();
});

document.getElementById("btn-new").addEventListener("click", () => {
  if (confirm("Начать новую игру? Старое сохранение будет удалено.")) {
    deleteSave();
    world = 0; totalStars = 0; gameOver = false; victory = false; frame = 0;
    makeLevel();
    menuScreen.classList.add("hidden");
    say("Новое приключение начинается!");
    saveProgress();
    draw();
    startGameLoop();
  }
});

document.getElementById("restart").addEventListener("click",()=>{
  if(!confirm("Начать игру заново? Старое сохранение будет удалено.")) return;
  deleteSave(); world=0; totalStars=0; gameOver=false; victory=false; frame=0; lastSaveFrame=0; keys={};
  makeLevel(); say("Новое приключение начинается!"); saveProgress(); draw(); startGameLoop();
});

/* ===== ЗАЩИТА ===== */
document.addEventListener("contextmenu",e=>{ if(e.target.tagName==="BUTTON"||e.target.tagName==="CANVAS") e.preventDefault(); });
window.addEventListener("blur",()=>{ keys.left=false; keys.right=false; keys.up=false; stopShoot(); saveProgress(); });
document.addEventListener("visibilitychange",()=>{ if(document.hidden){ keys.left=false; keys.right=false; keys.up=false; stopShoot(); saveProgress(); } });
window.addEventListener("pagehide",()=>{ saveProgress(); });
</script>
